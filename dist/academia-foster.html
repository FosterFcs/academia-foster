// PL-12 · Planejamento de Obras
Academia.modulo('pl',{
teoria:`<p>Uma obra é uma sequência de atividades que dependem umas das outras: não dá para rebocar antes de levantar a parede. O planejamento descobre o prazo total e, principalmente, quais atividades seguram a obra inteira.</p>
<div class="cols"><div class="conceito"><h4>Dependência</h4><p>A atividade só começa quando as anteriores terminam (relação término-início, a mais comum).</p></div>
<div class="conceito"><h4>Folga</h4><p>Quantos dias uma atividade pode atrasar sem atrasar a obra. Folga = início mais tarde − início mais cedo.</p></div>
<div class="conceito"><h4>Caminho crítico</h4><p>A sequência de atividades com folga zero. É ela que define o prazo. Atrasou ali, atrasou a obra.</p></div></div>
<h3>Como o cálculo funciona (CPM)</h3>
<div class="formula">Ida: início cedo = maior término cedo das antecessoras    término cedo = início + duração</div>
<div class="formula">Volta: término tarde = menor início tarde das sucessoras    início tarde = término − duração</div>
<div class="formula">PERT (duração incerta): te = (otimista + 4 × mais provável + pessimista) / 6</div>
<div class="dica"><b>Na obra</b>Equipe extra numa atividade com folga não adianta nada no prazo. Para acelerar a obra, reforce o caminho crítico.</div>`,
exemplo:`<h3>Casa térrea com 9 etapas</h3><p>As durações estão em dias úteis. A cobertura e as instalações começam juntas depois da alvenaria.</p>
<ol class="passos"><li><b>Ida.</b> A (0–5) → B (5–15) → C (15–35) → D (35–50). E (50–58) e F (50–62) em paralelo.</li>
<li><b>Revestimentos (G).</b> Dependem de E e F: começam no maior término, 62, e vão até 76.</li>
<li><b>Esquadrias (H).</b> Dependem só de E: 58–64.</li>
<li><b>Pintura (I).</b> Depende de G e H: começa em 76 e termina em <b>84 dias</b>.</li>
<li><b>Folgas.</b> E tem 4 dias de folga e H tem 12. As demais têm folga zero.</li>
<li><b>Caminho crítico.</b> <b>A → B → C → D → F → G → I</b>. As instalações (F) são críticas; a cobertura (E), não.</li></ol>
<div class="dica"><b>Teste no simulador</b>Aumente a cobertura (E) para 13 dias e veja o caminho crítico mudar.</div>`,
sim:{tarefas:[{id:'A',n:'Serviços preliminares',dur:5,pred:[]},{id:'B',n:'Fundações',dur:10,pred:['A']},{id:'C',n:'Estrutura',dur:20,pred:['B']},{id:'D',n:'Alvenaria',dur:15,pred:['C']},{id:'E',n:'Cobertura',dur:8,pred:['D']},{id:'F',n:'Instalações',dur:12,pred:['D']},{id:'G',n:'Revestimentos',dur:14,pred:['E','F']},{id:'H',n:'Esquadrias',dur:6,pred:['E']},{id:'I',n:'Pintura e limpeza',dur:8,pred:['G','H']}],
html(){return `<div class="ctrl"><div class="tbl-wrap"><table class="ed"><thead><tr><th>Id</th><th>Atividade</th><th>Dias</th><th>Depende de</th><th></th></tr></thead><tbody id="plBody"></tbody></table></div><div class="presets"><button class="chip" id="plAdd">+ Adicionar atividade</button><button class="chip" id="plReset">Voltar ao exemplo</button></div><div id="tiles"></div></div><div class="draw" id="draw" style="margin-top:16px"></div><h3>Memorial de cálculo</h3><div class="memorial" id="memorial"></div>`},

$('plReset').onclick=()=>{self.tarefas=JSON.parse(JSON.stringify(self.base));self.tabela();self.update()};this.tabela()},

$('draw').innerHTML=SVG(640,yl+14,'Cronograma de barras com caminho crítico',s);

ts.forEach(t=>{m+=`${t.id.padEnd(4)}${String(t.dur).padStart(7)}  ${String(r.ES[t.id]).padStart(11)}  ${String(r.EF[t.id]).padStart(12)}  ${String(r.LS[t.id]).padStart(12)}  ${String(r.LF[t.id]).padStart(13)}  ${String(r.folga[t.id]).padStart(5)}${r.folga[t.id]===0?'  ← crítica':''}\n`});

// ET-13 · Estacas
Academia.modulo('et',{
teoria:`<p>Quando o solo bom está fundo, a estaca leva a carga até lá. Ela resiste de dois jeitos: pela <b>ponta</b>, que se apoia na camada resistente, e pelo <b>atrito lateral</b>, o solo "abraçando" o fuste ao longo de todo o comprimento.</p>
<div class="cols"><div class="conceito"><h4>Resistência de ponta (Rp)</h4><p>Depende do solo na cota da ponta e da área da seção. Areias compactas dão muita ponta.</p></div>
<div class="conceito"><h4>Atrito lateral (Rl)</h4><p>Soma do atrito metro a metro. Depende do perímetro da estaca e da resistência de cada camada.</p></div>
<div class="conceito"><h4>Carga admissível</h4><p>A carga de ruptura dividida pelo fator de segurança. A NBR 6122 pede fator global 2 nos métodos semiempíricos.</p></div></div>
<h3>Aoki-Velloso (1975)</h3>
<div class="formula">Rp = K · Np / F1 · Ap        Rl = U · Σ (α · K · Nl / F2 · Δl)</div>
<p>K e α dependem do tipo de solo. F1 e F2 corrigem pelo tipo de estaca (escala e método executivo).</p>
<h3>Décourt-Quaresma (1978, revisado em 1996)</h3>
<div class="formula">Rp = α · C · Np · Ap        Rl = β · 10 · (Nl/3 + 1) · U · L</div>
<div class="formula">Np = média do N na ponta, logo acima e logo abaixo     Nl = média do N ao longo do fuste (3 ≤ N ≤ 50)</div>
<div class="formula">Carga admissível (Décourt): Rp/4 + Rl/1,3   e no máximo (Rp + Rl)/2</div>
<div class="dica"><b>Prática de projeto</b>Calcule por dois métodos e adote o menor valor. Confira também a carga estrutural da estaca, informada pelo fabricante, e faça prova de carga quando a norma exigir.</div>`,
exemplo:`<h3>Estaca pré-moldada Ø 30 cm com 10 m</h3><p>A sondagem mostra argila siltosa mole no topo, depois silte argiloso, silte arenoso e areia siltosa a partir de 10 m. Seção: Ap = 0,0707 m². Perímetro: U = 0,942 m.</p>
<ol class="passos"><li><b>Aoki-Velloso, ponta.</b> Areia siltosa (K = 0,80 MPa), N = 20 a 10 m: Rp = 800 × 20 / 1,75 × 0,0707 = <b>646 kN</b>.</li>
<li><b>Aoki-Velloso, atrito.</b> Somando os 10 metros de fuste camada por camada: Rl = <b>303 kN</b>. Carga admissível: (646 + 303) / 2 = <b>475 kN</b>.</li>
<li><b>Décourt-Quaresma, ponta.</b> Np = (17 + 20 + 24) / 3 = 20,3. C = 400 kPa (areia): Rp = 400 × 20,3 × 0,0707 = <b>575 kN</b>.</li>
<li><b>Décourt-Quaresma, atrito.</b> Nl = 7,6 (média de 1 a 8 m): Rl = 10 × (7,6/3 + 1) × 0,942 × 10 = <b>334 kN</b>. Carga admissível: 575/4 + 334/1,3 = <b>400 kN</b>.</li>
<li><b>Adotado.</b> O menor valor: <b>400 kN por estaca</b>. Um pilar de 1.000 kN precisa de 3 estacas.</li></ol>
<div class="dica"><b>Confira no simulador</b>O perfil e a estaca iniciais são os do exemplo.</div>`,
sim:{perfil:[['Argila siltosa',3],['Argila siltosa',4],['Argila siltosa',5],['Silte argiloso',6],['Silte argiloso',8],['Silte argiloso',9],['Silte arenoso',12],['Silte arenoso',14],['Silte arenoso',17],['Areia siltosa',20],['Areia siltosa',24],['Areia siltosa',30]].map(([solo,N])=>({solo,N})),
html(){return simWrap(sel('etT','Tipo de estaca',Object.entries(TIPOS_ESTACA).map(([k,t])=>[k,t.nome,k==='premoldada']))+sel('etD','Diâmetro',[20,25,30,35,40,50,60].map(d=>[d,'Ø '+d+' cm',d===30]))+rng('etL','Comprimento L',2,12,1,10,'m')+rng('etP','Carga do pilar',100,4000,50,1000,'kN','Para calcular quantas estacas o bloco precisa'),
  '<h3>Sondagem SPT</h3><div class="tbl-wrap alto"><table class="ed"><thead><tr><th>Prof.</th><th>Solo</th><th>N</th><th></th></tr></thead><tbody id="etBody"></tbody></table></div><div class="presets"><button class="chip" id="etAdd">+ 1 metro</button></div>')},
init(){const self=this;this.base=this.base||JSON.parse(JSON.stringify(this.perfil));$('etAdd').onclick=()=>{const l=self.perfil[self.perfil.length-1];self.perfil.push({solo:l.solo,N:Math.min(50,l.N+3)});self.tabela();self.update()};this.tabela()},
tabela(){const self=this,ops=Object.keys(SOLOS);$('etL').max=this.perfil.length;if(+$('etL').value>this.perfil.length)$('etL').value=this.perfil.length;outs();
  $('etBody').innerHTML=this.perfil.map((c,i)=>`<tr><td class="num">${i+1} m</td><td><select id="etS${i}" data-i="${i}" aria-label="Solo a ${i+1} m">${ops.map(o=>`<option${o===c.solo?' selected':''}>${o}</option>`).join('')}</select></td><td><input type="number" min="0" max="80" step="1" id="etN${i}" data-i="${i}" value="${c.N}" aria-label="N a ${i+1} m"></td><td>${this.perfil.length>3&&i===this.perfil.length-1?'<button class="rm" id="etRm" aria-label="Remover último metro">✕</button>':''}</td></tr>`).join('');
  $('etBody').querySelectorAll('select').forEach(s=>s.onchange=()=>{self.perfil[+s.dataset.i].solo=s.value;self.update()});

  const n=Math.ceil(P/r.Qadm-1e-9);
  $('tiles').innerHTML=tiles([['Aoki-Velloso',br(r.QA,0)+' kN'],['Décourt-Quaresma',br(r.QD,0)+' kN'],['Carga admissível',br(r.Qadm,0)+' kN',1],['Estacas no bloco',n+' estaca'+(n>1?'s':'')]])+`<span class="pill ok">Ponta em ${esc(this.perfil[L-1].solo.toLowerCase())} · N = ${this.perfil[L-1].N}</span>`;
  const nm=this.perfil.length,top=34,sz=Math.min(30,420/nm),x0=70,w=230,cor={argila:'soil-fill',silte:'amber-fill',areia:'steel-soft'};
  let s=T_('SONDAGEM SPT',30,18)+T(x0+w/2,top-8,'solo','muted','text-anchor="middle" font-size="10"')+T(450,top-8,'N (golpes)','muted','text-anchor="middle" font-size="10"');
  this.perfil.forEach((c,i)=>{const y=top+i*sz,g=SOLOS[c.solo].g;s+=`<rect x="${x0}" y="${y}" width="${w}" height="${sz}" style="fill:var(--${cor[g]});stroke:var(--line)"/>`+T(x0-8,y+sz/2+4,(i+1)+' m','muted','text-anchor="end" font-size="10"');
    if(i===0||c.solo!==this.perfil[i-1].solo)s+=T(x0+6,y+13,c.solo,'ink','font-size="10"');

  const pw=Math.max(8,D/60*34),px=x0+w-48-pw/2;s+=`<rect x="${px}" y="${top-14}" width="${pw}" height="${L*sz+14}" style="fill:var(--ink);opacity:.85"/>`;

  s+=T(30,top+nm*sz+38,`Atrito lateral (setas verdes) e ponta (seta amarela) · ${TIPOS_ESTACA[tp].nome} Ø ${D} cm`,'muted','font-size="10"');
  $('draw').innerHTML=SVG(560,top+nm*sz+56,'Perfil de sondagem com a estaca',s);

// PI-14 · Pilares
Academia.modulo('pi',{
teoria:`<p>O pilar leva a carga das vigas até a fundação. Parece que ele só é comprimido, mas qualquer pequena excentricidade faz o pilar flexionar. Se ele for esbelto, essa flexão cresce com a deformação: é o <b>efeito de segunda ordem</b>.</p>
<div class="cols"><div class="conceito"><h4>Esbeltez (λ)</h4><p>λ = 3,46 · le / h para seção retangular. Quanto mais alto e fino, maior o λ.</p></div>
<div class="conceito"><h4>Momento mínimo</h4><p>A norma sempre considera uma excentricidade mínima: M1d,mín = Nd · (0,015 + 0,03 · h), com h em metros.</p></div>
<div class="conceito"><h4>2ª ordem</h4><p>Para λ acima de λ1 (35 no pilar intermediário), soma-se o momento de 2ª ordem pelo pilar-padrão com curvatura aproximada.</p></div></div>
<h3>Roteiro de cálculo</h3>
<div class="formula">Nd = γn · 1,4 · Nk     γn = 1,95 − 0,05·b  para b &lt; 19 cm</div>
<div class="formula">ν = Nd / (Ac · fcd)     1/r = 0,005 / [h · (ν + 0,5)] ≤ 0,005 / h</div>
<div class="formula">M2d = Nd · le² / 10 · (1/r)     Md,tot = M1d,mín + M2d</div>
<div class="formula">As,mín = 0,15·Nd/fyd ≥ 0,4% Ac     As,máx = 4% Ac (8% na emenda)</div>
<div class="dica"><b>Detalhe que salva obra</b>Estribo segura as barras para elas não flambarem. Espaçamento máximo: o menor entre 20 cm, a menor dimensão do pilar e 12 vezes o diâmetro da barra (CA-50).</div>`,
exemplo:`<h3>Pilar 20 × 40 com Nk = 800 kN e le = 2,80 m</h3><p>Concreto C25, aço CA-50. Pilar intermediário, sem momentos de primeira ordem nas extremidades.</p>
<ol class="passos"><li><b>Esforço de cálculo.</b> b = 20 cm, então γn = 1: Nd = 1,4 × 800 = <b>1.120 kN</b>. ν = 1120 / (800 × 1,786) = 0,78.</li>
<li><b>Direção do lado de 20 cm.</b> λ = 3,46 × 280 / 20 = <b>48,4</b> &gt; 35: tem 2ª ordem. M1d,mín = 1120 × (1,5 + 0,03 × 20) = 2.352 kN·cm.</li>
<li><b>Curvatura.</b> 1/r = 0,005 / (20 × 1,28) = 1,95 × 10⁻⁴ cm⁻¹. M2d = 1120 × 280² / 10 × 1,95 × 10⁻⁴ = <b>1.710 kN·cm</b>.</li>
<li><b>Momento total.</b> Md = 2.352 + 1.710 = <b>4.062 kN·cm</b> (40,6 kN·m). Na outra direção, λ = 24,2 e vale só o momento mínimo.</li>
<li><b>Armadura.</b> Pelo diagrama parábola-retângulo, a seção precisa de As = <b>12,8 cm²</b> → <b>8 φ 16 mm</b> (16,1 cm², ρ = 2,0%). Estribos φ 5 a cada 19 cm.</li></ol>
<div class="dica"><b>Confira no simulador</b>Os valores iniciais são os do exemplo.</div>`,
sim:{html:()=>simWrap(rng('piB','Lado b',14,60,1,20,'cm')+rng('piH','Lado h',14,100,1,40,'cm')+sel('piF','Concreto',[[20,'C20'],[25,'C25',1],[30,'C30'],[35,'C35'],[40,'C40'],[45,'C45'],[50,'C50']])+rng('piN','Carga Nk',50,4000,10,800,'kN','Valor característico')+rng('piL','Comprimento de flambagem le',150,600,10,280,'cm','Pé-direito entre lajes')),
update(){const b=V_('piB'),h=V_('piH'),fck=V_('piF'),Nk=V_('piN'),le=V_('piL'),r=calc.pilar(b,h,fck,Nk,le);
  if(r.erro){$('tiles').innerHTML=tiles([['Nd',br(r.Nd,0)+' kN'],['λ máx.',br(r.lamMax,1)],['ν',br(r.nu,2)],['As','—',1]])+`<span class="pill alerta">${r.erro}</span>`;$('draw').innerHTML='';$('memorial').textContent=r.erro;return}
  $('tiles').innerHTML=tiles([['Nd',br(r.Nd,0)+' kN'],['λ máx.',br(r.lamMax,1)],['As necessária',br(r.As)+' cm²',1],['Armadura',r.bar?`${r.bar.n} φ ${br(r.bar.f,r.bar.f%1?1:0)} mm`:'—']])+(r.lamMax>35?'<span class="pill alerta">λ &gt; 35 · com efeito de 2ª ordem</span>':'<span class="pill ok">λ ≤ 35 · sem 2ª ordem</span>')+` <span class="pill ok">ρ = ${br(r.rho,2)}%</span>`;
  const sc=Math.min(260/h,200/b,8),W=b*sc,H=h*sc,ox=40,oy=30;let s=`<rect x="${ox}" y="${oy}" width="${W}" height="${H}" style="fill:var(--steel-soft);stroke:var(--ink);stroke-width:2"/><rect x="${ox+3*sc}" y="${oy+3*sc}" width="${W-6*sc}" height="${H-6*sc}" style="fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 2"/>`;
  if(r.bar){const pf=r.bar.n/2,rr=Math.max(3,r.bar.f/20*sc),cx=[ox+3.5*sc+rr/2,ox+W-3.5*sc-rr/2];for(let k=0;k<pf;k++){const y=oy+3.5*sc+rr/2+(pf>1?k*(H-7*sc-rr)/(pf-1):0);cx.forEach(x=>{s+=`<circle cx="${x}" cy="${y}" r="${rr}" style="fill:var(--amber);stroke:var(--ink)"/>`})}}
  s+=Ln(ox,oy+H+14,ox+W,oy+H+14,'muted')+T(ox+W/2,oy+H+28,'b = '+b+' cm','muted','text-anchor="middle"')+Ln(ox+W+12,oy,ox+W+12,oy+H,'muted')+T(ox+W+16,oy+H/2,'h = '+h,'muted');
  const tx=Math.max(ox+W+70,250);s+=T(tx,40,'VERIFICAÇÃO POR DIREÇÃO','muted','font-size="10" letter-spacing="1"');
  r.dx.forEach((q,i)=>{const y=64+i*92,pct=Math.min(1,q.Md/q.MRd);s+=T(tx,y,'Flexão na direção '+q.nome,'ink','font-weight="600"')+T(tx,y+18,`λ = ${br(q.lam,1)} · M1d,mín = ${br(q.M1/100,1)} · M2d = ${br(q.M2/100,1)} kN·m`,'muted','font-size="10"');
    s+=`<rect x="${tx}" y="${y+28}" width="260" height="12" style="fill:var(--grid)"/><rect x="${tx}" y="${y+28}" width="${260*pct}" height="12" style="fill:var(--${pct>0.999?'amber':'pos'})"/>`+T(tx,y+56,`Md = ${br(q.Md/100,1)} kN·m de ${br(q.MRd/100,1)} kN·m resistentes (${br(100*pct,0)}%)`,'ink','font-size="10"')});
  s+=T(tx,250,`Estribos φ ${br(r.estribo.f,1)} a cada ${r.estribo.s} cm`,'steel','font-weight="600"');
  $('draw').innerHTML=SVG(640,Math.max(280,oy+H+40),'Seção do pilar e verificação por direção',s);
  $('memorial').textContent=`1) γn = ${br(r.gn,2)} → Nd = ${br(r.gn,2)} × 1,4 × ${Nk} = ${br(r.Nd,1)} kN · ν = Nd/(Ac·fcd) = ${br(r.nu,3)}
${r.dx.map((q,i)=>`${i+2}) Direção ${q.nome}: λ = 3,46 × ${le}/${q.hd} = ${br(q.lam,1)}
   M1d,mín = Nd × (1,5 + 0,03 × ${q.hd}) = ${br(q.M1,0)} kN·cm
   ${q.lam>35?`1/r = 0,005/[${q.hd} × (${br(r.nu,3)} + 0,5)] → M2d = Nd·le²/10·(1/r) = ${br(q.M2,0)} kN·cm`:'λ ≤ 35: sem efeito de 2ª ordem'}
   Md,tot = ${br(q.Md,0)} kN·cm ≤ MRd = ${br(q.MRd,0)} kN·cm ✓`).join('\n')}
4) As,mín = máx(0,15·Nd/fyd ; 0,4%·Ac) = ${br(r.Asmin)} cm² · As,máx = ${br(r.Asmax)} cm²
5) As necessária = ${br(r.As)} cm² (diagrama parábola-retângulo, armadura simétrica nas duas faces)
6) Adotado: ${r.bar.n} φ ${br(r.bar.f,1)} mm = ${br(r.bar.area)} cm² · estribos φ ${br(r.estribo.f,1)} c/${r.estribo.s} cm
   Pilar intermediário com momento mínimo (αb = 1, λ1 = 35). Pilares de canto e extremidade exigem os momentos de 1ª ordem.`;}}
});

// EG-15 · Esgoto Sanitário
Academia.modulo('eg',{
teoria:`<p>O esgoto predial funciona por gravidade. Cada aparelho tem um "peso" chamado <b>Unidade Hunter de Contribuição (UHC)</b>, que representa quanto e com que frequência ele despeja água. Somando as UHC, achamos o diâmetro de cada tubo.</p>
<div class="cols"><div class="conceito"><h4>Ramal de descarga</h4><p>O tubo que sai de cada aparelho. A bacia sanitária pede DN 100; lavatório e chuveiro, DN 40.</p></div>
<div class="conceito"><h4>Tubo de queda</h4><p>A prumada vertical que desce recolhendo todos os andares. É dimensionado pela soma das UHC.</p></div>
<div class="conceito"><h4>Coletor predial</h4><p>O trecho horizontal até a rede pública. Diâmetro mínimo DN 100 e declividade mínima de 1% (2% para DN 75 ou menor).</p></div></div>
<h3>Algumas UHC da NBR 8160</h3>
<div class="formula">Bacia sanitária 6 (DN 100) · Chuveiro 2 (DN 40) · Lavatório 1 (DN 40) · Pia de cozinha 3 (DN 50)</div>
<div class="formula">Tanque 3 (DN 40) · Máquina de lavar roupa 3 (DN 50) · Máquina de lavar louça 2 (DN 50)</div>
<h3>Ventilação e inspeção</h3><p>Todo tubo de queda deve ser prolongado acima da cobertura (ventilação primária), para o ar entrar e o fecho hídrico dos sifões não ser sugado. Caixas de inspeção ficam a no máximo 25 m umas das outras.</p>
<div class="dica"><b>Cheiro de esgoto no banheiro</b>Quase sempre é falta de ventilação ou caixa sifonada sem fecho hídrico. Ralo seco também deixa o gás passar.</div>`,
exemplo:`<h3>Prédio de 8 andares com 4 apartamentos por andar</h3><p>Cada apartamento tem: bacia, chuveiro, lavatório, pia de cozinha, tanque e máquina de lavar roupa. Todos descem pelo mesmo tubo de queda.</p>
<ol class="passos"><li><b>UHC por apartamento.</b> 6 + 2 + 1 + 3 + 3 + 3 = <b>18 UHC</b>.</li>
<li><b>Por andar e total.</b> 18 × 4 = 72 UHC por andar. 72 × 8 = <b>576 UHC</b> no tubo de queda.</li>
<li><b>Tubo de queda.</b> Prédio com mais de 3 pavimentos: DN 100 aceita até 500 UHC (não serve). DN 150 aceita 1.900 no total e 330 por andar → <b>DN 150</b>.</li>
<li><b>Coletor predial a 1%.</b> DN 100 aceita 216 UHC (não serve). DN 150 aceita 840 → <b>DN 150</b>.</li>
<li><b>Ramal da caixa sifonada.</b> Chuveiro + lavatório = 3 UHC → <b>DN 50</b>, que é o mínimo de saída da caixa sifonada.</li></ol>
<div class="dica"><b>Confira no simulador</b>Os valores iniciais são os do exemplo.</div>`,
sim:{html:()=>simWrap(Object.entries(APARELHOS).map(([k,[u,dn,n]])=>rng('eg_'+k,n+' ('+u+' UHC)',0,3,1,['bacia','chuveiro','lavatorio','pia','tanque','maqroupa'].includes(k)?1:0,'un')).join('')+rng('egU','Unidades por andar',1,8,1,4,'un')+rng('egP','Pavimentos atendidos',1,20,1,8,'')+sel('egD','Declividade do coletor',[[0.5,'0,5% (só DN 150 ou maior)'],[1,'1%',1],[2,'2%'],[4,'4%']])),
update(){const ap={};Object.keys(APARELHOS).forEach(k=>ap[k]=V_('eg_'+k));const U=V_('egU'),P=V_('egP'),d=V_('egD'),r=calc.esgoto(ap,U,P,d);
  $('tiles').innerHTML=tiles([['UHC por unidade',r.uUn],['UHC no tubo de queda',r.uTot],['Tubo de queda',r.tq?'DN '+r.tq:'acima de DN 300',1],['Coletor predial',r.col?'DN '+r.col:'acima de DN 400',1]])+(r.uUn===0?'<span class="pill alerta">Nenhum aparelho escolhido</span>':'')+(!r.bacia&&r.uUn?' <span class="pill ok">Sem bacia: tubo de queda pode ser menor que DN 100</span>':'');
  const fl=Math.min(P,10),fh=24,top=30,x=150;let s=T_('ESQUEMA VERTICAL',30,18);
  for(let i=0;i<fl;i++){const y=top+i*fh;s+=`<rect x="60" y="${y}" width="240" height="${fh}" style="fill:${i%2?'var(--paper)':'var(--sheet)'};stroke:var(--line)"/>`+T(66,y+16,(P>10&&i===0?P:P-i)+'º','muted','font-size="10"');
    s+=Ln(x+20,y+fh-6,x+90,y+fh-2,'steel',1.5)+`<rect x="${x+20}" y="${y+fh-12}" width="12" height="7" style="fill:var(--steel)"/>`}
  if(P>10)s+=T(180,top+fh*0.5+4,'⋮ '+(P-9)+' andares','muted','text-anchor="middle" font-size="10"');
  const by=top+fl*fh;s+=Ln(x+90,top-18,x+90,by+30,'ink',5)+T(x+96,top-8,'ventilação acima do telhado','muted','font-size="9"');
  s+=Ln(x+90,by+30,560,by+30+410*d/100*4,'ink',5)+`<rect x="560" y="${by+18}" width="36" height="36" style="fill:none;stroke:var(--ink);stroke-width:2"/>`+T(578,by+68,'CI','ink','text-anchor="middle" font-size="10"');
  s+=T(x+100,by-6,r.tq?'TQ DN '+r.tq:'TQ > 300','amber-ink','font-weight="600"')+T(340,by+22+410*d/100*2,(r.col?'Coletor DN '+r.col:'Coletor > 400')+' · i = '+br(d,1).replace(',0','')+'%','amber-ink','font-weight="600"');
  s+=T(330,top+10,'RAMAIS DE DESCARGA','muted','font-size="10" letter-spacing="1"');let yy=top+28;Object.entries(APARELHOS).forEach(([k,[u,dn,n]])=>{if(!ap[k])return;s+=T(330,yy,`${ap[k]}× ${n}`,'ink','font-size="10"')+T(600,yy,'DN '+dn,'steel','text-anchor="end" font-size="10" font-weight="600"');yy+=16});
  if(r.ramal)s+=T(330,yy+6,'Saída da caixa sifonada','ink','font-size="10"')+T(600,yy+6,'DN '+r.ramal,'steel','text-anchor="end" font-size="10" font-weight="600"');
  $('draw').innerHTML=SVG(640,Math.max(by+80,yy+30),'Esquema vertical do esgoto do prédio',s);
  $('memorial').textContent=`1) UHC por unidade = ${Object.entries(APARELHOS).filter(([k])=>ap[k]).map(([k,[u,,n]])=>`${ap[k]}×${u} (${n.toLowerCase()})`).join(' + ')||'0'} = ${r.uUn}
2) UHC por andar = ${r.uUn} × ${U} = ${r.uPav} · UHC total = ${r.uPav} × ${P} = ${r.uTot}
3) Tubo de queda (${P<=3?'prédio de até 3 pavimentos':'mais de 3 pavimentos: confere total e por andar'})${r.bacia?', mínimo DN 100 por causa da bacia':''} → ${r.tq?'DN '+r.tq:'acima da tabela'}
4) Coletor predial com i = ${br(d,1)}% → ${r.col?'DN '+r.col:'acima da tabela'} (mínimo DN 100)
5) Ramal da caixa sifonada: ${r.uCx} UHC → ${r.ramal?'DN '+r.ramal:'—'}
6) Ventilação primária: prolongar o tubo de queda 30 cm acima do telhado (2 m em terraço utilizável).
   Valores das tabelas da NBR 8160. Confira as tabelas da edição vigente no projeto final.`;}}
});

// EL-16 · Instalações Elétricas
Academia.modulo('el',{
teoria:`<p>O projeto elétrico residencial segue uma sequência: prever as cargas de cada cômodo, dividir em circuitos, escolher a seção do fio e o disjuntor de cada circuito.</p>
<div class="cols"><div class="conceito"><h4>Previsão de cargas</h4><p>A NBR 5410 define o mínimo de iluminação e de tomadas (TUG) por cômodo, a partir da área e do perímetro.</p></div>
<div class="conceito"><h4>TUG e TUE</h4><p>Tomada de uso geral (TUG) é para aparelhos portáteis. Tomada de uso específico (TUE) é para chuveiro, ar-condicionado e outros equipamentos fixos com circuito próprio.</p></div>
<div class="conceito"><h4>Disjuntor</h4><p>Protege o fio. A regra é Ib ≤ In ≤ Iz: a corrente do circuito, a do disjuntor e a capacidade do fio.</p></div></div>
<h3>Previsão mínima (NBR 5410)</h3>
<div class="formula">Iluminação: até 6 m² → 100 VA · acima disso, +60 VA a cada 4 m² inteiros</div>
<div class="formula">TUG: cozinha e serviço 1 a cada 3,5 m de perímetro · sala e quarto 1 a cada 5 m · banheiro 1 junto ao lavatório</div>
<div class="formula">Potência: banheiro, cozinha e serviço 600 VA nas 3 primeiras e 100 VA nas demais · outros cômodos 100 VA</div>
<h3>Dimensionamento do circuito</h3>
<div class="formula">Ib = P / V     Iz = capacidade do fio × fator de agrupamento     Ib ≤ In ≤ Iz</div>
<div class="formula">Queda de tensão: ΔV% = 200 · L · Ib / (56 · S · V) ≤ 4%     Seção mínima: 1,5 mm² iluminação · 2,5 mm² tomadas</div>
<div class="dica"><b>Segurança</b>DR (dispositivo diferencial residual) de 30 mA é obrigatório nos circuitos de áreas molhadas e tomadas externas. Ele protege as pessoas contra choque; o disjuntor protege o fio.</div>`,
exemplo:`<h3>Circuito do chuveiro de 5.500 W em 220 V</h3><p>Comprimento de 12 m até o quadro, fio isolado em eletroduto embutido na alvenaria (método B1), sem outros circuitos no mesmo eletroduto.</p>
<ol class="passos"><li><b>Corrente.</b> Ib = 5500 / 220 = <b>25 A</b>.</li>
<li><b>Disjuntor.</b> O padrão logo acima de 25 A é o próprio <b>25 A</b>.</li>
<li><b>Fio de 2,5 mm².</b> Aguenta 24 A: menor que o disjuntor. Não serve.</li>
<li><b>Fio de 4 mm².</b> Aguenta 32 A ≥ 25 A ✓. Queda: 200 × 12 × 25 / (56 × 4 × 220) = <b>1,22%</b> ≤ 4% ✓</li>
<li><b>Resultado.</b> Fio <b>4 mm²</b> com disjuntor de <b>25 A</b>, mais DR de 30 mA por ser área molhada.</li></ol>
<div class="dica"><b>Previsão do exemplo</b>Uma cozinha de 9 m² com 12 m de perímetro leva 100 VA de iluminação e 4 tomadas (12 / 3,5 = 3,4 → 4): 3 × 600 + 100 = 1.900 VA.</div>`,
sim:{comodos:[['Sala','sala',16,16],['Cozinha','cozinha',9,12],['Dormitório 1','dormitorio',12,14],['Dormitório 2','dormitorio',9,12],['Banheiro','banheiro',3.6,7.6],['Área de serviço','servico',4,8],['Varanda','varanda',4,8]].map(([n,t,a,p])=>({n,t,a,p})),
circ:[['Iluminação','ilum',880,127,18],['TUG sala, quartos e varanda','tug',1100,127,20],['TUG cozinha','tug',1900,127,10],['TUG serviço e banheiro','tug',2400,127,12],['Chuveiro','tue',5500,220,12]].map(([n,t,P,V,L])=>({n,t,P,V,L})),
TIPOS:[['sala','Sala'],['dormitorio','Dormitório'],['cozinha','Cozinha / copa'],['servico','Área de serviço'],['banheiro','Banheiro'],['varanda','Varanda'],['outro','Outro cômodo']],
html(){return `<div class="sim"><div class="ctrl">${rng('elG','Circuitos no mesmo eletroduto',1,9,1,3,'','Fator de agrupamento da NBR 5410 (método B1)')}<div id="tiles"></div></div><div class="draw" id="draw"></div></div>
<h3>Previsão de cargas por cômodo</h3><div class="tbl-wrap"><table class="ed"><thead><tr><th>Cômodo</th><th>Tipo</th><th>Área (m²)</th><th>Perímetro (m)</th><th>Iluminação</th><th>TUG</th><th>TUG (VA)</th><th></th></tr></thead><tbody id="elR"></tbody></table></div><div class="presets"><button class="chip" id="elRA">+ Cômodo</button></div>
<h3>Circuitos</h3><div class="tbl-wrap"><table class="ed"><thead><tr><th>Circuito</th><th>Tipo</th><th>Potência (VA)</th><th>Tensão</th><th>Comp. (m)</th><th>Ib</th><th>Fio</th><th>Disjuntor</th><th>Queda</th><th></th></tr></thead><tbody id="elC"></tbody></table></div><div class="presets"><button class="chip" id="elCA">+ Circuito</button></div>
<h3>Memorial de cálculo</h3><div class="memorial" id="memorial"></div>`},
init(){const self=this;$('elRA').onclick=()=>{self.comodos.push({n:'Novo cômodo',t:'outro',a:6,p:10});self.tabelas();self.update()};$('elCA').onclick=()=>{self.circ.push({n:'Novo circuito',t:'tug',P:1000,V:127,L:10});self.tabelas();self.update()};this.tabelas()},
tabelas(){const self=this;
  $('elR').innerHTML=this.comodos.map((c,i)=>`<tr><td><input type="text" id="elRn${i}" data-r="${i}" data-k="n" value="${esc(c.n)}" style="min-width:110px;font-family:var(--f-body)" aria-label="Nome do cômodo"></td><td><select id="elRt${i}" data-r="${i}" data-k="t" aria-label="Tipo de ${esc(c.n)}">${this.TIPOS.map(([k,t])=>`<option value="${k}"${k===c.t?' selected':''}>${t}</option>`).join('')}</select></td><td><input type="number" step="0.1" min="0.5" id="elRa${i}" data-r="${i}" data-k="a" value="${c.a}" aria-label="Área"></td><td><input type="number" step="0.1" min="1" id="elRp${i}" data-r="${i}" data-k="p" value="${c.p}" aria-label="Perímetro"></td><td class="num" id="elRi${i}"></td><td class="num" id="elRq${i}"></td><td class="num" id="elRv${i}"></td><td>${this.comodos.length>1?`<button class="rm" data-rr="${i}" aria-label="Remover cômodo">✕</button>`:''}</td></tr>`).join('')+'<tr><td colspan="4"><b>Total</b></td><td class="num" id="elTi"></td><td class="num" id="elTq"></td><td class="num" id="elTv"></td><td></td></tr>';
  $('elC').innerHTML=this.circ.map((c,i)=>`<tr><td><input type="text" id="elCn${i}" data-c="${i}" data-k="n" value="${esc(c.n)}" style="min-width:130px;font-family:var(--f-body)" aria-label="Nome do circuito"></td><td><select id="elCt${i}" data-c="${i}" data-k="t" aria-label="Tipo do circuito"><option value="ilum"${c.t==='ilum'?' selected':''}>Iluminação</option><option value="tug"${c.t==='tug'?' selected':''}>TUG</option><option value="tue"${c.t==='tue'?' selected':''}>TUE</option></select></td><td><input type="number" step="10" min="10" id="elCP${i}" data-c="${i}" data-k="P" value="${c.P}" aria-label="Potência"></td><td><select id="elCV${i}" data-c="${i}" data-k="V" aria-label="Tensão"><option value="127"${c.V==127?' selected':''}>127 V</option><option value="220"${c.V==220?' selected':''}>220 V</option></select></td><td><input type="number" step="1" min="1" id="elCL${i}" data-c="${i}" data-k="L" value="${c.L}" aria-label="Comprimento"></td><td class="num" id="elCi${i}"></td><td class="num" id="elCs${i}"></td><td class="num" id="elCd${i}"></td><td class="num" id="elCq${i}"></td><td>${this.circ.length>1?`<button class="rm" data-rc="${i}" aria-label="Remover circuito">✕</button>`:''}</td></tr>`).join('');
  document.querySelectorAll('#elR [data-k],#elC [data-k]').forEach(e=>{e[e.tagName==='SELECT'?'onchange':'oninput']=()=>{const L=e.dataset.r!==undefined?self.comodos[+e.dataset.r]:self.circ[+e.dataset.c],k=e.dataset.k;
    if(k==='n'||k==='t')L[k]=e.value;else{const v=parseFloat(e.value);if(!isNaN(v)&&v>0)L[k]=v}self.update()}});
  document.querySelectorAll('[data-rr]').forEach(b=>b.onclick=()=>{self.comodos.splice(+b.dataset.rr,1);self.tabelas();self.update()});
  document.querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>{self.circ.splice(+b.dataset.rc,1);self.tabelas();self.update()})},
update(){const G=V_('elG');let ti=0,tq=0,tv=0;
  this.comodos.forEach((c,i)=>{const il=calc.ilum(c.a),t=calc.tugs(c.t,c.a,c.p);ti+=il;tq+=t.n;tv+=t.va;$('elRi'+i).textContent=il+' VA';$('elRq'+i).textContent=t.n;$('elRv'+i).textContent=t.va+' VA'});
  $('elTi').textContent=ti+' VA';$('elTq').textContent=tq;$('elTv').textContent=tv+' VA';
  const rs=this.circ.map(c=>calc.circuito(c.P,c.V,c.L,c.t,G));let ruim=0;
  rs.forEach((r,i)=>{$('elCi'+i).textContent=br(r.Ib,1)+' A';$('elCs'+i).textContent=r.ok?br(r.S,1).replace(',0','')+' mm²':'—';$('elCd'+i).textContent=r.ok?r.In+' A':'—';$('elCq'+i).innerHTML=r.ok?br(r.dv,2)+'%':'<span class="pill alerta">não atende</span>';if(!r.ok)ruim++});
  const tot=this.circ.reduce((s,c)=>s+c.P,0);
  $('tiles').innerHTML=tiles([['Iluminação prevista',br(ti,0)+' VA'],['TUG previstas',tq+' · '+br(tv,0)+' VA'],['Potência dos circuitos',br(tot,0)+' VA',1],['Circuitos',this.circ.length]])+(ruim?`<span class="pill alerta">${ruim} circuito(s) sem solução</span>`:'<span class="pill ok">Todos os circuitos atendem</span>')+(this.circ.filter(c=>c.t!=='tue').reduce((s,c)=>s+c.P,0)<ti+tv?' <span class="pill alerta">Circuitos com menos carga que a previsão</span>':'');
  const rh=34,top=34;let s=T_('QUADRO DE DISTRIBUIÇÃO · QUEDA DE TENSÃO',20,18);
  s+=Ln(330,top-6,330,top+rs.length*rh,'grid')+T(330,top+rs.length*rh+14,'0%','muted','text-anchor="middle" font-size="9"')+Ln(570,top-6,570,top+rs.length*rh,'neg',1.5,'stroke-dasharray="4 3"')+T(570,top+rs.length*rh+14,'4% (limite)','neg','text-anchor="middle" font-size="9"');
  rs.forEach((r,i)=>{const y=top+i*rh,c=this.circ[i];s+=`<rect x="20" y="${y}" width="22" height="${rh-8}" style="fill:var(--${r.ok?'ink':'neg'})"/>`+T(31,y+17,r.ok?r.In:'!','sheet','text-anchor="middle" font-size="10" font-weight="600"');
    s+=T(50,y+11,'C'+(i+1)+' '+(c.n.length>26?c.n.slice(0,25)+'…':c.n),'ink','font-size="11" font-weight="600"')+T(50,y+24,r.ok?`${br(r.Ib,1)} A · ${br(r.S,1).replace(',0','')} mm² · ${c.V} V · ${r.crit}`:r.erro.slice(0,40),'muted','font-size="9"');
    if(r.ok){const w=240*Math.min(1,r.dv/4);s+=`<rect x="330" y="${y+4}" width="${w}" height="${rh-16}" style="fill:var(--${r.dv>3?'amber':'pos'})"/>`+T(336+w,y+16,br(r.dv,2)+'%','ink','font-size="10"')}});
  $('draw').innerHTML=SVG(640,top+rs.length*rh+24,'Quadro de distribuição com queda de tensão por circuito',s);
  $('memorial').textContent=`PREVISÃO DE CARGAS: iluminação ${br(ti,0)} VA · ${tq} TUG = ${br(tv,0)} VA
Fator de agrupamento (${G} circuito${G>1?'s':''} no eletroduto) = ${br(FAGRUP[Math.min(G,9)],2)} · método B1, cobre/PVC
${this.circ.map((c,i)=>{const r=rs[i];return r.ok?`C${i+1} ${c.n}: Ib = ${c.P}/${c.V} = ${br(r.Ib,2)} A → disjuntor ${r.In} A · fio ${br(r.S,1)} mm² (Iz = ${br(CAPB1[r.S],1)} × ${br(r.fa,2)} = ${br(r.Iz,1)} A)
   ΔV = 200 × ${c.L} × ${br(r.Ib,2)} / (56 × ${br(r.S,1)} × ${c.V}) = ${br(r.dv,2)}% · critério: ${r.crit}`:`C${i+1} ${c.n}: ${r.erro}`}).join('\n')}
Use DR de 30 mA nos circuitos de áreas molhadas e tomadas externas.`;}}
});

iniciar();
</script>

// IS-02 · Isostática
Academia.modulo('is',{
teoria:`<p>Toda estrutura precisa estar presa ao chão de algum jeito. O tipo de apoio define quais movimentos ficam impedidos, e cada movimento impedido gera uma reação.</p>
<figure class="fig"><svg viewBox="0 0 640 182" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Tipos de apoio e as reações que cada um oferece"><rect x="50" y="58" width="100" height="12" style="fill:var(--grid);stroke:var(--ink);stroke-width:2" /><path d="M100 70 l-9 15 h18z" style="fill:none;stroke:var(--ink);stroke-width:1.5" /><line x1="88" y1="90" x2="112" y2="90" style="stroke:var(--ink);stroke-width:1.5" /><line x1="100" y1="122" x2="100" y2="96" style="stroke:var(--steel);stroke-width:1.8" /><path d="M102.7 102.4 L100 96 L97.3 102.4" style="fill:none;stroke:var(--steel);stroke-width:1.8" /><text x="100" y="150" style="fill:var(--ink)" text-anchor="middle" font-weight="600">1º gênero · móvel</text><text x="100" y="168" style="fill:var(--muted)" text-anchor="middle" font-size="10">1 reação: vertical</text><rect x="260" y="58" width="100" height="12" style="fill:var(--grid);stroke:var(--ink);stroke-width:2" /><path d="M310 70 l-9 15 h18z" style="fill:none;stroke:var(--ink);stroke-width:1.5" /><line x1="300" y1="85" x2="296" y2="91" style="stroke:var(--ink);stroke-width:1" /><line x1="305" y1="85" x2="301" y2="91" style="stroke:var(--ink);stroke-width:1" /><line x1="310" y1="85" x2="306" y2="91" style="stroke:var(--ink);stroke-width:1" /><line x1="315" y1="85" x2="311" y2="91" style="stroke:var(--ink);stroke-width:1" /><line x1="320" y1="85" x2="316" y2="91" style="stroke:var(--ink);stroke-width:1" /><line x1="310" y1="122" x2="310" y2="96" style="stroke:var(--steel);stroke-width:1.8" /><path d="M312.7 102.4 L310 96 L307.3 102.4" style="fill:none;stroke:var(--steel);stroke-width:1.8" /><line x1="260" y1="90" x2="294" y2="90" style="stroke:var(--steel);stroke-width:1.8" /><path d="M287.6 92.7 L294 90 L287.6 87.3" style="fill:none;stroke:var(--steel);stroke-width:1.8" /><text x="310" y="150" style="fill:var(--ink)" text-anchor="middle" font-weight="600">2º gênero · fixo</text><text x="310" y="168" style="fill:var(--muted)" text-anchor="middle" font-size="10">2 reações: V e H</text><rect x="514" y="40" width="12" height="70" style="fill:var(--grid);stroke:var(--ink);stroke-width:2" /><line x1="514" y1="45" x2="504" y2="53" style="stroke:var(--ink);stroke-width:1" /><line x1="514" y1="57" x2="504" y2="65" style="stroke:var(--ink);stroke-width:1" /><line x1="514" y1="69" x2="504" y2="77" style="stroke:var(--ink);stroke-width:1" /><line x1="514" y1="81" x2="504" y2="89" style="stroke:var(--ink);stroke-width:1" /><line x1="514" y1="93" x2="504" y2="101" style="stroke:var(--ink);stroke-width:1" /><line x1="514" y1="105" x2="504" y2="113" style="stroke:var(--ink);stroke-width:1" /><rect x="526" y="68" width="80" height="12" style="fill:var(--grid);stroke:var(--ink);stroke-width:2" /><line x1="560" y1="108" x2="560" y2="84" style="stroke:var(--steel);stroke-width:1.8" /><path d="M562.7 90.4 L560 84 L557.3 90.4" style="fill:none;stroke:var(--steel);stroke-width:1.8" /><line x1="480" y1="74" x2="510" y2="74" style="stroke:var(--steel);stroke-width:1.8" /><path d="M503.6 76.7 L510 74 L503.6 71.3" style="fill:none;stroke:var(--steel);stroke-width:1.8" /><path d="M542 50 A20 20 0 1 1 570 66" style="fill:none;stroke:var(--steel);stroke-width:1.6" /><path d="M564 62 L570 66 L571 59" style="fill:none;stroke:var(--steel);stroke-width:1.6" /><text x="520" y="150" style="fill:var(--ink)" text-anchor="middle" font-weight="600">3º gênero · engaste</text><text x="520" y="168" style="fill:var(--muted)" text-anchor="middle" font-size="10">3 reações: V, H e M</text></svg><figcaption>Tipos de apoio e as reações que cada um oferece</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Apoio móvel (1º gênero)</h4><p>Rolete. Impede só o movimento vertical: 1 reação.</p></div>
<div class="conceito"><h4>Apoio fixo (2º gênero)</h4><p>Articulação. Impede vertical e horizontal, mas deixa girar: 2 reações.</p></div>
<div class="conceito"><h4>Engaste (3º gênero)</h4><p>Peça chumbada. Impede tudo, inclusive girar: 2 forças e 1 momento.</p></div></div>
<h3>Isostática, hipostática ou hiperestática?</h3>
<p>No plano temos 3 equações de equilíbrio. Se a estrutura tem exatamente as reações necessárias (3, bem distribuídas), ela é <b>isostática</b> e resolvemos só com estática. Menos que isso, ela se move (<b>hipostática</b>). Mais que isso, sobra apoio (<b>hiperestática</b>) e precisamos de outros métodos.</p>
<h3>Viga em balanço (engastada)</h3>
<div class="formula">Reação vertical: R = q·L + P     Momento no engaste: M = q·L²/2 + P·L</div>
<div class="dica"><b>Atenção na obra</b>No balanço o momento é negativo: a parte de cima é tracionada. A armadura principal vai em cima. Marquises que desabam quase sempre têm aço mal posicionado ou corroído.</div>`,
exemplo:`<h3>Marquise de 1,50 m</h3><p>Uma marquise engastada na viga da fachada tem 1,50 m de balanço, carga distribuída de 6 kN/m (laje, impermeabilização e sobrecarga) e uma platibanda na ponta que pesa 2 kN.</p>
<ol class="passos"><li><b>Reação vertical.</b> R = 6 × 1,5 + 2 = <b>11 kN</b>.</li>
<li><b>Momento da carga distribuída.</b> q·L²/2 = 6 × 2,25 / 2 = 6,75 kN·m.</li>
<li><b>Momento da carga na ponta.</b> P·L = 2 × 1,5 = 3,00 kN·m.</li>
<li><b>Momento no engaste.</b> M = 6,75 + 3,00 = <b>9,75 kN·m</b> (negativo: tração em cima).</li>
<li><b>Leitura.</b> O momento é máximo junto à parede e zero na ponta. É justamente junto à parede que a armadura superior precisa estar bem ancorada.</li></ol>
<div class="dica"><b>Confira no simulador</b>L = 1,5 m, q = 6 kN/m, P = 2 kN.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Balanço de 1,2 m com carga distribuída", "html": "<p>Uma prateleira de concreto em balanço com 1,2 m recebe 4 kN/m.</p><ol class=\"passos\"><li><b>Reação vertical.</b> R = 4 × 1,2 = <b>4,8 kN</b>.</li><li><b>Momento no engaste.</b> M = q·L²/2 = 4 × 1,44 / 2 = <b>2,88 kN·m</b>, com tração em cima.</li><li><b>Na ponta.</b> Cortante e momento são zero na extremidade livre.</li></ol>"}, {"nivel": "obra", "titulo": "Sacada em balanço de 1,5 m", "html": "<p>Laje de sacada em balanço com 1,5 m, calculada por faixa de 1 m de largura. Laje de 12 cm (3,0 kN/m²), revestimento 1,0 kN/m² e sobrecarga de uso 2,0 kN/m². Guarda-corpo de alvenaria na ponta: 1,0 kN por metro.</p><ol class=\"passos\"><li><b>Carga distribuída.</b> q = 3,0 + 1,0 + 2,0 = <b>6,0 kN/m</b> por metro de largura.</li><li><b>Reação.</b> R = 6 × 1,5 + 1,0 = <b>10 kN/m</b>.</li><li><b>Momento no engaste.</b> 6 × 1,5² / 2 + 1,0 × 1,5 = 6,75 + 1,50 = <b>8,25 kN·m/m</b>.</li><li><b>Equilíbrio.</b> Esse momento precisa ser equilibrado pela laje interna. A armadura negativa da sacada tem que entrar na laje vizinha, com ancoragem suficiente.</li></ol><div class=\"dica\"><b>Atenção</b>Sacada sem laje interna para equilibrar, ou com a armadura cortada na porta, é uma das causas clássicas de colapso.</div>"}],
obra:{"intro": "Isostática na obra é entender por onde a carga passa até chegar ao chão. Balanços, marquises e escadas são as peças em que um erro de execução pesa mais.", "erros": [["Armadura negativa no lugar errado", "Em balanços, o aço principal fica em cima. Pisoteado durante a concretagem, ele desce e perde a função."], ["Balanço sem contrapeso", "Marquise ou sacada sem laje ou viga interna que equilibre o momento."], ["Retirar escora de balanço cedo", "O balanço é a última peça a ser desescorada, e sempre da ponta para o engaste."], ["Aumentar a carga na ponta", "Floreira, jardineira ou parede extra na ponta de marquise que não foi calculada para isso."]], "checklist": ["A armadura negativa dos balanços está em cima e apoiada em caranguejos ou espaçadores", "A armadura negativa entra na laje interna o comprimento de ancoragem indicado no projeto", "Durante a concretagem, ninguém pisa na armadura negativa", "A desforma do balanço foi feita por último e da ponta para o engaste", "Marquises existentes não têm fissuras na face superior junto à parede", "Não foram acrescentadas cargas na ponta sem novo cálculo"], "dica": "Em marquise antiga, fissura na face de cima junto à parede e ferrugem aparente são sinais de alerta. Interdite a área embaixo e chame um engenheiro."},

  ['inferior','superior','diagonal','montante'].forEach((k,i)=>{const b=mx(k);if(!b.g)return;const [x1,y1]=P(r.nos[b.a]),[x2,y2]=P(r.nos[b.c]);s+=T((x1+x2)/2,(y1+y2)/2+(k==='inferior'?16:k==='superior'?-8:4),br(b.N,1),b.N>0?'steel':'neg','text-anchor="middle" font-size="10" font-weight="600"')});
  s+=T(ox+L*sc/2,yb+34,'L = '+br(L,1)+' m · H = '+br(H,1)+' m · '+n+' painéis','muted','text-anchor="middle" font-size="10"');

// CA-03 · Concreto Armado
Academia.modulo('ca',{
teoria:`<p>O concreto aguenta muito bem ser apertado (compressão), mas trinca fácil quando é puxado (tração resiste só cerca de 10%). Por isso colocamos aço onde a peça é tracionada. Juntos, viram concreto armado.</p>
<figure class="fig"><svg viewBox="0 0 640 232" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Seção de viga fletida: concreto comprimido em cima, aço tracionado embaixo"><rect x="60" y="20" width="110" height="190" style="fill:var(--grid);stroke:var(--ink);stroke-width:2" /><circle cx="80" cy="186" r="6" style="fill:var(--steel);stroke:var(--ink);stroke-width:1"/><circle cx="115" cy="186" r="6" style="fill:var(--steel);stroke:var(--ink);stroke-width:1"/><circle cx="150" cy="186" r="6" style="fill:var(--steel);stroke:var(--ink);stroke-width:1"/><line x1="50" y1="88" x2="180" y2="88" style="stroke:var(--neg);stroke-width:1.5" stroke-dasharray="5 4"/><text x="186" y="92" style="fill:var(--neg)" font-size="10">linha neutra</text><text x="115" y="226" style="fill:var(--muted)" text-anchor="middle">b</text><line x1="40" y1="20" x2="40" y2="186" style="stroke:var(--muted);stroke-width:1" /><text x="34" y="110" style="fill:var(--muted)" text-anchor="end">d</text><path d="M260 20 L340 20 L300 88 L260 88Z" style="fill:var(--amber);stroke:var(--ink);stroke-width:1" /><text x="350" y="40" style="fill:var(--amber-ink)" font-size="10">concreto comprimido</text><text x="350" y="54" style="fill:var(--muted)" font-size="10">(bloco de tensões 0,8x)</text><line x1="260" y1="186" x2="380" y2="186" style="stroke:var(--steel);stroke-width:2.2" /><path d="M373.6 188.7 L380 186 L373.6 183.3" style="fill:none;stroke:var(--steel);stroke-width:2.2" /><text x="390" y="190" style="fill:var(--steel)" font-size="10" font-weight="600">aço tracionado: As · fyd</text><line x1="330" y1="54" x2="260" y2="54" style="stroke:var(--amber-ink);stroke-width:2.2" /><path d="M266.4 51.3 L260 54 L266.4 56.7" style="fill:none;stroke:var(--amber-ink);stroke-width:2.2" /><line x1="260" y1="20" x2="260" y2="200" style="stroke:var(--line);stroke-width:1" /><text x="420" y="120" style="fill:var(--ink)" font-weight="600">Md = Rcc · z</text><text x="420" y="138" style="fill:var(--muted)" font-size="10">z = d − 0,4x</text><line x1="240" y1="54" x2="240" y2="186" style="stroke:var(--muted);stroke-width:1" /><text x="234" y="124" style="fill:var(--muted)" text-anchor="end">z</text></svg><figcaption>Seção de viga fletida: concreto comprimido em cima, aço tracionado embaixo</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Coeficientes de segurança</h4><p>Cargas × 1,4 (γf). Resistência do concreto ÷ 1,4 (γc). Resistência do aço ÷ 1,15 (γs).</p></div>
<div class="conceito"><h4>Aço CA-50</h4><p>fyk = 500 MPa. De cálculo: fyd = 500/1,15 ≈ 435 MPa = 43,5 kN/cm².</p></div>
<div class="conceito"><h4>Linha neutra (x)</h4><p>Divide a parte comprimida da tracionada. A norma pede x/d ≤ 0,45 para a viga avisar antes de romper (ductilidade).</p></div></div>
<h3>Fórmulas do dimensionamento (seção retangular)</h3>
<div class="formula">Md = 1,4·Mk     fcd = fck/1,4     d ≈ h − 4 cm</div>
<div class="formula">x = 1,25·d·[1 − √(1 − Md / (0,425·bw·d²·fcd))]</div>
<div class="formula">As = Md / [fyd·(d − 0,4·x)]     As,mín = ρmín·bw·h (0,15% até C30)</div>
<div class="dica"><b>Dica de projeto</b>Se x/d passar de 0,45, não adianta só pôr mais aço. Aumente a altura da viga ou use concreto mais resistente.</div><h3>Cisalhamento e estribos (modelo I)</h3><div class="formula">VRd2 = 0,27 · (1 − fck/250) · fcd · bw · d     (esmagamento das bielas)</div><div class="formula">Vc = 0,6 · fctd · bw · d     Asw/s = (Vd − Vc) / (0,9 · d · fywd)     ρw,mín = 0,2 · fctm / fywk</div><p>O estribo "costura" as fissuras inclinadas que o cortante abre perto dos apoios. A calculadora <b>Estribos</b>, no simulador, faz essa verificação completa.</p>`,
exemplo:`<h3>Viga 20 × 50 com Mk = 100 kN·m</h3><p>Concreto C25 (fck = 25 MPa), aço CA-50, cobrimento e estribo somando cerca de 4 cm até o centro da barra.</p>
<ol class="passos"><li><b>Altura útil.</b> d = 50 − 4 = <b>46 cm</b>.</li>
<li><b>Momento de cálculo.</b> Md = 1,4 × 100 = 140 kN·m = <b>14.000 kN·cm</b>.</li>
<li><b>Resistência de cálculo.</b> fcd = 25 / 1,4 = 17,86 MPa = <b>1,786 kN/cm²</b>.</li>
<li><b>Linha neutra.</b> x = 1,25 × 46 × [1 − √(1 − 14000/(0,425 × 20 × 46² × 1,786))] ≈ <b>14,3 cm</b>. x/d = 0,31 ≤ 0,45 ✓</li>
<li><b>Armadura.</b> As = 14000 / [43,48 × (46 − 0,4 × 14,3)] ≈ <b>8,0 cm²</b> → <b>4 φ 16 mm</b> (8,04 cm²).</li></ol>
<div class="dica"><b>Confira no simulador</b>bw = 20, h = 50, fck = 25 e Mk = 100.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Viga 15 × 40 com Mk = 50 kN·m", "html": "<p>Concreto C25, aço CA-50.</p><ol class=\"passos\"><li><b>Altura útil.</b> d = 40 − 4 = <b>36 cm</b>. Md = 1,4 × 50 = 70 kN·m = 7.000 kN·cm.</li><li><b>Linha neutra.</b> x = 12,4 cm. x/d = <b>0,34</b> ≤ 0,45 ✓</li><li><b>Armadura.</b> As = <b>5,19 cm²</b>, bem acima do mínimo de 0,90 cm².</li><li><b>Barras.</b> Na largura de 15 cm cabem <b>2 φ 20 mm</b> (6,28 cm²). Outra opção seria 3 φ 16 em duas camadas.</li></ol>"}, {"nivel": "obra", "titulo": "Viga dentro da parede de bloco de 14 cm", "html": "<p>Em casas, a viga costuma ter a largura do bloco: 14 × 30 cm. Momento característico de 25 kN·m, C25.</p><ol class=\"passos\"><li><b>Altura útil.</b> d = 30 − 4 = <b>26 cm</b>.</li><li><b>Linha neutra.</b> x = 9,2 cm. x/d = <b>0,36</b> ✓</li><li><b>Armadura.</b> As = <b>3,61 cm²</b> → <b>2 φ 16 mm</b> (4,02 cm²).</li><li><b>Cuidado na obra.</b> Com 14 cm de largura e cobrimento de 2,5 a 3 cm, sobra pouco espaço para a brita passar entre as barras. Use brita 1 e vibre bem para não formar bicheira.</li></ol><div class=\"dica\"><b>Larguras pequenas</b>Viga de 14 cm com 3 ou mais barras de 16 mm numa camada não cabe. Confira o espaçamento antes de concretar.</div>"}],
obra:{"intro": "No concreto armado, o projeto só funciona se a obra executar o que está desenhado: aço na posição certa, cobrimento correto e concreto bem adensado e curado.", "erros": [["Cobrimento insuficiente", "Aço encostado na forma: em poucos anos aparece ferrugem e o concreto estoura."], ["Bicheira", "Concreto mal vibrado deixa vazios com brita aparente, principalmente no fundo de vigas e pé de pilares."], ["Água a mais no caminhão", "Cada balde de água adicionado para \"facilitar\" derruba a resistência do concreto."], ["Cura esquecida", "Concreto que seca rápido demais fissura e perde resistência na superfície."]], "checklist": ["Bitolas, quantidades e posições das barras conferidas com o projeto antes da concretagem", "Espaçadores (cocadas ou plásticos) garantindo o cobrimento em todas as faces", "Formas limpas, travadas, estanques e molhadas antes do lançamento", "Nota fiscal do concreto com fck, slump e horário de saída da usina", "Slump test feito na chegada do caminhão e corpos de prova moldados", "Concreto vibrado em camadas, sem encostar o vibrador na armadura", "Cura úmida mantida por pelo menos 7 dias"], "dica": "Antes de liberar a concretagem, tire fotos da armadura de cada peça com uma trena aparecendo. Isso protege você e o cliente se surgir dúvida depois."},
extras:[{nome:'Estribos (cisalhamento)',
html:()=>`<p class="nota">Cortante pela NBR 6118, modelo de cálculo I: bielas a 45° e estribos verticais de CA-50. Use o maior cortante, junto ao apoio.</p>`+simWrap(`<div class="row">${rng('esB','Largura bw',12,40,1,15,'cm')}${rng('esH','Altura h',25,100,1,40,'cm')}</div>`+sel('esF','Concreto',[[20,'C20'],[25,'C25',1],[30,'C30'],[35,'C35'],[40,'C40']])+rng('esV','Cortante característico Vk',5,400,1,60,'kN','Vd = 1,4 × Vk')+sel('esP','Diâmetro do estribo',[[5,'φ 5 mm',1],[6.3,'φ 6,3 mm'],[8,'φ 8 mm'],[10,'φ 10 mm']])+sel('esR','Ramos do estribo',[[2,'2 ramos (estribo simples)',1],[4,'4 ramos (estribo duplo)']])),
update(){const bw=V_('esB'),h=V_('esH'),fck=+$('esF').value,phi=+$('esP').value,ram=+$('esR').value,r=calc.estribos(bw,h,fck,V_('esV'),phi,50,ram);
  const est=r.ok?`φ ${br(phi,phi%1?1:0)} c/ ${r.s} cm`:'—';
  $('tiles').innerHTML=tiles([['Vd',br(r.Vd,1)+' kN'],['VRd2 (bielas)',br(r.VRd2,1)+' kN'],['Asw/s necessário',br(100*r.asw,2)+' cm²/m'],['Estribos',est,1]])+`<span class="pill ${r.ok?'ok':'alerta'}">${r.ok?(r.minGoverna?'Armadura mínima governa':'Seção atende'):'Bielas esmagam: aumente a seção ou o fck'}</span>`;
  const sc=Math.min(150/h,110/bw,5),W=bw*sc,H=h*sc,ox=40,oy=36,cb=3*sc;
  let s=T_('SEÇÃO',ox,18)+`<rect x="${ox}" y="${oy}" width="${W}" height="${H}" style="fill:var(--concrete,var(--grid));stroke:var(--ink);stroke-width:1.5"/>`+`<rect x="${ox+cb}" y="${oy+cb}" width="${W-2*cb}" height="${H-2*cb}" style="fill:none;stroke:var(--steel);stroke-width:2"/>`;
  if(ram===4)s+=`<rect x="${ox+cb+(W-2*cb)*0.25}" y="${oy+cb}" width="${(W-2*cb)*0.5}" height="${H-2*cb}" style="fill:none;stroke:var(--steel);stroke-width:1.5"/>`;
  s+=T(ox+W/2,oy+H+16,bw+' cm','muted','text-anchor="middle" font-size="10"')+T(ox+W+6,oy+H/2,h+' cm','muted','font-size="10"');
  const ex=220,ew=380,ey=40,eh=Math.min(110,h*2.2);s+=T_('ELEVAÇÃO · 1 METRO DE VIGA JUNTO AO APOIO',ex,18)+`<rect x="${ex}" y="${ey}" width="${ew}" height="${eh}" style="fill:none;stroke:var(--ink);stroke-width:1.5"/>`+`<path d="M${ex} ${ey+eh} l-8 14 h16z" style="fill:none;stroke:var(--ink)"/>`;
  if(r.ok){for(let x=5;x<=100;x+=r.s)s+=Ln(ex+ew*x/100,ey+4,ex+ew*x/100,ey+eh-4,'steel',2);s+=T(ex+ew/2,ey+eh+18,`estribos a cada ${r.s} cm (máximo ${br(r.smax,0)} cm)`,'muted','text-anchor="middle" font-size="10"')}
  for(let i=0;i<4;i++)s+=Ln(ex+20+i*eh*0.9,ey+eh,ex+20+(i+1)*eh*0.9,ey,'neg',1,'stroke-dasharray="4 3" opacity=".6"');
  s+=usoBarras([['Bielas comprimidas (Vd / VRd2)',r.Vd/r.VRd2,br(r.Vd,1)+' de '+br(r.VRd2,1)+' kN']],ex,ey+eh+44,ew);
  $('draw').innerHTML=SVG(640,ey+eh+110,'Seção e estribos da viga',s);
  $('memorial').textContent=`bw × h = ${bw} × ${h} cm · d = ${br(r.d,1)} cm · C${fck} · CA-50
1) Vd = 1,4 × ${br(V_('esV'),1)} = ${br(r.Vd,2)} kN
2) Bielas: αv2 = 1 − ${fck}/250 = ${br(r.av2,3)} · VRd2 = 0,27 × αv2 × fcd × bw × d = ${br(r.VRd2,1)} kN ${r.ok?'≥':'<'} Vd ${r.ok?'✓':'✗'}
3) Concreto: fctm = 0,3 × fck^(2/3) = ${br(r.fctm,3)} MPa · fctd = 0,7 fctm / 1,4 = ${br(10*r.fctd,3)} MPa · Vc = 0,6 fctd bw d = ${br(r.Vc,1)} kN
4) Vsw = Vd − Vc = ${br(r.Vsw,1)} kN → Asw/s = Vsw / (0,9 d fywd) = ${br(100*r.aswS,2)} cm²/m (fywd = ${br(10*r.fywd,0)} MPa)
5) Mínimo: ρw = 0,2 fctm / fywk = ${br(100*r.rmin,4)}% → Asw/s,mín = ${br(100*r.aswMin,2)} cm²/m → adotado ${br(100*r.asw,2)} cm²/m
6) Espaçamento máximo: Vd ${r.lim?'≤':'>'} 0,67 VRd2 → smáx = ${r.lim?'mín(0,6d ; 30 cm)':'mín(0,3d ; 20 cm)'} = ${br(r.smax,1)} cm
7) ${ram} ramos de φ ${br(phi,1)} mm = ${br(r.Aphi,3)} cm² → s = ${r.ok?r.s+' cm':'—'}${r.ok?` · fornecido ${br(100*r.Aphi/r.s,2)} cm²/m`:''}`;}}],
sim:{nome:'Flexão',html:()=>simWrap(rng('cB','Largura bw',12,40,1,20,'cm')+rng('cH','Altura h',25,90,5,50,'cm')+sel('cF','Concreto',[[20,'C20 (fck 20 MPa)'],[25,'C25 (fck 25 MPa)',1],[30,'C30 (fck 30 MPa)'],[35,'C35'],[40,'C40'],[45,'C45'],[50,'C50']])+rng('cM','Momento Mk',5,400,5,100,'kN·m','Valor característico (sem majorar)')),
update(){const bw=V_('cB'),h=V_('cH'),fck=V_('cF'),Mk=V_('cM'),r=calc.flexao(bw,h,fck,Mk);
if(r.inviavel){$('tiles').innerHTML=tiles([['Md',br(r.Md/100)+' kN·m'],['d',br(r.d,1)+' cm'],['Situação','Seção pequena',1],['As','—']])+'<span class="pill alerta">Seção não suporta o momento. Aumente h ou bw.</span>';
$('draw').innerHTML='';$('memorial').textContent=`Md = ${br(r.Md)} kN·cm é maior que a capacidade da seção (termo da raiz negativo).\nAumente a altura h, a largura bw ou o fck.`;return;}
const b=calc.barras(r.Asf,bw);
$('tiles').innerHTML=tiles([['Md',br(r.Md/100)+' kN·m'],['x / d',br(r.xd,3)],['As necessária',br(r.Asf)+' cm²',1],['Sugestão',`${b.n} φ ${br(b.f,b.f%1?1:0)} mm`]])+(r.ok?'<span class="pill ok">x/d ≤ 0,45 · ductilidade OK</span>':'<span class="pill alerta">x/d &gt; 0,45 · aumente a seção</span>')+(b.camadas>1?' <span class="pill alerta">Barras em 2 camadas</span>':'');
const sc=Math.min(300/h,240/bw),W=bw*sc,H=h*sc,ox=200-W/2+40,oy=30,xs=r.x*sc*0.8;
let s=`<rect x="${ox}" y="${oy}" width="${W}" height="${H}" style="fill:var(--steel-soft);stroke:var(--ink);stroke-width:2"/>`;
s+=`<rect x="${ox}" y="${oy}" width="${W}" height="${xs}" style="fill:var(--neg-fill)"/>`+Ln(ox-10,oy+r.x*sc,ox+W+10,oy+r.x*sc,'neg',1.5,'stroke-dasharray="6 4"')+T(ox+W+14,oy+r.x*sc+4,'LN  x = '+br(r.x,1)+' cm','neg');
s+=T(ox+W+14,oy+xs/2+4,'zona comprimida (0,8x)','muted');
s+=`<rect x="${ox+1.5*sc}" y="${oy+1.5*sc}" width="${W-3*sc}" height="${H-3*sc}" style="fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 2"/>`;
const n=b.n,cam=b.camadas,porCam=Math.ceil(n/cam),rr=Math.max(3,b.f/10/2*sc),esp=(W-6*sc)/(Math.max(porCam,2)-1||1);
for(let k=0;k<n;k++){const c=Math.floor(k/porCam),i=k%porCam;const cx=ox+3*sc+(porCam>1?i*(W-6*sc)/(porCam-1):(W-6*sc)/2),cy=oy+H-3*sc-c*(rr*2+2.5*sc);s+=`<circle cx="${cx}" cy="${cy}" r="${rr}" style="fill:var(--amber);stroke:var(--ink)"/>`}
s+=`<circle cx="${ox+3*sc}" cy="${oy+3*sc}" r="${Math.max(2.5,0.5*sc)}" style="fill:var(--muted)"/><circle cx="${ox+W-3*sc}" cy="${oy+3*sc}" r="${Math.max(2.5,0.5*sc)}" style="fill:var(--muted)"/>`;
s+=Ln(ox,oy+H+16,ox+W,oy+H+16,'muted')+T(ox+W/2,oy+H+30,'bw = '+bw+' cm','muted','text-anchor="middle"')+Ln(ox-18,oy,ox-18,oy+H,'muted')+T(ox-24,oy+H/2,'h = '+h,'muted','text-anchor="end"');
s+=T(ox+W+14,oy+H-3*sc+4,`${n} φ ${br(b.f,b.f%1?1:0)} (${br(b.area)} cm²)`,'amber-ink','font-weight="600"');
$('draw').innerHTML=SVG(640,Math.max(380,oy+H+50),'Seção transversal da viga com armadura',s);
$('memorial').textContent=`1) d = h − 4 = ${h} − 4 = ${br(r.d,1)} cm
2) Md = 1,4 × ${br(Mk)} kN·m = ${br(r.Md,0)} kN·cm
3) fcd = ${fck}/1,4 = ${br(r.fcd,3)} kN/cm²   fyd = 50/1,15 = ${br(r.fyd,2)} kN/cm²
4) Md/(0,425·bw·d²·fcd) = ${br(r.k,4)}
   x = 1,25 × ${br(r.d,1)} × [1 − √(1 − ${br(r.k,4)})] = ${br(r.x,2)} cm
5) x/d = ${br(r.xd,3)} ${r.ok?'≤ 0,45 ✓':'> 0,45 ✗ (aumente a seção)'}
6) As = ${br(r.Md,0)} / [${br(r.fyd,2)} × (${br(r.d,1)} − 0,4 × ${br(r.x,2)})] = ${br(r.As)} cm²
7) As,mín = ${br(ROMIN[fck],3)}% × ${bw} × ${h} = ${br(r.Asmin)} cm²  → adotar ${br(r.Asf)} cm²
8) Sugestão: ${n} φ ${br(b.f,b.f%1?1:0)} mm = ${br(b.area)} cm² (${b.camadas} camada${b.camadas>1?'s':''})`;}}
});

Academia.modulo('gt',{
teoria:`<p>Antes de fundar, precisamos saber o quanto o solo aguenta. A sondagem SPT (NBR 6484) crava um amostrador com golpes de um martelo de 65 kg. O número de golpes para os últimos 30 cm é o N<sub>SPT</sub>: quanto maior, mais resistente o solo.</p>
<figure class="fig"><svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Sapata isolada transmitindo a carga ao solo e o perfil de sondagem SPT"><line x1="20" y1="60" x2="620" y2="60" style="stroke:var(--soil);stroke-width:2" /><rect x="240" y="40" width="30" height="20" style="fill:var(--grid);stroke:var(--ink);stroke-width:1.5" /><rect x="190" y="120" width="130" height="26" style="fill:var(--grid);stroke:var(--ink);stroke-width:2" /><rect x="240" y="60" width="30" height="60" style="fill:var(--grid);stroke:var(--ink);stroke-width:1.5" /><rect x="180" y="146" width="150" height="6" style="fill:var(--line);stroke:var(--line);stroke-width:1" /><line x1="200" y1="152" x2="200" y2="174" style="stroke:var(--steel);stroke-width:1.3" /><path d="M197.3 167.6 L200 174 L202.7 167.6" style="fill:none;stroke:var(--steel);stroke-width:1.3" /><line x1="222" y1="152" x2="222" y2="174" style="stroke:var(--steel);stroke-width:1.3" /><path d="M219.3 167.6 L222 174 L224.7 167.6" style="fill:none;stroke:var(--steel);stroke-width:1.3" /><line x1="244" y1="152" x2="244" y2="174" style="stroke:var(--steel);stroke-width:1.3" /><path d="M241.3 167.6 L244 174 L246.7 167.6" style="fill:none;stroke:var(--steel);stroke-width:1.3" /><line x1="266" y1="152" x2="266" y2="174" style="stroke:var(--steel);stroke-width:1.3" /><path d="M263.3 167.6 L266 174 L268.7 167.6" style="fill:none;stroke:var(--steel);stroke-width:1.3" /><line x1="288" y1="152" x2="288" y2="174" style="stroke:var(--steel);stroke-width:1.3" /><path d="M285.3 167.6 L288 174 L290.7 167.6" style="fill:none;stroke:var(--steel);stroke-width:1.3" /><line x1="310" y1="152" x2="310" y2="174" style="stroke:var(--steel);stroke-width:1.3" /><path d="M307.3 167.6 L310 174 L312.7 167.6" style="fill:none;stroke:var(--steel);stroke-width:1.3" /><text x="255" y="192" style="fill:var(--steel)" text-anchor="middle" font-size="10" font-weight="600">σ = 1,05·N / A ≤ σadm</text><line x1="255" y1="14" x2="255" y2="38" style="stroke:var(--amber-ink);stroke-width:2" /><path d="M252.3 31.6 L255 38 L257.7 31.6" style="fill:none;stroke:var(--amber-ink);stroke-width:2" /><text x="262" y="18" style="fill:var(--amber-ink)" font-weight="600">N</text><rect x="460" y="60" width="12" height="24" style="fill:var(--soil-fill);stroke:var(--line);stroke-width:0.5" /><rect x="472" y="66" width="20" height="12" style="fill:var(--amber);stroke:var(--amber);stroke-width:0" /><text x="500" y="76" style="fill:var(--ink)" font-size="10">4</text><text x="452" y="76" style="fill:var(--muted)" text-anchor="end" font-size="10">1 m</text><rect x="460" y="84" width="12" height="24" style="fill:var(--soil-fill);stroke:var(--line);stroke-width:0.5" /><rect x="472" y="90" width="30" height="12" style="fill:var(--amber);stroke:var(--amber);stroke-width:0" /><text x="510" y="100" style="fill:var(--ink)" font-size="10">6</text><text x="452" y="100" style="fill:var(--muted)" text-anchor="end" font-size="10">2 m</text><rect x="460" y="108" width="12" height="24" style="fill:var(--soil-fill);stroke:var(--line);stroke-width:0.5" /><rect x="472" y="114" width="40" height="12" style="fill:var(--amber);stroke:var(--amber);stroke-width:0" /><text x="520" y="124" style="fill:var(--ink)" font-size="10">8</text><text x="452" y="124" style="fill:var(--muted)" text-anchor="end" font-size="10">3 m</text><rect x="460" y="132" width="12" height="24" style="fill:var(--soil-fill);stroke:var(--line);stroke-width:0.5" /><rect x="472" y="138" width="60" height="12" style="fill:var(--amber);stroke:var(--amber);stroke-width:0" /><text x="540" y="148" style="fill:var(--ink)" font-size="10">12</text><text x="452" y="148" style="fill:var(--muted)" text-anchor="end" font-size="10">4 m</text><rect x="460" y="156" width="12" height="24" style="fill:var(--soil-fill);stroke:var(--line);stroke-width:0.5" /><rect x="472" y="162" width="75" height="12" style="fill:var(--amber);stroke:var(--amber);stroke-width:0" /><text x="555" y="172" style="fill:var(--ink)" font-size="10">15</text><text x="452" y="172" style="fill:var(--muted)" text-anchor="end" font-size="10">5 m</text><rect x="460" y="180" width="12" height="24" style="fill:var(--soil-fill);stroke:var(--line);stroke-width:0.5" /><rect x="472" y="186" width="110" height="12" style="fill:var(--amber);stroke:var(--amber);stroke-width:0" /><text x="590" y="196" style="fill:var(--ink)" font-size="10">22</text><text x="452" y="196" style="fill:var(--muted)" text-anchor="end" font-size="10">6 m</text><text x="460" y="48" style="fill:var(--muted)" font-size="10">NSPT por metro</text></svg><figcaption>Sapata isolada transmitindo a carga ao solo e o perfil de sondagem SPT</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Tensão admissível</h4><p>Quanto o solo aguenta por metro quadrado sem romper nem recalcar demais. Medida em kPa (kN/m²).</p></div>
<div class="conceito"><h4>Fundação rasa</h4><p>Sapatas e radier: espalham a carga perto da superfície, quando o solo bom está raso.</p></div>
<div class="conceito"><h4>Fundação profunda</h4><p>Estacas e tubulões: levam a carga até camadas mais resistentes lá embaixo.</p></div></div>
<h3>Pré-dimensionamento de sapata</h3>
<div class="formula">σadm (MPa) ≈ NSPT / 50   (estimativa para 5 ≤ N ≤ 20)</div>
<div class="formula">Área = 1,05·N / σadm     (5% para peso próprio da sapata e solo)</div>
<div class="formula">Abas iguais:  L − B = a0 − b0     Sapata rígida: h ≥ (L − a0)/3</div>
<div class="dica"><b>Responsabilidade</b>Essa estimativa serve para estudo e pré-dimensionamento. Fundação de verdade exige sondagem e projeto conforme a NBR 6122.</div>`,
exemplo:`<h3>Pilar 20 × 40 com 800 kN</h3><p>A sondagem indicou N<sub>SPT</sub> = 12 na cota de apoio. O pilar mede 20 × 40 cm.</p>
<ol class="passos"><li><b>Tensão admissível.</b> 12 / 50 = 0,24 MPa = <b>240 kPa</b>.</li>
<li><b>Área necessária.</b> A = 1,05 × 800 / 240 = <b>3,50 m²</b>.</li>
<li><b>Abas iguais.</b> L − B = 0,40 − 0,20 = 0,20 m. Resolvendo B × (B + 0,20) = 3,50 → B ≈ 1,77 → <b>B = 1,80 m</b> e <b>L = 2,00 m</b>.</li>
<li><b>Verificação.</b> σ = 840 / (1,80 × 2,00) = <b>233 kPa ≤ 240 kPa</b> ✓</li>
<li><b>Altura.</b> h ≥ (2,00 − 0,40) / 3 = 0,53 → <b>h = 0,55 m</b>.</li></ol>
<div class="dica"><b>Confira no simulador</b>N = 800 kN, NSPT = 12, pilar 40 × 20.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Pilar quadrado de 30 × 30 com 400 kN", "html": "<p>Sondagem com N<sub>SPT</sub> = 8 na cota de apoio.</p><ol class=\"passos\"><li><b>Tensão admissível.</b> 8 / 50 = 0,16 MPa = <b>160 kPa</b>.</li><li><b>Área.</b> A = 1,05 × 400 / 160 = <b>2,63 m²</b>.</li><li><b>Sapata quadrada.</b> Pilar quadrado, então sapata quadrada: √2,63 = 1,62 → <b>1,65 × 1,65 m</b>.</li><li><b>Altura.</b> h ≥ (1,65 − 0,30) / 3 = 0,45 → <b>h = 0,45 m</b>.</li></ol>"}, {"nivel": "obra", "titulo": "Casa térrea com pilar de 15 × 30", "html": "<p>Pilar de casa com 150 kN e solo fraco, N<sub>SPT</sub> = 6.</p><ol class=\"passos\"><li><b>Tensão admissível.</b> 6 / 50 = <b>120 kPa</b>.</li><li><b>Área.</b> 1,05 × 150 / 120 = 1,31 m².</li><li><b>Abas iguais.</b> L − B = 0,30 − 0,15 = 0,15 m → <b>1,10 × 1,25 m</b>.</li><li><b>Altura.</b> h = <b>0,35 m</b>. Sob a sapata, use 5 cm de concreto magro.</li></ol><div class=\"dica\"><b>Sondagem em casa</b>Mesmo em obra pequena, a NBR 8036 pede sondagem. Uma casa de até 200 m² precisa de pelo menos 2 furos. Fundação \"no olho\" é a maior causa de trincas em casas.</div>"}],
obra:{"intro": "A fundação é a parte da obra que ninguém vê depois de pronta e a mais cara de corrigir. Os problemas quase sempre começam na falta de sondagem ou na escavação mal conferida.", "erros": [["Fundação sem sondagem", "Escolher sapata ou estaca \"pelo costume da região\" e descobrir o aterro mole depois."], ["Fundo da cava com solo solto ou água", "Sapata apoiada em lama ou terra solta recalca."], ["Sapata de divisa sem viga alavanca", "A carga excêntrica gira a sapata e trinca a parede."], ["Fundações diferentes na mesma obra", "Misturar sapata e estaca sem projeto provoca recalque diferencial."]], "checklist": ["Existe laudo de sondagem SPT com número de furos adequado à área", "A cota de apoio e o solo encontrado na escavação conferem com a sondagem", "O fundo da cava foi limpo, apiloado e está sem água", "Lastro de concreto magro de 5 cm foi executado antes da armadura", "Dimensões da sapata e posição do arranque do pilar conferidas com trena", "Impermeabilização da viga baldrame executada antes de levantar a alvenaria", "Aterro interno compactado em camadas de no máximo 20 cm"], "dica": "Se a escavação encontrar solo diferente do previsto (aterro, lixo, argila mole, água), pare e chame o projetista antes de concretar. É muito mais barato do que corrigir depois."},
extras:[{nome:'Recalque da sapata',
html:()=>`<p class="nota">Recalque imediato pela teoria da elasticidade, com o módulo do solo estimado pelo SPT (Teixeira e Godoy: Es = α · K · N). Para argilas saturadas, o recalque por adensamento, que acontece ao longo de anos, precisa de ensaio de laboratório.</p>`+simWrap(rng('rcN','Carga do pilar N',100,3000,50,400,'kN')+`<div class="row">${rng('rcB','Lado menor B',0.6,4,0.05,1.65,'m')}${rng('rcL','Lado maior L',0.6,6,0.05,1.65,'m')}</div>`+rng('rcS','NSPT médio abaixo da sapata',3,40,1,8,'golpes','Média até uma profundidade de cerca de 2B')+sel('rcT','Solo',Object.keys(calc.SOLOS_ES).map(k=>[k,k,k==='Silte arenoso']))+rng('rcV','Coeficiente de Poisson ν',0.2,0.45,0.05,0.3,'','Areias 0,3 · argilas 0,4 a 0,45')+sel('rcR','Sapata',[[1,'Rígida (recalque uniforme)',1],[0,'Flexível (valor médio)']])),
update(){const B=Math.min(V_('rcB'),V_('rcL')),L=Math.max(V_('rcB'),V_('rcL')),r=calc.recalque(V_('rcN'),B,L,V_('rcS'),$('rcT').value,V_('rcV'),$('rcR').value==='1');
  $('tiles').innerHTML=tiles([['Tensão aplicada',br(r.sig,1)+' kPa'],['Módulo Es',br(r.Es,1)+' MPa'],['Fator de forma Iρ',br(r.Ir,2)],['Recalque',br(r.rho,1)+' mm',1]])+`<span class="pill ${r.ok?'ok':'alerta'}">${r.ok?'Dentro do usual (até 25 mm em sapatas isoladas)':'Acima de 25 mm: avalie com o projetista'}</span>`;
  const sc=Math.min(60,160/L),cx=200,y0=70,w=L*sc;let s=T_('BULBO DE TENSÕES (ESQUEMA)',40,18)+Ln(20,y0,400,y0,'soil',2);
  [1,0.5,0.2,0.1].forEach((f,i)=>{const rx=w*(0.6+0.3*i),ry=Math.min(190,w*(0.45+0.4*i));s+=`<ellipse cx="${cx}" cy="${y0+8}" rx="${rx}" ry="${ry}" style="fill:none;stroke:var(--steel);stroke-dasharray:4 3;opacity:${1-i*0.2}"/>`+T(cx+rx+4,y0+8+ry*0.7,br(100*f,0)+'% σ','steel','font-size="9"')});
  s+=`<rect x="${cx-w/2}" y="${y0-14}" width="${w}" height="22" style="fill:var(--grid);stroke:var(--ink);stroke-width:1.5"/><rect x="${cx-10}" y="${y0-50}" width="20" height="36" style="fill:var(--grid);stroke:var(--ink)"/>`+T(cx+16,y0-34,'N = '+br(V_('rcN'),0)+' kN','ink','font-size="10" font-weight="600"');
  s+=usoBarras([['Recalque / 25 mm',r.rho/25,br(r.rho,1)+' de 25 mm']],420,80,200);
  $('draw').innerHTML=SVG(640,280,'Sapata e bulbo de tensões no solo',s);
  $('memorial').textContent=`Sapata ${br(B,2)} × ${br(L,2)} m · L/B = ${br(L/B,2)}
1) σ = 1,05 × N / (B × L) = 1,05 × ${br(V_('rcN'),0)} / ${br(B*L,3)} = ${br(r.sig,1)} kPa
2) ${$('rcT').value}: K = ${br(r.K,2)} MPa · α = ${r.a} → Es = α × K × N = ${r.a} × ${br(r.K,2)} × ${V_('rcS')} = ${br(r.Es,2)} MPa
3) Iρ (${$('rcR').value==='1'?'sapata rígida':'flexível, valor médio'}, L/B = ${br(L/B,2)}) = ${br(r.Ir,2)}
4) ρ = σ × B × (1 − ν²) × Iρ / Es = ${br(r.sig,1)} × ${br(B,2)} × (1 − ${br(V_('rcV'),2)}²) × ${br(r.Ir,2)} / ${br(1000*r.Es,0)} = ${br(r.rho,2)} mm
   Recalque imediato em meio elástico homogêneo e semi-infinito. Camadas moles abaixo do bulbo aumentam o recalque.`;}}],
sim:{nome:'Sapata',html:()=>simWrap(rng('gN','Carga do pilar N',100,3000,50,800,'kN')+rng('gS','NSPT na cota de apoio',5,20,1,12,'golpes')+rng('gA','Pilar: lado maior a0',15,100,5,40,'cm')+rng('gB','Pilar: lado menor b0',15,40,5,20,'cm')),
update(){const N=V_('gN'),ns=V_('gS'),a0=Math.max(V_('gA'),V_('gB')),b0=Math.min(V_('gA'),V_('gB')),r=calc.sapata(N,ns,a0,b0);
$('tiles').innerHTML=tiles([['σ adm',br(r.sadm,0)+' kPa'],['Área necessária',br(r.A)+' m²'],['Sapata B × L',br(r.B)+' × '+br(r.L)+' m',1],['Altura h',br(r.h)+' m']])+(r.sig<=r.sadm?`<span class="pill ok">σ = ${br(r.sig,0)} kPa ≤ σadm</span>`:'<span class="pill alerta">Tensão acima da admissível</span>');
const sc=Math.min(260/r.L,200/r.B),Lw=r.L*sc,Bw=r.B*sc,ox=40+(260-Lw)/2,oy=40+(200-Bw)/2,pa=a0/100*sc,pb=b0/100*sc;
let s=T(40,20,'PLANTA','muted','font-size="10" letter-spacing="1"')+`<rect x="${ox}" y="${oy}" width="${Lw}" height="${Bw}" style="fill:var(--soil-fill);stroke:var(--ink);stroke-width:2"/>`;
s+=`<rect x="${ox+Lw/2-pa/2}" y="${oy+Bw/2-pb/2}" width="${pa}" height="${pb}" style="fill:var(--ink)"/>`;
s+=Ln(ox,oy+Bw+14,ox+Lw,oy+Bw+14,'muted')+T(ox+Lw/2,oy+Bw+28,'L = '+br(r.L)+' m','ink','text-anchor="middle"')+Ln(ox+Lw+14,oy,ox+Lw+14,oy+Bw,'muted')+T(ox+Lw+20,oy+Bw/2+4,'B = '+br(r.B)+' m','ink');
const aba=(r.L-a0/100)/2;s+=T(ox+aba*sc/2,oy+Bw/2+4,'aba '+br(aba),'muted','text-anchor="middle" font-size="9"');
// corte
const cx=420,cy=40,cs=Math.min(140/r.L,120/(r.h+0.6)),cl=r.L*cs,ch=r.h*cs;
s+=T(cx,20,'CORTE','muted','font-size="10" letter-spacing="1"');
s+=`<rect x="${cx-10}" y="${cy+60}" width="${cl+20}" height="${ch+70}" style="fill:var(--soil-fill)"/>`;
s+=`<path d="M${cx} ${cy+60+ch*0.6+40} L${cx} ${cy+60+ch+40} L${cx+cl} ${cy+60+ch+40} L${cx+cl} ${cy+60+ch*0.6+40} L${cx+cl/2+a0/200*cs+4} ${cy+100} L${cx+cl/2-a0/200*cs-4} ${cy+100}Z" style="fill:var(--steel-soft);stroke:var(--ink);stroke-width:2"/>`;
s+=`<rect x="${cx+cl/2-a0/200*cs}" y="${cy}" width="${a0/100*cs}" height="100" style="fill:var(--ink)"/>`;
s+=Ln(cx+cl+8,cy+100,cx+cl+8,cy+100+ch,'muted')+T(cx+cl+12,cy+100+ch/2+4,'h = '+br(r.h),'ink');
s+=T(cx+cl/2,cy+60+ch+60,`NSPT = ${ns} · σadm = ${br(r.sadm,0)} kPa`,'soil','text-anchor="middle"');
$('draw').innerHTML=SVG(640,300,'Planta e corte da sapata isolada',s);
$('memorial').textContent=`1) σadm ≈ NSPT/50 = ${ns}/50 = ${br(ns/50,2)} MPa = ${br(r.sadm,0)} kPa
2) A = 1,05 × N / σadm = 1,05 × ${br(N,0)} / ${br(r.sadm,0)} = ${br(r.A,3)} m²
3) Abas iguais: L − B = a0 − b0 = ${br(a0/100)} − ${br(b0/100)} = ${br((a0-b0)/100)} m
   B·(B + ${br((a0-b0)/100)}) = ${br(r.A,3)} → B = ${br(r.B)} m · L = ${br(r.L)} m (múltiplos de 5 cm)
4) σ = 1,05 × ${br(N,0)} / (${br(r.B)} × ${br(r.L)}) = ${br(r.sig,1)} kPa ${r.sig<=r.sadm?'≤':'>'} ${br(r.sadm,0)} kPa
5) Sapata rígida: h ≥ (L − a0)/3 = ${br((r.L-a0/100)/3,3)} m → h = ${br(r.h)} m`;}}
});

// HD-05 · Hidráulica
Academia.modulo('hd',{
teoria:`<p>Quando a água anda dentro do cano, ela esfrega nas paredes e perde energia. Essa perda se chama <b>perda de carga</b> e aparece como pressão a menos na torneira.</p>
<figure class="fig"><svg viewBox="0 0 640 218" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Do reservatório ao ponto de uso: a pressão disponível é o desnível menos as perdas"><rect x="40" y="30" width="90" height="70" style="fill:var(--water-fill);stroke:var(--ink);stroke-width:2" /><line x1="40" y1="46" x2="130" y2="46" style="stroke:var(--water);stroke-width:1.5" /><text x="85" y="22" style="fill:var(--muted)" text-anchor="middle" font-size="10">reservatório</text><path d="M130 90 H520 V170" style="fill:none;stroke:var(--steel);stroke-width:6" /><rect x="510" y="170" width="20" height="14" style="fill:var(--ink);stroke:var(--ink);stroke-width:1" /><text x="540" y="182" style="fill:var(--muted)" font-size="10">ponto de uso</text><line x1="130" y1="46" x2="520" y2="118" style="stroke:var(--neg);stroke-width:1.5" stroke-dasharray="6 4"/><text x="300" y="66" style="fill:var(--neg)" font-size="10">linha de energia: cai com a perda de carga hf</text><line x1="560" y1="46" x2="560" y2="118" style="stroke:var(--muted);stroke-width:1" /><text x="566" y="86" style="fill:var(--neg)" font-weight="600">hf</text><line x1="130" y1="46" x2="600" y2="46" style="stroke:var(--line);stroke-width:1" stroke-dasharray="2 3"/><text x="140" y="206" style="fill:var(--ink)" font-size="11">J = 10,65 · Q^1,85 / (C^1,85 · D^4,87)  ·  hf = J · L</text></svg><figcaption>Do reservatório ao ponto de uso: a pressão disponível é o desnível menos as perdas</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Vazão (Q)</h4><p>Quanto de água passa por segundo. Em instalações prediais, usamos L/s.</p></div>
<div class="conceito"><h4>Velocidade (v)</h4><p>Pela continuidade, Q = v·A. Cano fino com muita vazão vira água rápida, barulho e golpe de aríete.</p></div>
<div class="conceito"><h4>Rugosidade (C)</h4><p>Cano liso perde menos. PVC tem C ≈ 150; ferro galvanizado velho, bem menos.</p></div></div>
<h3>Equações</h3>
<div class="formula">Continuidade:  v = 4·Q / (π·D²)</div>
<div class="formula">Hazen-Williams:  J = 10,643 · Q^1,85 / (C^1,85 · D^4,87)    (J em m/m, Q em m³/s, D em m)</div>
<div class="formula">Perda total no trecho:  hf = J · L</div>
<div class="dica"><b>Limite da norma</b>A NBR 5626 limita a velocidade em 3 m/s nas tubulações de água fria. Acima disso, aumente o diâmetro.</div>`,
exemplo:`<h3>Ramal de 30 m em PVC de 25 mm</h3><p>Um trecho de 30 m de PVC (C = 150) com diâmetro interno de 25 mm leva 0,5 L/s para um banheiro.</p>
<ol class="passos"><li><b>Velocidade.</b> v = 4 × 0,0005 / (π × 0,025²) = <b>1,02 m/s</b> ≤ 3 m/s ✓</li>
<li><b>Perda unitária.</b> J = 10,643 × 0,0005<sup>1,85</sup> / (150<sup>1,85</sup> × 0,025<sup>4,87</sup>) ≈ <b>0,050 m/m</b>.</li>
<li><b>Perda no trecho.</b> hf = 0,050 × 30 ≈ <b>1,49 m</b> de coluna d'água.</li>
<li><b>Leitura.</b> Se a caixa d'água fica 3 m acima da saída, sobram cerca de 1,5 m de pressão, perto do mínimo de 1 m que a norma pede nos pontos de uso. Por isso o último chuveiro costuma ser o mais fraco.</li></ol>
<div class="dica"><b>Confira no simulador</b>Q = 0,5 L/s, D = 25 mm, L = 30 m, PVC.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Trecho de 20 m em PVC de 32 mm", "html": "<p>Vazão de 1 L/s, tubo de PVC (C = 150) com diâmetro interno de 32 mm.</p><ol class=\"passos\"><li><b>Velocidade.</b> v = 4 × 0,001 / (π × 0,032²) = <b>1,24 m/s</b> ≤ 3 m/s ✓</li><li><b>Perda unitária.</b> J = <b>0,054 m/m</b>.</li><li><b>Perda no trecho.</b> hf = 0,054 × 20 = <b>1,08 m</b>.</li></ol>"}, {"nivel": "obra", "titulo": "O chuveiro fraco do último andar", "html": "<p>O chuveiro fica 2,50 m abaixo do nível da água da caixa. O ramal tem 15 m de PVC de 25 mm e o chuveiro elétrico pede 0,2 L/s.</p><ol class=\"passos\"><li><b>Velocidade.</b> v = <b>0,41 m/s</b>, tranquila.</li><li><b>Perda distribuída.</b> hf = <b>0,14 m</b>.</li><li><b>Pressão disponível.</b> 2,50 − 0,14 = <b>2,36 m.c.a.</b>, acima do mínimo de 1 m ✓</li><li><b>Mas falta algo.</b> Registros, joelhos e tês somam perdas localizadas que podem passar de 1 m. Se o chuveiro está fraco, a causa costuma ser a caixa muito baixa ou um registro parcialmente fechado, e não o diâmetro do tubo.</li></ol><div class=\"dica\"><b>Solução de obra</b>Elevar a caixa d’água em 1 m (torre ou base) costuma resolver mais do que trocar a tubulação. Pressurizador é a última opção.</div>"}],
obra:{"intro": "Na instalação de água fria, a maior parte dos problemas aparece no uso: pressão fraca, vazamento escondido e golpe de aríete. Quase tudo se evita com teste antes de fechar a parede.", "erros": [["Fechar a parede sem teste", "Tubulação embutida sem teste de pressão: o vazamento aparece meses depois, com a parede pintada."], ["Caixa d’água baixa", "Reservatório com pouca altura sobre os pontos de uso dá pressão fraca nos chuveiros."], ["Cola em excesso ou sem lixar", "Junta soldável mal feita vaza com o tempo."], ["Tubo de água quente em PVC comum", "PVC marrom não é para água quente. Use CPVC, PPR ou cobre."]], "checklist": ["Teste de estanqueidade feito com a rede pressurizada antes de fechar as paredes", "Registros de gaveta na saída da caixa e em cada banheiro", "Altura da caixa d’água garante pelo menos 1 m de pressão no ponto mais desfavorável", "Tubulação de água quente em material próprio (CPVC, PPR ou cobre)", "Passagem dos tubos registrada em foto, com medidas a partir de piso e paredes", "Hidrômetro e cavalete no padrão da concessionária"], "dica": "Antes de fechar a alvenaria, fotografe cada parede com trena horizontal e vertical aparecendo. Depois, ninguém vai furar o cano ao pendurar um armário."},
sim:{html:()=>simWrap(rng('hQ','Vazão Q',0.1,5,0.1,0.5,'L/s')+sel('hD','Diâmetro interno',[[20,'20 mm'],[25,'25 mm',1],[32,'32 mm'],[40,'40 mm'],[50,'50 mm'],[60,'60 mm'],[75,'75 mm'],[100,'100 mm']])+rng('hL','Comprimento L',5,200,5,30,'m')+sel('hC','Material',[[150,'PVC (C = 150)',1],[130,'Cobre (C = 130)'],[125,'Ferro galvanizado novo (C = 125)'],[100,'Ferro fundido usado (C = 100)']])+rng('hZ','Desnível disponível',1,30,0.5,3,'m','Altura da caixa d’água acima do ponto')),
update(){const Q=V_('hQ'),D=V_('hD'),L=V_('hL'),C=V_('hC'),Z=V_('hZ'),r=calc.hazen(Q,D,L,C),sobra=Z-r.hf;
$('tiles').innerHTML=tiles([['Velocidade',br(r.v)+' m/s'],['J',br(r.J,4)+' m/m'],['Perda hf',br(r.hf)+' m',1],['Pressão final',br(sobra)+' m.c.a.']])+(r.v<=3?'<span class="pill ok">v ≤ 3 m/s</span>':'<span class="pill alerta">v &gt; 3 m/s · aumente o diâmetro</span>')+' '+(sobra>=1?'<span class="pill ok">Pressão ≥ 1 m.c.a.</span>':'<span class="pill alerta">Pressão insuficiente no ponto</span>');
const top=50,base=230,sz=(base-top)/Math.max(Z,r.hf,1),wl=base-Z*sz,end=wl+Math.min(r.hf,Z+5)*sz;
let s=T(30,20,'LINHA DE CARGA','muted','font-size="10" letter-spacing="1"');
s+=`<rect x="40" y="${wl-10}" width="90" height="${base-wl+20}" style="fill:var(--water-fill);stroke:var(--ink);stroke-width:2"/>`+Ln(40,wl,130,wl,'water',2);
s+=`<rect x="130" y="${base-6}" width="440" height="12" style="fill:var(--steel-soft);stroke:var(--ink);stroke-width:1.5"/>`+`<circle cx="575" cy="${base}" r="5" style="fill:var(--water)"/>`;
s+=Ln(130,wl,570,Math.min(end,base+40),r.hf>Z?'neg':'water',2,'stroke-dasharray="8 4"')+Ln(130,wl,570,wl,'muted',1,'stroke-dasharray="2 4"');
s+=Ln(590,wl,590,Math.min(end,base+40),'amber',2)+T(596,(wl+Math.min(end,base+40))/2+4,'hf','amber-ink','font-weight="600"');
s+=T(350,base+30,`L = ${L} m · D = ${D} mm · Q = ${br(Q,1)} L/s`,'muted','text-anchor="middle"')+T(85,wl-16,`Z = ${br(Z,1)} m`,'water','text-anchor="middle"');
s+=T(350,wl-8,'nível da caixa','muted','text-anchor="middle" font-size="10"');
$('draw').innerHTML=SVG(640,290,'Linha de carga ao longo da tubulação',s);
$('memorial').textContent=`1) Q = ${br(Q,1)} L/s = ${br(Q/1000,4)} m³/s · D = ${D} mm = ${br(D/1000,3)} m
2) v = 4·Q/(π·D²) = ${br(r.v,3)} m/s ${r.v<=3?'≤ 3 m/s ✓':'> 3 m/s ✗'}
3) J = 10,643 × Q^1,85 / (C^1,85 × D^4,87) = ${br(r.J,5)} m/m   (C = ${C})
4) hf = J × L = ${br(r.J,5)} × ${L} = ${br(r.hf,3)} m
5) Pressão no ponto = Z − hf = ${br(Z,2)} − ${br(r.hf,3)} = ${br(sobra,3)} m.c.a. ${sobra>=1?'≥ 1,0 ✓':'< 1,0 ✗'}
   (perdas localizadas em conexões não incluídas)`;}}
});

// MC-06 · Materiais e Traço
Academia.modulo('mc',{
teoria:`<p>O traço é a receita do concreto. Escrito como <b>1 : a : p : x</b>, quer dizer: para cada 1 kg de cimento, <i>a</i> kg de areia, <i>p</i> kg de brita e <i>x</i> kg (litros) de água.</p>
<figure class="fig"><svg viewBox="0 0 640 212" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Composição típica de 1 m³ de concreto e o ensaio de abatimento"><rect x="60" y="30" width="90" height="22.1" style="fill:var(--ink);stroke:var(--line);stroke-width:1" opacity="0.8"/><text x="160" y="45.05" style="fill:var(--ink)" font-size="10">Cimento · 13% do volume</text><rect x="60" y="52.1" width="90" height="34.0" style="fill:var(--water);stroke:var(--line);stroke-width:1" opacity="0.55"/><text x="160" y="73.1" style="fill:var(--ink)" font-size="10">Água · 20% do volume</text><rect x="60" y="86.1" width="90" height="54.4" style="fill:var(--amber);stroke:var(--line);stroke-width:1" opacity="0.55"/><text x="160" y="117.3" style="fill:var(--ink)" font-size="10">Areia · 32% do volume</text><rect x="60" y="140.5" width="90" height="59.49999999999999" style="fill:var(--soil);stroke:var(--line);stroke-width:1" opacity="0.55"/><text x="160" y="174.25" style="fill:var(--ink)" font-size="10">Brita · 35% do volume</text><path d="M400 40 L430 40 L460 160 L370 160Z" style="fill:var(--grid);stroke:var(--ink);stroke-width:1.5" /><text x="415" y="30" style="fill:var(--muted)" text-anchor="middle" font-size="10">cone de abatimento</text><path d="M500 160 Q500 90 540 88 Q580 90 580 160Z" style="fill:var(--grid);stroke:var(--ink);stroke-width:1.5" /><line x1="600" y1="40" x2="600" y2="88" style="stroke:var(--neg);stroke-width:1.5" /><text x="606" y="68" style="fill:var(--neg)" font-size="10">slump</text><line x1="590" y1="40" x2="612" y2="40" style="stroke:var(--neg);stroke-width:1" /><line x1="590" y1="88" x2="612" y2="88" style="stroke:var(--neg);stroke-width:1" /></svg><figcaption>Composição típica de 1 m³ de concreto e o ensaio de abatimento</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Relação água/cimento</h4><p>É o fator que mais manda na resistência. Mais água deixa o concreto fácil de lançar, mas fraco e poroso (Lei de Abrams).</p></div>
<div class="conceito"><h4>Consumo de cimento</h4><p>Quantos kg de cimento vão em 1 m³ de concreto. É o que define o custo.</p></div>
<div class="conceito"><h4>Latas de 18 L</h4><p>Na obra, areia e brita são medidas em volume. Usamos a massa unitária para converter kg em latas.</p></div></div>
<h3>Fórmulas</h3>
<div class="formula">Consumo  C = 1000 / (1/γc + a/γa + p/γp + x)   kg/m³</div>
<div class="formula">γc = 3,10 · γa = 2,65 · γp = 2,70 (massas específicas, kg/dm³)</div>
<div class="formula">Latas por saco = (a × 50 / massa unitária) / 18   areia 1,50 kg/L · brita 1,45 kg/L</div>
<div class="dica"><b>Erro clássico</b>Jogar água na betoneira para o concreto ficar mais mole. Cada litro a mais derruba a resistência. Para trabalhabilidade, use aditivo plastificante.</div><h3>Dosagem pelo fck (método ABCP)</h3><div class="formula">fcj = fck + 1,65 · sd     a/c pela curva de Abrams do cimento, limitado pela durabilidade (NBR 12655)</div><p>Depois saem a água (pelo abatimento), o cimento, a brita (pelo módulo de finura da areia) e, por diferença, a areia. A calculadora <b>Dosagem pelo fck</b> faz o caminho todo e mostra o traço em massa.</p>`,
exemplo:`<h3>1 m³ de concreto no traço 1 : 2 : 3 : 0,55</h3>
<ol class="passos"><li><b>Consumo.</b> C = 1000 / (1/3,10 + 2/2,65 + 3/2,70 + 0,55) = 1000 / 2,738 ≈ <b>365 kg/m³</b>.</li>
<li><b>Sacos.</b> 365 / 50 = 7,3 → <b>8 sacos</b> de cimento.</li>
<li><b>Areia por saco.</b> 2 × 50 = 100 kg → 100 / 1,50 = 66,7 L → <b>3,7 latas</b>.</li>
<li><b>Brita por saco.</b> 3 × 50 = 150 kg → 150 / 1,45 = 103 L → <b>5,7 latas</b>.</li>
<li><b>Água por saco.</b> 0,55 × 50 = <b>27,5 L</b>, já descontando a umidade da areia na prática.</li></ol>
<div class="dica"><b>Confira no simulador</b>Use o atalho 1:2:3 e volume de 1 m³.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Meio metro cúbico de concreto 1 : 3 : 4", "html": "<p>Concreto para um contrapiso armado, traço 1 : 3 : 4 em massa, a/c = 0,65, volume de 0,5 m³.</p><ol class=\"passos\"><li><b>Consumo de cimento.</b> C ≈ <b>279 kg/m³</b>.</li><li><b>Para 0,5 m³.</b> 279 × 0,5 = 139 kg → <b>3 sacos</b> de 50 kg.</li><li><b>Por saco.</b> Areia ≈ <b>5,6 latas</b> de 18 L, brita ≈ <b>7,7 latas</b> e água ≈ <b>32,5 L</b>.</li><li><b>Leitura.</b> Medir em latas padronizadas e sempre na mesma ordem garante concreto igual em todas as betonadas.</li></ol>"}, {"nivel": "obra", "titulo": "O pedreiro quer pôr mais água", "html": "<p>Traço 1 : 2 : 3 previsto com a/c 0,50. O pedreiro reclama que está \"duro\" e quer subir para 0,70.</p><ol class=\"passos\"><li><b>Com a/c 0,50.</b> C ≈ <b>372 kg/m³</b> (cerca de 8 sacos por m³), com 25 L de água por saco.</li><li><b>Com a/c 0,70.</b> Mesmo traço seco, mas 35 L por saco. A resistência cai muito, pela lei de Abrams.</li><li><b>Quanto se perde.</b> Pela curva usual de Abrams, passar de 0,50 para 0,70 derruba a resistência em torno de 35% a 40%.</li><li><b>Solução certa.</b> Para ganhar trabalhabilidade sem perder resistência, use aditivo plastificante ou aumente a pasta inteira (cimento e água juntos), mantendo o a/c.</li></ol><div class=\"dica\"><b>Regra de canteiro</b>Água se mede, não se acerta no olho. Deixe um balde marcado com a quantidade por saco ao lado da betoneira.</div>"}],
obra:{"intro": "Os materiais chegam à obra todos os dias. Receber, armazenar e dosar bem é o que garante que o concreto e a argamassa tenham a resistência do projeto.", "erros": [["Cimento guardado no chão", "Saco encostado no piso ou na parede puxa umidade e empedra."], ["Areia suja ou com argila", "Torrões de argila e matéria orgânica enfraquecem a pasta e causam manchas."], ["Medir por pá", "Cada pá tem um volume. O traço muda de uma betonada para outra."], ["Concreto lançado depois do tempo", "Concreto de usina deve ser lançado em até 2 h 30 da saída. Depois disso começa a pega."]], "checklist": ["Cimento em estrado, a 30 cm das paredes, em pilhas de no máximo 10 sacos e usado por ordem de chegada", "Areia e brita em baias separadas, sobre piso limpo, longe de terra", "Traço afixado na betoneira, com padiolas ou latas padronizadas", "Água medida por saco de cimento", "Nota fiscal do concreto usinado conferida: fck, slump, horário e volume", "Slump test e moldagem de corpos de prova em cada caminhão", "Aço armazenado fora do chão, separado por bitola e protegido da chuva"], "dica": "Guarde as notas fiscais e os resultados de rompimento dos corpos de prova. Se surgir dúvida sobre a estrutura, esses papéis são a prova de que o concreto foi o especificado."},
extras:[{nome:'Dosagem pelo fck (ABCP)',
html:()=>`<p class="nota">Ponto de partida pelo método da ABCP, com os limites de durabilidade da NBR 12655. A curva de Abrams usada é uma média para cimento CP 32 aos 28 dias. Confirme sempre com betonada experimental e rompimento de corpos de prova.</p>`+simWrap(sel('dsF','Resistência desejada (fck)',[[20,'C20'],[25,'C25',1],[30,'C30'],[35,'C35'],[40,'C40']])+sel('dsS','Condição de preparo',[[4,'A · tudo medido em massa (sd = 4,0)'],[5.5,'B · cimento em massa, agregados em volume corrigido (sd = 5,5)',1],[7,'C · tudo em volume (sd = 7,0)']])+sel('dsC','Classe de agressividade',[[1,'I · rural, ambiente seco'],[2,'II · urbano',1],[3,'III · marinho ou industrial'],[4,'IV · respingos de maré, industrial agressivo']])+sel('dsA','Abatimento (slump)',[['40','40 a 60 mm'],['60','60 a 80 mm'],['80','80 a 100 mm',1]])+sel('dsD','Brita (dimensão máxima)',[[9.5,'Brita 0 · 9,5 mm'],[19,'Brita 1 · 19 mm',1],[25,'Brita 2 · 25 mm'],[32,'32 mm'],[38,'38 mm']])+rng('dsM','Módulo de finura da areia',1.8,3.6,0.1,2.6,'','Areia fina ~2,0 · média ~2,6 · grossa ~3,2')),
update(){const fck=+$('dsF').value,sd=+$('dsS').value,cl=+$('dsC').value,r=calc.dosagem(fck,sd,$('dsA').value,+$('dsD').value,V_('dsM'),cl);
  const cond=sd===7?15:sd===5.5?25:80,avisos=[];if(!r.okFck)avisos.push(`Classe ${['I','II','III','IV'][cl-1]} exige no mínimo C${r.fckMin}`);if(fck>cond)avisos.push(`A condição ${sd===7?'C':'B'} só vale até C${cond}`);
  $('tiles').innerHTML=tiles([['fcj (28 dias)',br(r.fcj,1)+' MPa'],['a/c adotado',br(r.ac,2)],['Cimento',br(r.C,0)+' kg/m³ · '+br(r.sacos,1)+' sacos'],['Traço em massa',`1 : ${br(r.a,2)} : ${br(r.p,2)} : ${br(r.ac,2)}`,1]])+avisos.map(a=>`<span class="pill alerta">${a}</span>`).join(' ');
  const gx=60,gy=40,gw=260,gh=180,ax=a=>gx+gw*(a-0.3)/0.55,fy=f=>gy+gh-gh*f/60;let s=T_('CURVA DE ABRAMS (CP 32, 28 DIAS)',gx,18);
  s+=Ln(gx,gy+gh,gx+gw,gy+gh,'line')+Ln(gx,gy,gx,gy+gh,'line');for(let f=10;f<=60;f+=10)s+=Ln(gx,fy(f),gx+gw,fy(f),'grid')+T(gx-6,fy(f)+3,f,'muted','text-anchor="end" font-size="9"');
  for(let a=0.3;a<=0.851;a+=0.1)s+=T(ax(a),gy+gh+14,br(a,1),'muted','text-anchor="middle" font-size="9"');
  let d='';for(let a=0.3;a<=0.85;a+=0.01)d+=(d?'L':'M')+ax(a).toFixed(1)+' '+fy(Math.min(60,93.2/7.3**a)).toFixed(1);s+=`<path d="${d}" style="fill:none;stroke:var(--steel);stroke-width:2"/>`;
  s+=Ln(ax(r.acMax),gy,ax(r.acMax),gy+gh,'neg',1,'stroke-dasharray="4 3"')+T(ax(r.acMax)+4,gy+12,'a/c máx '+br(r.acMax,2),'neg','font-size="9"');
  s+=`<circle cx="${ax(r.ac)}" cy="${fy(93.2/7.3**r.ac)}" r="5" style="fill:var(--amber);stroke:var(--ink)"/>`+T(gx+gw/2,gy+gh+30,'relação água/cimento','muted','text-anchor="middle" font-size="9"');
  const vol=[['Cimento',r.C/3100,'ink'],['Água',r.Ca/1000,'water'],['Areia',r.Cm/2650,'amber'],['Brita',r.Cb/2700,'soil']],bx=400,by=40,bh=190;let yy=by;s+=T_('1 m³ DE CONCRETO',bx,18);
  vol.forEach(([n,v,c])=>{const hh=bh*v;s+=`<rect x="${bx}" y="${yy}" width="70" height="${hh}" style="fill:var(--${c});opacity:${c==='ink'?.8:.55};stroke:var(--line)"/>`+T(bx+80,yy+hh/2+4,`${n} · ${br(1000*v,0)} L`,'ink','font-size="10"');yy+=hh});
  $('draw').innerHTML=SVG(640,262,'Curva de Abrams e composição do concreto',s);
  $('memorial').textContent=`1) fcj = fck + 1,65 × sd = ${fck} + 1,65 × ${br(sd,1)} = ${br(r.fcj,2)} MPa
2) Abrams (CP 32): fcj = 93,2 / 7,3^(a/c) → a/c = ${br(r.acAbrams,3)} · durabilidade: a/c ≤ ${br(r.acMax,2)} → adotado ${br(r.ac,2)}
3) Água pelo abatimento e pela brita: ${r.Ca} L/m³
4) Cimento = ${r.Ca} / ${br(r.ac,2)} = ${br(r.Ca/r.ac,0)} kg/m³${r.cMinGov?` → mínimo da classe: ${r.cMin} kg/m³`:` (mínimo da classe: ${r.cMin})`}
5) Brita: volume compactado ${br(r.Vb,3)} m³/m³ (MF ${br(V_('dsM'),1)}) × 1.500 kg/m³ = ${br(r.Cb,0)} kg
6) Areia: 1 − (${br(r.C,0)}/3.100 + ${br(r.Cb,0)}/2.700 + ${br(r.Ca/1000,3)}) = ${br(r.Va,3)} m³ × 2.650 = ${br(r.Cm,0)} kg
7) Traço unitário em massa: 1 : ${br(r.a,2)} : ${br(r.p,2)} : ${br(r.ac,2)} · ${br(r.sacos,1)} sacos de 50 kg por m³
   Massas específicas: cimento 3.100, areia 2.650 e brita 2.700 kg/m³. Ajuste a umidade da areia na obra.`;}}],
sim:{nome:'Traço e consumo',html:()=>simWrap(`<div class="presets"><button class="chip" data-t="2,3,0.55">1:2:3 estrutural</button><button class="chip" data-t="2.5,3.5,0.6">1:2,5:3,5</button><button class="chip" data-t="3,4,0.65">1:3:4 contrapiso</button><button class="chip" data-t="4,5,0.75">1:4:5 magro</button></div>`+rng('tA','Areia a',1,5,0.5,2,'')+rng('tP','Brita p',1,6,0.5,3,'')+rng('tX','Água/cimento x',0.4,0.8,0.05,0.55,'')+rng('tV','Volume de concreto',0.5,20,0.5,1,'m³')),
init(){document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const[a,p,x]=b.dataset.t.split(',');$('tA').value=a;$('tP').value=p;$('tX').value=x;outs();this.update()})},
update(){const a=V_('tA'),p=V_('tP'),x=V_('tX'),vol=V_('tV'),r=calc.traco(a,p,x,vol);
$('tiles').innerHTML=tiles([['Consumo',br(r.C,0)+' kg/m³'],['Cimento',r.sacos+' sacos',1],['Areia',br(r.areia)+' m³'],['Brita',br(r.brita)+' m³']])+(x<=0.6?'<span class="pill ok">a/c ≤ 0,60 · uso estrutural possível</span>':'<span class="pill alerta">a/c &gt; 0,60 · só uso não estrutural</span>');
const ps=r.porSaco,items=[['Cimento','1 saco (50 kg)',50/1.42,'ink'],['Areia',br(ps.areiaLatas,1)+' latas',ps.areiaL,'amber'],['Brita',br(ps.britaLatas,1)+' latas',ps.britaL,'muted'],['Água',br(ps.agua,1)+' L',ps.agua,'water']];
const tot=items.reduce((s,i)=>s+i[2],0);let s=T(30,20,'POR SACO DE CIMENTO (VOLUME APROXIMADO)','muted','font-size="10" letter-spacing="1"'),xx=30;
items.forEach(([n,t,v,c])=>{const w=580*v/tot;s+=`<rect x="${xx}" y="36" width="${w}" height="40" style="fill:var(--${c});opacity:.85"/>`;xx+=w});
items.forEach(([n,t,v,c],i)=>{const y=110+i*34,lat=n==='Areia'?ps.areiaLatas:n==='Brita'?ps.britaLatas:0;
s+=`<rect x="30" y="${y-12}" width="14" height="14" style="fill:var(--${c})"/>`+T(54,y,n,'ink','font-weight="600"')+T(150,y,t,'ink');

Academia.modulo('tp',{
sig:SIG,
teoria:`<p>Todo levantamento topográfico vira uma lista de pontos com coordenadas: <b>E</b> (Este, eixo x) e <b>N</b> (Norte, eixo y). Com essa lista dá para calcular a área exata de um terreno, por mais torto que ele seja.</p>
<figure class="fig"><svg viewBox="0 0 640 204" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Poligonal de um lote (área por Gauss) e curvas de nível do relevo"><path d="M80 170 L260 180 L300 70 L170 30 L60 80Z" style="fill:var(--amber);stroke:var(--ink);stroke-width:2" opacity=".9" fill-opacity=".25"/><circle cx="80" cy="170" r="4" style="fill:var(--ink);stroke:var(--ink);stroke-width:1"/><text x="86" y="164" style="fill:var(--ink)" font-size="10" font-weight="600">V1</text><circle cx="260" cy="180" r="4" style="fill:var(--ink);stroke:var(--ink);stroke-width:1"/><text x="266" y="174" style="fill:var(--ink)" font-size="10" font-weight="600">V2</text><circle cx="300" cy="70" r="4" style="fill:var(--ink);stroke:var(--ink);stroke-width:1"/><text x="306" y="64" style="fill:var(--ink)" font-size="10" font-weight="600">V3</text><circle cx="170" cy="30" r="4" style="fill:var(--ink);stroke:var(--ink);stroke-width:1"/><text x="176" y="24" style="fill:var(--ink)" font-size="10" font-weight="600">V4</text><circle cx="60" cy="80" r="4" style="fill:var(--ink);stroke:var(--ink);stroke-width:1"/><text x="66" y="74" style="fill:var(--ink)" font-size="10" font-weight="600">V5</text><text x="110" y="110" style="fill:var(--ink)" font-size="10">A = ½ |Σ (xi·yi+1 − xi+1·yi)|</text><path d="M360 190 C420 170 520 200 610 160" style="fill:none;stroke:var(--soil);stroke-width:1.2" /><text x="612" y="160" style="fill:var(--soil)" font-size="9">100</text><path d="M360 160 C420 136 520 164 610 130" style="fill:none;stroke:var(--soil);stroke-width:1.2" /><text x="612" y="130" style="fill:var(--soil)" font-size="9">101</text><path d="M360 130 C420 102 520 128 610 100" style="fill:none;stroke:var(--soil);stroke-width:1.2" /><text x="612" y="100" style="fill:var(--soil)" font-size="9">102</text><path d="M360 100 C420 68 520 92 610 70" style="fill:none;stroke:var(--soil);stroke-width:1.2" /><text x="612" y="70" style="fill:var(--soil)" font-size="9">103</text><path d="M360 70 C420 34 520 56 610 40" style="fill:none;stroke:var(--soil);stroke-width:1.2" /><text x="612" y="40" style="fill:var(--soil)" font-size="9">104</text><text x="360" y="24" style="fill:var(--muted)" font-size="10">curvas de nível a cada 1 m</text><line x1="600" y1="60" x2="600" y2="30" style="stroke:var(--ink);stroke-width:1.5" /><path d="M602.7 36.4 L600 30 L597.3 36.4" style="fill:none;stroke:var(--ink);stroke-width:1.5" /><text x="596" y="26" style="fill:var(--ink)" text-anchor="end" font-weight="600">N</text></svg><figcaption>Poligonal de um lote (área por Gauss) e curvas de nível do relevo</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Coordenadas</h4><p>Cada vértice do terreno tem um par (E, N) em metros. Em georreferenciamento, usamos o sistema UTM.</p></div>
<div class="conceito"><h4>Azimute</h4><p>Ângulo de uma linha medido a partir do Norte, no sentido horário, de 0° a 360°.</p></div>
<div class="conceito"><h4>Curva de nível</h4><p>Linha que liga pontos com a mesma cota (altura). Curvas próximas indicam terreno íngreme.</p></div></div>
<h3>Fórmula de Gauss (das coordenadas)</h3>
<div class="formula">2·A = Σ (Eᵢ · Nᵢ₊₁ − Eᵢ₊₁ · Nᵢ)     depois do último vértice volta ao primeiro</div>
<div class="formula">Perímetro = Σ √[(Eᵢ₊₁ − Eᵢ)² + (Nᵢ₊₁ − Nᵢ)²]</div>
<div class="dica"><b>Cuidado</b>Os vértices precisam seguir a ordem do contorno, sem pular nem cruzar linhas. O sentido (horário ou anti-horário) só muda o sinal.</div>
<h3>Curvas de nível por triangulação</h3><p>Os programas de topografia ligam os pontos levantados em triângulos (malha TIN, pelo critério de Delaunay). Dentro de cada triângulo, a cota varia em linha reta. As curvas de nível nascem onde cada cota redonda corta os lados dos triângulos.</p>
<div class="dica"><b>Bancada SIG</b>Na aba Bancada SIG você trabalha como num programa de geoprocessamento: importa o levantamento, gera as curvas de nível, traça perfis, calcula corte e aterro do platô e sai com o memorial descritivo pronto.</div>`,
exemplo:`<h3>Terreno em forma de trapézio</h3><p>Vértices: A (0; 0), B (24; 0), C (20; 30), D (0; 30).</p>
<ol class="passos"><li><b>A → B.</b> 0 × 0 − 24 × 0 = 0</li><li><b>B → C.</b> 24 × 30 − 20 × 0 = 720</li>
<li><b>C → D.</b> 20 × 30 − 0 × 30 = 600</li><li><b>D → A.</b> 0 × 0 − 0 × 30 = 0</li>
<li><b>Área.</b> (0 + 720 + 600 + 0) / 2 = <b>660 m²</b>. Confere com a fórmula do trapézio: (24 + 20)/2 × 30 = 660 ✓</li></ol>
<div class="dica"><b>Confira no simulador</b>Use o botão "Exemplo do trapézio".</div>`,
exemplos:[{"nivel": "facil", "titulo": "Lote retangular de 12 × 30 m", "html": "<p>Coordenadas: (0, 0), (12, 0), (12, 30) e (0, 30).</p><ol class=\"passos\"><li><b>Gauss.</b> Σ(x<sub>i</sub>·y<sub>i+1</sub> − x<sub>i+1</sub>·y<sub>i</sub>) = 0 + 360 + 360 + 0 = 720.</li><li><b>Área.</b> A = 720 / 2 = <b>360 m²</b>, igual a 12 × 30.</li><li><b>Perímetro.</b> 12 + 30 + 12 + 30 = <b>84 m</b>.</li><li><b>Para que serve o perímetro.</b> É o comprimento de muro de divisa ou de cerca. Com 84 m de muro de 2 m de altura, são 168 m² de alvenaria para orçar.</li></ol>"}, {"nivel": "obra", "titulo": "Lote em L numa esquina", "html": "<p>Vértices medidos com estação total: (0, 0), (20, 0), (20, 10), (8, 10), (8, 25) e (0, 25).</p><ol class=\"passos\"><li><b>Gauss.</b> A soma dos produtos cruzados dá 640 → A = <b>320 m²</b>.</li><li><b>Conferência por partes.</b> Retângulo de 20 × 10 (200 m²) + retângulo de 8 × 15 (120 m²) = 320 m² ✓</li><li><b>Perímetro.</b> 20 + 10 + 12 + 15 + 8 + 25 = <b>90 m</b>.</li><li><b>Na escritura.</b> Compare com a área da matrícula. Diferenças acima da tolerância pedem retificação antes de aprovar o projeto.</li></ol><div class=\"dica\"><b>Sempre feche a poligonal</b>Volte ao ponto de partida e confira o erro de fechamento. Ele mostra se alguma leitura saiu errada.</div>"}],
obra:{"intro": "Topografia na obra é locação: transferir o projeto para o terreno. Um erro de 10 cm no gabarito vira parede fora de esquadro, recuo irregular ou casa invadindo o vizinho.", "erros": [["Gabarito sem esquadro", "Cantos locados sem conferir as diagonais: a casa sai torta."], ["Divisa \"pelo muro do vizinho\"", "Muro existente nem sempre está na divisa da escritura."], ["Referência de nível perdida", "Sem RN fixa, cada pessoa mede a altura de um jeito."], ["Medir com trena torta ou esticada", "Trena sem tensão, encostando no chão ou dobrada, acumula erro."]], "checklist": ["Marcos de divisa conferidos com a matrícula ou levantamento", "Gabarito nivelado, travado e afastado cerca de 1 m da escavação", "Esquadro dos cantos conferido pelas diagonais (ou 3-4-5)", "Referência de nível (RN) marcada em ponto fixo e protegida", "Eixos de pilares e paredes transferidos com linha e prumo", "Recuos e afastamentos conferidos com o projeto aprovado"], "dica": "Para conferir o esquadro, meça as duas diagonais do retângulo. Se forem iguais, os cantos estão a 90°. Com a regra 3-4-5 (ou 6-8-10) você faz o mesmo em um canto só."},

html(){return `<p class="nota">Nivelamento pelo método da altura do instrumento: cota + leitura de ré = altura do instrumento; altura do instrumento − leitura de vante = nova cota. Volte à referência de nível para conferir o erro de fechamento (NBR 13133).</p><div class="sim"><div class="ctrl">${rng('nvC','Cota da RN de partida',0,1000,0.001,100,'m')}${rng('nvK','Extensão nivelada (ida e volta)',0.05,5,0.05,0.4,'km')}${sel('nvT','Classe do nivelamento',[['IN','Classe IN · 12 mm √k',1],['IIN','Classe IIN · 20 mm √k']])}<div class="tbl-wrap"><table class="ed"><thead><tr><th>Lance</th><th>Ré (m)</th><th>Vante (m)</th></tr></thead><tbody id="nvBody"></tbody></table></div><div class="presets"><button class="chip" id="nvAdd">+ Lance</button><button class="chip" id="nvRm">− Lance</button></div><div id="tiles"></div></div><div class="draw" id="draw"></div></div><h3>Memorial de cálculo</h3><div class="memorial" id="memorial"></div>`},

   Para fechar, o último ponto deve ser a própria RN de partida (ou outra RN de cota conhecida).`;}}],

tabela(){const self=this;$('tpBody').innerHTML=this.pts.map((p,i)=>`<tr><td class="num">${String.fromCharCode(65+i)}</td><td><input type="number" step="0.01" id="tpE${i}" value="${p[0]}" aria-label="E do vértice ${String.fromCharCode(65+i)}"></td><td><input type="number" step="0.01" id="tpN${i}" value="${p[1]}" aria-label="N do vértice ${String.fromCharCode(65+i)}"></td><td>${this.pts.length>3?`<button class="rm" data-i="${i}" aria-label="Remover vértice">✕</button>`:''}</td></tr>`).join('');
$('tpBody').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{const i=+inp.id.slice(3);self.pts[i][inp.id[2]==='E'?0:1]=parseFloat(inp.value.replace(',','.'))||0;self.update()});
$('tpBody').querySelectorAll('.rm').forEach(b=>b.onclick=()=>{self.pts.splice(+b.dataset.i,1);self.tabela();self.update()})},
update(){const pts=this.pts,r=calc.area(pts);

const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys),sc=Math.min(500/((mxx-mnx)||1),260/((mxy-mny)||1)),X=x=>70+(x-mnx)*sc,Y=y=>300-(y-mny)*sc;

const cx=xs.reduce((a,b)=>a+b,0)/pts.length,cy=ys.reduce((a,b)=>a+b,0)/pts.length;s+=T(X(cx),Y(cy)+4,br(r.area)+' m²','steel','text-anchor="middle" font-weight="600" font-size="14"');
s+=`<path d="M610 50 l-7 18 l7 -5 l7 5z" style="fill:var(--ink)"/>`+T(610,44,'N','ink','text-anchor="middle" font-weight="600"');

});

// OR-08 · Orçamento de Obras
Academia.modulo('or',{
teoria:`<p>Orçar é descobrir quanto custa cada serviço por unidade (m², m³, un) e depois somar tudo. A base é a <b>composição de custo unitário</b>: a lista de insumos que um serviço consome.</p>
<figure class="fig"><svg viewBox="0 0 640 204" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Do custo direto ao preço de venda"><rect x="90.0" y="30" width="460" height="38" style="fill:var(--steel);stroke:var(--ink);stroke-width:1" opacity=".7"/><text x="320" y="54" style="fill:var(--ink)" text-anchor="middle" font-size="11" font-weight="600">Preço de venda</text><rect x="130.0" y="78" width="380" height="38" style="fill:var(--amber);stroke:var(--ink);stroke-width:1" opacity=".7"/><text x="320" y="102" style="fill:var(--ink)" text-anchor="middle" font-size="11" font-weight="600">BDI: administração, riscos, impostos e lucro</text><rect x="170.0" y="126" width="300" height="38" style="fill:var(--grid);stroke:var(--ink);stroke-width:1" /><text x="320" y="150" style="fill:var(--ink)" text-anchor="middle" font-size="11" font-weight="600">Custo direto: material + mão de obra + equipamentos</text><text x="320" y="190" style="fill:var(--ink)" text-anchor="middle" font-size="12" font-weight="600">Preço = Custo direto × (1 + BDI)</text></svg><figcaption>Do custo direto ao preço de venda</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Composição</h4><p>Insumo × coeficiente × preço. Ex.: para 1 m² de alvenaria, 13 blocos, 0,85 h de pedreiro e assim por diante.</p></div>
<div class="conceito"><h4>SINAPI</h4><p>Sistema de referência de custos mantido pela Caixa e pelo IBGE. Obrigatório como referência em obras com recurso federal.</p></div>
<div class="conceito"><h4>BDI</h4><p>Benefícios e Despesas Indiretas: administração central, seguros, riscos, impostos e lucro, em % sobre o custo direto.</p></div></div>
<h3>Fórmulas</h3>
<div class="formula">Custo unitário = Σ (coeficiente × preço do insumo)</div>
<div class="formula">Preço de venda = Custo direto × (1 + BDI)</div>
<div class="formula">BDI (TCU) = [(1 + AC + S + R + G)·(1 + DF)·(1 + L) / (1 − I)] − 1</div>
<div class="dica"><b>Valores de exemplo</b>Os preços do simulador são ilustrativos. Use sempre a tabela SINAPI ou cotação do seu estado e mês de referência.</div><h3>Quantitativo de parede</h3><div class="formula">Blocos por m² = 1 / [(comprimento + junta) × (altura + junta)]     Reboco = área × faces × espessura</div><p>O orçamento começa no quantitativo. A calculadora <b>Quantitativo de parede</b> levanta blocos, argamassa, cimento, cal e areia de uma parede, já com perdas.</p>`,
exemplo:`<h3>1 m² de alvenaria de bloco cerâmico</h3><p>Composição simplificada com preços de exemplo.</p>
<ol class="passos"><li><b>Bloco cerâmico.</b> 13 un × R$ 3,10 = R$ 40,30</li><li><b>Argamassa.</b> 0,012 m³ × R$ 520,00 = R$ 6,24</li>

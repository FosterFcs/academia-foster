<title>Academia Foster de Engenharia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Academia Foster de Engenharia */
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: prancha técnica — trilha de disciplinas à esquerda, módulo com abas à direita, papel milimetrado de fundo */
:root{
  --paper:#f3f5f4; --sheet:#ffffff; --ink:#1b2a3a; --muted:#5d6b78; --grid:#dfe6e4;
  --line:#c9d3d1; --steel:#1f5f8b; --steel-soft:#e3eef6; --amber:#e0a106; --amber-ink:#7a5600;
  --pos:#1f7a4d; --neg:#b4402f; --pos-fill:rgba(31,122,77,.16); --neg-fill:rgba(180,64,47,.16);
  --amber-fill:rgba(224,161,6,.2); --water:#3a8fc4; --water-fill:rgba(58,143,196,.22); --soil:#a9875a; --soil-fill:rgba(169,135,90,.22);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11181f; --sheet:#18222c; --ink:#e4ecf1; --muted:#9aabb8; --grid:#1c2730;
  --line:#2c3a46; --steel:#6fb2e0; --steel-soft:#1d3346; --amber:#f2b632; --amber-ink:#f2c55a;
  --pos:#5cc98f; --neg:#ef8370; --pos-fill:rgba(92,201,143,.18); --neg-fill:rgba(239,131,112,.18);
  --amber-fill:rgba(242,182,50,.2); --water:#68b4e6; --water-fill:rgba(104,180,230,.22); --soil:#c9a678; --soil-fill:rgba(201,166,120,.2);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11181f; --sheet:#18222c; --ink:#e4ecf1; --muted:#9aabb8; --grid:#1c2730;
  --line:#2c3a46; --steel:#6fb2e0; --steel-soft:#1d3346; --amber:#f2b632; --amber-ink:#f2c55a;
  --pos:#5cc98f; --neg:#ef8370; --pos-fill:rgba(92,201,143,.18); --neg-fill:rgba(239,131,112,.18);
  --amber-fill:rgba(242,182,50,.2); --water:#68b4e6; --water-fill:rgba(104,180,230,.22); --soil:#c9a678; --soil-fill:rgba(201,166,120,.2);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:12px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,6vw,3.2rem);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--steel)}
.brand h1 em{font-style:normal;font-weight:500;color:var(--muted);font-size:.55em;letter-spacing:.08em;white-space:nowrap}
.brand .slogan{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.04em;color:var(--amber-ink);margin:6px 0 0}
.stamp{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);border:1.5px solid var(--line);padding:6px 10px;text-align:right;line-height:1.5;background:var(--sheet)}
.stamp b{color:var(--ink)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
nav.trilha{background:var(--sheet);border:1.5px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:4px}
nav.trilha h2{font-family:var(--f-display);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
nav.trilha hr{border:none;border-top:1.5px dashed var(--line);margin:6px 0;width:100%}
details.grupo{display:flex;flex-direction:column}
details.grupo summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:600;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 4px 4px;border-top:1.5px solid var(--line)}
details.grupo summary::-webkit-details-marker{display:none}
details.grupo summary::after{content:"+";font-family:var(--f-mono);font-size:1rem}
details.grupo[open] summary::after{content:"−"}
details.grupo summary span{font-family:var(--f-mono);font-size:.7rem;margin-left:auto;margin-right:8px}
details.grupo summary:hover{color:var(--ink)}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.area{display:flex;flex-direction:column;gap:8px;min-width:0}
.area h3{font-size:1.15rem;border-bottom:2px solid var(--ink);padding-bottom:4px}
.card-mod{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;text-align:left;font:inherit;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);padding:10px 12px;cursor:pointer}
.card-mod:hover{border-color:var(--steel)}
.card-mod .cod{font-family:var(--f-mono);font-size:.7rem;color:var(--steel)}
.card-mod b{font-size:1rem}
.card-mod small{grid-column:2/4;color:var(--muted);font-size:.85rem;line-height:1.35}
.card-mod .tag{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.card-mod .tag.feito{color:var(--pos);font-weight:600}
.chip.off{cursor:default;color:var(--muted);border-style:dashed}
.chip.off:hover{border-color:var(--line)}
.disc{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid transparent;background:none;color:var(--ink);font:inherit;font-size:.95rem;text-align:left;cursor:pointer;line-height:1.3}
.disc:hover{border-color:var(--line)}
.disc .cod{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);min-width:42px}
.disc.ativo{border-color:var(--steel);background:var(--steel-soft)}
.disc.ativo .cod{color:var(--steel)}
.disc .tag{margin-left:auto;font-size:.68rem;font-family:var(--f-mono);color:var(--muted);padding-left:8px}
.disc .tag.feito{color:var(--pos);font-weight:600}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main{background:var(--sheet);border:1.5px solid var(--line);min-width:0}
.mod-head{padding:18px 20px 0;display:flex;flex-direction:column;gap:4px}
.mod-head .eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;color:var(--steel);text-transform:uppercase}
.mod-head h2{font-family:var(--f-display);font-weight:600;font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.1;margin:0;text-wrap:balance}
.tabs{display:flex;gap:2px;padding:14px 20px 0;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tab{font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;padding:8px 14px;border:1.5px solid transparent;border-bottom:none;background:none;color:var(--muted);cursor:pointer;margin-bottom:-1.5px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);background:var(--sheet);border-color:var(--line);border-bottom:1.5px solid var(--sheet)}
.tab .n{font-family:var(--f-mono);font-size:.7rem;color:var(--amber-ink);margin-right:6px}
.painel{padding:20px;display:flex;flex-direction:column;gap:18px}
.painel p,.painel li{max-width:68ch}
.painel p{margin:0}
.painel h3{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0;text-wrap:balance}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.conceito{border-left:3px solid var(--steel);padding:4px 0 4px 14px}
.conceito h4{margin:0 0 4px;font-size:1rem}
.conceito p{color:var(--muted);font-size:.95rem}
.formula{font-family:var(--f-mono);font-size:.9rem;background:var(--steel-soft);padding:10px 14px;overflow-x:auto;white-space:nowrap}
.dica{border:1.5px dashed var(--amber);padding:10px 14px;font-size:.95rem}
.dica b{color:var(--amber-ink);font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;display:block}
ol.passos{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px}
ol.passos li::marker{font-family:var(--f-mono);color:var(--steel);font-weight:600}
.sim{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px}
@media (max-width:900px){.sim{grid-template-columns:1fr}}
.ctrl{display:flex;flex-direction:column;gap:14px;min-width:0}
.campo{display:flex;flex-direction:column;gap:2px}
.campo label{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;font-weight:600}
.campo output{font-family:var(--f-mono);color:var(--steel);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.campo input[type=range]{width:100%;accent-color:var(--steel)}
.campo select{width:100%;font:inherit;padding:6px 8px;background:var(--sheet);color:var(--ink);border:1.5px solid var(--line)}
.campo small{color:var(--muted);font-size:.8rem}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:.75rem;padding:5px 9px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--steel)}
.result{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res{border:1.5px solid var(--line);padding:8px 10px;min-width:0}
.res span{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.02em}
.res b{font-family:var(--f-mono);font-size:1rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.res.destaque{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.75rem;font-weight:600;padding:4px 10px;border:1.5px solid}
.pill.ok{color:var(--pos);border-color:var(--pos);background:var(--pos-fill)}
.pill.alerta{color:var(--neg);border-color:var(--neg);background:var(--neg-fill)}
.draw{min-width:0;overflow-x:auto;display:flex;flex-direction:column;gap:10px}
.draw svg{width:100%;min-width:520px;height:auto;display:block}
.memorial{font-family:var(--f-mono);font-size:.82rem;background:var(--paper);border:1.5px solid var(--line);padding:12px 14px;overflow-x:auto;white-space:pre;line-height:1.7}
.tbl-wrap{overflow-x:auto}
table.ed{border-collapse:collapse;width:100%;font-size:.88rem}
table.ed th{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1.5px solid var(--line)}
table.ed td{padding:3px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.ed input{width:100%;min-width:56px;font-family:var(--f-mono);font-size:.85rem;padding:4px 6px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
table.ed select{font-family:var(--f-body);font-size:.85rem;padding:4px 6px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);max-width:180px}
table.ed td.num{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.rm{border:none;background:none;color:var(--neg);cursor:pointer;font-size:1rem;padding:2px 6px}
.q{border:1.5px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.q p{font-weight:600}
.q .orig{font-family:var(--f-mono);font-size:.68rem;color:var(--steel);text-transform:uppercase;letter-spacing:.06em}
.ops{display:flex;flex-direction:column;gap:6px}
.op{text-align:left;font:inherit;padding:8px 12px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.op:hover:not([disabled]){border-color:var(--steel)}
.op.certa{border-color:var(--pos);background:var(--pos-fill)}
.op.errada{border-color:var(--neg);background:var(--neg-fill)}
.op[disabled]{cursor:default}
.expl{font-size:.92rem;color:var(--muted)}
.placar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--f-mono)}
.btn{font-family:var(--f-display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:1rem;padding:8px 16px;border:2px solid var(--ink);background:var(--ink);color:var(--sheet);cursor:pointer}
.btn.sec{background:none;color:var(--ink)}
.lista{display:flex;flex-direction:column;gap:14px}
/* Bancada SIG */
.sig{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;overflow-anchor:none}
#sigSub,.subtabs{overflow-anchor:none}
@media (max-width:900px){.sig{grid-template-columns:1fr}.sig .side{order:2}}
.sig .side{display:flex;flex-direction:column;gap:14px;min-width:0}
.sig h4{margin:0 0 6px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip.on{border-color:var(--steel);background:var(--steel-soft);font-weight:600}
.chip[disabled]{opacity:.5;cursor:default}
.camadas{display:flex;flex-direction:column;gap:4px}
.camadas label,.chk{display:flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.mapa{min-width:0;display:flex;flex-direction:column;gap:8px}
.mapwrap{position:relative}
#sigMap{width:100%;height:480px;display:block;border:1.5px solid var(--line);touch-action:none;cursor:crosshair;background:var(--sheet)}
@media (max-width:600px){#sigMap{height:360px}}
.mapbtns{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px}
.mapbtns button{width:34px;height:34px;font:600 1.1rem var(--f-mono);background:var(--sheet);color:var(--ink);border:1.5px solid var(--line);cursor:pointer}
.mapbtns button:hover{border-color:var(--steel)}
.status{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px;font-variant-numeric:tabular-nums;min-height:2.6em;align-content:flex-start}
.info{font-size:.92rem;border-left:3px solid var(--amber);padding:8px 12px;background:var(--paper);min-height:2.4em;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.subtabs{border-bottom:1.5px solid var(--line);padding-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>.campo{flex:1 1 140px;min-width:0}
.campo input[type=number],.campo input[type=text],.campo input[type=file]{width:100%;font:inherit;padding:6px 8px;background:var(--sheet);color:var(--ink);border:1.5px solid var(--line)}
textarea.out{width:100%;min-height:170px;font-family:var(--f-mono);font-size:.8rem;padding:10px;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);resize:vertical}
.tbl-wrap.alto{max-height:320px;overflow:auto}
tr.selrow td{background:var(--amber-fill)}
.nota{font-size:.85rem;color:var(--muted)}
footer{font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* PWA */
.topo-acoes{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:600px){.topo-acoes{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;width:100%}.topo-acoes .stamp{text-align:left}}
.aviso{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:var(--ink);color:var(--sheet);font-size:.95rem;
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.aviso .btn{background:var(--amber);border-color:var(--amber);color:#1b2a3a}
.carregando{color:var(--muted);font-family:var(--f-mono)}
/* Conta */
.topo-bt{justify-content:flex-end}
#btConta.logado{background:var(--steel-soft);color:var(--ink);border-color:var(--steel);text-transform:none;font-family:var(--f-mono);font-size:.85rem;letter-spacing:0}
.form-conta{max-width:420px}
.form-conta .campo input[type=email],.form-conta .campo input[type=password]{width:100%;font:inherit;padding:8px 10px;background:var(--sheet);color:var(--ink);border:1.5px solid var(--line)}
.form-conta .campo input:focus{border-color:var(--steel)}
p.pill{margin:0;display:block;max-width:420px;font-family:var(--f-body);font-weight:600;font-size:.9rem}
/* Exemplos e Na obra */
.conceito.erro{border-left-color:var(--neg)}
.checklist{display:flex;flex-direction:column;gap:8px;max-width:68ch}
.checklist .chk{align-items:flex-start;padding:8px 10px;border:1.5px solid var(--line);background:var(--sheet)}
.checklist .chk input{margin-top:3px;flex:none}
.checklist .chk:has(input:checked){border-color:var(--pos);background:var(--pos-fill)}

/* seletor de calculadoras da disciplina */
.calcs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.calc-op{font-family:var(--f-mono);font-size:.75rem;padding:6px 11px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.calc-op:hover{border-color:var(--steel)}
.calc-op.on{border-color:var(--ink);background:var(--ink);color:var(--sheet);font-weight:600}

/* figuras da teoria */
.fig{margin:18px 0;padding:14px;border:1px solid var(--line);background:var(--sheet)}
.fig svg{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
.fig figcaption{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-top:8px;text-align:center}

/* certificação */
.mono{font-family:var(--f-mono)}
.prova-topo{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;margin:-4px 0 12px;background:var(--sheet);border:1.5px solid var(--ink)}
.tempo{font-family:var(--f-mono);font-weight:600;font-size:1.05rem}
.tempo.acabando{color:var(--neg)}
fieldset.q{border:1px solid var(--line);padding:12px 14px;margin:0}
fieldset.q legend{font-weight:600;padding:0 4px}
.op-prova{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:2px;cursor:pointer}
.op-prova:hover{background:var(--grid)}
.op-prova input{margin-top:3px}
.pix{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:start;margin:12px 0;padding:14px;border:1.5px solid var(--line);background:var(--sheet)}
.pix-qr{background:#fff;padding:6px;width:180px;height:180px}
.pix-qr svg{width:100%;height:100%}
.pix textarea{width:100%;font-family:var(--f-mono);font-size:.72rem;word-break:break-all;background:var(--grid);color:var(--ink);border:1px solid var(--line);padding:8px;resize:none}
details.mini{margin:10px 0}
details.mini summary{cursor:pointer;color:var(--steel);font-weight:600}
@media (max-width:560px){.pix{grid-template-columns:1fr}.pix-qr{margin:0 auto}}

</style>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Academia <span>Foster</span> <em>de Engenharia</em></h1>
      <p class="slogan">Engenharia civil descomplicada</p>
    </div>
    <div class="topo-acoes"><div class="presets topo-bt"><button class="btn sec" id="btInstalar" hidden>Instalar app</button><button class="btn" id="btConta" hidden>Entrar</button></div><div class="stamp"><span id="stN"></span> DISCIPLINAS · <b id="stMod"></b><br>QUIZ <b id="stQuiz"></b><br>SIMULADO <b id="stSim">—</b></div></div>
  
  </header>
  <div class="layout">
    <nav class="trilha" aria-label="Disciplinas" id="trilha"></nav>
    <main id="main"></main>
  </div>
  <footer>Academia Foster de Engenharia · Engenharia civil descomplicada · Foster Engenharia &amp; Construção<br>Conteúdo didático. Não substitui projeto assinado por responsável técnico.<br><span id="versao"></span></footer>
</div>
<div class="aviso" id="aviso" role="status" hidden></div>
<script>
window.EMBUTIDO=true;
// Funções de cálculo (sem dependência de tela). Testadas em testes/*.test.js

{p:'O que a fórmula de Gauss calcula?',o:['O volume de corte','A área a partir das coordenadas dos vértices','A declividade','O azimute'],c:1,e:'Ela calcula a área de um polígono a partir das coordenadas dos seus vértices.'},
{p:'Qual a área de um terreno retangular de 20 m por 30 m?',o:['50 m²','100 m²','600 m²','6.000 m²'],c:2,e:'20 × 30 = 600 m².'},
{p:'O que o nivelamento geométrico mede?',o:['Distâncias horizontais','Diferenças de altura (cotas)','Ângulos horizontais','Áreas'],c:1,e:'O nivelamento determina a diferença de nível entre pontos.'},
{p:'Como se mede o azimute?',o:['A partir do Sul, sentido anti-horário','A partir do Norte, sentido horário','A partir do Leste','Sempre de 0° a 90°'],c:1,e:'O azimute é medido a partir do Norte, no sentido horário, de 0° a 360°.'},
{p:'O que é uma curva de nível?',o:['Uma estrada em curva','Linha que liga pontos de mesma cota','O limite do terreno','Uma rua com declive'],c:1,e:'Curvas de nível ligam pontos de mesma altitude. Quanto mais próximas, mais íngreme o terreno.'},
{p:"Numa planta em escala 1:500, quanto vale 1 cm no terreno?",o:["50 cm", "5 m", "50 m", "500 m"],c:1,e:"1 cm × 500 = 500 cm = 5 m."},
{p:"Qual a diferença entre rumo e azimute?",o:["Nenhuma", "O azimute vai de 0° a 360° a partir do Norte; o rumo vai de 0° a 90° a partir do Norte ou do Sul", "O rumo é medido na vertical", "O azimute é só para o Sul"],c:1,e:"O azimute é contado no sentido horário a partir do Norte. O rumo indica o quadrante, como N 30° E."},
{p:"Curvas de nível muito próximas indicam:",o:["Terreno plano", "Rio", "Terreno íngreme", "Erro de desenho"],c:2,e:"Pouca distância horizontal para o mesmo desnível significa inclinação forte."},
{p:"Um desnível de 2 m em 40 m de distância horizontal corresponde a qual declividade?",o:["2%", "5%", "20%", "40%"],c:1,e:"2 / 40 = 0,05 = 5%."},
{p:"No nivelamento geométrico, como se obtém a diferença de nível?",o:["Ré + vante", "Pela bússola", "Vante × 2", "Leitura de ré − leitura de vante"],c:3,e:"Δh = ré − vante. Resultado positivo indica que o ponto de vante está mais alto."},
{p:"Qual o sistema geodésico de referência oficial do Brasil?",o:["SAD 69", "SIRGAS 2000", "Córrego Alegre", "WGS 60"],c:1,e:"Desde 2015, o SIRGAS 2000 é o único sistema oficial."},
{p:"Para que serve o gabarito de obra?",o:["Transferir eixos e alinhamentos do projeto para o terreno", "Medir o concreto", "Fazer o orçamento", "Escorar a laje"],c:0,e:"O gabarito de tábuas recebe os pregos que materializam os eixos."},
{p:"Na regra do esquadro, um triângulo com lados de 3 m e 4 m precisa de que hipotenusa?",o:["5 m", "6 m", "7 m", "4,5 m"],c:0,e:"3² + 4² = 5². Com 5 m na diagonal, o canto está a 90°."},
{p:"O que é uma referência de nível (RN)?",o:["Um marco de divisa", "Um tipo de trena", "Uma escala de mapa", "Um ponto fixo de altitude ou cota conhecida"],c:3,e:"É o ponto de partida de todas as alturas da obra."},
{p:"Qual equipamento mede ângulos e distâncias eletronicamente na mesma visada?",o:["Estação total", "Nível de mangueira", "Trena", "Bússola"],c:0,e:"A estação total combina teodolito eletrônico e distanciômetro."}]},
{id:'or',cod:'OR-08',nome:'Orçamento de Obras',eyebrow:'OR-08 · Composição de custo e BDI',titulo:'Do custo unitário ao preço de venda',
quiz:[
{p:'O que significa a sigla BDI?',o:['Base de Dados Integrada','Benefícios e Despesas Indiretas','Balanço de Despesas Internas','Boletim Diário de Insumos'],c:1,e:'BDI = Benefícios e Despesas Indiretas, aplicado sobre o custo direto.'},
{p:'Um serviço custa R$ 100,00 e o BDI é de 25%. Qual o preço de venda?',o:['R$ 75,00','R$ 100,25','R$ 125,00','R$ 133,33'],c:2,e:'Preço = 100 × (1 + 0,25) = R$ 125,00.'},
{p:'O que é o SINAPI?',o:['Um software de desenho','Sistema de referência de custos da construção mantido pela Caixa e IBGE','Um sindicato','Uma norma de concreto'],c:1,e:'O SINAPI fornece custos e composições de referência para obras, especialmente com recurso federal.'},
{p:'O que entra em uma composição de custo unitário?',o:['Só o material','Materiais, mão de obra e equipamentos por unidade de serviço','Só o lucro','Apenas os impostos'],c:1,e:'A composição reúne todos os insumos (material, mão de obra, equipamento) com seus coeficientes por unidade.'},
{p:'Sobre o que incidem os encargos sociais no orçamento?',o:['Sobre os materiais','Sobre a mão de obra','Sobre o terreno','Sobre os equipamentos'],c:1,e:'Encargos sociais (INSS, FGTS, férias, 13º etc.) incidem sobre o custo da mão de obra.'},
{p:"O que é custo direto?",o:["Imposto e lucro", "Seguro", "Administração central", "Material, mão de obra e equipamento aplicados no serviço"],c:3,e:"Custo direto é o que vai fisicamente para o serviço."},
{p:"Qual destes itens costuma entrar no BDI?",o:["Cimento", "Lucro e impostos sobre faturamento", "Pedreiro", "Areia"],c:1,e:"O BDI cobre despesas indiretas, riscos, impostos e lucro."},
{p:"Um orçamento tem custo direto de R$ 200 mil e BDI de 20%. Qual o preço?",o:["R$ 220 mil", "R$ 250 mil", "R$ 240 mil", "R$ 400 mil"],c:2,e:"200 × 1,20 = 240 mil."},
{p:"O que é o cronograma físico-financeiro?",o:["Distribuição dos serviços e dos valores ao longo do tempo", "Lista de materiais", "Contrato de trabalho", "Projeto estrutural"],c:0,e:"Mostra quanto de cada serviço e quanto dinheiro são necessários em cada mês."},
{p:"O que é a curva ABC de insumos?",o:["Ordem alfabética", "Cronograma", "Curva de concretagem", "Classificação dos insumos pelo peso no custo total"],c:3,e:"Poucos insumos (classe A) concentram a maior parte do custo e merecem mais atenção na compra."},
{p:"Na composição de alvenaria, o que o coeficiente 0,8 h de pedreiro por m² representa?",o:["O preço", "A produtividade: horas de pedreiro para executar 1 m²", "A espessura", "O desperdício"],c:1,e:"Coeficientes indicam consumo de mão de obra ou material por unidade de serviço."},
{p:"Por que se descontam vãos grandes no quantitativo de alvenaria?",o:["Porque não há parede ali, embora haja trabalho de requadro", "Para pagar menos ao cliente", "Por exigência da prefeitura", "Não se descontam"],c:0,e:"Vãos grandes não recebem blocos. Vãos pequenos costumam não ser descontados por causa do trabalho extra no requadro."},
{p:"O que é a medição de obra?",o:["Topografia", "Teste de concreto", "Levantamento do que foi executado no período, para pagamento", "Projeto"],c:2,e:"A medição quantifica o serviço feito e serve de base para pagar ou faturar."},
{p:"Qual a diferença entre orçamento estimativo e orçamento analítico?",o:["Nenhuma", "O estimativo é obrigatório em licitação", "O analítico é mais barato", "O estimativo usa índices por m² (como o CUB); o analítico detalha cada serviço com composições"],c:3,e:"O estimativo serve para viabilidade. O analítico serve para contratar e controlar."},
{p:"O que é o CUB?",o:["Custo Unitário Básico da construção por m², divulgado pelos Sinduscons", "Cimento usinado básico", "Cadastro de obras", "Imposto municipal"],c:0,e:"O CUB é um índice de custo por m² usado em estimativas e reajustes."}]},
{id:'lj',cod:'LJ-09',nome:'Lajes',eyebrow:'LJ-09 · Cargas e reações · NBR 6120',titulo:'Para onde vai o peso da laje',
quiz:[
{p:'Qual o peso específico do concreto armado usado no cálculo de cargas?',o:['18 kN/m³','22 kN/m³','25 kN/m³','30 kN/m³'],c:2,e:'A NBR 6120 adota 25 kN/m³ para o concreto armado.'},
{p:'Qual o peso próprio de uma laje maciça de 12 cm?',o:['1,2 kN/m²','2,5 kN/m²','3,0 kN/m²','12 kN/m²'],c:2,e:'25 × 0,12 = 3,0 kN/m².'},
{p:'Uma laje de 3 × 7 m (λ = 2,33) é armada como?',o:['Em cruz','Em uma direção','Não precisa de armadura','Só com tela'],c:1,e:'Quando λ = ly/lx passa de 2, a laje trabalha praticamente numa direção só.'},
{p:'Qual a sobrecarga usual para salas e quartos de residência?',o:['0,5 kN/m²','1,5 kN/m²','5,0 kN/m²','10 kN/m²'],c:1,e:'A NBR 6120 indica 1,5 kN/m² para dormitórios e salas residenciais.'},
{p:'No método das charneiras com bordas iguais, as linhas saem dos cantos com qual ângulo?',o:['30°','45°','60°','90°'],c:1,e:'Com as quatro bordas no mesmo tipo de apoio, as charneiras partem dos cantos a 45°.'},
{p:"A partir de qual λ a laje passa a ser armada em uma direção?",o:["λ > 1", "λ > 5", "λ > 3", "λ > 2"],c:3,e:"Com o lado maior passando de duas vezes o menor, quase toda a carga vai pelo vão menor."},
{p:"Laje de 3 × 3 m com p = 5 kN/m² e charneiras a 45°. Quanto vai para cada viga?",o:["1,25 kN/m", "3,75 kN/m", "5 kN/m", "15 kN/m"],c:1,e:"Cada triângulo tem 2,25 m². 5 × 2,25 / 3 = 3,75 kN/m."},
{p:"Qual a espessura mínima de laje maciça de piso (não em balanço) pela NBR 6118?",o:["5 cm", "7 cm", "8 cm", "15 cm"],c:2,e:"8 cm para lajes de piso; 7 cm para cobertura sem balanço."},
{p:"O que é contraflecha?",o:["Flecha para cima dada nas formas para compensar a deformação", "Um tipo de escora", "A espessura da capa", "Armadura de canto"],c:0,e:"A forma recebe uma curvatura para cima. Com a carga, a laje fica reta."},
{p:"Na laje treliçada, quem resiste à tração entre as vigotas?",o:["O EPS", "O reboco", "A capa", "A armadura da treliça e das vigotas"],c:3,e:"O EPS ou a lajota cerâmica só preenche. O aço das vigotas resiste à tração."},
{p:"Por que as lajes armadas em cruz precisam de armadura nas duas direções?",o:["Por estética", "Porque a carga se divide entre os dois vãos", "Para facilitar a forma", "Por causa do EPS"],c:1,e:"Com λ ≤ 2, os dois sentidos trabalham à flexão."},
{p:"Qual a função da armadura negativa sobre as vigas?",o:["Resistir ao momento negativo nos apoios contínuos", "Segurar o EPS", "Aumentar o cobrimento", "Substituir o estribo"],c:0,e:"Sobre os apoios intermediários a laje é tracionada em cima."},
{p:"Qual a carga de revestimento usual numa laje de piso residencial?",o:["0,1 kN/m²", "1,0 kN/m²", "5 kN/m²", "10 kN/m²"],c:1,e:"Contrapiso e piso costumam somar perto de 1,0 kN/m²."},
{p:"Na laje treliçada, para que servem as nervuras de travamento?",o:["Decoração", "Substituir a capa", "Passar tubos", "Distribuir cargas concentradas e travar as vigotas em vãos maiores"],c:3,e:"Elas ligam as vigotas no sentido transversal."},
{p:"Por que não se deve cortar nervuras para passar tubulação?",o:["Porque a nervura é a parte resistente da laje", "Porque o tubo fica feio", "Porque o EPS derrete", "Não há problema"],c:0,e:"Cortar a nervura tira a seção que resiste à flexão."}]},
{id:'ma',cod:'MA-10',nome:'Muros de Arrimo',eyebrow:'MA-10 · Muro de gravidade · Empuxo de Rankine',titulo:'O muro aguenta a terra?',
quiz:[
{p:'Qual o coeficiente de empuxo ativo Ka para um solo com φ = 30°?',o:['0,25','0,33','0,50','1,00'],c:1,e:'Ka = tg²(45° − 15°) = tg²30° ≈ 0,333.'},
{p:'Em que altura atua o empuxo ativo de um solo sem sobrecarga?',o:['No topo','A H/2 da base','A H/3 da base','Na base'],c:2,e:'A pressão é triangular, então a resultante fica a um terço da altura, medida a partir da base.'},
{p:'Por que a drenagem atrás do muro é essencial?',o:['Para o muro secar mais rápido','Para evitar que a água some pressão ao empuxo','Por estética','Para economizar concreto'],c:1,e:'Sem drenagem, a água acumulada aplica pressão hidrostática, que pode dobrar a força sobre o muro.'},
{p:'O que garante a condição e ≤ B/6?',o:['Que o muro não desliza','Que toda a base fica comprimida','Que o muro é barato','Que não há empuxo'],c:1,e:'Com a resultante dentro do terço central, não há tração entre a base e o solo.'},
{p:'Se a altura do muro dobra, o que acontece com o empuxo?',o:['Dobra','Fica igual','Quadruplica','Cai pela metade'],c:2,e:'Ea depende de H². Dobrar a altura multiplica o empuxo por 4.'},
{p:"Qual o fator de segurança mínimo usual contra o tombamento?",o:["1,0", "1,5", "2,0", "5,0"],c:2,e:"A NBR 11682 pede FS ≥ 2,0 ao tombamento."},
{p:"Qual o fator de segurança mínimo usual contra o deslizamento?",o:["1,0", "1,5", "3,0", "4,0"],c:1,e:"Contra o deslizamento, FS ≥ 1,5."},
{p:"O que são barbacãs?",o:["Armaduras do muro", "Juntas de dilatação", "Furos ou tubos que deixam a água sair pelo muro", "Blocos de fundação"],c:2,e:"Elas aliviam a pressão d’água atrás do muro."},
{p:"Comparado ao empuxo ativo, o empuxo em repouso é:",o:["Maior", "Menor", "Igual", "Zero"],c:0,e:"K0 > Ka: um muro que não se desloca recebe mais empuxo."},
{p:"Como o muro de gravidade resiste ao empuxo?",o:["Com tirantes", "Com a armadura", "Com estacas", "Com o próprio peso"],c:3,e:"O peso gera o momento estabilizante e o atrito na base."},
{p:"Qual a vantagem do gabião?",o:["Ser impermeável", "Ser drenante e flexível", "Não precisar de base", "Ser mais alto que qualquer muro"],c:1,e:"As pedras deixam a água passar e o conjunto acompanha pequenos recalques."},
{p:"Para que serve a manta geotêxtil atrás do muro?",o:["Filtrar: deixa a água passar e retém o solo", "Impermeabilizar", "Decorar", "Armar o concreto"],c:0,e:"Ela evita que os finos do solo entupam o dreno."},
{p:"O que acontece com Ka quando o ângulo de atrito φ aumenta?",o:["Aumenta", "Não muda", "Diminui", "Vira 1"],c:2,e:"Ka = tan²(45° − φ/2): solos mais atritivos empurram menos."},
{p:"Uma sobrecarga na crista do muro:",o:["Diminui o empuxo", "Só afeta a drenagem", "Não interfere", "Aumenta o empuxo"],c:3,e:"A sobrecarga soma uma parcela constante q·Ka ao longo da altura."},
{p:"Qual muro costuma ser usado para alturas maiores, com laje de base e parede armadas?",o:["Flexão (muro em L ou T invertido)", "Gravidade", "Gabião de 1 m", "Muro de vedação"],c:0,e:"O muro de flexão aproveita o peso do solo sobre a base."}]},
{id:'ap',cod:'AP-11',nome:'Águas Pluviais',eyebrow:'AP-11 · Calhas e condutores · NBR 10844',titulo:'Calha que não transborda',
quiz:[
{p:'Qual norma trata das instalações prediais de águas pluviais?',o:['NBR 5626','NBR 8160','NBR 10844','NBR 6118'],c:2,e:'A NBR 10844 trata de águas pluviais. A 5626 é água fria e a 8160 é esgoto.'},
{p:'Qual a declividade mínima de uma calha de beiral?',o:['0,1%','0,5%','2%','5%'],c:1,e:'A NBR 10844 pede declividade mínima de 0,5% para calhas.'},
{p:'Qual o diâmetro interno mínimo de um condutor vertical?',o:['40 mm','50 mm','70 mm','150 mm'],c:2,e:'A norma fixa 70 mm como diâmetro interno mínimo. Na prática, usa-se tubo de 75 mm.'},
{p:'Chuva de 120 mm/h sobre 50 m² de telhado. Qual a vazão?',o:['60 L/min','100 L/min','120 L/min','6.000 L/min'],c:1,e:'Q = I × A / 60 = 120 × 50 / 60 = 100 L/min.'},
{p:'Qual o coeficiente de Manning (n) de uma calha de PVC?',o:['0,011','0,015','0,030','0,110'],c:0,e:'Plástico e metais lisos têm n = 0,011.'},
{p:"Como se calcula a vazão de projeto de um telhado?",o:["Q = I × A × 60", "Q = A × 60", "Q = I / A", "Q = I × A / 60"],c:3,e:"Com I em mm/h e A em m², Q = I·A/60 dá L/min."},
{p:"Por que se soma metade da altura do telhado na área de contribuição?",o:["Por estética", "Para considerar a chuva com vento inclinado", "Para descontar a calha", "Não se soma"],c:1,e:"A NBR 10844 considera a chuva inclinada atingindo a superfície do telhado."},
{p:"Qual o período de retorno usual para coberturas e terraços?",o:["1 ano", "5 anos", "100 anos", "1.000 anos"],c:1,e:"Para coberturas usa-se em geral 5 anos. Áreas onde empoçamento não é tolerado usam 25 anos."},
{p:"Para que servem as caixas de areia na rede pluvial?",o:["Reter sedimentos e permitir inspeção", "Armazenar água", "Aumentar a vazão", "Ventilar a rede"],c:0,e:"Elas retêm areia e folhas e dão acesso para limpeza."},
{p:"Pode-se ligar o condutor pluvial na rede de esgoto?",o:["Sim", "Só com sifão", "Só em casas", "Não"],c:3,e:"Os sistemas são separados no Brasil. A água pluvial vai para a drenagem."},
{p:"O que é rufo?",o:["Um tipo de telha", "Peça que veda o encontro do telhado com a parede", "Um ralo", "Uma calha de piso"],c:1,e:"O rufo impede a entrada de água entre a parede e o telhado."},
{p:"Mantendo a seção da calha, o que acontece com a capacidade se a declividade aumentar?",o:["Aumenta", "Diminui", "Não muda", "Zera"],c:0,e:"Pela fórmula de Manning, a vazão cresce com a raiz da declividade."},
{p:"Telhado de 80 m² com chuva de 150 mm/h. Qual a vazão?",o:["120 L/min", "200 L/min", "12.000 L/min", "80 L/min"],c:1,e:"150 × 80 / 60 = 200 L/min."},
{p:"Para que serve o ralo hemisférico (tipo abacaxi) na calha?",o:["Aumentar a pressão", "Ventilar", "Medir a chuva", "Reter folhas e evitar entupimento do condutor"],c:3,e:"O formato em cúpula deixa a água entrar mesmo com folhas em volta."},
{p:"Qual a vantagem de usar dois condutores numa calha longa?",o:["Cada condutor recebe metade da área, e a calha pode ser menor", "Nenhuma", "Só estética", "Aumenta o custo sem benefício"],c:0,e:"Com bocais distribuídos, a vazão em cada trecho da calha cai."}]},
{id:'pl',cod:'PL-12',nome:'Planejamento de Obras',eyebrow:'PL-12 · Cronograma e caminho crítico · CPM',titulo:'Qual atividade não pode atrasar',
quiz:[
{p:'O que é o caminho crítico de uma obra?',o:['As atividades mais caras','A sequência de atividades com folga zero, que define o prazo','As atividades com mais operários','As atividades de maior risco de acidente'],c:1,e:'O caminho crítico é a cadeia de atividades sem folga. A soma das durações dele é o prazo da obra.'},
{p:'Uma atividade crítica atrasa 3 dias. O que acontece com o prazo da obra?',o:['Nada','Atrasa 3 dias','Atrasa 1 dia','Adianta 3 dias'],c:1,e:'Como a folga é zero, todo atraso numa atividade crítica passa direto para o prazo final.'},
{p:'Pelo PERT, qual a duração esperada com otimista 4, mais provável 6 e pessimista 14 dias?',o:['6 dias','7 dias','8 dias','14 dias'],c:1,e:'te = (4 + 4 × 6 + 14) / 6 = 42 / 6 = 7 dias.'},
{p:'Como se calcula a folga total de uma atividade?',o:['Duração × 2','Início mais tarde − início mais cedo','Término cedo + duração','Prazo total ÷ número de atividades'],c:1,e:'Folga total = LS − ES (ou LF − EF): quanto a atividade pode deslizar sem atrasar a obra.'},
{p:'O que a curva S representa?',o:['A forma do terreno','O avanço acumulado da obra ao longo do tempo','A curva de uma estrada','O consumo de água'],c:1,e:'A curva S mostra o avanço físico ou financeiro acumulado. Começa devagar, acelera no meio e desacelera no fim.'},
{p:"O que é a folga livre de uma atividade?",o:["Um feriado", "O atraso total permitido na obra", "O tempo de cura", "O atraso que não afeta o início da atividade seguinte"],c:3,e:"A folga livre não mexe em nenhuma sucessora. A folga total não mexe no prazo final."},
{p:"Qual a folga total de uma atividade crítica?",o:["1 dia", "Zero", "A maior da obra", "Negativa sempre"],c:1,e:"Por definição, atividades críticas não têm folga."},
{p:"O que o gráfico de Gantt mostra?",o:["Os custos", "A estrutura", "As atividades como barras ao longo do tempo", "As cargas"],c:2,e:"É o cronograma de barras, fácil de ler na obra."},
{p:"O que é a rede PERT/CPM?",o:["Um diagrama das atividades e suas dependências", "Um software", "Um tipo de concreto", "Uma norma"],c:0,e:"A rede permite calcular datas, folgas e o caminho crítico."},
{p:"O que é o diário de obra?",o:["Uma agenda pessoal", "O projeto", "O orçamento", "Registro diário de serviços, equipes, clima e ocorrências"],c:3,e:"Ele documenta a obra e serve de prova em discussões de prazo."},
{p:"Uma atividade com 10 dias de folga atrasa 4 dias. O que acontece com o prazo final?",o:["Atrasa 4 dias", "Não muda", "Atrasa 10 dias", "Adianta"],c:1,e:"O atraso é absorvido pela folga."},
{p:"O que significa \"fazer o caminho crítico mudar\"?",o:["Outra sequência passa a ter a maior duração depois de acelerações ou atrasos", "Mudar o projeto", "Trocar a equipe", "Comprar material"],c:0,e:"Ao acelerar o caminho crítico, outro caminho pode se tornar o mais longo."},

// helpers SVG (cores via variáveis de tema)
const T=(x,y,t,c='ink',ex='')=>`<text x="${x}" y="${y}" style="fill:var(--${c})" ${ex}>${t}</text>`;
const Ln=(x1,y1,x2,y2,c='ink',w=1,ex='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--${c});stroke-width:${w}" ${ex}/>`;
const SVG=(w,h,label,body)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="${label}">${body}</svg>`;
function diagram(xs,arr,L,x0,x1,y,h,label,flip){
  const max=Math.max(...arr.map(Math.abs))||1,sx=x=>x0+(x1-x0)*x/L,sy=v=>y-(flip?-1:1)*h*v/max;
  let pp=`M${sx(0)} ${y}`,pn=`M${sx(0)} ${y}`;
  xs.forEach((x,i)=>{pp+=` L${sx(x).toFixed(1)} ${sy(Math.max(arr[i],0)).toFixed(1)}`;pn+=` L${sx(x).toFixed(1)} ${sy(Math.min(arr[i],0)).toFixed(1)}`});
  pp+=` L${sx(L)} ${y}Z`;pn+=` L${sx(L)} ${y}Z`;
  return T(x0,y-h-14,label,'muted','font-size="10" letter-spacing="1"')+
    `<path d="${pp}" style="fill:var(--pos-fill);stroke:var(--pos);stroke-width:1.5"/><path d="${pn}" style="fill:var(--neg-fill);stroke:var(--neg);stroke-width:1.5"/>`+Ln(x0,y,x1,y,'ink',1);
}

const sel=(id,label,opts,hint='')=>`<div class="campo"><label for="${id}">${label}</label><select id="${id}">${opts.map(([v,t,s])=>`<option value="${v}"${s?' selected':''}>${t}</option>`).join('')}</select>${hint?`<small>${hint}</small>`:''}</div>`;

function copiar(el,msg){const t=el.value!==undefined?el.value:el.textContent;
  const fb=()=>{try{if(el.select){el.focus();el.select()}else{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}}catch(e){}msg.textContent='Texto selecionado. Use Ctrl+C ou o menu Copiar.'};
  try{navigator.clipboard.writeText(t).then(()=>{msg.textContent='Copiado.'},fb)}catch(e){fb()}}

function bindNav(root){root.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{st.mod=b.dataset.m;st.tab='teoria';st.ex=0;st.calc=0;render();$('main').scrollIntoView({block:'start',behavior:'smooth'})})}
function trilha(){
  const mob=matchMedia('(max-width:820px)').matches;
  let h=`<button class="disc${st.mod==='inicio'?' ativo':''}" data-m="inicio"><span class="cod">00</span>Início</button>`;
  AREAS.forEach(([nome,ids])=>{const aberto=!mob||ids.includes(st.mod);
    h+=`<details class="grupo"${aberto?' open':''}><summary>${nome}<span>${ids.length}</span></summary>${ids.map(id=>{const m=modById(id);return `<button class="disc${st.mod===id?' ativo':''}" data-m="${id}"${st.mod===id?' aria-current="true"':''}><span class="cod">${m.cod}</span>${m.nome}${tagMod(m)}</button>`}).join('')}</details>`});
  h+=`<hr><button class="disc${st.mod==='sim'?' ativo':''}" data-m="sim"><span class="cod">SG</span>Simulado geral${simulado&&simulado.fim?`<span class="tag feito">${simulado.ok}/10</span>`:''}</button>`;
  $('trilha').innerHTML=h;bindNav($('trilha'));
  let ok=0,feitos=0;MODS.forEach(m=>{const p=placarMod(m);ok+=p.ok;if(p.n===p.tot)feitos++});
  $('stN').textContent=MODS.length;$('stMod').textContent=`${feitos} CONCLUÍDAS`;$('stQuiz').textContent=`${ok}/${MODS.reduce((t,m)=>t+m.quiz.length,0)} certas`;$('stSim').textContent=simulado&&simulado.fim?`${simulado.ok}/10`:'—';
}

function render(){
  trilha();
  if(st.mod==='conta'&&typeof Conta!=='undefined'&&Conta.ativo)return Conta.render();
  if(st.mod==='inicio')return renderInicio();
  if(st.mod==='sim')return renderSimulado();
  const m=modById(st.mod);
  if(!m){st.mod='inicio';return render()}
  if(!m.carregado)return renderCarregando(m);
  const tabs=[['teoria','Teoria'],['exemplo',m.exemplos&&m.exemplos.length?'Exemplos':'Exemplo'],['sim','Simulador']];if(m.sig)tabs.push(['sig','Bancada SIG']);if(m.obra)tabs.push(['obra','Na obra']);tabs.push(['quiz','Quiz']);if(typeof Cert!=='undefined')tabs.push(['cert','Certificado']);if(!tabs.some(t=>t[0]===st.tab))st.tab='teoria';
  $('main').innerHTML=`<div class="mod-head"><span class="eyebrow">${m.eyebrow}</span><h2>${m.titulo}</h2></div>
  <div class="tabs" role="tablist">${tabs.map(([k,t],i)=>`<button class="tab" role="tab" id="t-${k}" aria-selected="${st.tab===k}" aria-controls="painel" data-k="${k}"><span class="n">${i+1}</span>${t}</button>`).join('')}</div>
  <section class="painel" id="painel" role="tabpanel" aria-labelledby="t-${st.tab}"></section>`;
  $('main').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{st.tab=b.dataset.k;render()});
  const p=$('painel');
  if(st.tab==='teoria')p.innerHTML=m.teoria;
  else if(st.tab==='exemplo')renderExemplos(m,p);
  else if(st.tab==='obra')renderObra(m,p);
  else if(st.tab==='sim'){const lista=[m.sim,...(m.extras||[])],k=Math.min(st.calc||0,lista.length-1),s=lista[k];
    p.innerHTML=(lista.length>1?`<div class="calcs" role="tablist" aria-label="Calculadoras desta disciplina">${lista.map((c,i)=>`<button class="calc-op${i===k?' on':''}" data-calc="${i}" role="tab" aria-selected="${i===k}">${c.nome||'Principal'}</button>`).join('')}</div>`:'')+s.html();
    p.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{st.calc=+b.dataset.calc;render()});
    if(s.init)s.init();
    p.querySelectorAll('.ctrl input[type=range],.ctrl select').forEach(i=>i.addEventListener('input',()=>{outs();s.update()}));outs();s.update();}
  else if(st.tab==='sig'&&m.sig){p.innerHTML=m.sig.html();m.sig.init()}
  else if(st.tab==='cert'&&typeof Cert!=='undefined')Cert.render(m,p);
  else renderQuiz(m,p);
  const ir=$('irSim');if(ir)ir.onclick=()=>{st.tab='sim';render()};
}
function qBlock(q,i,resp,onPick,orig){
  const d=document.createElement('div');d.className='q';
  d.innerHTML=`${orig?`<span class="orig">${orig}</span>`:''}<p>${i+1}. ${q.p}</p><div class="ops"></div><div class="expl" hidden>${q.e}</div>`;
  const ops=d.querySelector('.ops');
  q.o.forEach((t,j)=>{const b=document.createElement('button');b.className='op';b.textContent=t;b.onclick=()=>onPick(j);ops.appendChild(b)});
  if(resp!==undefined){[...ops.children].forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('certa');else if(j===resp)b.classList.add('errada')});d.querySelector('.expl').hidden=false}

      $('ctApagar').onclick=async()=>{if(!this.confirmaApagar){this.confirmaApagar=true;return this.render()}this.confirmaApagar=false;try{await this.apagarDados();this.msg='Dados de estudo apagados da nuvem. O que está neste aparelho continua aqui.';this.msgOk=true}catch(e){this.msg=e.message;this.msgOk=false}this.render()};
      return;
    }
    const tit={entrar:'Entre para salvar seu progresso',criar:'Crie sua conta grátis',esqueci:'Recuperar a senha','nova-senha':'Escolha uma nova senha',confirmar:'Confirme seu e-mail'}[this.modo];

      <div class="presets"><button class="chip" data-modo="criar">Criar conta grátis</button><button class="chip" data-modo="esqueci">Esqueci a senha</button></div>`;
    else if(this.modo==='criar')corpo=`<form id="ctForm" class="lista form-conta" novalidate>${campo('ctNome','Nome','text','name','required')}${campo('ctEmail','E-mail','email','email','required inputmode="email"')}${campo('ctSenha','Senha (mínimo 8 caracteres)','password','new-password','required minlength="8"')}${campo('ctSenha2','Repita a senha','password','new-password','required')}
      <label class="chk"><input type="checkbox" id="ctAceito"> Concordo em guardar meu nome, e-mail e progresso de estudo para sincronizar entre aparelhos.</label>${msg}<div class="presets"><button class="btn" type="submit" id="ctOk">Criar conta</button></div></form>
      <div class="presets"><button class="chip" data-modo="entrar">Já tenho conta</button></div><p class="nota">A conta é a mesma dos outros apps Foster. Se você já usa o Foster Calc, entre com o mesmo e-mail e senha.</p>`;
    else if(this.modo==='esqueci')corpo=`<p>Informe o e-mail da conta. Enviamos um link para você criar uma senha nova.</p><form id="ctForm" class="lista form-conta" novalidate>${campo('ctEmail','E-mail','email','email','required inputmode="email"')}${msg}<div class="presets"><button class="btn" type="submit" id="ctOk">Enviar link</button></div></form><div class="presets"><button class="chip" data-modo="entrar">Voltar para Entrar</button></div>`;
    else if(this.modo==='nova-senha')corpo=`<form id="ctForm" class="lista form-conta" novalidate>${campo('ctSenha','Nova senha (mínimo 8 caracteres)','password','new-password','required minlength="8"')}${campo('ctSenha2','Repita a nova senha','password','new-password','required')}${msg}<div class="presets"><button class="btn" type="submit" id="ctOk">Salvar nova senha</button></div></form>`;
    else if(this.modo==='confirmar')corpo=`${msg}<p>Enviamos um link de confirmação para o seu e-mail. Abra o link neste aparelho para ativar a conta. Se não chegar em alguns minutos, confira a caixa de spam.</p><div class="presets"><button class="chip" data-modo="entrar">Já confirmei, quero entrar</button></div>`;
    const guardar={};if(this._modoTela===this.modo)M.querySelectorAll('.form-conta input').forEach(i=>{guardar[i.id]=i.type==='checkbox'?i.checked:i.value});this._modoTela=this.modo;
    M.innerHTML=`<div class="mod-head"><span class="eyebrow">Minha conta</span><h2>${tit}</h2></div><section class="painel">${corpo}</section>`;
    Object.entries(guardar).forEach(([id,v])=>{const i=$(id);if(!i)return;if(i.type==='checkbox')i.checked=v;else i.value=v});
    M.querySelectorAll('[data-modo]').forEach(b=>b.onclick=()=>{this.modo=b.dataset.modo;this.msg='';this._modoTela=null;this.render()});
    const f=$('ctForm');if(!f)return;
    f.onsubmit=async e=>{e.preventDefault();if(this.ocupado)return;const v=id=>($(id)?$(id).value.trim():''),sv=id=>($(id)?$(id).value:'');
      const email=v('ctEmail'),erro=t=>{this.msg=t;this.msgOk=false;this.render();const i=$(this._foco);if(i)i.focus()};
      if(this.modo!=='nova-senha'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){this._foco='ctEmail';return erro('Informe um e-mail válido.')}
      if(this.modo==='entrar'&&!sv('ctSenha')){this._foco='ctSenha';return erro('Informe a senha.')}
      if(this.modo==='criar'||this.modo==='nova-senha'){
        if(this.modo==='criar'&&!v('ctNome')){this._foco='ctNome';return erro('Informe seu nome.')}
        if(sv('ctSenha').length<8){this._foco='ctSenha';return erro('A senha precisa ter pelo menos 8 caracteres.')}
        if(sv('ctSenha')!==sv('ctSenha2')){this._foco='ctSenha2';return erro('As duas senhas não são iguais.')}
        if(this.modo==='criar'&&!$('ctAceito').checked){this._foco='ctAceito';return erro('Marque a concordância para criar a conta.')}}
      this.ocupado=true;const ok=$('ctOk');ok.disabled=true;ok.textContent='Aguarde…';
      try{
        if(this.modo==='entrar'){await this.entrar(email,sv('ctSenha'));this.msg='';aviso('Bem-vindo de volta! Seu progresso foi sincronizado.')}
        else if(this.modo==='criar'){const r=await this.criar(v('ctNome'),email,sv('ctSenha'));if(r==='confirmar'){this.modo='confirmar';this.msg='Conta criada.';this.msgOk=true}else{this.msg='';aviso('Conta criada. Seu progresso agora fica salvo na nuvem.')}}
        else if(this.modo==='esqueci'){await this.esqueci(email);this.msg='Se houver uma conta com esse e-mail, o link chega em alguns minutos. Confira também o spam.';this.msgOk=true}
        else if(this.modo==='nova-senha'){await this.novaSenha(sv('ctSenha'));this.modo='entrar';this.msg='';await this.aoEntrar();aviso('Senha alterada. Você já está dentro da conta.')}
      }catch(x){this.msg=x.message;this.msgOk=false}
      this.ocupado=false;this.topo();this.render();
    };
  },
  async iniciar(){
    if(!this.ativo){this.topo();return}
    this.carregar();const b=$('btConta');if(b)b.onclick=()=>{st.mod='conta';this.msg='';this.confirmaSair=this.confirmaApagar=false;render();$('main').scrollIntoView({block:'start',behavior:'smooth'})};
    this.topo();
    if(location.hash.includes('access_token')||location.hash.includes('error'))await this.lerLink();
    if(this.logado){this.estado='pendente';this.topo();this.baixar().catch(()=>{})}
    window.addEventListener('online',()=>{if(this.logado)this.baixar().catch(()=>{})});
    window.addEventListener('hashchange',async()=>{if(/access_token|error_code/.test(location.hash)){await this.lerLink();this.topo();render()}});
    if(st.mod==='conta')render();
  }
};

// Certificação: prova corrigida no servidor, pedido do certificado com Pix e painel de pagamentos do instrutor.
const Cert={
  CARGA:4,PROVA_Q:10,MINIMO:7,preco:9.9,
  provas:{},sit:{},carregando:{},
  ERROS:{login_necessario:'Entre na sua conta para fazer a prova.',modulo_sem_prova:'A prova desta disciplina ainda não está disponível.',ja_aprovado:'Você já foi aprovado nesta disciplina.',
    limite_tentativas:'Você já usou as 2 tentativas das últimas 24 horas.',tentativa_inexistente:'Não encontrei esta prova. Recarregue a página.',tentativa_encerrada:'Esta prova já foi enviada.',
    prova_nao_aprovada:'É preciso ser aprovado na prova antes de pedir o certificado.',nome_invalido:'Informe o nome completo, com nome e sobrenome.',cpf_invalido:'CPF inválido. Confira os números.',
    sem_permissao:'Sem permissão.',certificado_nao_pendente:'Este pedido já foi resolvido.'},
  erro(e){return this.ERROS[e&&e.raw]||(e&&e.message)||'Não foi possível concluir agora.'},
  rpc(fn,body={},auth=true){return Conta.req('/rest/v1/rpc/'+fn,{method:'POST',body,auth})},
  url(cod){return location.origin+location.pathname.replace(/index\.html$/,'')+'validar.html?c='+encodeURIComponent(cod)},
  data(iso){return iso?new Date(iso).toLocaleDateString('pt-BR'):''},
  hora(iso){const d=new Date(iso);return d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})},
  cpfMascara(v){const d=String(v).replace(/\D/g,'').slice(0,11);return d.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1-$2')},
  cpfValido(v){const c=String(v).replace(/\D/g,'');if(!/^\d{11}$/.test(c)||/^(\d)\1{10}$/.test(c))return false;
    const dv=n=>{let s=0;for(let i=0;i<n;i++)s+=+c[i]*(n+1-i);const r=s*10%11;return r===10?0:r};return dv(9)===+c[9]&&dv(10)===+c[10]},
  // ---------- Pix (BR Code estático, padrão do Banco Central)
  crc16(s){let c=0xFFFF;for(const ch of new TextEncoder().encode(s)){c^=ch<<8;for(let i=0;i<8;i++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')},
  semAcento(s,n){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().trim().slice(0,n)},
  pix({chave,nome,cidade,valor,txid}){const f=(id,v)=>id+String(v.length).padStart(2,'0')+v;
    const conta=f('00','br.gov.bcb.pix')+f('01',chave);
    const p=f('00','01')+f('26',conta)+f('52','0000')+f('53','986')+f('54',Number(valor).toFixed(2))+f('58','BR')+f('59',this.semAcento(nome,25)||'PIX')+f('60',this.semAcento(cidade,15)||'BRASIL')+f('62',f('05',String(txid).replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304';
    return p+this.crc16(p)},
  carregarQR(){return window.qrcode?Promise.resolve():carregarScript('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js')},
  async qr(el,texto){try{await this.carregarQR();const q=qrcode(0,'M');q.addData(texto);q.make();el.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){el.textContent=''}},
  zap(sit,c,m){const tel=(sit.contato||'').replace(/\D/g,'');if(!tel)return'';const t=`Olá, Wilson! Paguei o certificado ${c.codigo} (${m.cod} · ${m.nome}) da Academia Foster. Segue o comprovante.`;return `https://wa.me/${tel}?text=${encodeURIComponent(t)}`},
  // ---------- aba Certificado
  requisitos(m){return `<div class="cols"><div class="conceito"><h4>1 · Estude</h4><p>Teoria, os 3 exemplos, o simulador e a aba Na obra. Responda as 15 questões do quiz.</p></div>
    <div class="conceito"><h4>2 · Faça a prova</h4><p>${this.PROVA_Q} questões sorteadas, 30 minutos e nota mínima ${this.MINIMO}. São 2 tentativas a cada 24 horas.</p></div>
    <div class="conceito"><h4>3 · Receba o certificado</h4><p>Curso livre de ${this.CARGA} horas, com código e QR code para a faculdade conferir. Valor por certificado: R$ ${br(this.preco)}.</p></div></div>`},
  async render(m,p){
    const cab=`<p>A prova e o estudo são grátis. Você paga só se quiser o certificado, depois de aprovado.</p>${this.requisitos(m)}`;
    if(!Conta.ativo){p.innerHTML=cab+`<p class="nota">A certificação funciona no app publicado: <b>fosterfcs.github.io/academia-foster</b>. Nesta prévia ela fica desativada.</p>`;return}
    if(!Conta.logado){p.innerHTML=cab+`<p class="nota">Para fazer a prova, entre na sua conta. É a mesma conta que salva o seu progresso.</p><div class="presets"><button class="btn" id="ceEntrar">Entrar ou criar conta</button></div>`;$('ceEntrar').onclick=()=>{st.mod='conta';Conta.modo='entrar';render()};return}
    const prova=this.provas[m.id];if(prova&&!prova.fim)return this.renderProva(m,p,prova);
    const sit=this.sit[m.id];
    if(!sit){p.innerHTML=cab+`<p class="carregando" id="ceCarregando">Consultando a sua situação…</p>`;this.atualizar(m);return}
    if(sit.erro){p.innerHTML=cab+`<p class="pill alerta" role="status">${esc(sit.erro)}</p><div class="presets"><button class="btn sec" id="ceDeNovo">Tentar de novo</button></div>`;$('ceDeNovo').onclick=()=>{delete this.sit[m.id];render()};return}
    let h=cab;const res=prova&&prova.resultado;
    if(res)h+=`<p class="pill ${res.aprovada?'ok':'alerta'}" role="status">${res.no_prazo===false?'A prova foi enviada depois do prazo de 30 minutos e não foi considerada.':res.aprovada?`Aprovado com ${res.acertos} de ${res.total} acertos. Parabéns!`:`Você acertou ${res.acertos} de ${res.total}. Precisa de ${this.MINIMO}. Revise a teoria e tente de novo.`}</p>`;
    const c=sit.certificado;
    if(c&&c.status==='emitido'){
      h+=`<h3>Certificado emitido</h3><p>Emitido em ${this.data(c.emitido_em)} para <b>${esc(c.nome)}</b>. Código <b class="mono">${c.codigo}</b>.</p>
      <div class="presets"><a class="btn" href="${this.url(c.codigo)}" target="_blank" rel="noopener">Abrir e imprimir o certificado</a><button class="btn sec" id="ceCopiar">Copiar link de validação</button></div><p class="nota" id="ceCopiado"></p>`;
      p.innerHTML=h;$('ceCopiar').onclick=()=>{const t=document.createElement('textarea');t.value=this.url(c.codigo);copiar(t,$('ceCopiado'))};return}
    if(c&&c.status==='pendente'){
      const valor=Number(c.valor),px=sit.pix&&sit.pix.chave?this.pix({chave:sit.pix.chave,nome:sit.pix.nome,cidade:sit.pix.cidade,valor,txid:c.codigo}):null,z=this.zap(sit,c,m);
      h+=`<h3>Pagamento do certificado</h3><p>Pedido <b class="mono">${c.codigo}</b> em nome de <b>${esc(c.nome)}</b> · valor <b>R$ ${br(valor)}</b>.</p>
      ${px?`<div class="pix"><div class="pix-qr" id="cePixQr" aria-label="QR code do Pix"></div><div><p><b>Pague com Pix</b> pelo QR code ou pelo código copia e cola:</p><textarea id="cePix" readonly rows="3">${px}</textarea><div class="presets"><button class="btn" id="ceCopiaPix">Copiar código Pix</button></div><p class="nota" id="cePixMsg"></p></div></div>`:`<p class="nota">O pagamento é combinado direto com o instrutor pelo WhatsApp.</p>`}
      <p>Depois de pagar, ${z?`<a href="${z}" target="_blank" rel="noopener">envie o comprovante pelo WhatsApp</a>`:'envie o comprovante para comercial@fosterconstrucoes.com.br'}. Assim que o pagamento for confirmado, o certificado aparece aqui e na sua conta.</p>
      <details class="mini"><summary>Corrigir o nome ou o CPF</summary>${this.form(c.nome)}</details>
      <div class="presets"><button class="btn sec" id="ceAtualizar">Já paguei: verificar de novo</button></div>`;
      p.innerHTML=h;if(px){this.qr($('cePixQr'),px);$('ceCopiaPix').onclick=()=>copiar($('cePix'),$('cePixMsg'))}
      $('ceAtualizar').onclick=()=>{delete this.sit[m.id];render()};this.ligarForm(m);return}
    if(sit.aprovada){
      h+=`<h3>Você foi aprovado com nota ${sit.nota}</h3><p>Para emitir o certificado, informe os dados exatamente como devem sair nele.</p>${this.form('')}`;
      p.innerHTML=h;this.ligarForm(m);return}
    if(placarMod(m).n<placarMod(m).tot){
      h+=`<p class="pill alerta">Complete o quiz desta disciplina para liberar a prova: ${placarMod(m).n} de ${placarMod(m).tot} respondidas.</p><div class="presets"><button class="btn sec" id="ceQuiz">Ir para o quiz</button></div>`;
      p.innerHTML=h;$('ceQuiz').onclick=()=>{st.tab='quiz';render()};return}
    if(!sit.prova_aberta&&sit.tentativas_24h>=2){
      h+=`<p class="pill alerta">Você usou as 2 tentativas das últimas 24 horas. A próxima libera em ${this.hora(sit.libera_em)}.</p>`;p.innerHTML=h;return}
    h+=`<h3>Prova de certificação</h3><p>${sit.prova_aberta?'Você tem uma prova em andamento. Continue de onde parou.':`Tentativas nas últimas 24 horas: ${sit.tentativas_24h} de 2. Ao começar, o tempo de 30 minutos começa a contar.`}</p>
      <div class="presets"><button class="btn" id="ceComecar">${sit.prova_aberta?'Continuar a prova':'Começar a prova'}</button></div>`;
    p.innerHTML=h;
    $('ceComecar').onclick=async()=>{const b=$('ceComecar');b.disabled=true;b.textContent='Preparando…';
      try{const r=await this.rpc('acad_iniciar_prova',{p_modulo:m.id});const ant=this.provas[m.id];this.provas[m.id]={...r,resp:ant&&ant.tentativa===r.tentativa?ant.resp:{},fim:false};render()}
      catch(e){b.disabled=false;b.textContent='Começar a prova';this.sit[m.id]={...sit};const x=document.createElement('p');x.className='pill alerta';x.textContent=this.erro(e);b.parentNode.after(x)}};
  },
  form(nome){return `<form id="ceForm" class="lista form-conta" novalidate>
    <div class="campo"><label for="ceNome">Nome completo</label><input id="ceNome" autocomplete="name" value="${esc(nome)}" maxlength="120" required></div>
    <div class="campo"><label for="ceCpf">CPF</label><input id="ceCpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00" required></div>

    <div class="presets"><button class="btn" type="submit" id="ceSolicitar">${nome?'Salvar correção':'Pedir o certificado (R$ '+br(this.preco)+')'}</button></div></form>`},
  ligarForm(m){const f=$('ceForm');if(!f)return;const cpf=$('ceCpf'),er=$('ceErro');cpf.oninput=()=>{cpf.value=this.cpfMascara(cpf.value)};
    f.onsubmit=async ev=>{ev.preventDefault();const nome=$('ceNome').value.trim().replace(/\s+/g,' '),falha=t=>{er.textContent=t;er.hidden=false};
      if(nome.length<5||!nome.includes(' '))return falha(this.ERROS.nome_invalido);if(!this.cpfValido(cpf.value))return falha(this.ERROS.cpf_invalido);if(!$('ceAceite').checked)return falha('Marque a autorização para emitir o certificado.');
      const b=$('ceSolicitar');b.disabled=true;try{await this.rpc('acad_solicitar_certificado',{p_modulo:m.id,p_nome:nome,p_cpf:cpf.value});delete this.sit[m.id];render()}catch(e){b.disabled=false;falha(this.erro(e))}}},
  async atualizar(m){if(this.carregando[m.id])return;this.carregando[m.id]=true;
    try{this.sit[m.id]=await this.rpc('acad_situacao',{p_modulo:m.id});this.preco=Number(this.sit[m.id].preco)||this.preco}catch(e){this.sit[m.id]={erro:this.erro(e)}}
    this.carregando[m.id]=false;if(st.mod===m.id&&st.tab==='cert')render()},
  renderProva(m,p,pv){
    const falta=()=>Math.max(0,Math.round((new Date(pv.expira_em)-Date.now())/1000));
    p.innerHTML=`<div class="prova-topo"><b>Prova · ${m.cod} ${m.nome}</b><span class="tempo" id="ceTempo" aria-live="off"></span></div>
      <p class="nota">Escolha uma alternativa em cada questão. A correção é feita no servidor e o gabarito não é exibido.</p>
      <div class="lista" id="ceLista">${pv.questoes.map((q,i)=>`<fieldset class="q"><legend>${i+1}. ${esc(q.p)}</legend>${q.o.map((t,j)=>`<label class="op-prova"><input type="radio" name="ceQ${i}" value="${j}"${pv.resp[i]===j?' checked':''}> ${esc(t)}</label>`).join('')}</fieldset>`).join('')}</div>
      <p class="pill alerta" id="ceAviso" hidden role="alert"></p><div class="presets"><button class="btn" id="ceEnviar">Enviar a prova</button><span class="nota" id="ceResp"></span></div>`;
    const conta=()=>{const n=Object.keys(pv.resp).length;$('ceResp').textContent=`${n} de ${pv.questoes.length} respondidas`};conta();
    p.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{pv.resp[+r.name.slice(3)]=+r.value;conta()});
    const relogio=()=>{const el=$('ceTempo');if(!el||this.provas[m.id]!==pv||pv.fim){clearInterval(pv.timer);return}const s=falta();el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;el.classList.toggle('acabando',s<300);if(s<=0){clearInterval(pv.timer);this.enviar(m,pv,true)}};
    clearInterval(pv.timer);pv.timer=setInterval(relogio,1000);relogio();
    let confirmou=false;$('ceEnviar').onclick=()=>{const vazias=pv.questoes.length-Object.keys(pv.resp).length;if(vazias&&!confirmou){confirmou=true;const a=$('ceAviso');a.textContent=`Faltam ${vazias} questão(ões) sem resposta. Toque de novo em Enviar para confirmar.`;a.hidden=false;return}this.enviar(m,pv,false)};
  },

  },
  impMsg(t,ok){const m=$('sigImpMsg');if(m)m.innerHTML=`<span class="pill ${ok?'ok':'alerta'}">${t}</span>`},
  paraUTM(lista){if(!lista.length)return{pts:[]};const z=GEO.zona(lista[0].lon),sul=lista[0].lat<0;return{zona:z,sul,pts:lista.map(p=>{const r=GEO.direta(p.lat,p.lon,z);return{nome:p.nome,E:+r.E.toFixed(3),N:+r.N.toFixed(3),z:p.z}})}},
  lerCSV(t){const r=GEO.parseCSV(t);if(r.erro)throw new Error(r.erro);const out=r.geo?this.paraUTM(r.pts):{pts:r.pts};out.aviso=[r.semZ?`${r.semZ} ponto(s) sem cota ficaram com cota 0.`:'',r.ruins?`${r.ruins} linha(s) ignorada(s).`:''].join(' ').trim();return out},
  lerGeoJSON(o){const fs=o.type==='FeatureCollection'?o.features:o.type==='Feature'?[o]:[{geometry:o,properties:{}}],pts=[],geo=[];let ring=null;
    const add=(c,pr,i)=>{const nome=pr.nome||pr.name||pr.ponto||pr.id||'P'+String(i).padStart(2,'0'),z=+(c[2]??pr.cota??pr.z??pr.elevation??0)||0;(Math.abs(c[0])>180?pts:geo).push(Math.abs(c[0])>180?{nome,E:c[0],N:c[1],z}:{nome,lat:c[1],lon:c[0],z})};
    fs.forEach(f=>{const g=f.geometry,pr=f.properties||{};if(!g)return;if(g.type==='Point')add(g.coordinates,pr,pts.length+geo.length+1);else if(g.type==='MultiPoint')g.coordinates.forEach(c=>add(c,pr,pts.length+geo.length+1));
      else if(!ring&&(g.type==='Polygon'||g.type==='MultiPolygon')){ring=g.type==='Polygon'?g.coordinates[0]:g.coordinates[0][0]}});
    let out={pts},proj=null;if(geo.length){out=this.paraUTM(geo);out.pts=pts.concat(out.pts)}
    if(ring){ring=ring.slice();const a=ring[0],b=ring[ring.length-1];if(a[0]===b[0]&&a[1]===b[1])ring.pop();
      if(Math.abs(ring[0][0])>180)out.lote=ring.map(c=>[c[0],c[1]]);else{const z=out.zona||GEO.zona(ring[0][0]),sul=ring[0][1]<0;out.zona=z;out.sul=sul;out.lote=ring.map(c=>{const r=GEO.direta(c[1],c[0],z);return[+r.E.toFixed(3),+r.N.toFixed(3)]})}}
    return out},
  lerKML(t){const d=new DOMParser().parseFromString(t,'application/xml');if(d.getElementsByTagName('parsererror').length)throw new Error('o KML tem erro de formatação');
    const cs=s=>s.trim().split(/\s+/).map(q=>q.split(',').map(Number)).filter(c=>c.length>=2&&!isNaN(c[0])&&!isNaN(c[1])),geo=[];let ring=null;
    [...d.getElementsByTagName('Placemark')].forEach((pm,i)=>{const nm=pm.getElementsByTagName('name')[0],nome=nm?nm.textContent.trim():'P'+String(i+1).padStart(2,'0'),pt=pm.getElementsByTagName('Point')[0],pg=pm.getElementsByTagName('Polygon')[0];
      if(pt){const c=cs(pt.getElementsByTagName('coordinates')[0]?.textContent||'')[0];if(c)geo.push({nome,lon:c[0],lat:c[1],z:c[2]||0})}
      if(pg&&!ring){const ob=pg.getElementsByTagName('outerBoundaryIs')[0]||pg;ring=cs(ob.getElementsByTagName('coordinates')[0]?.textContent||'')}});
    const out=this.paraUTM(geo);if(ring&&ring.length>=3){const a=ring[0],b=ring[ring.length-1];if(a[0]===b[0]&&a[1]===b[1])ring.pop();const z=out.zona||GEO.zona(ring[0][0]);out.zona=z;out.sul=ring[0][1]<0;out.lote=ring.map(c=>{const r=GEO.direta(c[1],c[0],z);return[+r.E.toFixed(3),+r.N.toFixed(3)]})}
    return out},
  importar(t,nome){let r;t=t.replace(/^﻿/,'').trim();
    try{if(/\.kml$/i.test(nome)||t.startsWith('<'))r=this.lerKML(t);else if(/\.(geo)?json$/i.test(nome)||t.startsWith('{'))r=this.lerGeoJSON(JSON.parse(t));else r=this.lerCSV(t)}catch(e){return this.impMsg('Não consegui ler: '+e.message,false)}
    if(!r.pts.length&&!(r.lote&&r.lote.length>=3))return this.impMsg('Não encontrei pontos nem polígono no arquivo.',false);

  exportar(f){const P=this.p,g=(e,n)=>{const r=GEO.inversa(e,n,P.zona,P.sul);return[+r.lon.toFixed(9),+r.lat.toFixed(9)]},A=P.lote.length>=3?Math.abs(GEO.areaAss(P.lote)):0;

      return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Academia Foster · levantamento</name>\n${pm.join('\n')}\n</Document></kml>`}

 L80.0 180.0 L90.0 183.7 L100.0 187.2 L110.0 190.5 L120.0 193.7 L130.0 196.6 L140.0 199.4 L150.0 201.9 L160.0 204.3 L170.0 206.5 L180.0 208.5 L190.0 210.3 L200.0 211.9 L210.0 213.3 L220.0 214.6 L230.0 215.6 L240.0 216.5 L250.0 217.1 L260.0 217.6 L270.0 217.9 L280.0 218.0 L290.0 217.9 L300.0 217.6 L310.0 217.1 L320.0 216.5 L330.0 215.6 L340.0 214.6 L350.0 213.3 L360.0 211.9 L370.0 210.3 L380.0 208.5 L390.0 206.5 L400.0 204.3 L410.0 201.9 L420.0 199.4 L430.0 196.6 L440.0 193.7 L450.0 190.5 L460.0 187.2 L470.0 183.7 L480.0 180.0 Z" style="fill:var(--pos-fill);stroke:var(--pos);stroke-width:1.5" /><text x="40" y="196" style="fill:var(--muted)" font-weight="600">M</text><text x="280" y="232" style="fill:var(--pos)" text-anchor="middle" font-size="10">Mmáx = qL²/8 no meio, onde V = 0</text></svg><figcaption>Viga biapoiada: carga, reações, cortante V e momento fletor M</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Reações de apoio</h4><p>A força que cada apoio devolve para manter a viga parada. A soma das reações é igual à soma das cargas.</p></div>
<div class="conceito"><h4>Esforço cortante (V)</h4><p>A tendência de uma parte da viga escorregar em relação à outra, como uma tesoura. Medido em kN.</p></div>
<div class="conceito"><h4>Momento fletor (M)</h4><p>A tendência de a viga dobrar. É ele que define quanto aço vai embaixo da viga. Medido em kN·m.</p></div></div>
<h3>As três equações de equilíbrio</h3><div class="formula">ΣFx = 0  |  ΣFy = 0  |  ΣM = 0</div>
<p>Em palavras: nada anda para os lados, nada sobe ou desce, e nada gira. Com essas três regras você encontra as reações de qualquer viga biapoiada.</p>
<h3>Fórmulas que você vai usar muito</h3>
<div class="formula">Carga distribuída q em vão L:  R = q·L/2   Mmáx = q·L²/8</div>
<div class="formula">Carga concentrada P no meio:  R = P/2   Mmáx = P·L/4</div>
<div class="dica"><b>Regra de ouro</b>Onde o cortante passa por zero, o momento é máximo. É ali que a viga mais sofre.</div>`,
exemplo:`<h3>Viga de 5 m com laje apoiada em cima</h3><p>Uma viga biapoiada de 5,00 m recebe uma carga distribuída de 12 kN/m (peso da laje, revestimento e uso). Quais são as reações e o momento máximo?</p>
<ol class="passos"><li><b>Carga total.</b> 12 × 5 = <b>60 kN</b>.</li><li><b>Reações.</b> A carga é simétrica, então cada apoio pega metade: R<sub>A</sub> = R<sub>B</sub> = <b>30 kN</b>.</li>
<li><b>Cortante.</b> Começa em +30 kN no apoio A, cai em linha reta e chega a −30 kN no apoio B. Passa por zero no meio (x = 2,50 m).</li>
<li><b>Momento máximo.</b> M = q·L²/8 = 12 × 25 / 8 = <b>37,5 kN·m</b>.</li>
<li><b>Na obra.</b> Esse valor vai para o dimensionamento da armadura (NBR 6118), com γf = 1,4 → Md = 52,5 kN·m. Veja o módulo CA-03.</li></ol>
<div class="dica"><b>Confira no simulador</b>Coloque L = 5 m, q = 12 kN/m e P = 0. Os números devem bater.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Viga de 3 m com uma carga no meio", "html": "<p>Uma viga biapoiada de 3 m recebe um pilarete que descarrega 12 kN bem no meio do vão. Sem carga distribuída.</p><ol class=\"passos\"><li><b>Reações.</b> Simetria: R<sub>A</sub> = R<sub>B</sub> = 12 / 2 = <b>6 kN</b>.</li><li><b>Cortante.</b> +6 kN do apoio A até o meio, −6 kN do meio até B. Ele troca de sinal exatamente embaixo da carga.</li><li><b>Momento máximo.</b> M = P·L/4 = 12 × 3 / 4 = <b>9 kN·m</b>, embaixo da carga.</li><li><b>Leitura.</b> Com carga concentrada, o diagrama de momento é um triângulo, e não uma parábola.</li></ol><div class=\"dica\"><b>No simulador</b>L = 3 m, q = 0, P = 12 kN e posição 50%.</div>"}, {"nivel": "obra", "titulo": "Viga sob parede de alvenaria", "html": "<p>Uma viga de 14 × 30 cm vence 4 m e carrega uma parede de bloco cerâmico de 14 cm, rebocada, com 2,80 m de altura. Peso usual dessa parede: cerca de 2,0 kN por m² de parede.</p><ol class=\"passos\"><li><b>Carga da parede.</b> 2,0 kN/m² × 2,80 m = <b>5,6 kN/m</b>.</li><li><b>Peso próprio da viga.</b> 25 kN/m³ × 0,14 × 0,30 = <b>1,05 kN/m</b>. Total: q = 6,65 kN/m.</li><li><b>Reações.</b> R = 6,65 × 4 / 2 = <b>13,3 kN</b> em cada pilar.</li><li><b>Momento.</b> M = 6,65 × 4² / 8 = <b>13,3 kN·m</b>. Esse valor segue para o dimensionamento da armadura (CA-03).</li></ol><div class=\"dica\"><b>Erro comum</b>Esquecer o peso da parede ou da própria viga. Juntos, eles costumam ser a maior parte da carga em casas.</div>"}],
obra:{"intro": "Na obra, a Resistência dos Materiais aparece no dia em que alguém quer tirar uma parede, abrir um vão ou apoiar uma caixa d’água sobre a laje. Saber de onde vem cada carga evita improviso perigoso.", "erros": [["Apoiar carga nova sem conferir", "Caixa d’água, ar-condicionado ou parede nova sobre laje e viga que não foram calculadas para isso."], ["Abrir vão sem verga", "Porta ou janela aberta sem verga e contraverga: a parede trinca em diagonal nos cantos."], ["Cortar viga para passar tubo", "Furo ou rasgo na viga, principalmente perto dos apoios, onde o cortante é maior."], ["Confundir kN com kgf", "1 kN ≈ 100 kgf. Errar a unidade multiplica ou divide a carga por 10."]], "checklist": ["Cargas novas (caixa d’água, equipamentos, paredes) foram avaliadas por engenheiro", "Vergas e contravergas passam pelo menos 30 cm de cada lado do vão", "Nenhuma viga foi furada ou rasgada sem autorização do projetista", "Apoios das vigas estão íntegros, sem esmagamento ou fissuras", "Escoramento só foi retirado no prazo indicado", "Flechas visíveis ou fissuras no meio do vão foram registradas e comunicadas"], "dica": "Fissura inclinada perto do apoio indica cortante; fissura vertical no meio do vão, embaixo, indica momento. Fotografe com uma régua ao lado para acompanhar a abertura."},
sim:{html:()=>simWrap(rng('inL','Vão L',2,10,0.5,5,'m')+rng('inQ','Carga distribuída q',0,30,1,12,'kN/m','Peso de laje, parede, revestimento')+rng('inP','Carga concentrada P',0,80,5,20,'kN','Pilar apoiado, equipamento')+rng('inA','Posição de P',0,100,5,40,'% do vão','Medida a partir do apoio A')),

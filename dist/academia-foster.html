// EG-15 · Esgoto Sanitário
Academia.modulo('eg',{
teoria:`<p>O esgoto predial funciona por gravidade. Cada aparelho tem um "peso" chamado <b>Unidade Hunter de Contribuição (UHC)</b>, que representa quanto e com que frequência ele despeja água. Somando as UHC, achamos o diâmetro de cada tubo.</p>
<figure class="fig"><svg viewBox="0 0 640 252" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Caminho do esgoto: ralo, caixa sifonada, tubo de queda ventilado e coletor"><line x1="40" y1="180" x2="600" y2="180" style="stroke:var(--ink);stroke-width:1" /><rect x="60" y="150" width="40" height="14" style="fill:var(--grid);stroke:var(--ink);stroke-width:1.5" /><text x="80" y="144" style="fill:var(--muted)" text-anchor="middle" font-size="10">ralo</text><rect x="150" y="150" width="50" height="26" style="fill:var(--grid);stroke:var(--ink);stroke-width:1.5" /><text x="175" y="144" style="fill:var(--muted)" text-anchor="middle" font-size="10">caixa sifonada</text><path d="M100 164 H150 M200 170 H330" style="fill:none;stroke:var(--steel);stroke-width:4" /><line x1="340" y1="20" x2="340" y2="200" style="stroke:var(--steel);stroke-width:6" /><text x="332" y="60" style="fill:var(--muted)" text-anchor="end" font-size="10">tubo de queda</text><line x1="380" y1="10" x2="380" y2="150" style="stroke:var(--water);stroke-width:3" /><path d="M380 150 Q380 170 345 170" style="fill:none;stroke:var(--water);stroke-width:3" /><text x="388" y="30" style="fill:var(--water)" font-size="10">ventilação</text><path d="M340 200 L600 214" style="fill:none;stroke:var(--steel);stroke-width:6" /><text x="470" y="232" style="fill:var(--muted)" text-anchor="middle" font-size="10">coletor com declividade de 1 a 2%</text><rect x="560" y="196" width="40" height="30" style="fill:var(--grid);stroke:var(--ink);stroke-width:1.5" /><text x="580" y="190" style="fill:var(--muted)" text-anchor="middle" font-size="10">caixa de inspeção</text></svg><figcaption>Caminho do esgoto: ralo, caixa sifonada, tubo de queda ventilado e coletor</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Ramal de descarga</h4><p>O tubo que sai de cada aparelho. A bacia sanitária pede DN 100; lavatório e chuveiro, DN 40.</p></div>
<div class="conceito"><h4>Tubo de queda</h4><p>A prumada vertical que desce recolhendo todos os andares. É dimensionado pela soma das UHC.</p></div>
<div class="conceito"><h4>Coletor predial</h4><p>O trecho horizontal até a rede pública. Diâmetro mínimo DN 100 e declividade mínima de 1% (2% para DN 75 ou menor).</p></div></div>
<h3>Algumas UHC da NBR 8160</h3>
<div class="formula">Bacia sanitária 6 (DN 100) · Chuveiro 2 (DN 40) · Lavatório 1 (DN 40) · Pia de cozinha 3 (DN 50)</div>
<div class="formula">Tanque 3 (DN 40) · Máquina de lavar roupa 3 (DN 50) · Máquina de lavar louça 2 (DN 50)</div>
<h3>Ventilação e inspeção</h3><p>Todo tubo de queda deve ser prolongado acima da cobertura (ventilação primária), para o ar entrar e o fecho hídrico dos sifões não ser sugado. Caixas de inspeção ficam a no máximo 25 m umas das outras.</p>
<div class="dica"><b>Cheiro de esgoto no banheiro</b>Quase sempre é falta de ventilação ou caixa sifonada sem fecho hídrico. Ralo seco também deixa o gás passar.</div><h3>Sem rede pública: fossa e sumidouro</h3><div class="formula">Tanque séptico (NBR 7229): V = 1.000 + N · (C · T + K · Lf)</div><div class="formula">Sumidouro (NBR 13969): área de infiltração = contribuição diária / coeficiente de infiltração</div><p>A caixa de gordura da cozinha fica antes de tudo. A calculadora <b>Fossa séptica e sumidouro</b> dimensiona os três.</p>`,
exemplo:`<h3>Prédio de 8 andares com 4 apartamentos por andar</h3><p>Cada apartamento tem: bacia, chuveiro, lavatório, pia de cozinha, tanque e máquina de lavar roupa. Todos descem pelo mesmo tubo de queda.</p>
<ol class="passos"><li><b>UHC por apartamento.</b> 6 + 2 + 1 + 3 + 3 + 3 = <b>18 UHC</b>.</li>
<li><b>Por andar e total.</b> 18 × 4 = 72 UHC por andar. 72 × 8 = <b>576 UHC</b> no tubo de queda.</li>
<li><b>Tubo de queda.</b> Prédio com mais de 3 pavimentos: DN 100 aceita até 500 UHC (não serve). DN 150 aceita 1.900 no total e 330 por andar → <b>DN 150</b>.</li>
<li><b>Coletor predial a 1%.</b> DN 100 aceita 216 UHC (não serve). DN 150 aceita 840 → <b>DN 150</b>.</li>
<li><b>Ramal da caixa sifonada.</b> Chuveiro + lavatório = 3 UHC → <b>DN 50</b>, que é o mínimo de saída da caixa sifonada.</li></ol>
<div class="dica"><b>Confira no simulador</b>Os valores iniciais são os do exemplo.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Casa com um banheiro", "html": "<p>Bacia, chuveiro, lavatório, pia de cozinha e tanque. Coletor com 2% de declividade.</p><ol class=\"passos\"><li><b>UHC.</b> 6 + 2 + 1 + 3 + 3 = <b>15 UHC</b>.</li><li><b>Ramais.</b> Bacia DN 100, pia e tanque DN 50, chuveiro e lavatório DN 40.</li><li><b>Tubo de queda e coletor.</b> <b>DN 100</b>, mínimo por causa da bacia.</li><li><b>Caixa sifonada.</b> Recebe chuveiro e lavatório e sai em DN 50 para o ramal.</li></ol>"}, {"nivel": "obra", "titulo": "Duas casas geminadas com coletor comum", "html": "<p>Cada casa tem 2 banheiros (bacia, chuveiro e lavatório), pia de cozinha, tanque e máquina de lavar. As duas ligam num coletor comum com 1% de declividade.</p><ol class=\"passos\"><li><b>UHC por casa.</b> 2 × (6 + 2 + 1) + 3 + 3 + 3 = <b>27 UHC</b>.</li><li><b>Coletor comum.</b> 54 UHC. DN 100 a 1% admite até 180 UHC → <b>DN 100</b> ✓</li><li><b>Ventilação.</b> Cada casa precisa da sua coluna de ventilação, saindo pelo menos 30 cm acima do telhado.</li><li><b>Cuidado.</b> Máquina de lavar despeja muita espuma. Ligue em ramal próprio ou caixa sifonada de saída maior, nunca direto na caixa do chuveiro.</li></ol><div class=\"dica\"><b>Mau cheiro</b>Cheiro de esgoto em casa nova quase sempre é falta de ventilação ou sifão sem fecho hídrico, e não \"tubo furado\".</div>"}],
obra:{"intro": "Esgoto mal executado aparece com mau cheiro, entupimento e retorno. Declividade, ventilação e teste antes de fechar são o que mais importa.", "erros": [["Declividade invertida ou zero", "Tubo assentado em nível ou com barriga acumula sólidos e entope."], ["Sem ventilação", "Sem coluna de ventilação, o sifão perde o fecho hídrico e o cheiro volta."], ["Joelho de 90° no coletor horizontal", "Mudanças bruscas de direção no trecho horizontal entopem. Use duas curvas de 45° ou caixa de inspeção."], ["Pluvial ligado ao esgoto", "Sobrecarrega a rede e faz o esgoto voltar em chuva forte."]], "checklist": ["Declividade conferida com nível em todos os trechos horizontais", "Tubulações assentadas em berço de areia, sem pedras pontiagudas", "Caixas de inspeção a no máximo 25 m e em toda mudança de direção do coletor", "Coluna de ventilação saindo pelo menos 30 cm acima da cobertura", "Caixa de gordura na saída da pia da cozinha", "Teste de estanqueidade com água antes de fechar e aterrar", "Pluvial e esgoto em redes separadas"], "dica": "Faça o teste com água: tampe a saída, encha a rede até o ralo mais alto e espere 15 minutos. Se o nível baixar, tem vazamento."},
extras:[{nome:'Fossa séptica e sumidouro',
html:()=>`<p class="nota">Onde não há rede de esgoto: tanque séptico pela NBR 7229, sumidouro pela NBR 13969 e caixa de gordura pela NBR 8160. O coeficiente de infiltração sai do teste de percolação no terreno.</p>`+simWrap(rng('fsN','Pessoas atendidas',1,100,1,5,'')+sel('fsC','Padrão da residência',[[160,'Alto padrão (160 L/pessoa·dia)'],[130,'Padrão médio (130 L/pessoa·dia)',1],[100,'Baixo padrão (100 L/pessoa·dia)']])+rng('fsL','Intervalo entre limpezas',1,5,1,1,'anos')+sel('fsT','Temperatura média do mês mais frio',[['quente','Acima de 20 °C',1],['medio','Entre 10 e 20 °C'],['frio','Até 10 °C']])+rng('fsI','Coeficiente de infiltração do solo',20,150,5,60,'L/m²·dia','Teste de percolação: argila ~20 a 40, silte ~40 a 70, areia acima de 90')+rng('fsD','Diâmetro do sumidouro',1,3,0.1,1.5,'m')+rng('fsK','Cozinhas ligadas à caixa de gordura',1,20,1,1,'')),
update(){const N=V_('fsN'),C=+$('fsC').value,r=calc.fossa(N,C,1,V_('fsL'),$('fsT').value),sm=calc.sumidouro(r.cd,V_('fsI'),V_('fsD')),cg=calc.caixaGordura(V_('fsK'),N);
  $('tiles').innerHTML=tiles([['Contribuição',br(r.cd,0)+' L/dia'],['Tanque séptico',br(r.V,0)+' L',1],['Dimensões internas',br(r.L,2)+' × '+br(r.W,2)+' × '+br(r.hu,2)+' m'],['Sumidouro',`Ø ${br(V_('fsD'),1)} × ${br(sm.hAdot,1)} m`,1]])+`<span class="pill ok">Caixa de gordura ${cg.tipo}: ${br(cg.V,0)} L</span>`;
  const sc=Math.min(60,240/(r.L+V_('fsD')+2)),ox=40,chao=60,hu=r.hu*sc,L=r.L*sc;let s=T_('CORTE ESQUEMÁTICO',ox,18)+Ln(20,chao,620,chao,'soil',2);
  s+=`<rect x="${ox}" y="${chao-6}" width="40" height="30" style="fill:var(--water-fill);stroke:var(--ink)"/>`+T(ox+20,chao+40,'CG','muted','text-anchor="middle" font-size="10"');
  const fx=ox+70;s+=`<rect x="${fx}" y="${chao-4}" width="${L}" height="${hu+10}" style="fill:none;stroke:var(--ink);stroke-width:2"/><rect x="${fx+2}" y="${chao+6}" width="${L-4}" height="${hu-2}" style="fill:var(--water-fill)"/><rect x="${fx+2}" y="${chao+hu-0.25*hu}" width="${L-4}" height="${0.25*hu}" style="fill:var(--soil-fill)"/>`+T(fx+L/2,chao+hu+26,'tanque séptico · '+br(r.V,0)+' L','ink','text-anchor="middle" font-size="10" font-weight="600"')+T(fx+L/2,chao+hu-0.12*hu+4,'lodo','soil','text-anchor="middle" font-size="9"');
  const D=V_('fsD')*sc,sx=fx+L+60,hh=Math.min(230,sm.hAdot*sc);s+=Ln(ox+40,chao+8,fx,chao+8,'steel',2)+Ln(fx+L,chao+10,sx,chao+10,'steel',2);
  s+=`<rect x="${sx}" y="${chao}" width="${D}" height="${hh}" style="fill:var(--soil-fill);stroke:var(--ink);stroke-width:2;stroke-dasharray:6 4"/>`;for(let i=0;i<5;i++)s+=Ln(sx+D+4,chao+20+i*hh/5,sx+D+22,chao+28+i*hh/5,'water',1.5);
  s+=T(sx+D/2,chao+hh+18,'sumidouro · h = '+br(sm.hAdot,1)+' m','ink','text-anchor="middle" font-size="10" font-weight="600"');
  $('draw').innerHTML=SVG(640,Math.max(chao+hu+40,chao+hh+32),'Caixa de gordura, tanque séptico e sumidouro',s);
  $('memorial').textContent=`Tanque séptico (NBR 7229)
1) Contribuição: ${N} pessoas × ${C} L = ${br(r.cd,0)} L/dia → período de detenção T = ${br(r.T,2)} dia
2) Taxa de acumulação de lodo K = ${r.K} dias (limpeza a cada ${V_('fsL')} ano${V_('fsL')>1?'s':''}) · lodo fresco Lf = 1 L/pessoa·dia
3) V = 1.000 + N × (C·T + K·Lf) = 1.000 + ${N} × (${C} × ${br(r.T,2)} + ${r.K} × 1) = ${br(r.V,0)} L
4) Altura útil ${br(r.hu,2)} m → área ${br(r.Ab,2)} m² → ${br(r.L,2)} × ${br(r.W,2)} m (comprimento ≈ 2 × largura, largura ≥ 0,80 m)
Sumidouro (NBR 13969)
5) Área de infiltração = ${br(r.cd,0)} / ${br(V_('fsI'),0)} = ${br(sm.A,2)} m² · fundo π D²/4 = ${br(sm.fundo,2)} m²
6) Parede π D h ≥ ${br(sm.A-sm.fundo,2)} m² → h = ${br(sm.h,2)} m → adotado ${br(sm.hAdot,1)} m útil abaixo da entrada
Caixa de gordura (NBR 8160)
7) ${V_('fsK')} cozinha${V_('fsK')>1?'s':''} → ${cg.tipo}${cg.D?`, Ø ${cg.D} cm`:''} · ${cg.tipo.includes('especial')?`V = 2N + 20 = ${br(cg.V,0)} L`:`volume ${cg.V} L`}
   Fundo do sumidouro a pelo menos 1,50 m acima do lençol freático e distâncias mínimas de poços e divisas, conforme a norma.`;}}],
sim:{nome:'Unidades Hunter',html:()=>simWrap(Object.entries(APARELHOS).map(([k,[u,dn,n]])=>rng('eg_'+k,n+' ('+u+' UHC)',0,3,1,['bacia','chuveiro','lavatorio','pia','tanque','maqroupa'].includes(k)?1:0,'un')).join('')+rng('egU','Unidades por andar',1,8,1,4,'un')+rng('egP','Pavimentos atendidos',1,20,1,8,'')+sel('egD','Declividade do coletor',[[0.5,'0,5% (só DN 150 ou maior)'],[1,'1%',1],[2,'2%'],[4,'4%']])),
update(){const ap={};Object.keys(APARELHOS).forEach(k=>ap[k]=V_('eg_'+k));const U=V_('egU'),P=V_('egP'),d=V_('egD'),r=calc.esgoto(ap,U,P,d);
  $('tiles').innerHTML=tiles([['UHC por unidade',r.uUn],['UHC no tubo de queda',r.uTot],['Tubo de queda',r.tq?'DN '+r.tq:'acima de DN 300',1],['Coletor predial',r.col?'DN '+r.col:'acima de DN 400',1]])+(r.uUn===0?'<span class="pill alerta">Nenhum aparelho escolhido</span>':'')+(!r.bacia&&r.uUn?' <span class="pill ok">Sem bacia: tubo de queda pode ser menor que DN 100</span>':'');
  const fl=Math.min(P,10),fh=24,top=30,x=150;let s=T_('ESQUEMA VERTICAL',30,18);
  for(let i=0;i<fl;i++){const y=top+i*fh;s+=`<rect x="60" y="${y}" width="240" height="${fh}" style="fill:${i%2?'var(--paper)':'var(--sheet)'};stroke:var(--line)"/>`+T(66,y+16,(P>10&&i===0?P:P-i)+'º','muted','font-size="10"');
    s+=Ln(x+20,y+fh-6,x+90,y+fh-2,'steel',1.5)+`<rect x="${x+20}" y="${y+fh-12}" width="12" height="7" style="fill:var(--steel)"/>`}
  if(P>10)s+=T(180,top+fh*0.5+4,'⋮ '+(P-9)+' andares','muted','text-anchor="middle" font-size="10"');
  const by=top+fl*fh;s+=Ln(x+90,top-18,x+90,by+30,'ink',5)+T(x+96,top-8,'ventilação acima do telhado','muted','font-size="9"');
  s+=Ln(x+90,by+30,560,by+30+410*d/100*4,'ink',5)+`<rect x="560" y="${by+18}" width="36" height="36" style="fill:none;stroke:var(--ink);stroke-width:2"/>`+T(578,by+68,'CI','ink','text-anchor="middle" font-size="10"');
  s+=T(x+100,by-6,r.tq?'TQ DN '+r.tq:'TQ > 300','amber-ink','font-weight="600"')+T(340,by+22+410*d/100*2,(r.col?'Coletor DN '+r.col:'Coletor > 400')+' · i = '+br(d,1).replace(',0','')+'%','amber-ink','font-weight="600"');
  s+=T(330,top+10,'RAMAIS DE DESCARGA','muted','font-size="10" letter-spacing="1"');let yy=top+28;Object.entries(APARELHOS).forEach(([k,[u,dn,n]])=>{if(!ap[k])return;s+=T(330,yy,`${ap[k]}× ${n}`,'ink','font-size="10"')+T(600,yy,'DN '+dn,'steel','text-anchor="end" font-size="10" font-weight="600"');yy+=16});
  if(r.ramal)s+=T(330,yy+6,'Saída da caixa sifonada','ink','font-size="10"')+T(600,yy+6,'DN '+r.ramal,'steel','text-anchor="end" font-size="10" font-weight="600"');
  $('draw').innerHTML=SVG(640,Math.max(by+80,yy+30),'Esquema vertical do esgoto do prédio',s);
  $('memorial').textContent=`1) UHC por unidade = ${Object.entries(APARELHOS).filter(([k])=>ap[k]).map(([k,[u,,n]])=>`${ap[k]}×${u} (${n.toLowerCase()})`).join(' + ')||'0'} = ${r.uUn}
2) UHC por andar = ${r.uUn} × ${U} = ${r.uPav} · UHC total = ${r.uPav} × ${P} = ${r.uTot}
3) Tubo de queda (${P<=3?'prédio de até 3 pavimentos':'mais de 3 pavimentos: confere total e por andar'})${r.bacia?', mínimo DN 100 por causa da bacia':''} → ${r.tq?'DN '+r.tq:'acima da tabela'}
4) Coletor predial com i = ${br(d,1)}% → ${r.col?'DN '+r.col:'acima da tabela'} (mínimo DN 100)
5) Ramal da caixa sifonada: ${r.uCx} UHC → ${r.ramal?'DN '+r.ramal:'—'}
6) Ventilação primária: prolongar o tubo de queda 30 cm acima do telhado (2 m em terraço utilizável).
   Valores das tabelas da NBR 8160. Confira as tabelas da edição vigente no projeto final.`;}}

// EL-16 · Instalações Elétricas
Academia.modulo('el',{
teoria:`<p>O projeto elétrico residencial segue uma sequência: prever as cargas de cada cômodo, dividir em circuitos, escolher a seção do fio e o disjuntor de cada circuito.</p>
<figure class="fig"><svg viewBox="0 0 640 186" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Do quadro à tomada: disjuntor, condutores com as cores da norma e DR"><rect x="40" y="40" width="90" height="130" style="fill:var(--grid);stroke:var(--ink);stroke-width:2" /><text x="85" y="30" style="fill:var(--muted)" text-anchor="middle" font-size="10">quadro</text><rect x="55" y="56" width="60" height="16" style="fill:var(--sheet);stroke:var(--ink);stroke-width:1" /><text x="85" y="68" style="fill:var(--ink)" text-anchor="middle" font-size="9">DR</text><rect x="55" y="82" width="60" height="16" style="fill:var(--sheet);stroke:var(--ink);stroke-width:1" /><text x="85" y="94" style="fill:var(--ink)" text-anchor="middle" font-size="9">C1</text><rect x="55" y="108" width="60" height="16" style="fill:var(--sheet);stroke:var(--ink);stroke-width:1" /><text x="85" y="120" style="fill:var(--ink)" text-anchor="middle" font-size="9">C2</text><rect x="55" y="134" width="60" height="16" style="fill:var(--sheet);stroke:var(--ink);stroke-width:1" /><text x="85" y="146" style="fill:var(--ink)" text-anchor="middle" font-size="9">C3</text><line x1="130" y1="90" x2="480" y2="90" style="stroke:var(--neg);stroke-width:2.5" /><text x="140" y="86" style="fill:var(--neg)" font-size="9">fase</text><line x1="130" y1="106" x2="480" y2="106" style="stroke:var(--steel);stroke-width:2.5" /><text x="140" y="102" style="fill:var(--steel)" font-size="9">neutro (azul-claro)</text><line x1="130" y1="122" x2="480" y2="122" style="stroke:var(--pos);stroke-width:2.5" /><text x="140" y="118" style="fill:var(--pos)" font-size="9">terra (verde-amarelo)</text><rect x="480" y="74" width="60" height="60" style="fill:var(--grid);stroke:var(--ink);stroke-width:1.5" /><circle cx="500" cy="98" r="4" style="fill:var(--ink);stroke:var(--ink);stroke-width:1"/><circle cx="520" cy="98" r="4" style="fill:var(--ink);stroke:var(--ink);stroke-width:1"/><circle cx="510" cy="114" r="4" style="fill:var(--ink);stroke:var(--ink);stroke-width:1"/><text x="510" y="150" style="fill:var(--muted)" text-anchor="middle" font-size="10">tomada</text><text x="220" y="170" style="fill:var(--ink)" font-weight="600">Ib ≤ In ≤ Iz  ·  queda de tensão ≤ 4%</text></svg><figcaption>Do quadro à tomada: disjuntor, condutores com as cores da norma e DR</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Previsão de cargas</h4><p>A NBR 5410 define o mínimo de iluminação e de tomadas (TUG) por cômodo, a partir da área e do perímetro.</p></div>
<div class="conceito"><h4>TUG e TUE</h4><p>Tomada de uso geral (TUG) é para aparelhos portáteis. Tomada de uso específico (TUE) é para chuveiro, ar-condicionado e outros equipamentos fixos com circuito próprio.</p></div>
<div class="conceito"><h4>Disjuntor</h4><p>Protege o fio. A regra é Ib ≤ In ≤ Iz: a corrente do circuito, a do disjuntor e a capacidade do fio.</p></div></div>
<h3>Previsão mínima (NBR 5410)</h3>
<div class="formula">Iluminação: até 6 m² → 100 VA · acima disso, +60 VA a cada 4 m² inteiros</div>
<div class="formula">TUG: cozinha e serviço 1 a cada 3,5 m de perímetro · sala e quarto 1 a cada 5 m · banheiro 1 junto ao lavatório</div>
<div class="formula">Potência: banheiro, cozinha e serviço 600 VA nas 3 primeiras e 100 VA nas demais · outros cômodos 100 VA</div>
<h3>Dimensionamento do circuito</h3>
<div class="formula">Ib = P / V     Iz = capacidade do fio × fator de agrupamento     Ib ≤ In ≤ Iz</div>
<div class="formula">Queda de tensão: ΔV% = 200 · L · Ib / (56 · S · V) ≤ 4%     Seção mínima: 1,5 mm² iluminação · 2,5 mm² tomadas</div>
<div class="dica"><b>Segurança</b>DR (dispositivo diferencial residual) de 30 mA é obrigatório nos circuitos de áreas molhadas e tomadas externas. Ele protege as pessoas contra choque; o disjuntor protege o fio.</div>`,
exemplo:`<h3>Circuito do chuveiro de 5.500 W em 220 V</h3><p>Comprimento de 12 m até o quadro, fio isolado em eletroduto embutido na alvenaria (método B1), sem outros circuitos no mesmo eletroduto.</p>
<ol class="passos"><li><b>Corrente.</b> Ib = 5500 / 220 = <b>25 A</b>.</li>
<li><b>Disjuntor.</b> O padrão logo acima de 25 A é o próprio <b>25 A</b>.</li>
<li><b>Fio de 2,5 mm².</b> Aguenta 24 A: menor que o disjuntor. Não serve.</li>
<li><b>Fio de 4 mm².</b> Aguenta 32 A ≥ 25 A ✓. Queda: 200 × 12 × 25 / (56 × 4 × 220) = <b>1,22%</b> ≤ 4% ✓</li>
<li><b>Resultado.</b> Fio <b>4 mm²</b> com disjuntor de <b>25 A</b>, mais DR de 30 mA por ser área molhada.</li></ol>
<div class="dica"><b>Previsão do exemplo</b>Uma cozinha de 9 m² com 12 m de perímetro leva 100 VA de iluminação e 4 tomadas (12 / 3,5 = 3,4 → 4): 3 × 600 + 100 = 1.900 VA.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Circuito de tomadas de uso geral", "html": "<p>Circuito de TUG com 1.500 VA em 127 V e 15 m de comprimento.</p><ol class=\"passos\"><li><b>Corrente.</b> Ib = 1.500 / 127 = <b>11,8 A</b>.</li><li><b>Fio.</b> Mínimo para tomadas: <b>2,5 mm²</b>.</li><li><b>Disjuntor.</b> Ib ≤ In ≤ Iz → <b>13 A</b>.</li><li><b>Queda de tensão.</b> ΔV = <b>1,99%</b> ≤ 4% ✓</li><li><b>Quantas tomadas.</b> Com 1.500 VA e tomadas de 100 VA, cabem até 15 pontos de TUG nesse circuito. Na prática, separe cozinha e área de serviço em circuitos próprios.</li></ol>"}, {"nivel": "obra", "titulo": "Ar-condicionado: 127 V ou 220 V?", "html": "<p>Split de 1.400 W, a 20 m do quadro, passando num eletroduto com outro circuito (agrupamento de 2).</p><ol class=\"passos\"><li><b>Em 220 V.</b> Ib = <b>6,4 A</b>, fio 2,5 mm², disjuntor <b>10 A</b>, ΔV = <b>0,83%</b>.</li><li><b>Em 127 V.</b> Ib = <b>11,0 A</b>, fio 2,5 mm², disjuntor <b>13 A</b>, ΔV = <b>2,48%</b>.</li><li><b>Comparação.</b> A mesma potência em 220 V tem menos corrente, menos aquecimento do fio e três vezes menos queda de tensão.</li><li><b>Decisão.</b> Use 220 V sempre que o equipamento permitir, em circuito exclusivo (TUE).</li></ol><div class=\"dica\"><b>Disjuntor que desarma</b>Disjuntor que cai quando o ar liga costuma ser circuito compartilhado com outras cargas. A solução é circuito exclusivo, e não um disjuntor maior.</div>"}],
obra:{"intro": "Instalação elétrica errada não avisa: aquece por anos até o dia em que provoca um incêndio ou um choque. Seguir a NBR 5410 na obra é questão de segurança.", "erros": [["Disjuntor maior que o fio", "Trocar o disjuntor por um maior \"porque desarma\" deixa o fio esquentar sem proteção."], ["Sem aterramento", "Tomada de três pinos sem o fio terra ligado não protege ninguém."], ["Emenda dentro do eletroduto", "Emenda deve ficar em caixa de passagem, acessível."], ["Cores trocadas", "Neutro e terra com cores fora do padrão confundem a manutenção."]], "checklist": ["Seções dos fios e disjuntores conferidas com o quadro de cargas", "DR instalado nos circuitos de áreas molhadas e externas", "DPS no quadro de distribuição", "Condutor de proteção (terra) verde-amarelo em todas as tomadas e equipamentos", "Neutro em azul-claro", "Circuitos exclusivos para chuveiro, ar-condicionado, forno e torneira elétrica", "Quadro identificado, com diagrama unifilar", "Teste de isolamento e funcionamento do DR antes da entrega"], "dica": "Depois de energizar, aperte o botão de teste do DR. Se ele não desarmar, está com defeito ou mal ligado. Ensine o cliente a fazer o teste a cada mês."},
sim:{comodos:[['Sala','sala',16,16],['Cozinha','cozinha',9,12],['Dormitório 1','dormitorio',12,14],['Dormitório 2','dormitorio',9,12],['Banheiro','banheiro',3.6,7.6],['Área de serviço','servico',4,8],['Varanda','varanda',4,8]].map(([n,t,a,p])=>({n,t,a,p})),
circ:[['Iluminação','ilum',880,127,18],['TUG sala, quartos e varanda','tug',1100,127,20],['TUG cozinha','tug',1900,127,10],['TUG serviço e banheiro','tug',2400,127,12],['Chuveiro','tue',5500,220,12]].map(([n,t,P,V,L])=>({n,t,P,V,L})),
TIPOS:[['sala','Sala'],['dormitorio','Dormitório'],['cozinha','Cozinha / copa'],['servico','Área de serviço'],['banheiro','Banheiro'],['varanda','Varanda'],['outro','Outro cômodo']],
html(){return `<div class="sim"><div class="ctrl">${rng('elG','Circuitos no mesmo eletroduto',1,9,1,3,'','Fator de agrupamento da NBR 5410 (método B1)')}<div id="tiles"></div></div><div class="draw" id="draw"></div></div>
<h3>Previsão de cargas por cômodo</h3><div class="tbl-wrap"><table class="ed"><thead><tr><th>Cômodo</th><th>Tipo</th><th>Área (m²)</th><th>Perímetro (m)</th><th>Iluminação</th><th>TUG</th><th>TUG (VA)</th><th></th></tr></thead><tbody id="elR"></tbody></table></div><div class="presets"><button class="chip" id="elRA">+ Cômodo</button></div>
<h3>Circuitos</h3><div class="tbl-wrap"><table class="ed"><thead><tr><th>Circuito</th><th>Tipo</th><th>Potência (VA)</th><th>Tensão</th><th>Comp. (m)</th><th>Ib</th><th>Fio</th><th>Disjuntor</th><th>Queda</th><th></th></tr></thead><tbody id="elC"></tbody></table></div><div class="presets"><button class="chip" id="elCA">+ Circuito</button></div>
<h3>Memorial de cálculo</h3><div class="memorial" id="memorial"></div>`},
init(){const self=this;$('elRA').onclick=()=>{self.comodos.push({n:'Novo cômodo',t:'outro',a:6,p:10});self.tabelas();self.update()};$('elCA').onclick=()=>{self.circ.push({n:'Novo circuito',t:'tug',P:1000,V:127,L:10});self.tabelas();self.update()};this.tabelas()},
tabelas(){const self=this;
  $('elR').innerHTML=this.comodos.map((c,i)=>`<tr><td><input type="text" id="elRn${i}" data-r="${i}" data-k="n" value="${esc(c.n)}" style="min-width:110px;font-family:var(--f-body)" aria-label="Nome do cômodo"></td><td><select id="elRt${i}" data-r="${i}" data-k="t" aria-label="Tipo de ${esc(c.n)}">${this.TIPOS.map(([k,t])=>`<option value="${k}"${k===c.t?' selected':''}>${t}</option>`).join('')}</select></td><td><input type="number" step="0.1" min="0.5" id="elRa${i}" data-r="${i}" data-k="a" value="${c.a}" aria-label="Área"></td><td><input type="number" step="0.1" min="1" id="elRp${i}" data-r="${i}" data-k="p" value="${c.p}" aria-label="Perímetro"></td><td class="num" id="elRi${i}"></td><td class="num" id="elRq${i}"></td><td class="num" id="elRv${i}"></td><td>${this.comodos.length>1?`<button class="rm" data-rr="${i}" aria-label="Remover cômodo">✕</button>`:''}</td></tr>`).join('')+'<tr><td colspan="4"><b>Total</b></td><td class="num" id="elTi"></td><td class="num" id="elTq"></td><td class="num" id="elTv"></td><td></td></tr>';
  $('elC').innerHTML=this.circ.map((c,i)=>`<tr><td><input type="text" id="elCn${i}" data-c="${i}" data-k="n" value="${esc(c.n)}" style="min-width:130px;font-family:var(--f-body)" aria-label="Nome do circuito"></td><td><select id="elCt${i}" data-c="${i}" data-k="t" aria-label="Tipo do circuito"><option value="ilum"${c.t==='ilum'?' selected':''}>Iluminação</option><option value="tug"${c.t==='tug'?' selected':''}>TUG</option><option value="tue"${c.t==='tue'?' selected':''}>TUE</option></select></td><td><input type="number" step="10" min="10" id="elCP${i}" data-c="${i}" data-k="P" value="${c.P}" aria-label="Potência"></td><td><select id="elCV${i}" data-c="${i}" data-k="V" aria-label="Tensão"><option value="127"${c.V==127?' selected':''}>127 V</option><option value="220"${c.V==220?' selected':''}>220 V</option></select></td><td><input type="number" step="1" min="1" id="elCL${i}" data-c="${i}" data-k="L" value="${c.L}" aria-label="Comprimento"></td><td class="num" id="elCi${i}"></td><td class="num" id="elCs${i}"></td><td class="num" id="elCd${i}"></td><td class="num" id="elCq${i}"></td><td>${this.circ.length>1?`<button class="rm" data-rc="${i}" aria-label="Remover circuito">✕</button>`:''}</td></tr>`).join('');
  document.querySelectorAll('#elR [data-k],#elC [data-k]').forEach(e=>{e[e.tagName==='SELECT'?'onchange':'oninput']=()=>{const L=e.dataset.r!==undefined?self.comodos[+e.dataset.r]:self.circ[+e.dataset.c],k=e.dataset.k;
    if(k==='n'||k==='t')L[k]=e.value;else{const v=parseFloat(e.value);if(!isNaN(v)&&v>0)L[k]=v}self.update()}});
  document.querySelectorAll('[data-rr]').forEach(b=>b.onclick=()=>{self.comodos.splice(+b.dataset.rr,1);self.tabelas();self.update()});
  document.querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>{self.circ.splice(+b.dataset.rc,1);self.tabelas();self.update()})},
update(){const G=V_('elG');let ti=0,tq=0,tv=0;
  this.comodos.forEach((c,i)=>{const il=calc.ilum(c.a),t=calc.tugs(c.t,c.a,c.p);ti+=il;tq+=t.n;tv+=t.va;$('elRi'+i).textContent=il+' VA';$('elRq'+i).textContent=t.n;$('elRv'+i).textContent=t.va+' VA'});
  $('elTi').textContent=ti+' VA';$('elTq').textContent=tq;$('elTv').textContent=tv+' VA';
  const rs=this.circ.map(c=>calc.circuito(c.P,c.V,c.L,c.t,G));let ruim=0;
  rs.forEach((r,i)=>{$('elCi'+i).textContent=br(r.Ib,1)+' A';$('elCs'+i).textContent=r.ok?br(r.S,1).replace(',0','')+' mm²':'—';$('elCd'+i).textContent=r.ok?r.In+' A':'—';$('elCq'+i).innerHTML=r.ok?br(r.dv,2)+'%':'<span class="pill alerta">não atende</span>';if(!r.ok)ruim++});
  const tot=this.circ.reduce((s,c)=>s+c.P,0);
  $('tiles').innerHTML=tiles([['Iluminação prevista',br(ti,0)+' VA'],['TUG previstas',tq+' · '+br(tv,0)+' VA'],['Potência dos circuitos',br(tot,0)+' VA',1],['Circuitos',this.circ.length]])+(ruim?`<span class="pill alerta">${ruim} circuito(s) sem solução</span>`:'<span class="pill ok">Todos os circuitos atendem</span>')+(this.circ.filter(c=>c.t!=='tue').reduce((s,c)=>s+c.P,0)<ti+tv?' <span class="pill alerta">Circuitos com menos carga que a previsão</span>':'');
  const rh=34,top=34;let s=T_('QUADRO DE DISTRIBUIÇÃO · QUEDA DE TENSÃO',20,18);
  s+=Ln(330,top-6,330,top+rs.length*rh,'grid')+T(330,top+rs.length*rh+14,'0%','muted','text-anchor="middle" font-size="9"')+Ln(570,top-6,570,top+rs.length*rh,'neg',1.5,'stroke-dasharray="4 3"')+T(570,top+rs.length*rh+14,'4% (limite)','neg','text-anchor="middle" font-size="9"');
  rs.forEach((r,i)=>{const y=top+i*rh,c=this.circ[i];s+=`<rect x="20" y="${y}" width="22" height="${rh-8}" style="fill:var(--${r.ok?'ink':'neg'})"/>`+T(31,y+17,r.ok?r.In:'!','sheet','text-anchor="middle" font-size="10" font-weight="600"');
    s+=T(50,y+11,'C'+(i+1)+' '+(c.n.length>26?c.n.slice(0,25)+'…':c.n),'ink','font-size="11" font-weight="600"')+T(50,y+24,r.ok?`${br(r.Ib,1)} A · ${br(r.S,1).replace(',0','')} mm² · ${c.V} V · ${r.crit}`:r.erro.slice(0,40),'muted','font-size="9"');
    if(r.ok){const w=240*Math.min(1,r.dv/4);s+=`<rect x="330" y="${y+4}" width="${w}" height="${rh-16}" style="fill:var(--${r.dv>3?'amber':'pos'})"/>`+T(336+w,y+16,br(r.dv,2)+'%','ink','font-size="10"')}});
  $('draw').innerHTML=SVG(640,top+rs.length*rh+24,'Quadro de distribuição com queda de tensão por circuito',s);
  $('memorial').textContent=`PREVISÃO DE CARGAS: iluminação ${br(ti,0)} VA · ${tq} TUG = ${br(tv,0)} VA
Fator de agrupamento (${G} circuito${G>1?'s':''} no eletroduto) = ${br(FAGRUP[Math.min(G,9)],2)} · método B1, cobre/PVC
${this.circ.map((c,i)=>{const r=rs[i];return r.ok?`C${i+1} ${c.n}: Ib = ${c.P}/${c.V} = ${br(r.Ib,2)} A → disjuntor ${r.In} A · fio ${br(r.S,1)} mm² (Iz = ${br(CAPB1[r.S],1)} × ${br(r.fa,2)} = ${br(r.Iz,1)} A)
   ΔV = 200 × ${c.L} × ${br(r.Ib,2)} / (56 × ${br(r.S,1)} × ${c.V}) = ${br(r.dv,2)}% · critério: ${r.crit}`:`C${i+1} ${c.n}: ${r.erro}`}).join('\n')}
Use DR de 30 mA nos circuitos de áreas molhadas e tomadas externas.`;}}

// AC-17 · Estruturas de Aço
Academia.modulo('ac',{
teoria:`<p>O aço resiste muito tanto à tração quanto à compressão, e por isso vence vãos grandes com pouco peso. O desafio em vigas de aço não é o material romper: é a peça <b>perder estabilidade</b>, torcendo ou enrugando antes de usar toda a sua resistência.</p>
<figure class="fig"><svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Perfil I: mesa e alma, e a flambagem lateral com torção nas vigas sem travamento"><path d="M60 30 h120 v14 h-54 v120 h54 v14 h-120 v-14 h54 v-120 h-54z" style="fill:var(--steel-soft);stroke:var(--ink);stroke-width:1.5" /><text x="200" y="40" style="fill:var(--muted)" font-size="10">mesa</text><text x="130" y="110" style="fill:var(--muted)" font-size="10">alma</text><path d="M300 60 L600 60" style="fill:none;stroke:var(--ink);stroke-width:8" /><path d="M300 60 Q450 40 600 60" style="fill:none;stroke:var(--neg);stroke-width:2" stroke-dasharray="6 4"/><text x="450" y="30" style="fill:var(--neg)" text-anchor="middle" font-size="10">sem travamento: a mesa comprimida tomba de lado (FLT)</text><line x1="300" y1="80" x2="300" y2="110" style="stroke:var(--amber);stroke-width:3" /><circle cx="300" cy="112" r="3" style="fill:var(--amber);stroke:var(--amber);stroke-width:1"/><line x1="375" y1="80" x2="375" y2="110" style="stroke:var(--amber);stroke-width:3" /><circle cx="375" cy="112" r="3" style="fill:var(--amber);stroke:var(--amber);stroke-width:1"/><line x1="450" y1="80" x2="450" y2="110" style="stroke:var(--amber);stroke-width:3" /><circle cx="450" cy="112" r="3" style="fill:var(--amber);stroke:var(--amber);stroke-width:1"/><line x1="525" y1="80" x2="525" y2="110" style="stroke:var(--amber);stroke-width:3" /><circle cx="525" cy="112" r="3" style="fill:var(--amber);stroke:var(--amber);stroke-width:1"/><line x1="600" y1="80" x2="600" y2="110" style="stroke:var(--amber);stroke-width:3" /><circle cx="600" cy="112" r="3" style="fill:var(--amber);stroke:var(--amber);stroke-width:1"/><text x="450" y="140" style="fill:var(--amber-ink)" text-anchor="middle" font-size="10">travamentos a cada Lb reduzem a esbeltez λ = Lb / ry</text></svg><figcaption>Perfil I: mesa e alma, e a flambagem lateral com torção nas vigas sem travamento</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Perfil I (W)</h4><p>Mesas largas afastadas do centro dão muita inércia com pouco aço. É o formato mais eficiente para vigas.</p></div>
<div class="conceito"><h4>Flambagem local</h4><p>Partes finas da seção (mesa ou alma) enrugam sob compressão. Na NBR 8800 são as verificações FLM e FLA.</p></div>
<div class="conceito"><h4>Flambagem lateral (FLT)</h4><p>A viga sem travamento lateral tomba e torce. É a verificação que mais derruba vigas longas.</p></div></div>
<h3>Momento resistente (NBR 8800, perfis I compactos)</h3>
<div class="formula">Mpl = Zx · fy     MRd = MRk / 1,10     MRd ≤ 1,5 · Wx · fy / 1,10</div>
<div class="formula">FLT: λ = Lb / ry     λp = 1,76 √(E/fy)     Mr = (fy − σr) · Wx,  com σr = 0,3 fy</div>
<div class="formula">λ ≤ λp: MRk = Mpl     λp &lt; λ ≤ λr: interpolação linear × Cb     λ &gt; λr: MRk = Mcr</div>
<div class="formula">Mcr = Cb · π² E Iy / Lb² · √[ Cw/Iy · (1 + 0,039 · J · Lb² / Cw) ]</div>
<h3>Cortante e flecha</h3>
<div class="formula">VRd = 0,6 · d · tw · fy / 1,10   (alma compacta)     Flecha de piso ≤ L/350</div>
<div class="dica"><b>Travar é mais barato que aumentar o perfil</b>Ligar a mesa comprimida à laje ou a vigas secundárias reduz Lb e pode multiplicar a resistência. Vigas de cobertura sem travamento são as mais vulneráveis.</div>`,
exemplo:`<h3>Viga W 310 × 32,7 com 6 m de vão</h3><p>Aço ASTM A572 Grau 50 (fy = 345 MPa). Cargas: permanente 5 kN/m e variável 3 kN/m, mais o peso próprio do perfil (0,32 kN/m).</p>
<ol class="passos"><li><b>Carga de cálculo.</b> qd = 1,4 × (5 + 0,32) + 1,5 × 3 = <b>11,9 kN/m</b>. Msd = 11,9 × 6² / 8 = <b>53,8 kN·m</b>.</li>
<li><b>Sem travamento (Lb = 6 m, Cb = 1,14).</b> λ = 600 / 2,16 = 278, maior que λr = 129. Vale Mcr = 39,2 kN·m → MRd = <b>35,6 kN·m</b> &lt; 53,8 ✗ A viga tomba.</li>
<li><b>Travando a cada 2 m (Cb = 1,0).</b> λ = 200 / 2,16 = 92,8, entre λp = 42,4 e λr = 129. Interpolando, MRd = <b>114 kN·m</b> ≥ 53,8 ✓</li>
<li><b>Cortante.</b> Vsd = 35,8 kN ≤ VRd = 389 kN ✓</li>
<li><b>Flecha.</b> 1,10 cm ≤ L/350 = 1,71 cm ✓ O mesmo perfil passa ou falha só pelo travamento.</li></ol>
<div class="dica"><b>Confira no simulador</b>Comece com Lb = 6 m e depois reduza para 2 m.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Viga W 200 × 15 bem travada", "html": "<p>Vão de 4 m, permanente 3 kN/m, variável 2 kN/m, travamento a cada 1 m (Cb = 1,0), aço A572 Gr. 50.</p><ol class=\"passos\"><li><b>Esforço.</b> Msd = <b>14,8 kN·m</b>.</li><li><b>Resistência.</b> Com Lb = 1 m quase não há flambagem lateral: MRd = <b>43,1 kN·m</b> ✓</li><li><b>Cortante.</b> Vsd = 14,8 kN ≤ VRd = 162 kN ✓</li><li><b>Flecha.</b> 0,70 cm ≤ L/350 = 1,14 cm ✓</li></ol>"}, {"nivel": "obra", "titulo": "Viga de cobertura de 5 m sem travamento", "html": "<p>W 250 × 25,3, vão de 5 m, permanente 4 kN/m e variável 2 kN/m. Sem nenhum travamento lateral (Lb = 5 m, Cb = 1,14).</p><ol class=\"passos\"><li><b>Esforço.</b> Msd = <b>27,9 kN·m</b>.</li><li><b>FLT.</b> λ = 231, bem acima de λr = 128,6. Mcr = 31,2 kN·m → MRd = <b>28,4 kN·m</b>.</li><li><b>Resultado.</b> Passa, mas no limite: <b>98%</b> de aproveitamento. Qualquer carga a mais e a viga tomba.</li><li><b>Com travamento a cada 1,25 m (Cb = 1,0).</b> MRd sobe para <b>87,8 kN·m</b>: três vezes mais, com o mesmo perfil.</li></ol><div class=\"dica\"><b>Na montagem</b>Durante a montagem, antes de terças e contraventamentos estarem fixados, a viga está sem travamento. Monte por partes e trave logo.</div>"}],
obra:{"intro": "Estrutura metálica é rápida de montar, mas depende de ligações bem executadas, de proteção contra corrosão e de travamentos colocados na hora certa.", "erros": [["Parafuso sem torque ou trocado", "Parafuso comum no lugar do estrutural (ASTM A325) ou sem o aperto especificado."], ["Solda sem controle", "Solda feita por soldador não qualificado, sem inspeção visual ou ensaio."], ["Pintura sobre ferrugem", "Tinta aplicada sem limpeza da superfície descasca em pouco tempo."], ["Contraventamento deixado para depois", "Estrutura montada sem os contraventamentos fica instável com vento."]], "checklist": ["Perfis e chapas conferidos com o projeto (bitola, aço e certificado de qualidade)", "Parafusos estruturais com classe e torque especificados", "Soldas inspecionadas visualmente e por ensaio quando o projeto pedir", "Chumbadores na posição e no nível corretos antes da montagem", "Contraventamentos e travamentos montados junto com a estrutura", "Superfícies limpas e pintura de fundo nas espessuras especificadas", "Retoque da pintura nas ligações e pontos danificados na montagem"], "dica": "Conferir a posição dos chumbadores antes da montagem evita a cena mais cara da obra metálica: o pilar chegando e não encaixando na base."},
extras:[{nome:'Ligação parafusada',

   Ainda faltam no projeto: rasgamento entre furos e até a borda, colapso por rasgamento e a verificação das chapas e cantoneiras.`;}}],

  const vx=220,vw=380,vy=70;s+=T_('ELEVAÇÃO · TRAVAMENTOS',vx,18)+`<rect x="${vx}" y="${vy}" width="${vw}" height="10" style="fill:var(--ink)"/>`+`<path d="M${vx} ${vy+10} l-8 14 h16z" style="fill:none;stroke:var(--ink)"/><path d="M${vx+vw} ${vy+10} l-8 14 h16z" style="fill:none;stroke:var(--ink)"/>`;

  s+=T(vx+vw/2,vy+44,`L = ${br(L,1)} m · Lb = ${br(Lb,1)} m`,'muted','text-anchor="middle" font-size="10"');

// MD-18 · Estruturas de Madeira
Academia.modulo('md',{
teoria:`<p>A madeira é leve, resistente e renovável, mas o comportamento muda com a <b>umidade</b> e com o <b>tempo de carga</b>. Uma viga que aguenta um peso por minutos pode não aguentar o mesmo peso por anos. A NBR 7190 cuida disso com o coeficiente k<sub>mod</sub>.</p>
<figure class="fig"><svg viewBox="0 0 640 164" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Madeira: resistência muda com a direção das fibras, a umidade e o tempo de carga"><rect x="60" y="60" width="380" height="60" style="fill:var(--soil-fill);stroke:var(--soil);stroke-width:2" /><path d="M62 66 q190 -8 376 0" style="fill:none;stroke:var(--soil);stroke-width:0.9" opacity=".7"/><path d="M62 76 q190 -8 376 0" style="fill:none;stroke:var(--soil);stroke-width:0.9" opacity=".7"/><path d="M62 86 q190 -8 376 0" style="fill:none;stroke:var(--soil);stroke-width:0.9" opacity=".7"/><path d="M62 96 q190 -8 376 0" style="fill:none;stroke:var(--soil);stroke-width:0.9" opacity=".7"/><path d="M62 106 q190 -8 376 0" style="fill:none;stroke:var(--soil);stroke-width:0.9" opacity=".7"/><path d="M62 116 q190 -8 376 0" style="fill:none;stroke:var(--soil);stroke-width:0.9" opacity=".7"/><line x1="460" y1="90" x2="560" y2="90" style="stroke:var(--steel);stroke-width:2" /><path d="M553.6 92.7 L560 90 L553.6 87.3" style="fill:none;stroke:var(--steel);stroke-width:2" /><text x="460" y="80" style="fill:var(--steel)" font-size="10">paralelo às fibras:</text><text x="460" y="108" style="fill:var(--steel)" font-size="10">muito resistente</text><line x1="250" y1="20" x2="250" y2="56" style="stroke:var(--neg);stroke-width:2" /><path d="M247.3 49.6 L250 56 L252.7 49.6" style="fill:none;stroke:var(--neg);stroke-width:2" /><text x="258" y="30" style="fill:var(--neg)" font-size="10">perpendicular: bem mais fraco</text><text x="60" y="150" style="fill:var(--ink)" font-size="11" font-weight="600">kmod = k1 (tempo de carga) × k2 (umidade) × k3 (qualidade)</text></svg><figcaption>Madeira: resistência muda com a direção das fibras, a umidade e o tempo de carga</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Classes de resistência</h4><p>Coníferas (pinus, eucalipto de reflorestamento leve) e dicotiledôneas (madeiras duras, como peroba e ipê), de C20 a C60.</p></div>
<div class="conceito"><h4>kmod</h4><p>Produto de três fatores: duração da carga (k1), umidade do ambiente (k2) e qualidade da peça (k3).</p></div>
<div class="conceito"><h4>Flecha</h4><p>Muitas vezes é a flecha, e não a resistência, que define a seção de caibros e terças.</p></div></div>
<h3>Verificações (NBR 7190, método da edição de 1997)</h3>
<div class="formula">kmod = k1 · k2 · k3     k1: longa duração 0,70 · k2: classe de umidade 1 e 2 = 1,0 · k3: 2ª categoria 0,8</div>
<div class="formula">fcd = kmod · fc0,k / 1,4     fvd = kmod · fv,k / 1,8     Ec,ef = kmod · Ec0,m</div>
<div class="formula">Flexão: σ = Md / W ≤ fcd     Cisalhamento: τ = 1,5 · Vd / (b·h) ≤ fvd     Flecha (g + 0,2q) ≤ L/200</div>
<div class="dica"><b>Norma em transição</b>A NBR 7190 foi revisada em 2022, com novas classes e coeficientes. Aqui usamos o método de 1997, que ainda é o mais ensinado. Em projeto, confira a edição vigente.</div>`,
exemplo:`<h3>Terça de dicotiledônea C30, seção 6 × 12 cm</h3><p>Vão de 3 m, terças espaçadas a cada 60 cm. Telhado com 0,8 kN/m² de carga permanente (telha cerâmica e madeiramento) e 0,25 kN/m² de variável.</p>
<ol class="passos"><li><b>kmod.</b> 0,70 × 1,0 × 0,8 = <b>0,56</b>. fcd = 0,56 × 30 / 1,4 = <b>12,0 MPa</b>.</li>
<li><b>Carga na terça.</b> Permanente 0,8 × 0,6 + peso próprio 0,06 = 0,54 kN/m. Variável 0,25 × 0,6 = 0,15 kN/m. Fd = 1,4 × 0,69 = <b>0,96 kN/m</b>.</li>
<li><b>Flexão.</b> Md = 0,96 × 3² / 8 = 1,08 kN·m. W = 6 × 12² / 6 = 144 cm³. σ = <b>7,5 MPa</b> ≤ 12,0 ✓</li>
<li><b>Cisalhamento.</b> τ = 0,30 MPa ≤ fvd = 1,56 MPa ✓</li>
<li><b>Flecha.</b> Com Ec,ef = 8.120 MPa, δ = <b>8,5 mm</b> ≤ L/200 = 15 mm ✓</li></ol>
<div class="dica"><b>Confira no simulador</b>Troque para conífera C20 e veja a flecha passar do limite.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Caibro de pinus 5 × 6", "html": "<p>Conífera C30, vão de 1,0 m, caibros a cada 50 cm. Permanente 0,8 kN/m² e variável 0,25 kN/m².</p><ol class=\"passos\"><li><b>Flexão.</b> σ = <b>3,15 MPa</b> ≤ fcd = 12 MPa ✓</li><li><b>Cisalhamento.</b> τ = <b>0,19 MPa</b> ≤ 1,87 ✓</li><li><b>Flecha.</b> 0,78 mm ≤ L/200 = 5 mm ✓</li><li><b>Leitura.</b> Com vão curto, o caibro trabalha folgado. Se o vão dobrar, a flecha cresce 16 vezes.</li></ol>"}, {"nivel": "obra", "titulo": "Deck externo em madeira dura", "html": "<p>Barrotes de dicotiledônea C40, 6 × 16 cm, vão de 2,5 m, espaçados a cada 50 cm. Permanente 0,6 kN/m² e uso de 2,0 kN/m². Área externa, úmida.</p><ol class=\"passos\"><li><b>kmod.</b> 0,70 × 0,8 (umidade) × 0,8 = <b>0,448</b>. A umidade derruba a resistência em 20%.</li><li><b>Flexão.</b> σ = <b>5,94 MPa</b> ≤ fcd = 12,8 ✓</li><li><b>Cisalhamento.</b> τ = 0,38 ≤ 1,49 ✓</li><li><b>Flecha.</b> 1,68 mm ≤ 12,5 mm ✓</li><li><b>O que decide na obra.</b> No deck, o que estraga a madeira é a água parada, não a carga. Deixe frestas entre as tábuas e afaste os barrotes do chão.</li></ol><div class=\"dica\"><b>Madeira em contato com o solo</b>Use madeira tratada em autoclave ou espécies naturalmente duráveis, e apoie em sapatas que não deixem a peça encostar na terra.</div>"}],
obra:{"intro": "Na obra, a madeira estraga mais por umidade, cupim e ligações mal feitas do que por excesso de carga. A escolha da espécie e o detalhe construtivo fazem a diferença.", "erros": [["Madeira verde", "Peça molhada empena, racha e afrouxa as ligações ao secar."], ["Peça encostada no solo ou na alvenaria úmida", "A umidade constante apodrece a madeira e atrai cupim."], ["Prego perto da ponta", "Pregar muito perto da extremidade racha a peça."], ["Emenda no meio do vão", "Emendar terças ou caibros fora dos apoios sem cálculo."]], "checklist": ["Espécie e classe de resistência conferidas com o projeto, com nota fiscal e DOF", "Madeira seca ao ar (perto de 12% a 15% de umidade) e sem rachaduras grandes", "Tratamento preservativo em peças expostas ou em contato com alvenaria", "Peças apoiadas sobre material que corte a umidade (manta, chapa ou calço)", "Pregos e parafusos com espaçamento e distância às bordas do projeto", "Emendas apenas sobre apoios", "Contraventamento do telhado instalado"], "dica": "Exija o DOF (Documento de Origem Florestal) da madeira nativa. Além de ser obrigatório, ele protege você de usar madeira ilegal na obra."},
sim:{html:()=>simWrap(sel('mdC','Madeira',Object.keys(MADEIRAS).map(k=>[k,k,k==='Dicotiledônea C30']))+`<div class="row">${rng('mdB','Largura b',3,20,0.5,6,'cm')}${rng('mdH','Altura h',5,30,0.5,12,'cm')}</div>`+rng('mdL','Vão L',1,6,0.1,3,'m')+rng('mdS','Espaçamento entre peças',0.3,2,0.05,0.6,'m')+rng('mdG','Carga permanente',0.1,3,0.05,0.8,'kN/m²','Telha, madeiramento, forro')+rng('mdQ','Carga variável',0,3,0.05,0.25,'kN/m²','Manutenção, sobrecarga')+sel('mdK1','Duração da carga (k1)',[[0.6,'Permanente (0,60)'],[0.7,'Longa duração (0,70)',1],[0.8,'Média duração (0,80)'],[0.9,'Curta duração (0,90)']])+sel('mdK2','Umidade do ambiente (k2)',[[1,'Classes 1 e 2: ambiente seco a normal (1,0)',1],[0.8,'Classes 3 e 4: úmido (0,8)']])+sel('mdK3','Qualidade da madeira (k3)',[[0.8,'Segunda categoria (0,8)',1],[1,'Primeira categoria, classificada (1,0)']])),
update(){const cls=$('mdC').value,b=V_('mdB'),h=V_('mdH'),L=V_('mdL'),r=calc.vigaMadeira(cls,b,h,L,V_('mdS'),V_('mdG'),V_('mdQ'),V_('mdK1'),V_('mdK2'),V_('mdK3')),ok=r.okM&&r.okV&&r.okF;
  $('tiles').innerHTML=tiles([['kmod',br(r.kmod,2)],['σ / fcd',br(r.sig,1)+' / '+br(r.fcd,1)+' MPa',1],['τ / fvd',br(r.tau,2)+' / '+br(r.fvd,2)+' MPa'],['Flecha',br(r.flecha,1)+' / '+br(r.lim,1)+' mm',1]])+`<span class="pill ${ok?'ok':'alerta'}">${ok?'Peça atende':'Peça não atende'}</span>`;
  const sc=Math.min(150/h,110/b,8),W=b*sc,H=h*sc,ox=40,oy=34;
  let s=T_('SEÇÃO',ox,18)+`<rect x="${ox}" y="${oy}" width="${W}" height="${H}" style="fill:var(--soil-fill);stroke:var(--soil);stroke-width:2"/>`;for(let i=1;i<5;i++)s+=`<path d="M${ox+2} ${oy+i*H/5} q${W/2} ${-6} ${W-4} 0" style="fill:none;stroke:var(--soil);stroke-width:.8;opacity:.7"/>`;
  s+=T(ox+W/2,oy+H+16,b+' cm','muted','text-anchor="middle" font-size="10"')+T(ox+W+6,oy+H/2,h+' cm','muted','font-size="10"');
  s+=usoBarras([['Flexão (σ / fcd)',r.sig/r.fcd,br(r.sig,2)+' de '+br(r.fcd,2)+' MPa'],['Cisalhamento (τ / fvd)',r.tau/r.fvd,br(r.tau,2)+' de '+br(r.fvd,2)+' MPa'],['Flecha (δ / L/200)',r.flecha/r.lim,br(r.flecha,1)+' de '+br(r.lim,1)+' mm']],220,40,380);
  $('draw').innerHTML=SVG(640,230,'Seção da peça de madeira e verificações',s);
  $('memorial').textContent=`${cls} · b × h = ${b} × ${h} cm · W = ${br(r.W,1)} cm³ · I = ${br(r.I,0)} cm⁴
1) kmod = ${br(V_('mdK1'),2)} × ${br(V_('mdK2'),2)} × ${br(V_('mdK3'),2)} = ${br(r.kmod,3)}
2) fcd = ${br(r.kmod,3)} × ${MADEIRAS[cls].fc} / 1,4 = ${br(r.fcd,2)} MPa · fvd = ${br(r.fvd,2)} MPa · Ec,ef = ${br(r.Eef,0)} MPa
3) Cargas na peça: permanente ${br(r.gl,3)} kN/m (com peso próprio ${br(r.pp,3)}) · variável ${br(r.ql,3)} kN/m
4) Fd = 1,4 × (${br(r.gl,3)} + ${br(r.ql,3)}) = ${br(r.Fd,3)} kN/m → Md = ${br(r.Md,3)} kN·m · Vd = ${br(r.Vd,3)} kN
5) σ = Md / W = ${br(r.sig,2)} MPa ${r.okM?'≤':'>'} fcd ${r.okM?'✓':'✗'}
6) τ = 1,5 Vd / (b·h) = ${br(r.tau,3)} MPa ${r.okV?'≤':'>'} fvd ${r.okV?'✓':'✗'}
7) Flecha com g + 0,2q = ${br(r.qs,3)} kN/m: δ = ${br(r.flecha,2)} mm ${r.okF?'≤':'>'} L/200 = ${br(r.lim,1)} mm ${r.okF?'✓':'✗'}
   Método da NBR 7190:1997. A edição de 2022 muda classes e coeficientes.`;}}
});

// RS-19 · Reservatórios
Academia.modulo('rs',{
teoria:`<p>A caixa d'água garante água mesmo quando a rede pública falha. O tamanho certo depende de quantas pessoas usam, de quanto cada uma consome e de quantos dias de reserva se quer ter.</p>
<figure class="fig"><svg viewBox="0 0 640 196" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Reservatório inferior, bomba de recalque e reservatório superior"><rect x="60" y="30" width="240" height="150" style="fill:none;stroke:var(--line);stroke-width:1" /><rect x="120" y="40" width="120" height="40" style="fill:var(--water-fill);stroke:var(--ink);stroke-width:2" /><text x="130" y="34" style="fill:var(--ink)" font-size="10">superior (40% + incêndio)</text><line x1="30" y1="180" x2="620" y2="180" style="stroke:var(--soil);stroke-width:2" /><rect x="380" y="130" width="140" height="50" style="fill:var(--water-fill);stroke:var(--ink);stroke-width:2" /><text x="390" y="124" style="fill:var(--ink)" font-size="10">inferior (60%)</text><circle cx="560" cy="170" r="10" style="fill:var(--amber);stroke:var(--ink);stroke-width:1"/><path d="M560 160 V60 H240" style="fill:none;stroke:var(--steel);stroke-width:3" /><text x="568" y="110" style="fill:var(--steel)" font-size="10">recalque</text><path d="M180 80 V180" style="fill:none;stroke:var(--steel);stroke-width:2" /><text x="186" y="150" style="fill:var(--muted)" font-size="10">distribuição</text></svg><figcaption>Reservatório inferior, bomba de recalque e reservatório superior</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Consumo per capita</h4><p>Litros por pessoa por dia. Residência: 150 a 200 L. Escritório: cerca de 50 L. Escola: cerca de 50 L por aluno.</p></div>
<div class="conceito"><h4>População</h4><p>Regra usual em residências: 2 pessoas por dormitório. Em prédios, some todas as unidades.</p></div>
<div class="conceito"><h4>Reserva de incêndio (RTI)</h4><p>Volume exigido pelo Corpo de Bombeiros, guardado no reservatório superior e intocável no uso diário.</p></div></div>
<h3>Dimensionamento (NBR 5626)</h3>
<div class="formula">Consumo diário = pessoas × consumo per capita     Reserva = consumo diário × dias (1 a 3 dias)</div>
<div class="formula">Com bombeamento: 60% no reservatório inferior e 40% no superior, mais a RTI no superior</div>
<h3>Bomba de recalque</h3>
<div class="formula">Vazão = consumo diário / horas de funcionamento     Forchheimer: D = 1,3 · √Q · X^¼,  X = horas / 24</div>
<p>O tubo de sucção usa um diâmetro comercial acima do de recalque, para a bomba não "puxar" ar.</p>
<div class="dica"><b>Limpeza</b>Reservatório precisa de tampa vedada, extravasor com tela e limpeza a cada 6 meses. Água parada destampada vira criadouro do Aedes aegypti.</div>`,
exemplo:`<h3>Prédio com 4 apartamentos de 2 dormitórios</h3><p>16 pessoas, 200 L por pessoa por dia, 2 dias de reserva, reserva de incêndio de 6.000 L e bomba funcionando 6 horas por dia.</p>
<ol class="passos"><li><b>Consumo diário.</b> 16 × 200 = <b>3.200 L/dia</b>. Reserva de 2 dias: <b>6.400 L</b>.</li>
<li><b>Reservatório inferior.</b> 60% de 6.400 = <b>3.840 L</b>. Em concreto, com 1,50 m de altura útil: 2,56 m² → cerca de 1,60 × 1,60 m.</li>
<li><b>Reservatório superior.</b> 40% de 6.400 + 6.000 de RTI = <b>8.560 L</b> → caixa comercial de 10.000 L.</li>
<li><b>Bomba.</b> 3.200 L em 6 h = 533 L/h. Forchheimer: D = 1,3 × √0,000148 × 0,25^¼ = 11 mm → recalque <b>DN 20</b> e sucção <b>DN 25</b>.</li>
<li><b>Tempo de enchimento.</b> O superior recebe 3.840 L do inferior em cerca de 7,2 horas de bomba.</li></ol>
<div class="dica"><b>Confira no simulador</b>Os valores iniciais são os do exemplo.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Casa com 4 pessoas", "html": "<p>Consumo de 150 L por pessoa por dia, 2 dias de reserva, sem bomba (a rede enche a caixa direto).</p><ol class=\"passos\"><li><b>Consumo diário.</b> 4 × 150 = <b>600 L/dia</b>.</li><li><b>Reserva.</b> 600 × 2 = <b>1.200 L</b>.</li><li><b>Caixa comercial.</b> <b>1.500 L</b>, a próxima acima de 1.200.</li></ol>"}, {"nivel": "obra", "titulo": "Escola com 300 alunos", "html": "<p>50 L por aluno por dia, 1 dia de reserva, bomba funcionando 5 horas por dia, reservatório inferior com 1,50 m de altura útil.</p><ol class=\"passos\"><li><b>Consumo diário.</b> 300 × 50 = <b>15.000 L</b>.</li><li><b>Inferior.</b> 60% = <b>9.000 L</b> → 6 m² de base, cerca de 2,45 × 2,45 m.</li><li><b>Superior.</b> 40% = <b>6.000 L</b> → <b>10.000 L</b> comercial (ou dois de 5.000, para limpar um de cada vez).</li><li><b>Bomba.</b> 15.000 / 5 = <b>3.000 L/h</b>. Forchheimer: D = 25,4 mm → recalque <b>DN 32</b>, sucção <b>DN 40</b>.</li><li><b>Enchimento.</b> A bomba transfere o volume do inferior em cerca de 3 horas.</li></ol><div class=\"dica\"><b>Dois compartimentos</b>Em prédios públicos e escolas, divida o reservatório em duas células. Assim dá para limpar uma sem cortar a água.</div>"}],
obra:{"intro": "Reservatório bem dimensionado e mal instalado vira problema de saúde: água contaminada, vazamento na laje ou caixa que transborda sem ninguém ver.", "erros": [["Caixa sem tampa ou com tampa solta", "Entra sujeira, inseto e luz, e a água vira criadouro de mosquito."], ["Base irregular", "Caixa de polietileno sobre apoio que não cobre toda a base deforma e racha."], ["Extravasor sem saída visível", "O ladrão escondido não avisa quando a boia falha."], ["Sem registro de limpeza", "Sem dreno no fundo, a limpeza exige bombear a água para fora."]], "checklist": ["Base plana, nivelada e maior que o fundo da caixa", "Laje ou estrutura verificada para o peso da caixa cheia (1.000 L = 10 kN)", "Tampa vedada e travada", "Extravasor (ladrão) com tela e saída visível", "Tubo de limpeza com registro no fundo", "Boia instalada e testada", "Registro na saída para a distribuição", "Limpeza a cada 6 meses registrada"], "dica": "Uma caixa de 1.000 L cheia pesa uma tonelada. Antes de colocar caixa d’água sobre laje existente, confirme com o engenheiro se a laje foi calculada para isso."},
sim:{html:()=>simWrap(rng('rsP','Pessoas',1,400,1,16,'')+sel('rsC','Consumo per capita',[[150,'Residência popular (150 L/dia)'],[200,'Residência / apartamento (200 L/dia)',1],[50,'Escritório (50 L/dia)'],[50.0001,'Escola, por aluno (50 L/dia)'],[250,'Alto padrão (250 L/dia)']])+rng('rsD','Dias de reserva',1,3,0.5,2,'dias')+rng('rsR','Reserva de incêndio (RTI)',0,30000,500,6000,'L','Conforme o Corpo de Bombeiros')+sel('rsB','Sistema',[['1','Com bomba (inferior + superior)',1],['0','Só caixa superior (casa, rede direta)']])+rng('rsH','Horas de bomba por dia',2,12,0.5,6,'h')+rng('rsU','Altura útil do inferior',0.8,3,0.1,1.5,'m')),
update(){const rec=$('rsB').value==='1',r=calc.reservatorio(V_('rsP'),Math.round(V_('rsC')),V_('rsD'),V_('rsR'),rec,V_('rsH'),V_('rsU'));
  const cx=c=>c?(c.n>1?c.n+' × ':'')+br(c.cap,0)+' L':'—';
  $('tiles').innerHTML=tiles([['Consumo diário',br(r.diario,0)+' L'],['Superior',br(r.sup,0)+' L → '+cx(r.caixaSup),1],['Inferior',rec?br(r.inf,0)+' L':'—',1],['Bomba',rec?'DN '+r.rec+' / sucção DN '+r.suc:'—']]);
  const sup=Math.max(r.sup,1),inf=Math.max(r.inf,1),mx=Math.max(sup,inf),hs=40+70*sup/mx,hi=40+70*inf/mx,chao=300,tet=140,base=tet-4;
  let s=T_('ESQUEMA',30,18)+`<rect x="60" y="${tet}" width="240" height="${chao-tet}" style="fill:none;stroke:var(--line);stroke-width:1.5"/>`;for(let i=1;i<3;i++)s+=Ln(60,tet+i*(chao-tet)/3,300,tet+i*(chao-tet)/3,'line');
  s+=`<rect x="120" y="${base-hs}" width="120" height="${hs}" style="fill:var(--water-fill);stroke:var(--ink);stroke-width:2"/>`;
  if(r.sup>0&&V_('rsR')>0){const hr=hs*V_('rsR')/r.sup;s+=`<rect x="121" y="${base-hr}" width="118" height="${hr-1}" style="fill:var(--neg-fill)"/>`+T(180,base-hr/2+4,'RTI','neg','text-anchor="middle" font-size="10" font-weight="600"')}
  s+=T(132,base-hs-8,'Superior · '+br(r.sup,0)+' L','ink','font-size="11" font-weight="600"');
  if(rec){s+=`<rect x="330" y="${chao-hi}" width="150" height="${hi}" style="fill:var(--water-fill);stroke:var(--ink);stroke-width:2"/>`+T(340,chao-hi-8,'Inferior · '+br(r.inf,0)+' L','ink','font-size="11" font-weight="600"');
    const yt=base-hs+12;s+=Ln(480,chao-10,512,chao-10,'steel',2.5)+`<circle cx="522" cy="${chao-10}" r="10" style="fill:var(--amber);stroke:var(--ink)"/>`+T(538,chao-6,'bomba','amber-ink','font-size="10"')+Ln(522,chao-20,522,yt,'steel',2.5)+Ln(522,yt,240,yt,'steel',2.5)+T(530,(yt+chao)/2,'recalque DN '+r.rec,'steel','font-size="10"');}
  s+=Ln(30,chao,610,chao,'soil',2)+T(36,chao+16,'térreo','muted','font-size="10"');
  $('draw').innerHTML=SVG(640,340,'Esquema dos reservatórios superior e inferior',s);
  $('memorial').textContent=`1) Consumo diário = ${V_('rsP')} pessoas × ${Math.round(V_('rsC'))} L = ${br(r.diario,0)} L/dia
2) Reserva = ${br(r.diario,0)} × ${br(V_('rsD'),1)} dias = ${br(r.reserva,0)} L · RTI = ${br(V_('rsR'),0)} L · total = ${br(r.total,0)} L
${rec?`3) Inferior = 60% × ${br(r.reserva,0)} = ${br(r.inf,0)} L → com ${br(V_('rsU'),2)} m de altura útil: ${br(r.area,2)} m² (≈ ${br(r.lado,2)} × ${br(r.lado,2)} m)
4) Superior = 40% × ${br(r.reserva,0)} + RTI = ${br(r.sup,0)} L → ${cx(r.caixaSup)}
5) Vazão da bomba = ${br(r.diario,0)} / ${br(V_('rsH'),1)} h = ${br(r.Qlh,0)} L/h · Forchheimer: D = 1,3 √Q · (${br(V_('rsH'),1)}/24)^¼ = ${br(r.Dmm,1)} mm
   Recalque DN ${r.rec} · sucção DN ${r.suc} · enchimento do superior em ${br(r.tempo,1)} h de bomba`:`3) Sem bomba: todo o volume no superior = ${br(r.sup,0)} L → ${cx(r.caixaSup)}`}`;}}
});

// PV-20 · Pavimentação
Academia.modulo('pv',{
teoria:`<p>O pavimento é um "sanduíche" de camadas. Cada uma espalha a carga dos pneus para a de baixo, até que o solo natural (subleito) receba uma pressão que ele aguenta. Quanto mais fraco o solo e mais pesado o tráfego, mais espesso o pavimento.</p>
<figure class="fig"><svg viewBox="0 0 640 196" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Estrutura do pavimento flexível e o espalhamento da carga da roda"><rect x="60" y="40" width="330" height="16" style="fill:var(--ink);stroke:var(--line);stroke-width:1" opacity="0.85"/><text x="400" y="52.0" style="fill:var(--ink)" font-size="10">Revestimento asfáltico</text><rect x="60" y="56" width="330" height="30" style="fill:var(--amber);stroke:var(--line);stroke-width:1" opacity="0.5"/><text x="400" y="75.0" style="fill:var(--ink)" font-size="10">Base (CBR ≥ 80)</text><rect x="60" y="86" width="330" height="38" style="fill:var(--soil);stroke:var(--line);stroke-width:1" opacity="0.5"/><text x="400" y="109.0" style="fill:var(--ink)" font-size="10">Sub-base (CBR ≥ 20)</text><rect x="60" y="124" width="330" height="40" style="fill:var(--soil-fill);stroke:var(--line);stroke-width:1" opacity="0.5"/><text x="400" y="148.0" style="fill:var(--ink)" font-size="10">Subleito</text><circle cx="225" cy="22" r="18" style="fill:var(--ink);stroke:var(--ink);stroke-width:1"/><path d="M205 40 L120 164 L330 164 L245 40" style="fill:none;stroke:var(--neg);stroke-width:1.5" stroke-dasharray="5 4"/><text x="225" y="184" style="fill:var(--neg)" text-anchor="middle" font-size="10">a carga do pneu se espalha camada por camada</text></svg><figcaption>Estrutura do pavimento flexível e o espalhamento da carga da roda</figcaption></figure>
<div class="cols"><div class="conceito"><h4>CBR</h4><p>Índice de Suporte Califórnia: a resistência do solo comparada a uma brita padrão. Solo com CBR 5 é fraco; brita graduada passa de 80.</p></div>
<div class="conceito"><h4>Número N</h4><p>Quantas vezes o eixo padrão de 8,2 toneladas vai passar pela pista durante a vida útil do projeto.</p></div>
<div class="conceito"><h4>Camadas</h4><p>Revestimento asfáltico, base, sub-base e, se o subleito for muito fraco, reforço do subleito.</p></div></div>
<h3>Método do DNIT (antigo DNER, Souza 1981)</h3>
<div class="formula">Espessura total equivalente: H = 77,67 · N^0,0482 · CBR^−0,598   (cm, em material granular)</div>
<div class="formula">Revestimento pelo N: até 10⁶ tratamento superficial · até 5×10⁶ 5 cm · até 10⁷ 7,5 cm · até 5×10⁷ 10 cm · acima 12,5 cm</div>
<div class="formula">R·KR + B ≥ H20     R·KR + B + h20 ≥ Hn     R·KR + B + h20 + hn ≥ Hm     (KR = 2,0 para concreto asfáltico)</div>
<div class="formula">N = 365 × Σ VDM × FV × FR     (FV: fator de veículo · FR: fator climático)</div>
<div class="dica"><b>Qualidade dos materiais</b>A sub-base precisa de CBR ≥ 20 e a base de CBR ≥ 80 (ou ≥ 60 para N até 5×10⁶). Sem compactação na umidade ótima, nenhuma espessura resolve.</div>`,
exemplo:`<h3>Rua de bairro com N = 3 × 10⁶ e subleito com CBR 6</h3>
<ol class="passos"><li><b>Revestimento.</b> N entre 10⁶ e 5×10⁶: <b>5 cm</b> de concreto asfáltico, KR = 2,0, valendo 10 cm de material granular.</li>
<li><b>Proteção da sub-base (CBR 20).</b> H20 = 77,67 × (3×10⁶)^0,0482 × 20^−0,598 = <b>26,6 cm</b>. Base: B ≥ 26,6 − 10 = 16,6 → <b>17 cm</b>.</li>
<li><b>Proteção do subleito (CBR 6).</b> Hm = <b>54,6 cm</b>. Sub-base: h20 ≥ 54,6 − 10 − 17 = 27,6 → <b>28 cm</b>.</li>
<li><b>Estrutura final.</b> 5 cm de CBUQ + 17 cm de base + 28 cm de sub-base = <b>50 cm</b> de pavimento.</li>
<li><b>Leitura.</b> Se o subleito tivesse CBR 10, a sub-base cairia para menos da metade. Melhorar o solo da base costuma ser a economia mais barata.</li></ol>
<div class="dica"><b>Confira no simulador</b>Os valores iniciais são os do exemplo.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Rua local com tráfego leve", "html": "<p>N = 5 × 10⁵ e subleito com CBR 10.</p><ol class=\"passos\"><li><b>Revestimento.</b> N ≤ 10⁶: <b>tratamento superficial</b>, sem contribuição estrutural.</li><li><b>Base.</b> H20 = 24,4 cm → <b>B = 25 cm</b>.</li><li><b>Sub-base.</b> Hm = 36,9 cm → h20 ≥ 36,9 − 25 → <b>12 cm</b>.</li><li><b>Total.</b> <b>37 cm</b> de camadas granulares, mais o tratamento superficial.</li></ol>"}, {"nivel": "obra", "titulo": "Avenida com tráfego pesado sobre solo fraco", "html": "<p>N = 2 × 10⁷ e subleito com CBR 4.</p><ol class=\"passos\"><li><b>Revestimento.</b> N entre 10⁷ e 5 × 10⁷: <b>10 cm de CBUQ</b>, valendo 20 cm de granular.</li><li><b>Base.</b> B ≥ H20 − 20 dá menos que o mínimo → <b>B = 15 cm</b>.</li><li><b>Sub-base.</b> Hm = 76,2 cm → h20 ≥ 76,2 − 20 − 15 → <b>42 cm</b>. Total de <b>67 cm</b>.</li><li><b>Com reforço de CBR 10.</b> A sub-base cai para <b>10 cm</b> e entram <b>32 cm de reforço</b>, em material mais barato. A espessura total é a mesma, mas o custo cai.</li></ol><div class=\"dica\"><b>Drenagem</b>Num subleito de CBR 4, água é o maior inimigo. Sarjeta, dreno profundo e abaulamento da pista valem tanto quanto as camadas.</div>"}],
obra:{"intro": "O pavimento se decide na compactação. Camada com espessura certa mas mal compactada afunda nos primeiros meses e abre trilha de roda.", "erros": [["Compactar fora da umidade ótima", "Solo seco demais ou encharcado não atinge o grau de compactação."], ["Camadas grossas demais", "Compactar mais de 20 cm de uma vez deixa o fundo da camada fofo."], ["Asfalto sem imprimação ou pintura de ligação", "O revestimento descola da base e se desfaz em placas."], ["Sem drenagem", "Água infiltrada amolece o subleito e o pavimento afunda."]], "checklist": ["Ensaio de compactação (Proctor) e CBR dos materiais antes da execução", "Controle do grau de compactação em cada camada (usual: 100% do Proctor)", "Espessura de cada camada conferida com nivelamento", "Imprimação sobre a base granular antes do revestimento", "Pintura de ligação entre camadas asfálticas", "Temperatura do CBUQ conferida na chegada e na compactação", "Sarjetas, bocas de lobo e drenos executados antes do revestimento"], "dica": "Em obra de pavimentação, o ensaio de frasco de areia (ou densímetro) em cada camada é barato perto do custo de refazer a pista. Exija os laudos antes de liberar a camada seguinte."},
sim:{html:()=>simWrap(sel('pvM','Como informar o tráfego',[['n','Número N direto',1],['v','Calcular pelo volume de veículos']])+`<div id="pvNbox">${rng('pvN','N (expoente)',5,8,0.01,6.48,'','N = 10 elevado a este valor (6,48 ≈ 3 × 10⁶)')}</div><div id="pvVbox" hidden>${rng('pvV','Veículos comerciais por dia (VDM)',10,5000,10,800,'')}${rng('pvA','Período de projeto',5,20,1,10,'anos')}${rng('pvT','Crescimento do tráfego',0,8,0.5,3,'% ao ano')}${rng('pvF','Fator de veículo FV',0.5,6,0.1,2.5,'')}${sel('pvS','Faixa de projeto',[[0.5,'Pista de mão dupla (50%)',1],[1,'Faixa única (100%)']])}</div>`+rng('pvC','CBR do subleito',2,19,1,6,'%')+rng('pvR','CBR do reforço (0 = sem reforço)',0,19,1,0,'%','Use quando o subleito for muito fraco')),
init(){const t=()=>{const v=$('pvM').value==='v';$('pvNbox').hidden=v;$('pvVbox').hidden=!v};$('pvM').addEventListener('input',t);t()},
update(){const porV=$('pvM').value==='v',N=porV?calc.numeroN(V_('pvV'),V_('pvA'),V_('pvT'),V_('pvF'),+$('pvS').value):10**V_('pvN'),cr=V_('pvR')>V_('pvC')?V_('pvR'):null,r=calc.pavimento(N,V_('pvC'),cr);
  const ne=x=>{const e=Math.floor(Math.log10(x));return br(x/10**e,1)+' × 10^'+e};
  $('tiles').innerHTML=tiles([['Número N',ne(N)],['Revestimento',r.R?br(r.R,1)+' cm':'trat. superficial'],['Base / sub-base',r.B+' / '+r.h20+' cm',1],['Pavimento total',br(r.total,1)+' cm',1]])+(cr==null&&V_('pvR')>0?'<span class="pill alerta">O reforço precisa ter CBR maior que o subleito</span>':'');
  const cam=[['Revestimento',r.R||1.5,'ink',r.R?br(r.R,1)+' cm':'tratamento superficial'],['Base (CBR ≥ 80)',r.B,'amber',r.B+' cm'],['Sub-base (CBR ≥ 20)',r.h20,'soil',r.h20+' cm']];if(r.hn)cam.push(['Reforço (CBR '+cr+')',r.hn,'steel',r.hn+' cm']);
  const tot=cam.reduce((a,c)=>a+c[1],0),sc=Math.min(4.5,260/tot);let y=40,s=T_('SEÇÃO DO PAVIMENTO',30,18);
  cam.forEach(([n,e,c,t])=>{const hh=Math.max(6,e*sc);s+=`<rect x="60" y="${y}" width="260" height="${hh}" style="fill:var(--${c});opacity:${c==='ink'?.85:.5};stroke:var(--line)"/>`+T(332,y+hh/2+4,n+' · '+t,'ink','font-size="11"');y+=hh});
  s+=`<rect x="60" y="${y}" width="260" height="40" style="fill:var(--soil-fill)"/>`+T(332,y+22,'Subleito (CBR '+V_('pvC')+')','ink','font-size="11"');for(let i=0;i<7;i++)s+=Ln(70+i*38,y+30,82+i*38,y+18,'soil',1);
  s+=Ln(48,40,48,y,'muted')+T(42,(40+y)/2,br(r.total,0)+' cm','muted','text-anchor="end" font-size="10"');
  $('draw').innerHTML=SVG(640,y+56,'Seção das camadas do pavimento',s);
  $('memorial').textContent=`${porV?`N = 365 × Σ VDM(1 + ${br(V_('pvT'),1)}%)^i × FV ${br(V_('pvF'),1)} × faixa ${+$('pvS').value*100}% em ${V_('pvA')} anos = ${ne(N)}\n`:''}1) N = ${ne(N)} → ${r.tipo}${r.R?` (R = ${br(r.R,1)} cm, KR = 2,0)`:' (sem contribuição estrutural)'}
2) H20 = 77,67 × N^0,0482 × 20^−0,598 = ${br(r.H20,1)} cm → B ≥ ${br(r.H20,1)} − ${br(r.R*r.KR,1)} = ${br(r.H20-r.R*r.KR,1)} → B = ${r.B} cm (mínimo 15)
${r.temRef?`3) Hn (CBR ${cr}) = ${br(r.Hn,1)} cm → h20 ≥ ${br(r.Hn,1)} − ${br(r.R*r.KR,1)} − ${r.B} → h20 = ${r.h20} cm
4) Hm (CBR ${V_('pvC')}) = ${br(r.Hm,1)} cm → reforço ≥ ${br(r.Hm,1)} − ${br(r.R*r.KR+r.B+r.h20,1)} → hn = ${r.hn} cm`:`3) Hm (CBR ${V_('pvC')}) = ${br(r.Hm,1)} cm → h20 ≥ ${br(r.Hm,1)} − ${br(r.R*r.KR,1)} − ${r.B} → h20 = ${r.h20} cm`}
Total: ${br(r.total,1)} cm · Base e sub-base consideradas granulares (K = 1,0).`;}}
});

iniciar();
</script>

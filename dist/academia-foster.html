<style>
/* Academia Foster de Engenharia */

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: prancha técnica — trilha de disciplinas à esquerda, módulo com abas à direita, papel milimetrado de fundo */
:root{

  --line:#c9d3d1; --steel:#1f5f8b; --steel-soft:#e3eef6; --amber:#e0a106; --amber-ink:#7a5600;
  --pos:#1f7a4d; --neg:#b4402f; --pos-fill:rgba(31,122,77,.16); --neg-fill:rgba(180,64,47,.16);
  --amber-fill:rgba(224,161,6,.2); --water:#3a8fc4; --water-fill:rgba(58,143,196,.22); --soil:#a9875a; --soil-fill:rgba(169,135,90,.22);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --pos:#5cc98f; --neg:#ef8370; --pos-fill:rgba(92,201,143,.18); --neg-fill:rgba(239,131,112,.18);
  --amber-fill:rgba(242,182,50,.2); --water:#68b4e6; --water-fill:rgba(104,180,230,.22); --soil:#c9a678; --soil-fill:rgba(201,166,120,.2);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11181f; --sheet:#18222c; --ink:#e4ecf1; --muted:#9aabb8; --grid:#1c2730;
  --line:#2c3a46; --steel:#6fb2e0; --steel-soft:#1d3346; --amber:#f2b632; --amber-ink:#f2c55a;
  --pos:#5cc98f; --neg:#ef8370; --pos-fill:rgba(92,201,143,.18); --neg-fill:rgba(239,131,112,.18);
  --amber-fill:rgba(242,182,50,.2); --water:#68b4e6; --water-fill:rgba(104,180,230,.22); --soil:#c9a678; --soil-fill:rgba(201,166,120,.2);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:12px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,6vw,3.2rem);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--steel)}
.brand h1 em{font-style:normal;font-weight:500;color:var(--muted);font-size:.55em;letter-spacing:.08em;white-space:nowrap}
.brand .slogan{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.04em;color:var(--amber-ink);margin:6px 0 0}
.stamp{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);border:1.5px solid var(--line);padding:6px 10px;text-align:right;line-height:1.5;background:var(--sheet)}
.stamp b{color:var(--ink)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}

nav.trilha{background:var(--sheet);border:1.5px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:4px}
nav.trilha h2{font-family:var(--f-display);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}

details.grupo{display:flex;flex-direction:column}
details.grupo summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-weight:600;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 4px 4px;border-top:1.5px solid var(--line)}
details.grupo summary::-webkit-details-marker{display:none}
details.grupo summary::after{content:"+";font-family:var(--f-mono);font-size:1rem}
details.grupo[open] summary::after{content:"−"}
details.grupo summary span{font-family:var(--f-mono);font-size:.7rem;margin-left:auto;margin-right:8px}
details.grupo summary:hover{color:var(--ink)}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.area{display:flex;flex-direction:column;gap:8px;min-width:0}
.area h3{font-size:1.15rem;border-bottom:2px solid var(--ink);padding-bottom:4px}
.card-mod{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;text-align:left;font:inherit;color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);padding:10px 12px;cursor:pointer}
.card-mod:hover{border-color:var(--steel)}
.card-mod .cod{font-family:var(--f-mono);font-size:.7rem;color:var(--steel)}
.card-mod b{font-size:1rem}
.card-mod small{grid-column:2/4;color:var(--muted);font-size:.85rem;line-height:1.35}
.card-mod .tag{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.card-mod .tag.feito{color:var(--pos);font-weight:600}
.chip.off{cursor:default;color:var(--muted);border-style:dashed}
.chip.off:hover{border-color:var(--line)}
.disc{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid transparent;background:none;color:var(--ink);font:inherit;font-size:.95rem;text-align:left;cursor:pointer;line-height:1.3}
.disc:hover{border-color:var(--line)}
.disc .cod{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);min-width:42px}
.disc.ativo{border-color:var(--steel);background:var(--steel-soft)}
.disc.ativo .cod{color:var(--steel)}
.disc .tag{margin-left:auto;font-size:.68rem;font-family:var(--f-mono);color:var(--muted);padding-left:8px}
.disc .tag.feito{color:var(--pos);font-weight:600}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main{background:var(--sheet);border:1.5px solid var(--line);min-width:0}
.mod-head{padding:18px 20px 0;display:flex;flex-direction:column;gap:4px}
.mod-head .eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;color:var(--steel);text-transform:uppercase}
.mod-head h2{font-family:var(--f-display);font-weight:600;font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.1;margin:0;text-wrap:balance}
.tabs{display:flex;gap:2px;padding:14px 20px 0;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tab{font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;padding:8px 14px;border:1.5px solid transparent;border-bottom:none;background:none;color:var(--muted);cursor:pointer;margin-bottom:-1.5px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);background:var(--sheet);border-color:var(--line);border-bottom:1.5px solid var(--sheet)}
.tab .n{font-family:var(--f-mono);font-size:.7rem;color:var(--amber-ink);margin-right:6px}
.painel{padding:20px;display:flex;flex-direction:column;gap:18px}
.painel p,.painel li{max-width:68ch}
.painel p{margin:0}
.painel h3{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0;text-wrap:balance}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.conceito{border-left:3px solid var(--steel);padding:4px 0 4px 14px}
.conceito h4{margin:0 0 4px;font-size:1rem}
.conceito p{color:var(--muted);font-size:.95rem}
.formula{font-family:var(--f-mono);font-size:.9rem;background:var(--steel-soft);padding:10px 14px;overflow-x:auto;white-space:nowrap}
.dica{border:1.5px dashed var(--amber);padding:10px 14px;font-size:.95rem}
.dica b{color:var(--amber-ink);font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;display:block}
ol.passos{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px}
ol.passos li::marker{font-family:var(--f-mono);color:var(--steel);font-weight:600}
.sim{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px}
@media (max-width:900px){.sim{grid-template-columns:1fr}}
.ctrl{display:flex;flex-direction:column;gap:14px;min-width:0}
.campo{display:flex;flex-direction:column;gap:2px}
.campo label{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;font-weight:600}
.campo output{font-family:var(--f-mono);color:var(--steel);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.campo input[type=range]{width:100%;accent-color:var(--steel)}
.campo select{width:100%;font:inherit;padding:6px 8px;background:var(--sheet);color:var(--ink);border:1.5px solid var(--line)}
.campo small{color:var(--muted);font-size:.8rem}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:.75rem;padding:5px 9px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--steel)}
.result{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res{border:1.5px solid var(--line);padding:8px 10px;min-width:0}
.res span{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.02em}
.res b{font-family:var(--f-mono);font-size:1rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.res.destaque{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.75rem;font-weight:600;padding:4px 10px;border:1.5px solid}
.pill.ok{color:var(--pos);border-color:var(--pos);background:var(--pos-fill)}
.pill.alerta{color:var(--neg);border-color:var(--neg);background:var(--neg-fill)}
.draw{min-width:0;overflow-x:auto;display:flex;flex-direction:column;gap:10px}
.draw svg{width:100%;min-width:520px;height:auto;display:block}
.memorial{font-family:var(--f-mono);font-size:.82rem;background:var(--paper);border:1.5px solid var(--line);padding:12px 14px;overflow-x:auto;white-space:pre;line-height:1.7}
.tbl-wrap{overflow-x:auto}
table.ed{border-collapse:collapse;width:100%;font-size:.88rem}
table.ed th{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1.5px solid var(--line)}
table.ed td{padding:3px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.ed input{width:100%;min-width:56px;font-family:var(--f-mono);font-size:.85rem;padding:4px 6px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink)}
table.ed select{font-family:var(--f-body);font-size:.85rem;padding:4px 6px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);max-width:180px}
table.ed td.num{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.rm{border:none;background:none;color:var(--neg);cursor:pointer;font-size:1rem;padding:2px 6px}
.q{border:1.5px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.q p{font-weight:600}
.q .orig{font-family:var(--f-mono);font-size:.68rem;color:var(--steel);text-transform:uppercase;letter-spacing:.06em}
.ops{display:flex;flex-direction:column;gap:6px}
.op{text-align:left;font:inherit;padding:8px 12px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.op:hover:not([disabled]){border-color:var(--steel)}
.op.certa{border-color:var(--pos);background:var(--pos-fill)}
.op.errada{border-color:var(--neg);background:var(--neg-fill)}
.op[disabled]{cursor:default}
.expl{font-size:.92rem;color:var(--muted)}
.placar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--f-mono)}
.btn{font-family:var(--f-display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:1rem;padding:8px 16px;border:2px solid var(--ink);background:var(--ink);color:var(--sheet);cursor:pointer}
.btn.sec{background:none;color:var(--ink)}
.lista{display:flex;flex-direction:column;gap:14px}

.sig{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;overflow-anchor:none}
#sigSub,.subtabs{overflow-anchor:none}
@media (max-width:900px){.sig{grid-template-columns:1fr}.sig .side{order:2}}
.sig .side{display:flex;flex-direction:column;gap:14px;min-width:0}
.sig h4{margin:0 0 6px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip.on{border-color:var(--steel);background:var(--steel-soft);font-weight:600}
.chip[disabled]{opacity:.5;cursor:default}
.camadas{display:flex;flex-direction:column;gap:4px}

.mapa{min-width:0;display:flex;flex-direction:column;gap:8px}
.mapwrap{position:relative}
#sigMap{width:100%;height:480px;display:block;border:1.5px solid var(--line);touch-action:none;cursor:crosshair;background:var(--sheet)}

.mapbtns{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px}
.mapbtns button{width:34px;height:34px;font:600 1.1rem var(--f-mono);background:var(--sheet);color:var(--ink);border:1.5px solid var(--line);cursor:pointer}

.status{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px;font-variant-numeric:tabular-nums;min-height:2.6em;align-content:flex-start}
.info{font-size:.92rem;border-left:3px solid var(--amber);padding:8px 12px;background:var(--paper);min-height:2.4em;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.subtabs{border-bottom:1.5px solid var(--line);padding-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>.campo{flex:1 1 140px;min-width:0}
.campo input[type=number],.campo input[type=text],.campo input[type=file]{width:100%;font:inherit;padding:6px 8px;background:var(--sheet);color:var(--ink);border:1.5px solid var(--line)}
textarea.out{width:100%;min-height:170px;font-family:var(--f-mono);font-size:.8rem;padding:10px;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);resize:vertical}
.tbl-wrap.alto{max-height:320px;overflow:auto}
tr.selrow td{background:var(--amber-fill)}
.nota{font-size:.85rem;color:var(--muted)}
footer{font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* PWA */
.topo-acoes{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:600px){.topo-acoes{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;width:100%}.topo-acoes .stamp{text-align:left}}
.aviso{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:var(--ink);color:var(--sheet);font-size:.95rem;
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.aviso .btn{background:var(--amber);border-color:var(--amber);color:#1b2a3a}
.carregando{color:var(--muted);font-family:var(--f-mono)}
/* Conta */
.topo-bt{justify-content:flex-end}
#btConta.logado{background:var(--steel-soft);color:var(--ink);border-color:var(--steel);text-transform:none;font-family:var(--f-mono);font-size:.85rem;letter-spacing:0}
.form-conta{max-width:420px}
.form-conta .campo input[type=email],.form-conta .campo input[type=password]{width:100%;font:inherit;padding:8px 10px;background:var(--sheet);color:var(--ink);border:1.5px solid var(--line)}
.form-conta .campo input:focus{border-color:var(--steel)}
p.pill{margin:0;display:block;max-width:420px;font-family:var(--f-body);font-weight:600;font-size:.9rem}

</style>

  viga(L,q,P,a,N=400){

    return{RA,RB,xs,V,M,Mmax:M[iM],xM:xs[iM],Vmax:Math.max(Math.abs(RA),Math.abs(RB))};

  balanco(L,q,P,N=200){

  barras(Asf,bw){

  sapata(N,nspt,a0,b0){

  },
  area(pts){

  muro(H,b,B,phi,gs,gm){

  pluvial(a,hc,b,I,wcm,ycm,i,n){

      dPrat=Math.sqrt(4*A/Math.PI)*10,cond=[75,100,125,150,200,250].find(d=>d>=dPrat)||300;
    return{A,Q,S,P,Rh,Qc,ok:Qc>=Q,dPrat,cond};

  cpm(ts){
    const ids=ts.map(t=>t.id),by=Object.fromEntries(ts.map(t=>[t.id,t])),indeg={},succ={},pr={};
    ts.forEach(t=>{succ[t.id]=[];indeg[t.id]=0;pr[t.id]=[...new Set(t.pred)].filter(p=>by[p]&&p!==t.id)});
    ts.forEach(t=>pr[t.id].forEach(p=>{succ[p].push(t.id);indeg[t.id]++}));
    const ord=[],q=ids.filter(i=>!indeg[i]);
    while(q.length){const i=q.shift();ord.push(i);succ[i].forEach(s=>{if(--indeg[s]===0)q.push(s)})}
    if(ord.length<ts.length)return{erro:'Há um ciclo nas dependências: alguma tarefa acaba dependendo dela mesma.'};
    const ES={},EF={},LS={},LF={};
    ord.forEach(i=>{ES[i]=Math.max(0,...pr[i].map(p=>EF[p]));EF[i]=ES[i]+by[i].dur});
    const total=Math.max(0,...ids.map(i=>EF[i]));
    [...ord].reverse().forEach(i=>{LF[i]=succ[i].length?Math.min(...succ[i].map(s=>LS[s])):total;LS[i]=LF[i]-by[i].dur});
    const folga=Object.fromEntries(ids.map(i=>[i,LS[i]-ES[i]]));

  estaca(perfil,tipo,D,L){
    if(L<2||L>perfil.length)return{erro:`O comprimento precisa estar entre 2 m e a profundidade da sondagem (${perfil.length} m).`};
    const T=TIPOS_ESTACA[tipo],Dm=D/100,Ap=Math.PI*Dm*Dm/4,U=Math.PI*Dm,S=i=>SOLOS[perfil[i].solo],N=i=>Math.min(50,Math.max(0,perfil[i].N));
    const st=S(L-1),RpA=st.K*1000*N(L-1)/T.F1*Ap;let RlA=0;const fusteA=[];
    for(let i=0;i<L;i++){const s=S(i),r=U*s.a/100*s.K*1000*N(i)/T.F2;RlA+=r;fusteA.push(r)}
    const ip=[L-2,L-1,L].filter(i=>i>=0&&i<perfil.length),Np=ip.reduce((s,i)=>s+N(i),0)/ip.length,C=st.C;
    const RpD=T.alfa[st.g]*C*Np*Ap,fi=[];for(let i=0;i<L-2;i++)fi.push(Math.min(50,Math.max(3,perfil[i].N)));
    const Nl=fi.length?fi.reduce((a,b)=>a+b,0)/fi.length:3;let RlD=0;for(let i=0;i<L;i++)RlD+=T.beta[S(i).g]*10*(Nl/3+1)*U;
    const QA=(RpA+RlA)/2,QD=Math.min(RpD/4+RlD/1.3,(RpD+RlD)/2);

  pilarSec(b,h,fck,As,Nd,k=100){
    const fcd=fck/14,fyd=50/1.15,Es=21000,dp=Math.min(4,0.2*h),d=h-dp,sig=e=>Math.max(-fyd,Math.min(fyd,Es*e)),x2=0.0035/(0.0035+0.010)*d,
      sc=e=>e<=0?0:e>=0.002?0.85*fcd:0.85*fcd*(1-(1-e/0.002)**2),eps=(x,y)=>x>h?0.002*(x-y)/(x-3*h/7):x<=x2?0.010*(x-y)/(d-x):0.0035*(x-y)/x;

  pilar(b,h,fck,Nk,le){
    const bm=Math.min(b,h),gn=bm<19?1.95-0.05*bm:1,Nd=gn*1.4*Nk,fcd=fck/14,fyd=50/1.15,Ac=b*h,nu=Nd/(Ac*fcd);

// Núcleo do app: utilitários de desenho, estado, navegação, carregamento das disciplinas e recursos de PWA.
const VERSAO_APP='1.1.0';
const $=id=>document.getElementById(id);
const br=(n,d=2)=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const R$=n=>'R$ '+br(n);
const dec=s=>(String(s).split('.')[1]||'').length;
// helpers SVG (cores via variáveis de tema)
const T=(x,y,t,c='ink',ex='')=>`<text x="${x}" y="${y}" style="fill:var(--${c})" ${ex}>${t}</text>`;
const Ln=(x1,y1,x2,y2,c='ink',w=1,ex='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--${c});stroke-width:${w}" ${ex}/>`;
const SVG=(w,h,label,body)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="${label}">${body}</svg>`;
function diagram(xs,arr,L,x0,x1,y,h,label,flip){
  const max=Math.max(...arr.map(Math.abs))||1,sx=x=>x0+(x1-x0)*x/L,sy=v=>y-(flip?-1:1)*h*v/max;
  let pp=`M${sx(0)} ${y}`,pn=`M${sx(0)} ${y}`;
  xs.forEach((x,i)=>{pp+=` L${sx(x).toFixed(1)} ${sy(Math.max(arr[i],0)).toFixed(1)}`;pn+=` L${sx(x).toFixed(1)} ${sy(Math.min(arr[i],0)).toFixed(1)}`});
  pp+=` L${sx(L)} ${y}Z`;pn+=` L${sx(L)} ${y}Z`;
  return T(x0,y-h-14,label,'muted','font-size="10" letter-spacing="1"')+
    `<path d="${pp}" style="fill:var(--pos-fill);stroke:var(--pos);stroke-width:1.5"/><path d="${pn}" style="fill:var(--neg-fill);stroke:var(--neg);stroke-width:1.5"/>`+Ln(x0,y,x1,y,'ink',1);
}
const rng=(id,label,min,max,step,val,unit,hint='')=>`<div class="campo"><label for="${id}">${label} <output id="o_${id}"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}">${hint?`<small>${hint}</small>`:''}</div>`;
const sel=(id,label,opts,hint='')=>`<div class="campo"><label for="${id}">${label}</label><select id="${id}">${opts.map(([v,t,s])=>`<option value="${v}"${s?' selected':''}>${t}</option>`).join('')}</select>${hint?`<small>${hint}</small>`:''}</div>`;
const tiles=arr=>`<div class="result">${arr.map(([l,v,d])=>`<div class="res${d?' destaque':''}"><span>${l}</span><b>${v}</b></div>`).join('')}</div>`;
const V_=id=>+$(id).value;
const T_=(t,x,y)=>T(x,y,t,'muted','font-size="10" letter-spacing="1"');
function outs(){document.querySelectorAll('.ctrl input[type=range]').forEach(i=>{const o=$('o_'+i.id);if(o)o.textContent=br(+i.value,dec(i.step))+' '+i.dataset.unit})}
const simWrap=(ctrl,extraCtrl='')=>`<div class="sim"><div class="ctrl">${ctrl}<div id="tiles"></div>${extraCtrl}</div><div class="draw" id="draw"></div></div><h3>Memorial de cálculo</h3><div class="memorial" id="memorial"></div>`;


const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const cssVar=k=>getComputedStyle(document.documentElement).getPropertyValue('--'+k).trim();
const rgbOf=(()=>{let cx;return c=>{try{if(!cx){const cv=document.createElement('canvas');cv.width=cv.height=1;cx=cv.getContext('2d',{willReadFrequently:true})}cx.clearRect(0,0,1,1);cx.fillStyle=c;cx.fillRect(0,0,1,1);return [...cx.getImageData(0,0,1,1).data]}catch(e){return[200,60,40,255]}}})();
function copiar(el,msg){const t=el.value!==undefined?el.value:el.textContent;
  const fb=()=>{try{if(el.select){el.focus();el.select()}else{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}}catch(e){}msg.textContent='Texto selecionado. Use Ctrl+C ou o menu Copiar.'};
  try{navigator.clipboard.writeText(t).then(()=>{msg.textContent='Copiado.'},fb)}catch(e){fb()}}

// Download de arquivo (funciona no app publicado; dentro do Claude o navegador bloqueia)
const podeBaixar=!window.EMBUTIDO;

function qBlock(q,i,resp,onPick,orig){
  const d=document.createElement('div');d.className='q';
  d.innerHTML=`${orig?`<span class="orig">${orig}</span>`:''}<p>${i+1}. ${q.p}</p><div class="ops"></div><div class="expl" hidden>${q.e}</div>`;
  const ops=d.querySelector('.ops');
  q.o.forEach((t,j)=>{const b=document.createElement('button');b.className='op';b.textContent=t;b.onclick=()=>onPick(j);ops.appendChild(b)});
  if(resp!==undefined){[...ops.children].forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('certa');else if(j===resp)b.classList.add('errada')});d.querySelector('.expl').hidden=false}
  return d;
}

}

function aviso(html,fixo){const a=$('aviso');if(!a||(aviso.fixo&&!fixo&&!a.hidden))return;aviso.fixo=!!fixo;a.innerHTML=html;a.hidden=false;clearTimeout(aviso._t);if(!fixo)aviso._t=setTimeout(()=>{a.hidden=true},5000)}
function iniciarPWA(){
  if(window.EMBUTIDO)return;
  let adiado=null;const bi=$('btInstalar');
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();adiado=e;if(bi)bi.hidden=false});
  if(bi)bi.onclick=async()=>{if(!adiado)return;adiado.prompt();try{await adiado.userChoice}catch(e){}adiado=null;bi.hidden=true};
  window.addEventListener('appinstalled',()=>{if(bi)bi.hidden=true;aviso('App instalado. Ele agora abre direto da tela inicial, mesmo sem internet.')});
  window.addEventListener('offline',()=>aviso('Sem internet. Você continua usando a versão salva no aparelho.'));
  window.addEventListener('online',()=>aviso('Conexão de volta.'));
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  let pediuAtualizar=false,recarregando=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!pediuAtualizar||recarregando)return;recarregando=true;location.reload()});
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const oferecer=w=>{aviso('Nova versão da Academia disponível. <button class="btn" id="btAtualizar">Atualizar agora</button>',true);$('btAtualizar').onclick=()=>{pediuAtualizar=true;$('btAtualizar').disabled=true;w.postMessage('pular')}};
    if(reg.waiting&&navigator.serviceWorker.controller)oferecer(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)oferecer(w)})});
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(()=>{});
}
function iniciar(){load();render();if(typeof Conta!=='undefined')Conta.iniciar();iniciarPWA()}

  impMsg(t,ok){const m=$('sigImpMsg');if(m)m.innerHTML=`<span class="pill ${ok?'ok':'alerta'}">${t}</span>`},

  lerCSV(t){const r=GEO.parseCSV(t);if(r.erro)throw new Error(r.erro);const out=r.geo?this.paraUTM(r.pts):{pts:r.pts};out.aviso=[r.semZ?`${r.semZ} ponto(s) sem cota ficaram com cota 0.`:'',r.ruins?`${r.ruins} linha(s) ignorada(s).`:''].join(' ').trim();return out},

    const add=(c,pr,i)=>{const nome=pr.nome||pr.name||pr.ponto||pr.id||'P'+String(i).padStart(2,'0'),z=+(c[2]??pr.cota??pr.z??pr.elevation??0)||0;(Math.abs(c[0])>180?pts:geo).push(Math.abs(c[0])>180?{nome,E:c[0],N:c[1],z}:{nome,lat:c[1],lon:c[0],z})};
    fs.forEach(f=>{const g=f.geometry,pr=f.properties||{};if(!g)return;if(g.type==='Point')add(g.coordinates,pr,pts.length+geo.length+1);else if(g.type==='MultiPoint')g.coordinates.forEach(c=>add(c,pr,pts.length+geo.length+1));
      else if(!ring&&(g.type==='Polygon'||g.type==='MultiPolygon')){ring=g.type==='Polygon'?g.coordinates[0]:g.coordinates[0][0]}});
    let out={pts},proj=null;if(geo.length){out=this.paraUTM(geo);out.pts=pts.concat(out.pts)}
    if(ring){ring=ring.slice();const a=ring[0],b=ring[ring.length-1];if(a[0]===b[0]&&a[1]===b[1])ring.pop();
      if(Math.abs(ring[0][0])>180)out.lote=ring.map(c=>[c[0],c[1]]);else{const z=out.zona||GEO.zona(ring[0][0]),sul=ring[0][1]<0;out.zona=z;out.sul=sul;out.lote=ring.map(c=>{const r=GEO.direta(c[1],c[0],z);return[+r.E.toFixed(3),+r.N.toFixed(3)]})}}

  lerKML(t){const d=new DOMParser().parseFromString(t,'application/xml');if(d.getElementsByTagName('parsererror').length)throw new Error('o KML tem erro de formatação');
    const cs=s=>s.trim().split(/\s+/).map(q=>q.split(',').map(Number)).filter(c=>c.length>=2&&!isNaN(c[0])&&!isNaN(c[1])),geo=[];let ring=null;
    [...d.getElementsByTagName('Placemark')].forEach((pm,i)=>{const nm=pm.getElementsByTagName('name')[0],nome=nm?nm.textContent.trim():'P'+String(i+1).padStart(2,'0'),pt=pm.getElementsByTagName('Point')[0],pg=pm.getElementsByTagName('Polygon')[0];
      if(pt){const c=cs(pt.getElementsByTagName('coordinates')[0]?.textContent||'')[0];if(c)geo.push({nome,lon:c[0],lat:c[1],z:c[2]||0})}

    try{if(/\.kml$/i.test(nome)||t.startsWith('<'))r=this.lerKML(t);else if(/\.(geo)?json$/i.test(nome)||t.startsWith('{'))r=this.lerGeoJSON(JSON.parse(t));else r=this.lerCSV(t)}catch(e){return this.impMsg('Não consegui ler: '+e.message,false)}

// RM-01 · Resistência dos Materiais
Academia.modulo('rm',{
teoria:`<p>Pense numa tábua apoiada em dois tijolos com alguém em pé no meio. A tábua enverga, e os tijolos empurram de volta. Resistência dos Materiais estuda exatamente isso: quanto cada peça sofre por dentro quando recebe carga.</p>
<div class="cols"><div class="conceito"><h4>Reações de apoio</h4><p>A força que cada apoio devolve para manter a viga parada. A soma das reações é igual à soma das cargas.</p></div>
<div class="conceito"><h4>Esforço cortante (V)</h4><p>A tendência de uma parte da viga escorregar em relação à outra, como uma tesoura. Medido em kN.</p></div>
<div class="conceito"><h4>Momento fletor (M)</h4><p>A tendência de a viga dobrar. É ele que define quanto aço vai embaixo da viga. Medido em kN·m.</p></div></div>
<h3>As três equações de equilíbrio</h3><div class="formula">ΣFx = 0  |  ΣFy = 0  |  ΣM = 0</div>
<p>Em palavras: nada anda para os lados, nada sobe ou desce, e nada gira. Com essas três regras você encontra as reações de qualquer viga biapoiada.</p>
<h3>Fórmulas que você vai usar muito</h3>
<div class="formula">Carga distribuída q em vão L:  R = q·L/2   Mmáx = q·L²/8</div>
<div class="formula">Carga concentrada P no meio:  R = P/2   Mmáx = P·L/4</div>
<div class="dica"><b>Regra de ouro</b>Onde o cortante passa por zero, o momento é máximo. É ali que a viga mais sofre.</div>`,
exemplo:`<h3>Viga de 5 m com laje apoiada em cima</h3><p>Uma viga biapoiada de 5,00 m recebe uma carga distribuída de 12 kN/m (peso da laje, revestimento e uso). Quais são as reações e o momento máximo?</p>
<ol class="passos"><li><b>Carga total.</b> 12 × 5 = <b>60 kN</b>.</li><li><b>Reações.</b> A carga é simétrica, então cada apoio pega metade: R<sub>A</sub> = R<sub>B</sub> = <b>30 kN</b>.</li>
<li><b>Cortante.</b> Começa em +30 kN no apoio A, cai em linha reta e chega a −30 kN no apoio B. Passa por zero no meio (x = 2,50 m).</li>
<li><b>Momento máximo.</b> M = q·L²/8 = 12 × 25 / 8 = <b>37,5 kN·m</b>.</li>
<li><b>Na obra.</b> Esse valor vai para o dimensionamento da armadura (NBR 6118), com γf = 1,4 → Md = 52,5 kN·m. Veja o módulo CA-03.</li></ol>
<div class="dica"><b>Confira no simulador</b>Coloque L = 5 m, q = 12 kN/m e P = 0. Os números devem bater.</div>`,
sim:{html:()=>simWrap(rng('inL','Vão L',2,10,0.5,5,'m')+rng('inQ','Carga distribuída q',0,30,1,12,'kN/m','Peso de laje, parede, revestimento')+rng('inP','Carga concentrada P',0,80,5,20,'kN','Pilar apoiado, equipamento')+rng('inA','Posição de P',0,100,5,40,'% do vão','Medida a partir do apoio A')),
update(){const L=V_('inL'),q=V_('inQ'),P=V_('inP'),a=L*V_('inA')/100,r=calc.viga(L,q,P,a);

const W=640,x0=50,x1=590,sx=x=>x0+(x1-x0)*x/L,by=120;let s=T(x0,18,'ESQUEMA ESTÁTICO','muted','font-size="10" letter-spacing="1"');
if(q>0){const n=Math.max(6,Math.round(L*2));for(let i=0;i<=n;i++){const x=sx(L*i/n);s+=Ln(x,70,x,by-8,'steel',1.2)+`<path d="M${x-3} ${by-12} L${x} ${by-6} L${x+3} ${by-12}" style="fill:var(--steel)"/>`}s+=Ln(x0,70,x1,70,'steel',1.5)+T(320,62,`q = ${q} kN/m`,'steel','text-anchor="middle"')}

s+=`<rect x="${x0}" y="${by-4}" width="${x1-x0}" height="10" style="fill:var(--ink)"/><path d="M${x0} ${by+6} l-10 16 h20z" style="fill:none;stroke:var(--ink);stroke-width:1.5"/><path d="M${x1} ${by+6} l-10 16 h20z" style="fill:none;stroke:var(--ink);stroke-width:1.5"/><circle cx="${x1}" cy="${by+26}" r="3" style="fill:none;stroke:var(--ink)"/>`;
s+=T(x0,by+42,'RA = '+br(r.RA),'ink','text-anchor="middle"')+T(x1,by+42,'RB = '+br(r.RB),'ink','text-anchor="middle"')+Ln(x0,by+56,x1,by+56,'line')+T(320,by+70,`L = ${br(L)} m`,'muted','text-anchor="middle"');

$('draw').innerHTML=SVG(W,560,'Viga biapoiada com diagramas de cortante e momento',s);
$('memorial').textContent=`1) Carga total      = q·L + P = ${br(q)}×${br(L)} + ${br(P)} = ${br(q*L+P)} kN
2) ΣM em A = 0      → RB = q·L/2 + P·a/L = ${br(q*L/2)} + ${br(P)}×${br(a)}/${br(L)} = ${br(r.RB)} kN
3) ΣFy = 0          → RA = ${br(q*L+P)} − ${br(r.RB)} = ${br(r.RA)} kN
4) V(x) = RA − q·x − P (depois de x = ${br(a)} m)
5) M máx em x = ${br(r.xM)} m (onde V muda de sinal) = ${br(r.Mmax)} kN·m
6) Valor de cálculo  Md = 1,4 × ${br(r.Mmax)} = ${br(1.4*r.Mmax)} kN·m  (γf, NBR 6118)`;}}
});

// IS-02 · Isostática
Academia.modulo('is',{
teoria:`<p>Toda estrutura precisa estar presa ao chão de algum jeito. O tipo de apoio define quais movimentos ficam impedidos, e cada movimento impedido gera uma reação.</p>
<div class="cols"><div class="conceito"><h4>Apoio móvel (1º gênero)</h4><p>Rolete. Impede só o movimento vertical: 1 reação.</p></div>
<div class="conceito"><h4>Apoio fixo (2º gênero)</h4><p>Articulação. Impede vertical e horizontal, mas deixa girar: 2 reações.</p></div>
<div class="conceito"><h4>Engaste (3º gênero)</h4><p>Peça chumbada. Impede tudo, inclusive girar: 2 forças e 1 momento.</p></div></div>
<h3>Isostática, hipostática ou hiperestática?</h3>
<p>No plano temos 3 equações de equilíbrio. Se a estrutura tem exatamente as reações necessárias (3, bem distribuídas), ela é <b>isostática</b> e resolvemos só com estática. Menos que isso, ela se move (<b>hipostática</b>). Mais que isso, sobra apoio (<b>hiperestática</b>) e precisamos de outros métodos.</p>
<h3>Viga em balanço (engastada)</h3>
<div class="formula">Reação vertical: R = q·L + P     Momento no engaste: M = q·L²/2 + P·L</div>
<div class="dica"><b>Atenção na obra</b>No balanço o momento é negativo: a parte de cima é tracionada. A armadura principal vai em cima. Marquises que desabam quase sempre têm aço mal posicionado ou corroído.</div>`,
exemplo:`<h3>Marquise de 1,50 m</h3><p>Uma marquise engastada na viga da fachada tem 1,50 m de balanço, carga distribuída de 6 kN/m (laje, impermeabilização e sobrecarga) e uma platibanda na ponta que pesa 2 kN.</p>
<ol class="passos"><li><b>Reação vertical.</b> R = 6 × 1,5 + 2 = <b>11 kN</b>.</li>
<li><b>Momento da carga distribuída.</b> q·L²/2 = 6 × 2,25 / 2 = 6,75 kN·m.</li>
<li><b>Momento da carga na ponta.</b> P·L = 2 × 1,5 = 3,00 kN·m.</li>
<li><b>Momento no engaste.</b> M = 6,75 + 3,00 = <b>9,75 kN·m</b> (negativo: tração em cima).</li>
<li><b>Leitura.</b> O momento é máximo junto à parede e zero na ponta. É justamente junto à parede que a armadura superior precisa estar bem ancorada.</li></ol>
<div class="dica"><b>Confira no simulador</b>L = 1,5 m, q = 6 kN/m, P = 2 kN.</div>`,
sim:{html:()=>simWrap(rng('bL','Balanço L',0.5,5,0.1,1.5,'m')+rng('bQ','Carga distribuída q',0,20,0.5,6,'kN/m')+rng('bP','Carga na ponta P',0,50,1,2,'kN','Platibanda, guarda-corpo')),
update(){const L=V_('bL'),q=V_('bQ'),P=V_('bP'),r=calc.balanco(L,q,P);
$('tiles').innerHTML=tiles([['Reação R',br(r.R)+' kN'],['Cortante no engaste',br(r.R)+' kN'],['Momento no engaste',br(-r.M0)+' kN·m',1],['Md (×1,4)',br(-1.4*r.M0)+' kN·m']]);
const x0=80,x1=590,sx=x=>x0+(x1-x0)*x/L,by=120;
let s=T(30,18,'ESQUEMA ESTÁTICO','muted','font-size="10" letter-spacing="1"');
s+=`<rect x="${x0-24}" y="${by-50}" width="24" height="100" style="fill:var(--line)"/>`;for(let i=0;i<8;i++)s+=Ln(x0-24,by-46+i*12,x0-4,by-56+i*12,'muted',1);
if(q>0){const n=10;for(let i=0;i<=n;i++){const x=sx(L*i/n);s+=Ln(x,70,x,by-8,'steel',1.2)+`<path d="M${x-3} ${by-12} L${x} ${by-6} L${x+3} ${by-12}" style="fill:var(--steel)"/>`}s+=Ln(x0,70,x1,70,'steel',1.5)+T(335,62,`q = ${br(q,1)} kN/m`,'steel','text-anchor="middle"')}
if(P>0){s+=Ln(x1,34,x1,by-6,'amber',3)+`<path d="M${x1-7} ${by-16} L${x1} ${by-4} L${x1+7} ${by-16}Z" style="fill:var(--amber)"/>`+T(x1-8,42,`P = ${P} kN`,'amber-ink','text-anchor="end" font-weight="600"')}
s+=`<rect x="${x0}" y="${by-4}" width="${x1-x0}" height="10" style="fill:var(--ink)"/>`+T(x0,by+30,'Engaste','muted','text-anchor="middle"')+Ln(x0,by+44,x1,by+44,'line')+T(335,by+58,`L = ${br(L)} m`,'muted','text-anchor="middle"');
s+=diagram(r.xs,r.V,L,x0,x1,320,60,'ESFORÇO CORTANTE V (kN)')+T(x0-6,264,br(r.R,1),'pos','text-anchor="end"');
s+=diagram(r.xs,r.M,L,x0,x1,470,70,'MOMENTO FLETOR M (kN·m) — tração em cima',true)+T(x0-6,404,br(-r.M0,1),'neg','text-anchor="end" font-weight="600"');
$('draw').innerHTML=SVG(640,500,'Viga em balanço com diagramas',s);
$('memorial').textContent=`1) ΣFy = 0  → R = q·L + P = ${br(q)}×${br(L)} + ${br(P)} = ${br(r.R)} kN
2) ΣM no engaste = 0
   M = q·L²/2 + P·L = ${br(q)}×${br(L*L)}/2 + ${br(P)}×${br(L)}
   M = ${br(q*L*L/2)} + ${br(P*L)} = ${br(r.M0)} kN·m  (negativo: tração em cima)
3) Valor de cálculo Md = 1,4 × ${br(r.M0)} = ${br(1.4*r.M0)} kN·m`;}}
});

// CA-03 · Concreto Armado
Academia.modulo('ca',{
teoria:`<p>O concreto aguenta muito bem ser apertado (compressão), mas trinca fácil quando é puxado (tração resiste só cerca de 10%). Por isso colocamos aço onde a peça é tracionada. Juntos, viram concreto armado.</p>
<div class="cols"><div class="conceito"><h4>Coeficientes de segurança</h4><p>Cargas × 1,4 (γf). Resistência do concreto ÷ 1,4 (γc). Resistência do aço ÷ 1,15 (γs).</p></div>
<div class="conceito"><h4>Aço CA-50</h4><p>fyk = 500 MPa. De cálculo: fyd = 500/1,15 ≈ 435 MPa = 43,5 kN/cm².</p></div>
<div class="conceito"><h4>Linha neutra (x)</h4><p>Divide a parte comprimida da tracionada. A norma pede x/d ≤ 0,45 para a viga avisar antes de romper (ductilidade).</p></div></div>
<h3>Fórmulas do dimensionamento (seção retangular)</h3>
<div class="formula">Md = 1,4·Mk     fcd = fck/1,4     d ≈ h − 4 cm</div>
<div class="formula">x = 1,25·d·[1 − √(1 − Md / (0,425·bw·d²·fcd))]</div>
<div class="formula">As = Md / [fyd·(d − 0,4·x)]     As,mín = ρmín·bw·h (0,15% até C30)</div>
<div class="dica"><b>Dica de projeto</b>Se x/d passar de 0,45, não adianta só pôr mais aço. Aumente a altura da viga ou use concreto mais resistente.</div>`,
exemplo:`<h3>Viga 20 × 50 com Mk = 100 kN·m</h3><p>Concreto C25 (fck = 25 MPa), aço CA-50, cobrimento e estribo somando cerca de 4 cm até o centro da barra.</p>
<ol class="passos"><li><b>Altura útil.</b> d = 50 − 4 = <b>46 cm</b>.</li>
<li><b>Momento de cálculo.</b> Md = 1,4 × 100 = 140 kN·m = <b>14.000 kN·cm</b>.</li>
<li><b>Resistência de cálculo.</b> fcd = 25 / 1,4 = 17,86 MPa = <b>1,786 kN/cm²</b>.</li>
<li><b>Linha neutra.</b> x = 1,25 × 46 × [1 − √(1 − 14000/(0,425 × 20 × 46² × 1,786))] ≈ <b>14,3 cm</b>. x/d = 0,31 ≤ 0,45 ✓</li>
<li><b>Armadura.</b> As = 14000 / [43,48 × (46 − 0,4 × 14,3)] ≈ <b>8,0 cm²</b> → <b>4 φ 16 mm</b> (8,04 cm²).</li></ol>
<div class="dica"><b>Confira no simulador</b>bw = 20, h = 50, fck = 25 e Mk = 100.</div>`,
sim:{html:()=>simWrap(rng('cB','Largura bw',12,40,1,20,'cm')+rng('cH','Altura h',25,90,5,50,'cm')+sel('cF','Concreto',[[20,'C20 (fck 20 MPa)'],[25,'C25 (fck 25 MPa)',1],[30,'C30 (fck 30 MPa)'],[35,'C35'],[40,'C40'],[45,'C45'],[50,'C50']])+rng('cM','Momento Mk',5,400,5,100,'kN·m','Valor característico (sem majorar)')),
update(){const bw=V_('cB'),h=V_('cH'),fck=V_('cF'),Mk=V_('cM'),r=calc.flexao(bw,h,fck,Mk);
if(r.inviavel){$('tiles').innerHTML=tiles([['Md',br(r.Md/100)+' kN·m'],['d',br(r.d,1)+' cm'],['Situação','Seção pequena',1],['As','—']])+'<span class="pill alerta">Seção não suporta o momento. Aumente h ou bw.</span>';
$('draw').innerHTML='';$('memorial').textContent=`Md = ${br(r.Md)} kN·cm é maior que a capacidade da seção (termo da raiz negativo).\nAumente a altura h, a largura bw ou o fck.`;return;}
const b=calc.barras(r.Asf,bw);
$('tiles').innerHTML=tiles([['Md',br(r.Md/100)+' kN·m'],['x / d',br(r.xd,3)],['As necessária',br(r.Asf)+' cm²',1],['Sugestão',`${b.n} φ ${br(b.f,b.f%1?1:0)} mm`]])+(r.ok?'<span class="pill ok">x/d ≤ 0,45 · ductilidade OK</span>':'<span class="pill alerta">x/d &gt; 0,45 · aumente a seção</span>')+(b.camadas>1?' <span class="pill alerta">Barras em 2 camadas</span>':'');
const sc=Math.min(300/h,240/bw),W=bw*sc,H=h*sc,ox=200-W/2+40,oy=30,xs=r.x*sc*0.8;
let s=`<rect x="${ox}" y="${oy}" width="${W}" height="${H}" style="fill:var(--steel-soft);stroke:var(--ink);stroke-width:2"/>`;
s+=`<rect x="${ox}" y="${oy}" width="${W}" height="${xs}" style="fill:var(--neg-fill)"/>`+Ln(ox-10,oy+r.x*sc,ox+W+10,oy+r.x*sc,'neg',1.5,'stroke-dasharray="6 4"')+T(ox+W+14,oy+r.x*sc+4,'LN  x = '+br(r.x,1)+' cm','neg');
s+=T(ox+W+14,oy+xs/2+4,'zona comprimida (0,8x)','muted');
s+=`<rect x="${ox+1.5*sc}" y="${oy+1.5*sc}" width="${W-3*sc}" height="${H-3*sc}" style="fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 2"/>`;
const n=b.n,cam=b.camadas,porCam=Math.ceil(n/cam),rr=Math.max(3,b.f/10/2*sc),esp=(W-6*sc)/(Math.max(porCam,2)-1||1);
for(let k=0;k<n;k++){const c=Math.floor(k/porCam),i=k%porCam;const cx=ox+3*sc+(porCam>1?i*(W-6*sc)/(porCam-1):(W-6*sc)/2),cy=oy+H-3*sc-c*(rr*2+2.5*sc);s+=`<circle cx="${cx}" cy="${cy}" r="${rr}" style="fill:var(--amber);stroke:var(--ink)"/>`}
s+=`<circle cx="${ox+3*sc}" cy="${oy+3*sc}" r="${Math.max(2.5,0.5*sc)}" style="fill:var(--muted)"/><circle cx="${ox+W-3*sc}" cy="${oy+3*sc}" r="${Math.max(2.5,0.5*sc)}" style="fill:var(--muted)"/>`;
s+=Ln(ox,oy+H+16,ox+W,oy+H+16,'muted')+T(ox+W/2,oy+H+30,'bw = '+bw+' cm','muted','text-anchor="middle"')+Ln(ox-18,oy,ox-18,oy+H,'muted')+T(ox-24,oy+H/2,'h = '+h,'muted','text-anchor="end"');
s+=T(ox+W+14,oy+H-3*sc+4,`${n} φ ${br(b.f,b.f%1?1:0)} (${br(b.area)} cm²)`,'amber-ink','font-weight="600"');
$('draw').innerHTML=SVG(640,Math.max(380,oy+H+50),'Seção transversal da viga com armadura',s);
$('memorial').textContent=`1) d = h − 4 = ${h} − 4 = ${br(r.d,1)} cm
2) Md = 1,4 × ${br(Mk)} kN·m = ${br(r.Md,0)} kN·cm
3) fcd = ${fck}/1,4 = ${br(r.fcd,3)} kN/cm²   fyd = 50/1,15 = ${br(r.fyd,2)} kN/cm²
4) Md/(0,425·bw·d²·fcd) = ${br(r.k,4)}
   x = 1,25 × ${br(r.d,1)} × [1 − √(1 − ${br(r.k,4)})] = ${br(r.x,2)} cm
5) x/d = ${br(r.xd,3)} ${r.ok?'≤ 0,45 ✓':'> 0,45 ✗ (aumente a seção)'}
6) As = ${br(r.Md,0)} / [${br(r.fyd,2)} × (${br(r.d,1)} − 0,4 × ${br(r.x,2)})] = ${br(r.As)} cm²
7) As,mín = ${br(ROMIN[fck],3)}% × ${bw} × ${h} = ${br(r.Asmin)} cm²  → adotar ${br(r.Asf)} cm²
8) Sugestão: ${n} φ ${br(b.f,b.f%1?1:0)} mm = ${br(b.area)} cm² (${b.camadas} camada${b.camadas>1?'s':''})`;}}
});

// GT-04 · Fundações e Solos
Academia.modulo('gt',{
teoria:`<p>Antes de fundar, precisamos saber o quanto o solo aguenta. A sondagem SPT (NBR 6484) crava um amostrador com golpes de um martelo de 65 kg. O número de golpes para os últimos 30 cm é o N<sub>SPT</sub>: quanto maior, mais resistente o solo.</p>
<div class="cols"><div class="conceito"><h4>Tensão admissível</h4><p>Quanto o solo aguenta por metro quadrado sem romper nem recalcar demais. Medida em kPa (kN/m²).</p></div>
<div class="conceito"><h4>Fundação rasa</h4><p>Sapatas e radier: espalham a carga perto da superfície, quando o solo bom está raso.</p></div>
<div class="conceito"><h4>Fundação profunda</h4><p>Estacas e tubulões: levam a carga até camadas mais resistentes lá embaixo.</p></div></div>
<h3>Pré-dimensionamento de sapata</h3>
<div class="formula">σadm (MPa) ≈ NSPT / 50   (estimativa para 5 ≤ N ≤ 20)</div>
<div class="formula">Área = 1,05·N / σadm     (5% para peso próprio da sapata e solo)</div>
<div class="formula">Abas iguais:  L − B = a0 − b0     Sapata rígida: h ≥ (L − a0)/3</div>
<div class="dica"><b>Responsabilidade</b>Essa estimativa serve para estudo e pré-dimensionamento. Fundação de verdade exige sondagem e projeto conforme a NBR 6122.</div>`,
exemplo:`<h3>Pilar 20 × 40 com 800 kN</h3><p>A sondagem indicou N<sub>SPT</sub> = 12 na cota de apoio. O pilar mede 20 × 40 cm.</p>
<ol class="passos"><li><b>Tensão admissível.</b> 12 / 50 = 0,24 MPa = <b>240 kPa</b>.</li>
<li><b>Área necessária.</b> A = 1,05 × 800 / 240 = <b>3,50 m²</b>.</li>
<li><b>Abas iguais.</b> L − B = 0,40 − 0,20 = 0,20 m. Resolvendo B × (B + 0,20) = 3,50 → B ≈ 1,77 → <b>B = 1,80 m</b> e <b>L = 2,00 m</b>.</li>
<li><b>Verificação.</b> σ = 840 / (1,80 × 2,00) = <b>233 kPa ≤ 240 kPa</b> ✓</li>
<li><b>Altura.</b> h ≥ (2,00 − 0,40) / 3 = 0,53 → <b>h = 0,55 m</b>.</li></ol>
<div class="dica"><b>Confira no simulador</b>N = 800 kN, NSPT = 12, pilar 40 × 20.</div>`,
sim:{html:()=>simWrap(rng('gN','Carga do pilar N',100,3000,50,800,'kN')+rng('gS','NSPT na cota de apoio',5,20,1,12,'golpes')+rng('gA','Pilar: lado maior a0',15,100,5,40,'cm')+rng('gB','Pilar: lado menor b0',15,40,5,20,'cm')),
update(){const N=V_('gN'),ns=V_('gS'),a0=Math.max(V_('gA'),V_('gB')),b0=Math.min(V_('gA'),V_('gB')),r=calc.sapata(N,ns,a0,b0);
$('tiles').innerHTML=tiles([['σ adm',br(r.sadm,0)+' kPa'],['Área necessária',br(r.A)+' m²'],['Sapata B × L',br(r.B)+' × '+br(r.L)+' m',1],['Altura h',br(r.h)+' m']])+(r.sig<=r.sadm?`<span class="pill ok">σ = ${br(r.sig,0)} kPa ≤ σadm</span>`:'<span class="pill alerta">Tensão acima da admissível</span>');
const sc=Math.min(260/r.L,200/r.B),Lw=r.L*sc,Bw=r.B*sc,ox=40+(260-Lw)/2,oy=40+(200-Bw)/2,pa=a0/100*sc,pb=b0/100*sc;
let s=T(40,20,'PLANTA','muted','font-size="10" letter-spacing="1"')+`<rect x="${ox}" y="${oy}" width="${Lw}" height="${Bw}" style="fill:var(--soil-fill);stroke:var(--ink);stroke-width:2"/>`;
s+=`<rect x="${ox+Lw/2-pa/2}" y="${oy+Bw/2-pb/2}" width="${pa}" height="${pb}" style="fill:var(--ink)"/>`;
s+=Ln(ox,oy+Bw+14,ox+Lw,oy+Bw+14,'muted')+T(ox+Lw/2,oy+Bw+28,'L = '+br(r.L)+' m','ink','text-anchor="middle"')+Ln(ox+Lw+14,oy,ox+Lw+14,oy+Bw,'muted')+T(ox+Lw+20,oy+Bw/2+4,'B = '+br(r.B)+' m','ink');
const aba=(r.L-a0/100)/2;s+=T(ox+aba*sc/2,oy+Bw/2+4,'aba '+br(aba),'muted','text-anchor="middle" font-size="9"');
// corte
const cx=420,cy=40,cs=Math.min(140/r.L,120/(r.h+0.6)),cl=r.L*cs,ch=r.h*cs;
s+=T(cx,20,'CORTE','muted','font-size="10" letter-spacing="1"');
s+=`<rect x="${cx-10}" y="${cy+60}" width="${cl+20}" height="${ch+70}" style="fill:var(--soil-fill)"/>`;
s+=`<path d="M${cx} ${cy+60+ch*0.6+40} L${cx} ${cy+60+ch+40} L${cx+cl} ${cy+60+ch+40} L${cx+cl} ${cy+60+ch*0.6+40} L${cx+cl/2+a0/200*cs+4} ${cy+100} L${cx+cl/2-a0/200*cs-4} ${cy+100}Z" style="fill:var(--steel-soft);stroke:var(--ink);stroke-width:2"/>`;
s+=`<rect x="${cx+cl/2-a0/200*cs}" y="${cy}" width="${a0/100*cs}" height="100" style="fill:var(--ink)"/>`;
s+=Ln(cx+cl+8,cy+100,cx+cl+8,cy+100+ch,'muted')+T(cx+cl+12,cy+100+ch/2+4,'h = '+br(r.h),'ink');
s+=T(cx+cl/2,cy+60+ch+60,`NSPT = ${ns} · σadm = ${br(r.sadm,0)} kPa`,'soil','text-anchor="middle"');
$('draw').innerHTML=SVG(640,300,'Planta e corte da sapata isolada',s);
$('memorial').textContent=`1) σadm ≈ NSPT/50 = ${ns}/50 = ${br(ns/50,2)} MPa = ${br(r.sadm,0)} kPa
2) A = 1,05 × N / σadm = 1,05 × ${br(N,0)} / ${br(r.sadm,0)} = ${br(r.A,3)} m²
3) Abas iguais: L − B = a0 − b0 = ${br(a0/100)} − ${br(b0/100)} = ${br((a0-b0)/100)} m
   B·(B + ${br((a0-b0)/100)}) = ${br(r.A,3)} → B = ${br(r.B)} m · L = ${br(r.L)} m (múltiplos de 5 cm)
4) σ = 1,05 × ${br(N,0)} / (${br(r.B)} × ${br(r.L)}) = ${br(r.sig,1)} kPa ${r.sig<=r.sadm?'≤':'>'} ${br(r.sadm,0)} kPa
5) Sapata rígida: h ≥ (L − a0)/3 = ${br((r.L-a0/100)/3,3)} m → h = ${br(r.h)} m`;}}
});

// HD-05 · Hidráulica
Academia.modulo('hd',{
teoria:`<p>Quando a água anda dentro do cano, ela esfrega nas paredes e perde energia. Essa perda se chama <b>perda de carga</b> e aparece como pressão a menos na torneira.</p>
<div class="cols"><div class="conceito"><h4>Vazão (Q)</h4><p>Quanto de água passa por segundo. Em instalações prediais, usamos L/s.</p></div>
<div class="conceito"><h4>Velocidade (v)</h4><p>Pela continuidade, Q = v·A. Cano fino com muita vazão vira água rápida, barulho e golpe de aríete.</p></div>
<div class="conceito"><h4>Rugosidade (C)</h4><p>Cano liso perde menos. PVC tem C ≈ 150; ferro galvanizado velho, bem menos.</p></div></div>
<h3>Equações</h3>
<div class="formula">Continuidade:  v = 4·Q / (π·D²)</div>
<div class="formula">Hazen-Williams:  J = 10,643 · Q^1,85 / (C^1,85 · D^4,87)    (J em m/m, Q em m³/s, D em m)</div>
<div class="formula">Perda total no trecho:  hf = J · L</div>
<div class="dica"><b>Limite da norma</b>A NBR 5626 limita a velocidade em 3 m/s nas tubulações de água fria. Acima disso, aumente o diâmetro.</div>`,
exemplo:`<h3>Ramal de 30 m em PVC de 25 mm</h3><p>Um trecho de 30 m de PVC (C = 150) com diâmetro interno de 25 mm leva 0,5 L/s para um banheiro.</p>
<ol class="passos"><li><b>Velocidade.</b> v = 4 × 0,0005 / (π × 0,025²) = <b>1,02 m/s</b> ≤ 3 m/s ✓</li>
<li><b>Perda unitária.</b> J = 10,643 × 0,0005<sup>1,85</sup> / (150<sup>1,85</sup> × 0,025<sup>4,87</sup>) ≈ <b>0,050 m/m</b>.</li>
<li><b>Perda no trecho.</b> hf = 0,050 × 30 ≈ <b>1,49 m</b> de coluna d'água.</li>
<li><b>Leitura.</b> Se a caixa d'água fica 3 m acima da saída, sobram cerca de 1,5 m de pressão, perto do mínimo de 1 m que a norma pede nos pontos de uso. Por isso o último chuveiro costuma ser o mais fraco.</li></ol>
<div class="dica"><b>Confira no simulador</b>Q = 0,5 L/s, D = 25 mm, L = 30 m, PVC.</div>`,
sim:{html:()=>simWrap(rng('hQ','Vazão Q',0.1,5,0.1,0.5,'L/s')+sel('hD','Diâmetro interno',[[20,'20 mm'],[25,'25 mm',1],[32,'32 mm'],[40,'40 mm'],[50,'50 mm'],[60,'60 mm'],[75,'75 mm'],[100,'100 mm']])+rng('hL','Comprimento L',5,200,5,30,'m')+sel('hC','Material',[[150,'PVC (C = 150)',1],[130,'Cobre (C = 130)'],[125,'Ferro galvanizado novo (C = 125)'],[100,'Ferro fundido usado (C = 100)']])+rng('hZ','Desnível disponível',1,30,0.5,3,'m','Altura da caixa d’água acima do ponto')),
update(){const Q=V_('hQ'),D=V_('hD'),L=V_('hL'),C=V_('hC'),Z=V_('hZ'),r=calc.hazen(Q,D,L,C),sobra=Z-r.hf;
$('tiles').innerHTML=tiles([['Velocidade',br(r.v)+' m/s'],['J',br(r.J,4)+' m/m'],['Perda hf',br(r.hf)+' m',1],['Pressão final',br(sobra)+' m.c.a.']])+(r.v<=3?'<span class="pill ok">v ≤ 3 m/s</span>':'<span class="pill alerta">v &gt; 3 m/s · aumente o diâmetro</span>')+' '+(sobra>=1?'<span class="pill ok">Pressão ≥ 1 m.c.a.</span>':'<span class="pill alerta">Pressão insuficiente no ponto</span>');
const top=50,base=230,sz=(base-top)/Math.max(Z,r.hf,1),wl=base-Z*sz,end=wl+Math.min(r.hf,Z+5)*sz;
let s=T(30,20,'LINHA DE CARGA','muted','font-size="10" letter-spacing="1"');
s+=`<rect x="40" y="${wl-10}" width="90" height="${base-wl+20}" style="fill:var(--water-fill);stroke:var(--ink);stroke-width:2"/>`+Ln(40,wl,130,wl,'water',2);
s+=`<rect x="130" y="${base-6}" width="440" height="12" style="fill:var(--steel-soft);stroke:var(--ink);stroke-width:1.5"/>`+`<circle cx="575" cy="${base}" r="5" style="fill:var(--water)"/>`;
s+=Ln(130,wl,570,Math.min(end,base+40),r.hf>Z?'neg':'water',2,'stroke-dasharray="8 4"')+Ln(130,wl,570,wl,'muted',1,'stroke-dasharray="2 4"');
s+=Ln(590,wl,590,Math.min(end,base+40),'amber',2)+T(596,(wl+Math.min(end,base+40))/2+4,'hf','amber-ink','font-weight="600"');
s+=T(350,base+30,`L = ${L} m · D = ${D} mm · Q = ${br(Q,1)} L/s`,'muted','text-anchor="middle"')+T(85,wl-16,`Z = ${br(Z,1)} m`,'water','text-anchor="middle"');
s+=T(350,wl-8,'nível da caixa','muted','text-anchor="middle" font-size="10"');
$('draw').innerHTML=SVG(640,290,'Linha de carga ao longo da tubulação',s);
$('memorial').textContent=`1) Q = ${br(Q,1)} L/s = ${br(Q/1000,4)} m³/s · D = ${D} mm = ${br(D/1000,3)} m
2) v = 4·Q/(π·D²) = ${br(r.v,3)} m/s ${r.v<=3?'≤ 3 m/s ✓':'> 3 m/s ✗'}
3) J = 10,643 × Q^1,85 / (C^1,85 × D^4,87) = ${br(r.J,5)} m/m   (C = ${C})
4) hf = J × L = ${br(r.J,5)} × ${L} = ${br(r.hf,3)} m
5) Pressão no ponto = Z − hf = ${br(Z,2)} − ${br(r.hf,3)} = ${br(sobra,3)} m.c.a. ${sobra>=1?'≥ 1,0 ✓':'< 1,0 ✗'}
   (perdas localizadas em conexões não incluídas)`;}}
});

// MC-06 · Materiais e Traço
Academia.modulo('mc',{
teoria:`<p>O traço é a receita do concreto. Escrito como <b>1 : a : p : x</b>, quer dizer: para cada 1 kg de cimento, <i>a</i> kg de areia, <i>p</i> kg de brita e <i>x</i> kg (litros) de água.</p>
<div class="cols"><div class="conceito"><h4>Relação água/cimento</h4><p>É o fator que mais manda na resistência. Mais água deixa o concreto fácil de lançar, mas fraco e poroso (Lei de Abrams).</p></div>
<div class="conceito"><h4>Consumo de cimento</h4><p>Quantos kg de cimento vão em 1 m³ de concreto. É o que define o custo.</p></div>
<div class="conceito"><h4>Latas de 18 L</h4><p>Na obra, areia e brita são medidas em volume. Usamos a massa unitária para converter kg em latas.</p></div></div>
<h3>Fórmulas</h3>
<div class="formula">Consumo  C = 1000 / (1/γc + a/γa + p/γp + x)   kg/m³</div>
<div class="formula">γc = 3,10 · γa = 2,65 · γp = 2,70 (massas específicas, kg/dm³)</div>
<div class="formula">Latas por saco = (a × 50 / massa unitária) / 18   areia 1,50 kg/L · brita 1,45 kg/L</div>
<div class="dica"><b>Erro clássico</b>Jogar água na betoneira para o concreto ficar mais mole. Cada litro a mais derruba a resistência. Para trabalhabilidade, use aditivo plastificante.</div>`,
exemplo:`<h3>1 m³ de concreto no traço 1 : 2 : 3 : 0,55</h3>
<ol class="passos"><li><b>Consumo.</b> C = 1000 / (1/3,10 + 2/2,65 + 3/2,70 + 0,55) = 1000 / 2,738 ≈ <b>365 kg/m³</b>.</li>
<li><b>Sacos.</b> 365 / 50 = 7,3 → <b>8 sacos</b> de cimento.</li>
<li><b>Areia por saco.</b> 2 × 50 = 100 kg → 100 / 1,50 = 66,7 L → <b>3,7 latas</b>.</li>
<li><b>Brita por saco.</b> 3 × 50 = 150 kg → 150 / 1,45 = 103 L → <b>5,7 latas</b>.</li>
<li><b>Água por saco.</b> 0,55 × 50 = <b>27,5 L</b>, já descontando a umidade da areia na prática.</li></ol>
<div class="dica"><b>Confira no simulador</b>Use o atalho 1:2:3 e volume de 1 m³.</div>`,
sim:{html:()=>simWrap(`<div class="presets"><button class="chip" data-t="2,3,0.55">1:2:3 estrutural</button><button class="chip" data-t="2.5,3.5,0.6">1:2,5:3,5</button><button class="chip" data-t="3,4,0.65">1:3:4 contrapiso</button><button class="chip" data-t="4,5,0.75">1:4:5 magro</button></div>`+rng('tA','Areia a',1,5,0.5,2,'')+rng('tP','Brita p',1,6,0.5,3,'')+rng('tX','Água/cimento x',0.4,0.8,0.05,0.55,'')+rng('tV','Volume de concreto',0.5,20,0.5,1,'m³')),
init(){document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const[a,p,x]=b.dataset.t.split(',');$('tA').value=a;$('tP').value=p;$('tX').value=x;outs();this.update()})},
update(){const a=V_('tA'),p=V_('tP'),x=V_('tX'),vol=V_('tV'),r=calc.traco(a,p,x,vol);
$('tiles').innerHTML=tiles([['Consumo',br(r.C,0)+' kg/m³'],['Cimento',r.sacos+' sacos',1],['Areia',br(r.areia)+' m³'],['Brita',br(r.brita)+' m³']])+(x<=0.6?'<span class="pill ok">a/c ≤ 0,60 · uso estrutural possível</span>':'<span class="pill alerta">a/c &gt; 0,60 · só uso não estrutural</span>');
const ps=r.porSaco,items=[['Cimento','1 saco (50 kg)',50/1.42,'ink'],['Areia',br(ps.areiaLatas,1)+' latas',ps.areiaL,'amber'],['Brita',br(ps.britaLatas,1)+' latas',ps.britaL,'muted'],['Água',br(ps.agua,1)+' L',ps.agua,'water']];
const tot=items.reduce((s,i)=>s+i[2],0);let s=T(30,20,'POR SACO DE CIMENTO (VOLUME APROXIMADO)','muted','font-size="10" letter-spacing="1"'),xx=30;
items.forEach(([n,t,v,c])=>{const w=580*v/tot;s+=`<rect x="${xx}" y="36" width="${w}" height="40" style="fill:var(--${c});opacity:.85"/>`;xx+=w});
items.forEach(([n,t,v,c],i)=>{const y=110+i*34,lat=n==='Areia'?ps.areiaLatas:n==='Brita'?ps.britaLatas:0;
s+=`<rect x="30" y="${y-12}" width="14" height="14" style="fill:var(--${c})"/>`+T(54,y,n,'ink','font-weight="600"')+T(150,y,t,'ink');
for(let k=0;k<Math.ceil(lat);k++){const f=Math.min(1,lat-k);s+=`<rect x="${300+k*24}" y="${y-14}" width="18" height="18" style="fill:none;stroke:var(--${c});stroke-width:1.5"/><rect x="${300+k*24}" y="${y+4-18*f}" width="18" height="${18*f}" style="fill:var(--${c});opacity:.7"/>`}});
s+=T(30,256,`Total para ${br(vol,1)} m³: ${r.sacos} sacos · ${br(r.areia)} m³ de areia · ${br(r.brita)} m³ de brita · ${br(r.agua,0)} L de água`,'muted');
$('draw').innerHTML=SVG(640,270,'Proporção do traço por saco de cimento',s);
$('memorial').textContent=`1) C = 1000 / (1/3,10 + ${br(a,1)}/2,65 + ${br(p,1)}/2,70 + ${br(x)}) = ${br(r.C,1)} kg/m³
2) Cimento total = ${br(r.C,1)} × ${br(vol,1)} = ${br(r.cim,1)} kg → ${r.sacos} sacos de 50 kg
3) Areia = ${br(a,1)} × ${br(r.cim,1)} / 1500 = ${br(r.areia,3)} m³  (por saco: ${br(ps.areiaL,1)} L = ${br(ps.areiaLatas,1)} latas)
4) Brita = ${br(p,1)} × ${br(r.cim,1)} / 1450 = ${br(r.brita,3)} m³  (por saco: ${br(ps.britaL,1)} L = ${br(ps.britaLatas,1)} latas)
5) Água = ${br(x)} × ${br(r.cim,1)} = ${br(r.agua,0)} L  (por saco: ${br(ps.agua,1)} L)
   Sem perdas. Na obra, some 5% a 10%.`;}}
});

// TP-07 · Topografia
Academia.modulo('tp',{
sig:SIG,
teoria:`<p>Todo levantamento topográfico vira uma lista de pontos com coordenadas: <b>E</b> (Este, eixo x) e <b>N</b> (Norte, eixo y). Com essa lista dá para calcular a área exata de um terreno, por mais torto que ele seja.</p>
<div class="cols"><div class="conceito"><h4>Coordenadas</h4><p>Cada vértice do terreno tem um par (E, N) em metros. Em georreferenciamento, usamos o sistema UTM.</p></div>
<div class="conceito"><h4>Azimute</h4><p>Ângulo de uma linha medido a partir do Norte, no sentido horário, de 0° a 360°.</p></div>
<div class="conceito"><h4>Curva de nível</h4><p>Linha que liga pontos com a mesma cota (altura). Curvas próximas indicam terreno íngreme.</p></div></div>
<h3>Fórmula de Gauss (das coordenadas)</h3>
<div class="formula">2·A = Σ (Eᵢ · Nᵢ₊₁ − Eᵢ₊₁ · Nᵢ)     depois do último vértice volta ao primeiro</div>
<div class="formula">Perímetro = Σ √[(Eᵢ₊₁ − Eᵢ)² + (Nᵢ₊₁ − Nᵢ)²]</div>
<div class="dica"><b>Cuidado</b>Os vértices precisam seguir a ordem do contorno, sem pular nem cruzar linhas. O sentido (horário ou anti-horário) só muda o sinal.</div>
<h3>Curvas de nível por triangulação</h3><p>Os programas de topografia ligam os pontos levantados em triângulos (malha TIN, pelo critério de Delaunay). Dentro de cada triângulo, a cota varia em linha reta. As curvas de nível nascem onde cada cota redonda corta os lados dos triângulos.</p>
<div class="dica"><b>Bancada SIG</b>Na aba Bancada SIG você trabalha como num programa de geoprocessamento: importa o levantamento, gera as curvas de nível, traça perfis, calcula corte e aterro do platô e sai com o memorial descritivo pronto.</div>`,
exemplo:`<h3>Terreno em forma de trapézio</h3><p>Vértices: A (0; 0), B (24; 0), C (20; 30), D (0; 30).</p>
<ol class="passos"><li><b>A → B.</b> 0 × 0 − 24 × 0 = 0</li><li><b>B → C.</b> 24 × 30 − 20 × 0 = 720</li>
<li><b>C → D.</b> 20 × 30 − 0 × 30 = 600</li><li><b>D → A.</b> 0 × 0 − 0 × 30 = 0</li>
<li><b>Área.</b> (0 + 720 + 600 + 0) / 2 = <b>660 m²</b>. Confere com a fórmula do trapézio: (24 + 20)/2 × 30 = 660 ✓</li></ol>
<div class="dica"><b>Confira no simulador</b>Use o botão "Exemplo do trapézio".</div>`,
sim:{pts:[[0,0],[28,0],[32,18],[15,30],[0,24]],
html(){return simWrap('<div class="presets"><button class="chip" id="tpEx">Exemplo do trapézio</button><button class="chip" id="tpLote">Lote irregular</button></div><div class="tbl-wrap"><table class="ed"><thead><tr><th>Vértice</th><th>E (m)</th><th>N (m)</th><th></th></tr></thead><tbody id="tpBody"></tbody></table></div><button class="chip" id="tpAdd">+ Adicionar vértice</button>')},
init(){const self=this;$('tpAdd').onclick=()=>{const l=self.pts[self.pts.length-1]||[0,0];self.pts.push([l[0]+5,l[1]+5]);self.tabela();self.update()};
$('tpEx').onclick=()=>{self.pts=[[0,0],[24,0],[20,30],[0,30]];self.tabela();self.update()};$('tpLote').onclick=()=>{self.pts=[[0,0],[28,0],[32,18],[15,30],[0,24]];self.tabela();self.update()};this.tabela()},
tabela(){const self=this;$('tpBody').innerHTML=this.pts.map((p,i)=>`<tr><td class="num">${String.fromCharCode(65+i)}</td><td><input type="number" step="0.01" id="tpE${i}" value="${p[0]}" aria-label="E do vértice ${String.fromCharCode(65+i)}"></td><td><input type="number" step="0.01" id="tpN${i}" value="${p[1]}" aria-label="N do vértice ${String.fromCharCode(65+i)}"></td><td>${this.pts.length>3?`<button class="rm" data-i="${i}" aria-label="Remover vértice">✕</button>`:''}</td></tr>`).join('');
$('tpBody').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{const i=+inp.id.slice(3);self.pts[i][inp.id[2]==='E'?0:1]=parseFloat(inp.value.replace(',','.'))||0;self.update()});
$('tpBody').querySelectorAll('.rm').forEach(b=>b.onclick=()=>{self.pts.splice(+b.dataset.i,1);self.tabela();self.update()})},
update(){const pts=this.pts,r=calc.area(pts);
$('tiles').innerHTML=tiles([['Área',br(r.area)+' m²',1],['Hectares',br(r.area/10000,4)+' ha'],['Perímetro',br(r.perim)+' m'],['Vértices',pts.length]]);
const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys),sc=Math.min(500/((mxx-mnx)||1),260/((mxy-mny)||1)),X=x=>70+(x-mnx)*sc,Y=y=>300-(y-mny)*sc;
let s='';for(let g=0;g<=4;g++){const gx=70+g*125,gy=40+g*65;s+=Ln(gx,40,gx,300,'grid')+Ln(70,gy,570,gy,'grid')}
s+=`<polygon points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" style="fill:var(--steel-soft);stroke:var(--steel);stroke-width:2"/>`;
pts.forEach((p,i)=>{const q=pts[(i+1)%pts.length],d=Math.hypot(q[0]-p[0],q[1]-p[1]);s+=T((X(p[0])+X(q[0]))/2,(Y(p[1])+Y(q[1]))/2-6,br(d)+' m','muted','text-anchor="middle" font-size="10"');
s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="5" style="fill:var(--amber);stroke:var(--ink)"/>`+T(X(p[0])+8,Y(p[1])+16,String.fromCharCode(65+i),'ink','font-weight="600"')});
const cx=xs.reduce((a,b)=>a+b,0)/pts.length,cy=ys.reduce((a,b)=>a+b,0)/pts.length;s+=T(X(cx),Y(cy)+4,br(r.area)+' m²','steel','text-anchor="middle" font-weight="600" font-size="14"');
s+=`<path d="M610 50 l-7 18 l7 -5 l7 5z" style="fill:var(--ink)"/>`+T(610,44,'N','ink','text-anchor="middle" font-weight="600"');
$('draw').innerHTML=SVG(640,330,'Planta do terreno com área calculada',s);
let m='Fórmula de Gauss: 2A = Σ (Ei·Ni+1 − Ei+1·Ni)\n';pts.forEach((p,i)=>{const q=pts[(i+1)%pts.length],n1=String.fromCharCode(65+i),n2=String.fromCharCode(65+(i+1)%pts.length);m+=`${n1} → ${n2}: ${br(p[0])} × ${br(q[1])} − ${br(q[0])} × ${br(p[1])} = ${br(p[0]*q[1]-q[0]*p[1])}\n`});
m+=`Soma = ${br(r.soma)} → A = |${br(r.soma)}| / 2 = ${br(r.area)} m²\nPerímetro = ${br(r.perim)} m`;$('memorial').textContent=m;}}
});

// OR-08 · Orçamento de Obras
Academia.modulo('or',{
teoria:`<p>Orçar é descobrir quanto custa cada serviço por unidade (m², m³, un) e depois somar tudo. A base é a <b>composição de custo unitário</b>: a lista de insumos que um serviço consome.</p>
<div class="cols"><div class="conceito"><h4>Composição</h4><p>Insumo × coeficiente × preço. Ex.: para 1 m² de alvenaria, 13 blocos, 0,85 h de pedreiro e assim por diante.</p></div>
<div class="conceito"><h4>SINAPI</h4><p>Sistema de referência de custos mantido pela Caixa e pelo IBGE. Obrigatório como referência em obras com recurso federal.</p></div>
<div class="conceito"><h4>BDI</h4><p>Benefícios e Despesas Indiretas: administração central, seguros, riscos, impostos e lucro, em % sobre o custo direto.</p></div></div>
<h3>Fórmulas</h3>
<div class="formula">Custo unitário = Σ (coeficiente × preço do insumo)</div>
<div class="formula">Preço de venda = Custo direto × (1 + BDI)</div>
<div class="formula">BDI (TCU) = [(1 + AC + S + R + G)·(1 + DF)·(1 + L) / (1 − I)] − 1</div>
<div class="dica"><b>Valores de exemplo</b>Os preços do simulador são ilustrativos. Use sempre a tabela SINAPI ou cotação do seu estado e mês de referência.</div>`,
exemplo:`<h3>1 m² de alvenaria de bloco cerâmico</h3><p>Composição simplificada com preços de exemplo.</p>
<ol class="passos"><li><b>Bloco cerâmico.</b> 13 un × R$ 3,10 = R$ 40,30</li><li><b>Argamassa.</b> 0,012 m³ × R$ 520,00 = R$ 6,24</li>
<li><b>Pedreiro.</b> 0,85 h × R$ 32,00 = R$ 27,20</li><li><b>Servente.</b> 0,85 h × R$ 24,00 = R$ 20,40</li>
<li><b>Custo unitário.</b> R$ 94,14/m². Com BDI de 25%: 94,14 × 1,25 = <b>R$ 117,68/m²</b>. Para 100 m²: <b>R$ 11.767,50</b>.</li></ol>
<div class="dica"><b>Confira no simulador</b>Os valores iniciais são os do exemplo.</div>`,
sim:{itens:[{n:'Bloco cerâmico 14×19×39',u:'un',coef:13,preco:3.10},{n:'Argamassa de assentamento',u:'m³',coef:0.012,preco:520},{n:'Pedreiro (com encargos)',u:'h',coef:0.85,preco:32},{n:'Servente (com encargos)',u:'h',coef:0.85,preco:24}],
html(){return simWrap(rng('oB','BDI',0,40,0.5,25,'%')+rng('oQ','Quantidade de serviço',1,500,1,100,'m²'),'<div class="tbl-wrap"><table class="ed"><thead><tr><th>Insumo</th><th>Un</th><th>Coef.</th><th>Preço (R$)</th><th>Subtotal</th></tr></thead><tbody id="orBody"></tbody></table></div>')},
init(){const self=this;$('orBody').innerHTML=this.itens.map((it,i)=>`<tr><td>${it.n}</td><td>${it.u}</td><td><input type="number" step="0.001" id="orC${i}" value="${it.coef}" aria-label="Coeficiente de ${it.n}"></td><td><input type="number" step="0.01" id="orP${i}" value="${it.preco}" aria-label="Preço de ${it.n}"></td><td class="num" id="orS${i}"></td></tr>`).join('');
$('orBody').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{const i=+inp.id.slice(3);self.itens[i][inp.id[2]==='C'?'coef':'preco']=parseFloat(inp.value.replace(',','.'))||0;self.update()})},
update(){const bdi=V_('oB'),qtd=V_('oQ'),r=calc.orcamento(this.itens,bdi,qtd);
r.linhas.forEach((l,i)=>{$('orS'+i).textContent=R$(l.sub)});
$('tiles').innerHTML=tiles([['Custo unitário',R$(r.cu)+'/m²'],['Preço c/ BDI',R$(r.pu)+'/m²',1],['BDI em R$',R$(r.pu-r.cu)+'/m²'],['Total',R$(r.total)]]);
const cores=['amber','steel','pos','water'];let s=T(30,20,'COMPOSIÇÃO DO PREÇO UNITÁRIO','muted','font-size="10" letter-spacing="1"'),xx=30;const tot=r.pu||1;
r.linhas.forEach((l,i)=>{const w=580*l.sub/tot;s+=`<rect x="${xx}" y="36" width="${w}" height="36" style="fill:var(--${cores[i%4]});opacity:.85"/>`;xx+=w});
s+=`<rect x="${xx}" y="36" width="${580*(r.pu-r.cu)/tot}" height="36" style="fill:var(--neg);opacity:.75"/>`;
[...r.linhas.map((l,i)=>[l.n,l.sub,cores[i%4]]),['BDI ('+br(bdi,1)+'%)',r.pu-r.cu,'neg']].forEach(([n,v,c],i)=>{const y=100+i*26;s+=`<rect x="30" y="${y-11}" width="12" height="12" style="fill:var(--${c})"/>`+T(50,y,n,'ink')+T(470,y,R$(v),'ink','text-anchor="end"')+T(590,y,br(100*v/tot,1)+'%','muted','text-anchor="end"')});

m+=`${'Custo unitário'.padEnd(28)} ${''.padStart(31)}= ${R$(r.cu).padStart(12)}\nPreço = ${R$(r.cu)} × (1 + ${br(bdi,1)}%) = ${R$(r.pu)}/m²\nTotal = ${R$(r.pu)} × ${qtd} m² = ${R$(r.total)}`;$('memorial').textContent=m;}}

// LJ-09 · Lajes
Academia.modulo('lj',{
teoria:`<p>A laje é o piso. Ela recebe tudo o que está em cima (pessoas, móveis, contrapiso, piso) e entrega esse peso para as vigas em volta. Entender esse caminho da carga é o primeiro passo para dimensionar qualquer estrutura.</p>
<div class="cols"><div class="conceito"><h4>Laje maciça</h4><p>Placa de concreto armado cheia. Funciona bem em vãos médios e apoia nas quatro vigas.</p></div>
<div class="conceito"><h4>Laje treliçada</h4><p>Vigotas pré-moldadas com lajota ou EPS. Muito usada em casas. Trabalha numa direção só.</p></div>
<div class="conceito"><h4>Cargas (NBR 6120)</h4><p>Peso próprio (concreto: 25 kN/m³), revestimentos e a sobrecarga de uso, que depende do tipo de ambiente.</p></div></div>
<h3>Montando a carga total</h3>
<div class="formula">Peso próprio = 25 × h (h em m)     Ex.: laje de 10 cm → 2,5 kN/m²</div>
<div class="formula">p = peso próprio + revestimento + sobrecarga   (kN/m²)</div>
<h3>Uma ou duas direções?</h3>
<div class="formula">λ = ly / lx  (lado maior ÷ lado menor)     λ ≤ 2: armada em cruz · λ &gt; 2: armada em uma direção</div>
<h3>Método das charneiras (bordas iguais)</h3>
<p>Traçamos linhas a 45° saindo dos cantos. A laje fica dividida em 2 triângulos (lados curtos) e 2 trapézios (lados longos). Cada viga recebe o peso da área que está encostada nela.</p>
<div class="formula">Viga do lado curto: q = p · lx / 4     Viga do lado longo: q = p · (lx·ly/2 − lx²/4) / ly</div>
<div class="dica"><b>Na obra</b>Laje treliçada apoia só nas vigas perpendiculares às vigotas. Inverter o sentido das vigotas muda completamente a carga nas vigas.</div>`,
exemplo:`<h3>Sala de 4 × 5 m com laje maciça de 10 cm</h3><p>Uso residencial, com contrapiso e piso cerâmico.</p>
<ol class="passos"><li><b>Peso próprio.</b> 25 × 0,10 = <b>2,5 kN/m²</b>.</li>
<li><b>Revestimento.</b> Contrapiso + piso + reboco do teto ≈ <b>1,0 kN/m²</b>.</li>
<li><b>Sobrecarga.</b> Residencial (salas e quartos): <b>1,5 kN/m²</b>.</li>
<li><b>Carga total.</b> p = 2,5 + 1,0 + 1,5 = <b>5,0 kN/m²</b>. λ = 5/4 = 1,25 → armada em cruz.</li>
<li><b>Vigas de 4 m (lado curto).</b> q = 5,0 × 4 / 4 = <b>5,0 kN/m</b>.</li>
<li><b>Vigas de 5 m (lado longo).</b> Área do trapézio = 4 × 5/2 − 4²/4 = 6,0 m² → q = 5,0 × 6 / 5 = <b>6,0 kN/m</b>.</li>
<li><b>Conferência.</b> 2 × 5,0 × 4 + 2 × 6,0 × 5 = 100 kN = 5,0 × 20 m² ✓</li></ol>
<div class="dica"><b>Próximo passo</b>Essas cargas entram no módulo RM-01 para achar o momento das vigas.</div>`,
sim:{html:()=>simWrap(rng('lX','Lado menor lx',2,8,0.1,4,'m')+rng('lY','Lado maior ly',2,12,0.1,5,'m')+rng('lH','Espessura h',8,20,1,10,'cm')+rng('lR','Revestimento',0.5,2.5,0.1,1,'kN/m²','Contrapiso, piso, reboco do teto')+sel('lS','Uso (sobrecarga)',[[1.5,'Residencial: salas e quartos (1,5 kN/m²)',1],[2.5,'Escritórios (2,5 kN/m²)'],[3,'Corredores e escadas de uso comum (3,0 kN/m²)'],[1,'Cobertura só com manutenção (1,0 kN/m²)']],'Valores usuais. Confira a tabela da NBR 6120.')),
update(){const r=calc.laje(V_('lX'),V_('lY'),V_('lH'),V_('lR'),V_('lS'));
$('tiles').innerHTML=tiles([['Carga total p',br(r.p)+' kN/m²'],['λ = ly/lx',br(r.lam)],['Vigas lado curto',br(r.qc)+' kN/m',1],['Vigas lado longo',br(r.ql)+' kN/m',1]])+(r.umaDir?'<span class="pill alerta">λ &gt; 2 · laje armada em uma direção</span>':'<span class="pill ok">λ ≤ 2 · laje armada em cruz</span>')+(V_('lH')<r.hs?` <span class="pill alerta">Espessura abaixo de ${r.hs} cm (lx/40)</span>`:'');
const sc=Math.min(440/r.ly,230/r.lx),W=r.ly*sc,H=r.lx*sc,ox=100+(440-W)/2,oy=50,c=H/2;
const P=(pts,cl)=>`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" style="fill:var(--${cl});stroke:var(--ink);stroke-width:1"/>`;
let s=T(30,20,'PLANTA · LINHAS DE CHARNEIRA A 45°','muted','font-size="10" letter-spacing="1"');
s+=P([[ox,oy],[ox+c,oy+c],[ox,oy+H]],'amber-fill')+P([[ox+W,oy],[ox+W-c,oy+c],[ox+W,oy+H]],'amber-fill');
s+=P([[ox,oy],[ox+W,oy],[ox+W-c,oy+c],[ox+c,oy+c]],'steel-soft')+P([[ox,oy+H],[ox+W,oy+H],[ox+W-c,oy+c],[ox+c,oy+c]],'steel-soft');
s+=`<rect x="${ox}" y="${oy}" width="${W}" height="${H}" style="fill:none;stroke:var(--ink);stroke-width:5"/>`;
s+=T(ox+W/2,oy-12,br(r.ql)+' kN/m','steel','text-anchor="middle" font-weight="600"')+T(ox+W/2,oy+H+22,br(r.ql)+' kN/m','steel','text-anchor="middle" font-weight="600"');
s+=T(ox-10,oy+H/2+4,br(r.qc)+' kN/m','amber-ink','text-anchor="end" font-weight="600"')+T(ox+W+10,oy+H/2+4,br(r.qc)+' kN/m','amber-ink','font-weight="600"');
s+=T(ox+W/2,oy+H+42,`ly = ${br(r.ly)} m · lx = ${br(r.lx)} m · p = ${br(r.p)} kN/m²`,'muted','text-anchor="middle"');
$('draw').innerHTML=SVG(640,oy+H+56,'Planta da laje com charneiras e cargas nas vigas',s);
$('memorial').textContent=`1) Peso próprio = 25 × ${br(V_('lH')/100)} = ${br(r.pp)} kN/m²
2) p = ${br(r.pp)} + ${br(V_('lR'))} + ${br(V_('lS'))} = ${br(r.p)} kN/m²
3) λ = ${br(r.ly)} / ${br(r.lx)} = ${br(r.lam)} → ${r.umaDir?'armada em uma direção':'armada em cruz'}
4) Triângulo (lado curto): A = lx²/4 = ${br(r.At,3)} m² → q = p·A/lx = ${br(r.qc)} kN/m
5) Trapézio (lado longo): A = lx·ly/2 − lx²/4 = ${br(r.Atr,3)} m² → q = p·A/ly = ${br(r.ql)} kN/m
6) Conferência: 2×${br(r.qc)}×${br(r.lx)} + 2×${br(r.ql)}×${br(r.ly)} = ${br(2*r.qc*r.lx+2*r.ql*r.ly)} kN = p × área = ${br(r.total)} kN
7) Espessura de pré-dimensionamento ≈ lx/40 = ${r.hs} cm`;}}
});

// MA-10 · Muros de Arrimo
Academia.modulo('ma',{
teoria:`<p>A terra atrás de um muro empurra o tempo todo. Esse empurrão se chama <b>empuxo</b>. O muro de gravidade resiste com o próprio peso: quanto mais pesado e largo na base, mais estável.</p>
<div class="cols"><div class="conceito"><h4>Empuxo ativo (Ea)</h4><p>A força da terra sobre o muro. Cresce com o quadrado da altura: um muro com o dobro da altura recebe quatro vezes mais empuxo.</p></div>
<div class="conceito"><h4>Ângulo de atrito (φ)</h4><p>Mede o quanto o solo se segura sozinho. Areias compactas têm φ alto; argilas moles, baixo.</p></div>
<div class="conceito"><h4>Tipos de muro</h4><p>Gravidade (concreto ciclópico, pedra, gabião), flexão (concreto armado em L) e solo grampeado.</p></div></div>
<h3>Fórmulas (Rankine, terrapleno horizontal)</h3>
<div class="formula">Ka = tg²(45° − φ/2)     Ea = ½ · Ka · γ · H²   aplicado a H/3 da base</div>
<h3>As três verificações</h3>
<div class="formula">Tombamento: FS = M resistente / M atuante ≥ 1,5 a 2,0</div>
<div class="formula">Deslizamento: FS = W · tg φ / Ea ≥ 1,5</div>
<div class="formula">Base: e = B/2 − (Mr − Mt)/W ≤ B/6   →  σmáx = (W/B)·(1 + 6e/B)</div>
<div class="dica"><b>O que mais derruba muro</b>Falta de drenagem. Água acumulada atrás do muro soma pressão hidrostática ao empuxo. Barbacãs, brita e manta geotêxtil são obrigatórios.</div>`,
exemplo:`<h3>Muro de concreto ciclópico com 3 m de altura</h3><p>Topo com 0,50 m, base com 1,80 m, face de trás vertical. Solo com γ = 18 kN/m³ e φ = 30°. Concreto ciclópico com 22 kN/m³. Cálculo por metro de muro.</p>
<ol class="passos"><li><b>Coeficiente.</b> Ka = tg²(45° − 15°) = tg²30° = <b>0,333</b>.</li>
<li><b>Empuxo.</b> Ea = 0,5 × 0,333 × 18 × 3² = <b>27,0 kN/m</b>, a 1,00 m da base.</li>
<li><b>Peso.</b> Triângulo: 1,30 × 3/2 × 22 = 42,9 kN. Retângulo: 0,50 × 3 × 22 = 33,0 kN. W = <b>75,9 kN/m</b>.</li>
<li><b>Tombamento.</b> Mr = 42,9 × 0,867 + 33,0 × 1,55 = 88,3 kN·m. Mt = 27 × 1,0 = 27,0. FS = <b>3,27</b> ✓</li>
<li><b>Deslizamento.</b> FS = 75,9 × tg30° / 27 = <b>1,62</b> ✓</li>
<li><b>Base.</b> e = 0,90 − (88,3 − 27,0)/75,9 = 0,09 m ≤ 0,30 ✓ → σmáx ≈ <b>55 kPa</b>.</li></ol>
<div class="dica"><b>Teste no simulador</b>Diminua a base para 1,20 m e veja qual verificação falha primeiro.</div>`,
sim:{html:()=>simWrap(rng('mH','Altura H',1,6,0.1,3,'m')+rng('mb','Largura do topo b',0.3,1.5,0.05,0.5,'m')+rng('mB','Largura da base B',0.5,4,0.05,1.8,'m')+rng('mF','Ângulo de atrito φ',20,40,1,30,'°')+rng('mG','Peso do solo γ',15,21,0.5,18,'kN/m³')+sel('mM','Material do muro',[[22,'Concreto ciclópico (22 kN/m³)',1],[24,'Concreto simples (24 kN/m³)'],[20,'Pedra argamassada (20 kN/m³)'],[17,'Gabião (17 kN/m³)']])),
update(){const H=V_('mH'),b=V_('mb'),r=calc.muro(H,b,V_('mB'),V_('mF'),V_('mG'),V_('mM')),B=r.B;
const pill=(c,t)=>`<span class="pill ${c?'ok':'alerta'}">${t}</span>`;
$('tiles').innerHTML=tiles([['Empuxo Ea',br(r.Ea)+' kN/m'],['Peso W',br(r.W)+' kN/m'],['FS tombamento',br(r.FSt),1],['FS deslizamento',br(r.FSd),1]])+`<div class="presets">${pill(r.FSt>=1.5,'Tombamento '+(r.FSt>=1.5?'OK':'falha'))}${pill(r.FSd>=1.5,'Deslizamento '+(r.FSd>=1.5?'OK':'falha'))}${pill(r.nucleo,r.nucleo?'Base comprimida':'Base com tração')}</div>`;
const sc=Math.min(260/H,220/B),gx=150,gy=40,Hs=H*sc,Bs=B*sc,bs=b*sc,base=gy+Hs;
let s=T(30,20,'CORTE · POR METRO DE MURO','muted','font-size="10" letter-spacing="1"');
const xBack=gx+Bs;s+=`<rect x="${xBack}" y="${gy}" width="${170}" height="${Hs}" style="fill:var(--soil-fill)"/>`;for(let k=0;k<6;k++)s+=Ln(xBack+20+k*26,gy+4,xBack+8+k*26,gy+16,'soil',1);
s+=`<polygon points="${gx},${base} ${xBack-bs},${gy} ${xBack},${gy} ${xBack},${base}" style="fill:var(--steel-soft);stroke:var(--ink);stroke-width:2"/>`;
s+=`<rect x="${gx-40}" y="${base}" width="${Bs+250}" height="14" style="fill:var(--soil-fill)"/>`;
const pk=Math.min(120,r.Ka*V_('mG')*H*8);s+=`<polygon points="${xBack},${gy} ${xBack},${base} ${xBack+pk},${base}" style="fill:var(--neg-fill);stroke:var(--neg)"/>`;
const ya=base-Hs/3;s+=Ln(xBack+pk+50,ya,xBack+6,ya,'neg',2.5)+`<path d="M${xBack+6} ${ya} l10 -6 v12z" style="fill:var(--neg)"/>`+T(xBack+pk+54,ya+4,'Ea = '+br(r.Ea,1),'neg','font-weight="600"');
const xc=gx+(r.W1*r.x1+r.W2*r.x2)/r.W*sc;s+=Ln(xc,gy+Hs*0.35,xc,gy+Hs*0.35+46,'ink',2.5)+`<path d="M${xc} ${gy+Hs*0.35+52} l-6 -10 h12z" style="fill:var(--ink)"/>`+T(xc+8,gy+Hs*0.35+20,'W = '+br(r.W,1),'ink','font-weight="600"');
const xR=gx+r.xr*sc;s+=`<circle cx="${xR}" cy="${base}" r="5" style="fill:var(--amber);stroke:var(--ink)"/>`+Ln(gx+Bs/3,base+20,gx+2*Bs/3,base+20,'pos',3)+T(gx+Bs/2,base+34,'terço central da base','pos','text-anchor="middle" font-size="10"');
s+=Ln(gx,base+44,xBack,base+44,'muted')+T(gx+Bs/2,base+58,'B = '+br(B)+' m','ink','text-anchor="middle"')+Ln(gx-24,gy,gx-24,base,'muted')+T(gx-30,gy+Hs/2,'H = '+br(H,1),'ink','text-anchor="end"');
$('draw').innerHTML=SVG(640,base+70,'Corte do muro de arrimo com empuxo e peso',s);
$('memorial').textContent=`1) Ka = tg²(45° − ${V_('mF')}°/2) = ${br(r.Ka,3)}
2) Ea = ½ × ${br(r.Ka,3)} × ${br(V_('mG'),1)} × ${br(H)}² = ${br(r.Ea)} kN/m  (a ${br(H/3)} m da base)
3) Peso: triângulo ${br(r.W1)} kN (braço ${br(r.x1,3)} m) + retângulo ${br(r.W2)} kN (braço ${br(r.x2,3)} m) = ${br(r.W)} kN/m
4) Tombamento: Mr = ${br(r.Mr)} kN·m · Mt = ${br(r.Mt)} kN·m → FS = ${br(r.FSt)} ${r.FSt>=1.5?'≥ 1,5 ✓':'< 1,5 ✗'}
5) Deslizamento: FS = ${br(r.W)} × tg${V_('mF')}° / ${br(r.Ea)} = ${br(r.FSd)} ${r.FSd>=1.5?'≥ 1,5 ✓':'< 1,5 ✗'}
6) Excentricidade: e = ${br(B/2)} − (${br(r.Mr)} − ${br(r.Mt)})/${br(r.W)} = ${br(r.e,3)} m ${r.nucleo?'≤':'>'} B/6 = ${br(B/6,3)} m
7) Tensões na base: σmáx = ${br(r.smax,1)} kPa · σmín = ${br(r.smin,1)} kPa${r.nucleo?'':'  (tração: aumente a base)'}
   Atrito na base adotado igual a tg φ (concreto moldado sobre o solo). Sem empuxo passivo e sem água.`;}}
});

// AP-11 · Águas Pluviais
Academia.modulo('ap',{
teoria:`<p>Toda a chuva que cai no telhado precisa sair por algum lugar. A calha recolhe a água e o condutor vertical leva até o chão. Se a calha for pequena, transborda e a água entra pela parede.</p>
<div class="cols"><div class="conceito"><h4>Intensidade (I)</h4><p>Quantos milímetros de chuva caem por hora numa chuva forte. Depende da cidade e do período de retorno (5 anos para telhados).</p></div>
<div class="conceito"><h4>Área de contribuição</h4><p>A área do telhado que escoa para aquela calha. Em telhado inclinado, a altura da água também conta.</p></div>
<div class="conceito"><h4>Rugosidade (n)</h4><p>Coeficiente de Manning. PVC e metal: 0,011. Concreto alisado: 0,012. Alvenaria sem revestimento: 0,015.</p></div></div>
<h3>Fórmulas da NBR 10844</h3>
<div class="formula">Área de contribuição (telhado inclinado): A = (a + h/2) · b</div>
<div class="formula">Vazão de projeto: Q = I · A / 60     (Q em L/min, I em mm/h, A em m²)</div>
<div class="formula">Capacidade da calha (Manning): Q = 60.000 · (S/n) · Rh^(2/3) · i^(1/2)</div>
<div class="formula">Rh = S / P  (área molhada ÷ perímetro molhado)     declividade mínima da calha: 0,5%</div>
<div class="dica"><b>Condutor vertical</b>A norma exige diâmetro interno mínimo de 70 mm (na prática, tubo de 75 mm). O simulador usa uma regra prática de pré-dimensionamento; o dimensionamento final usa os ábacos da NBR 10844.</div>`,
exemplo:`<h3>Telhado de uma água com 10 m de comprimento</h3><p>Projeção horizontal de 5 m, altura de 1 m, chuva de 150 mm/h. Calha de PVC com 15 cm de largura e lâmina d'água de 5 cm, declividade 0,5%.</p>
<ol class="passos"><li><b>Área.</b> A = (5 + 1/2) × 10 = <b>55 m²</b>.</li>
<li><b>Vazão de projeto.</b> Q = 150 × 55 / 60 = <b>137,5 L/min</b>.</li>
<li><b>Geometria da calha.</b> S = 0,15 × 0,05 = 0,0075 m². P = 0,15 + 2 × 0,05 = 0,25 m. Rh = 0,030 m.</li>
<li><b>Capacidade.</b> Q = 60.000 × (0,0075/0,011) × 0,030<sup>2/3</sup> × 0,005<sup>1/2</sup> ≈ <b>279 L/min</b>.</li>
<li><b>Verificação.</b> 279 ≥ 137,5 ✓ A calha trabalha com cerca de metade da capacidade.</li></ol>
<div class="dica"><b>Confira no simulador</b>Os valores iniciais são os do exemplo.</div>`,
sim:{html:()=>simWrap(rng('pa','Projeção horizontal a',2,15,0.5,5,'m')+rng('ph','Altura do telhado h',0,4,0.1,1,'m')+rng('pb','Comprimento b',3,30,0.5,10,'m')+rng('pI','Intensidade de chuva I',100,250,5,150,'mm/h','Consulte a tabela da NBR 10844 para sua cidade')+rng('pw','Largura da calha',8,40,1,15,'cm')+rng('py','Lâmina d’água',3,20,0.5,5,'cm','Use no máximo metade da altura da calha')+rng('pi','Declividade da calha',0.5,2,0.1,0.5,'%')+sel('pn','Material da calha',[[0.011,'PVC, chapa metálica (n = 0,011)',1],[0.012,'Concreto alisado (n = 0,012)'],[0.013,'Concreto não alisado (n = 0,013)'],[0.015,'Alvenaria sem revestimento (n = 0,015)']])),
update(){const r=calc.pluvial(V_('pa'),V_('ph'),V_('pb'),V_('pI'),V_('pw'),V_('py'),V_('pi'),V_('pn')),uso=r.Q/r.Qc;
$('tiles').innerHTML=tiles([['Área',br(r.A)+' m²'],['Vazão de projeto',br(r.Q)+' L/min',1],['Capacidade da calha',br(r.Qc)+' L/min',1],['Condutor sugerido','Ø '+r.cond+' mm']])+(r.ok?`<span class="pill ok">Calha OK · ${br(uso*100,0)}% da capacidade</span>`:'<span class="pill alerta">Calha transborda · aumente largura, lâmina ou declividade</span>');
const a=V_('pa'),h=V_('ph');let s=T(30,20,'TELHADO EM CORTE','muted','font-size="10" letter-spacing="1"');
const tw=260,th=Math.max(10,110*h/Math.max(a,1)),tx=40,ty=170;s+=`<polygon points="${tx},${ty} ${tx+tw},${ty} ${tx},${ty-th}" style="fill:var(--line);stroke:var(--ink);stroke-width:1.5"/>`;
for(let k=0;k<5;k++)s+=Ln(tx+30+k*50,ty-th*(1-(30+k*50)/tw)-30,tx+22+k*50,ty-th*(1-(30+k*50)/tw)-14,'water',1.5);
s+=`<rect x="${tx+tw}" y="${ty-4}" width="22" height="18" style="fill:none;stroke:var(--ink);stroke-width:2"/>`+Ln(tx+tw+11,ty+14,tx+tw+11,250,'ink',6)+T(tx+tw+20,248,'Ø '+r.cond,'ink');
s+=T(tx+tw/2+30,ty+20,'a = '+br(a,1)+' m','muted','text-anchor="middle"')+T(tx,ty+20,'h = '+br(h,1)+' m','muted');
const cw=160,sc=cw/V_('pw'),ch=Math.max(V_('py')*2,V_('pw')*0.6)*sc,cx=400,cy=60,fill=Math.min(1.25,uso)*V_('py')*sc;

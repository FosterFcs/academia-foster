exemplos:[{"nivel": "facil", "titulo": "Preço de venda de 50 m² de piso", "html": "<p>Custo direto do piso cerâmico assentado: R$ 35,00 de material e R$ 25,00 de mão de obra com encargos, por m². BDI de 25%.</p><ol class=\"passos\"><li><b>Custo unitário.</b> 35 + 25 = <b>R$ 60,00/m²</b>.</li><li><b>Custo direto total.</b> 50 × 60 = <b>R$ 3.000,00</b>.</li><li><b>Preço de venda.</b> 3.000 × 1,25 = <b>R$ 3.750,00</b>, ou R$ 75,00/m².</li></ol>"}, {"nivel": "obra", "titulo": "Orçamento de um muro de divisa de 30 m", "html": "<p>Muro de 2 m de altura em bloco de concreto, com viga baldrame e reboco nas duas faces. BDI de 22%.</p><ol class=\"passos\"><li><b>Fundação.</b> 30 m de baldrame × R$ 120,00/m = <b>R$ 3.600,00</b>.</li><li><b>Alvenaria.</b> 30 × 2 = 60 m² × R$ 85,00 = <b>R$ 5.100,00</b>.</li><li><b>Chapisco e reboco.</b> 2 faces = 120 m² × R$ 32,00 = <b>R$ 3.840,00</b>.</li><li><b>Custo direto.</b> 3.600 + 5.100 + 3.840 = <b>R$ 12.540,00</b>.</li><li><b>Preço.</b> 12.540 × 1,22 = <b>R$ 15.298,80</b>.</li></ol><div class=\"dica\"><b>Quantitativo primeiro</b>Quase todo orçamento errado começa na medição. Confira as áreas pela planta e desconte vãos acima de 2 m² na alvenaria.</div>"}],
obra:{"intro": "O orçamento só vale se a obra for medida e acompanhada. Comparar o previsto com o realizado todo mês é o que separa obra com lucro de obra com prejuízo.", "erros": [["Esquecer itens indiretos", "Canteiro, água, luz, transporte de entulho, ART e limpeza final ficam fora da conta."], ["BDI aplicado duas vezes", "Composições que já incluem lucro recebem BDI de novo."], ["Usar preço de referência desatualizado", "Tabela de meses atrás não reflete o preço do aço ou do cimento hoje."], ["Não medir o que foi executado", "Pagar o empreiteiro \"por estimativa\" sem medir a etapa."]], "checklist": ["Quantitativos conferidos pela planta, com memória de cálculo", "Composições com referência e data base (SINAPI, TCPO ou própria)", "Encargos sociais e BDI declarados separadamente", "Itens indiretos incluídos: canteiro, ART, consumo de água e energia, entulho", "Cronograma físico-financeiro anexado ao orçamento", "Medição mensal comparando previsto e realizado"], "dica": "Guarde uma reserva de contingência (5% a 10%) separada do BDI para obras de reforma. Elas quase sempre revelam surpresas quando a parede é aberta."},
extras:[{nome:'Quantitativo de parede',
html:()=>`<p class="nota">Levantamento de blocos, argamassa de assentamento, chapisco e reboco de uma parede, já com perdas (5% nos blocos, 10% nas argamassas). Regra prática: o volume de argamassa mista é próximo ao volume de areia seca usada.</p>`+simWrap(`<div class="row">${rng('qpC','Comprimento',1,50,0.1,10,'m')}${rng('qpH','Altura',2,6,0.05,2.8,'m')}</div>`+rng('qpV','Vãos a descontar (portas e janelas)',0,30,0.1,3.2,'m²')+sel('qpB','Bloco',Object.keys(calc.BLOCOS).map((k,i)=>[k,k,i===1]))+rng('qpJ','Espessura da junta',0.5,2,0.1,1,'cm')+rng('qpR','Espessura do reboco',1,4,0.5,2,'cm','Interno 1,5 a 2 cm · externo 2 a 3 cm')+sel('qpF','Faces rebocadas',[[2,'As duas faces',1],[1,'Uma face']])+sel('qpT','Traço da argamassa (cimento : cal : areia)',[['1:2:8','1 : 2 : 8 (assentamento e reboco interno)',1],['1:1:6','1 : 1 : 6 (reboco externo)'],['1:0:4','1 : 0 : 4 (sem cal)']])),
update(){const tr=$('qpT').value.split(':').map(Number),r=calc.parede(V_('qpC'),V_('qpH'),V_('qpV'),$('qpB').value,V_('qpJ'),V_('qpR'),+$('qpF').value,tr);
  $('tiles').innerHTML=tiles([['Área líquida',br(r.A,2)+' m²'],['Blocos',br(r.blocos,0)+' un',1],['Argamassa total',br(r.Vass+r.Vreb,2)+' m³'],['Cimento / cal / areia',`${r.sacosC} sc · ${r.sacosCal} sc · ${br(r.areia,2)} m³`,1]]);
  const [cb,ab]=calc.BLOCOS[$('qpB').value],L=V_('qpC'),H=V_('qpH'),sc=Math.min(500/L,200/H),ox=40,oy=40,W=L*sc,Hh=H*sc,bw=(cb/100+V_('qpJ')/100)*sc,bh=(ab/100+V_('qpJ')/100)*sc;
  let s=T_('ELEVAÇÃO DA PAREDE',ox,18)+`<clipPath id="qpcl"><rect x="${ox}" y="${oy}" width="${W}" height="${Hh}"/></clipPath><g clip-path="url(#qpcl)"><rect x="${ox}" y="${oy}" width="${W}" height="${Hh}" style="fill:var(--amber);opacity:.25"/>`;
  if(bh>2.5){let row=0;for(let y=oy+Hh;y>oy-bh;y-=bh,row++){s+=Ln(ox,y,ox+W,y,'line',0.6);if(bw>2.5)for(let x=ox+(row%2?bw/2:0);x<ox+W;x+=bw)s+=Ln(x,y,x,y-bh,'line',0.6)}}
  const va=Math.min(V_('qpV'),L*H*0.8);if(va>0){const vw=Math.min(W*0.5,Math.sqrt(va)*sc*1.1),vh=Math.min(Hh*0.8,va*sc*sc/vw);s+=`<rect x="${ox+W/2-vw/2}" y="${oy+Hh-vh}" width="${vw}" height="${vh}" style="fill:var(--sheet);stroke:var(--ink);stroke-width:1.5"/>`+T(ox+W/2,oy+Hh-vh/2+4,'vãos '+br(V_('qpV'),1)+' m²','muted','text-anchor="middle" font-size="10"')}
  s+=`</g><rect x="${ox}" y="${oy}" width="${W}" height="${Hh}" style="fill:none;stroke:var(--ink);stroke-width:2"/>`+T(ox+W/2,oy+Hh+16,br(L,2)+' m','muted','text-anchor="middle" font-size="10"')+T(ox+W+6,oy+Hh/2,br(H,2)+' m','muted','font-size="10"');
  $('draw').innerHTML=SVG(640,oy+Hh+30,'Elevação da parede com os blocos',s);
  $('memorial').textContent=`1) Área = ${br(L,2)} × ${br(H,2)} − ${br(V_('qpV'),2)} = ${br(r.A,2)} m²
2) Blocos: 1 / ((${cb} + ${br(V_('qpJ'),1)}) × (${ab} + ${br(V_('qpJ'),1)}) cm²) = ${br(r.nb,2)} un/m² → ${br(r.A*r.nb,0)} + 5% = ${r.blocos} un
3) Assentamento: (1 − área dos blocos) × espessura da parede + 10% = ${br(r.Vass,3)} m³
4) Reboco: ${br(r.A,2)} m² × ${+$('qpF').value} face(s) × ${br(V_('qpR'),1)} cm + 10% = ${br(r.Vreb,3)} m³ · chapisco 1:3 com 5 mm = ${br(r.Vch,3)} m³
5) Traço ${tr.join(' : ')} em volume: areia ≈ volume de argamassa → cimento = V × ${tr[0]}/${tr[2]} × 1.420 kg/m³ · cal = V × ${tr[1]}/${tr[2]} × 600 kg/m³
6) Cimento ${br(r.cim,0)} kg = ${r.sacosC} sacos de 50 kg · cal ${br(r.cal,0)} kg = ${r.sacosCal} sacos de 20 kg · areia ${br(r.areia,2)} m³
   Estimativa de compra. Composições oficiais (SINAPI/TCPO) trazem coeficientes próprios para cada serviço.`;}}],
sim:{nome:'Composição e BDI',itens:[{n:'Bloco cerâmico 14×19×39',u:'un',coef:13,preco:3.10},{n:'Argamassa de assentamento',u:'m³',coef:0.012,preco:520},{n:'Pedreiro (com encargos)',u:'h',coef:0.85,preco:32},{n:'Servente (com encargos)',u:'h',coef:0.85,preco:24}],
html(){return simWrap(rng('oB','BDI',0,40,0.5,25,'%')+rng('oQ','Quantidade de serviço',1,500,1,100,'m²'),'<div class="tbl-wrap"><table class="ed"><thead><tr><th>Insumo</th><th>Un</th><th>Coef.</th><th>Preço (R$)</th><th>Subtotal</th></tr></thead><tbody id="orBody"></tbody></table></div>')},
init(){const self=this;$('orBody').innerHTML=this.itens.map((it,i)=>`<tr><td>${it.n}</td><td>${it.u}</td><td><input type="number" step="0.001" id="orC${i}" value="${it.coef}" aria-label="Coeficiente de ${it.n}"></td><td><input type="number" step="0.01" id="orP${i}" value="${it.preco}" aria-label="Preço de ${it.n}"></td><td class="num" id="orS${i}"></td></tr>`).join('');
$('orBody').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{const i=+inp.id.slice(3);self.itens[i][inp.id[2]==='C'?'coef':'preco']=parseFloat(inp.value.replace(',','.'))||0;self.update()})},
update(){const bdi=V_('oB'),qtd=V_('oQ'),r=calc.orcamento(this.itens,bdi,qtd);
r.linhas.forEach((l,i)=>{$('orS'+i).textContent=R$(l.sub)});
$('tiles').innerHTML=tiles([['Custo unitário',R$(r.cu)+'/m²'],['Preço c/ BDI',R$(r.pu)+'/m²',1],['BDI em R$',R$(r.pu-r.cu)+'/m²'],['Total',R$(r.total)]]);
const cores=['amber','steel','pos','water'];let s=T(30,20,'COMPOSIÇÃO DO PREÇO UNITÁRIO','muted','font-size="10" letter-spacing="1"'),xx=30;const tot=r.pu||1;
r.linhas.forEach((l,i)=>{const w=580*l.sub/tot;s+=`<rect x="${xx}" y="36" width="${w}" height="36" style="fill:var(--${cores[i%4]});opacity:.85"/>`;xx+=w});
s+=`<rect x="${xx}" y="36" width="${580*(r.pu-r.cu)/tot}" height="36" style="fill:var(--neg);opacity:.75"/>`;
[...r.linhas.map((l,i)=>[l.n,l.sub,cores[i%4]]),['BDI ('+br(bdi,1)+'%)',r.pu-r.cu,'neg']].forEach(([n,v,c],i)=>{const y=100+i*26;s+=`<rect x="30" y="${y-11}" width="12" height="12" style="fill:var(--${c})"/>`+T(50,y,n,'ink')+T(470,y,R$(v),'ink','text-anchor="end"')+T(590,y,br(100*v/tot,1)+'%','muted','text-anchor="end"')});
$('draw').innerHTML=SVG(640,100+26*(r.linhas.length+1),'Participação de cada insumo no preço',s);
let m='';r.linhas.forEach(l=>{m+=`${l.n.padEnd(28)} ${br(l.coef,3).padStart(8)} ${l.u.padEnd(3)} × ${R$(l.preco).padStart(12)} = ${R$(l.sub).padStart(12)}\n`});
m+=`${'Custo unitário'.padEnd(28)} ${''.padStart(31)}= ${R$(r.cu).padStart(12)}\nPreço = ${R$(r.cu)} × (1 + ${br(bdi,1)}%) = ${R$(r.pu)}/m²\nTotal = ${R$(r.pu)} × ${qtd} m² = ${R$(r.total)}`;$('memorial').textContent=m;}}
});

// LJ-09 · Lajes
Academia.modulo('lj',{
teoria:`<p>A laje é o piso. Ela recebe tudo o que está em cima (pessoas, móveis, contrapiso, piso) e entrega esse peso para as vigas em volta. Entender esse caminho da carga é o primeiro passo para dimensionar qualquer estrutura.</p>
<figure class="fig"><svg viewBox="0 0 640 208" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Divisão da carga da laje entre as vigas pelas charneiras"><rect x="60" y="30" width="300" height="150" style="fill:var(--grid);stroke:var(--ink);stroke-width:3" /><path d="M60 30 L135 105 L285 105 L360 30" style="fill:none;stroke:var(--neg);stroke-width:1.5" stroke-dasharray="5 4"/><path d="M60 180 L135 105 M285 105 L360 180" style="fill:none;stroke:var(--neg);stroke-width:1.5" stroke-dasharray="5 4"/><text x="210" y="70" style="fill:var(--ink)" text-anchor="middle" font-size="10">trapézio → viga longa</text><text x="95" y="110" style="fill:var(--ink)" text-anchor="middle" font-size="10">triângulo</text><text x="210" y="196" style="fill:var(--muted)" text-anchor="middle">ly</text><text x="48" y="110" style="fill:var(--muted)" text-anchor="end">lx</text><text x="400" y="60" style="fill:var(--ink)" font-size="11" font-weight="600">Charneiras a 45° dividem a laje</text><text x="400" y="80" style="fill:var(--muted)" font-size="10">em áreas que vão para cada viga.</text><text x="400" y="110" style="fill:var(--ink)" font-size="10">λ = ly / lx ≤ 2 → armada em cruz</text><text x="400" y="128" style="fill:var(--ink)" font-size="10">λ > 2 → armada em uma direção</text></svg><figcaption>Divisão da carga da laje entre as vigas pelas charneiras</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Laje maciça</h4><p>Placa de concreto armado cheia. Funciona bem em vãos médios e apoia nas quatro vigas.</p></div>
<div class="conceito"><h4>Laje treliçada</h4><p>Vigotas pré-moldadas com lajota ou EPS. Muito usada em casas. Trabalha numa direção só.</p></div>
<div class="conceito"><h4>Cargas (NBR 6120)</h4><p>Peso próprio (concreto: 25 kN/m³), revestimentos e a sobrecarga de uso, que depende do tipo de ambiente.</p></div></div>
<h3>Montando a carga total</h3>
<div class="formula">Peso próprio = 25 × h (h em m)     Ex.: laje de 10 cm → 2,5 kN/m²</div>
<div class="formula">p = peso próprio + revestimento + sobrecarga   (kN/m²)</div>
<h3>Uma ou duas direções?</h3>
<div class="formula">λ = ly / lx  (lado maior ÷ lado menor)     λ ≤ 2: armada em cruz · λ &gt; 2: armada em uma direção</div>
<h3>Método das charneiras (bordas iguais)</h3>
<p>Traçamos linhas a 45° saindo dos cantos. A laje fica dividida em 2 triângulos (lados curtos) e 2 trapézios (lados longos). Cada viga recebe o peso da área que está encostada nela.</p>
<div class="formula">Viga do lado curto: q = p · lx / 4     Viga do lado longo: q = p · (lx·ly/2 − lx²/4) / ly</div>
<div class="dica"><b>Na obra</b>Laje treliçada apoia só nas vigas perpendiculares às vigotas. Inverter o sentido das vigotas muda completamente a carga nas vigas.</div><h3>Momentos e armadura</h3><p>Com as reações nas vigas resolvidas, falta o aço da própria laje. Em lajes apoiadas nos quatro lados, a teoria de placas dá os momentos no centro: M = μ · p · lx². A calculadora <b>Momentos e armadura</b> usa a solução exata de Navier e escolhe bitola e espaçamento por metro.</p>`,
exemplo:`<h3>Sala de 4 × 5 m com laje maciça de 10 cm</h3><p>Uso residencial, com contrapiso e piso cerâmico.</p>
<ol class="passos"><li><b>Peso próprio.</b> 25 × 0,10 = <b>2,5 kN/m²</b>.</li>
<li><b>Revestimento.</b> Contrapiso + piso + reboco do teto ≈ <b>1,0 kN/m²</b>.</li>
<li><b>Sobrecarga.</b> Residencial (salas e quartos): <b>1,5 kN/m²</b>.</li>
<li><b>Carga total.</b> p = 2,5 + 1,0 + 1,5 = <b>5,0 kN/m²</b>. λ = 5/4 = 1,25 → armada em cruz.</li>
<li><b>Vigas de 4 m (lado curto).</b> q = 5,0 × 4 / 4 = <b>5,0 kN/m</b>.</li>
<li><b>Vigas de 5 m (lado longo).</b> Área do trapézio = 4 × 5/2 − 4²/4 = 6,0 m² → q = 5,0 × 6 / 5 = <b>6,0 kN/m</b>.</li>
<li><b>Conferência.</b> 2 × 5,0 × 4 + 2 × 6,0 × 5 = 100 kN = 5,0 × 20 m² ✓</li></ol>
<div class="dica"><b>Próximo passo</b>Essas cargas entram no módulo RM-01 para achar o momento das vigas.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Laje quadrada de 3 × 3 m", "html": "<p>Laje maciça de 10 cm, revestimento de 1,0 kN/m² e uso residencial de 1,5 kN/m².</p><ol class=\"passos\"><li><b>Peso próprio.</b> 25 × 0,10 = <b>2,5 kN/m²</b>.</li><li><b>Carga total.</b> p = 2,5 + 1,0 + 1,5 = <b>5,0 kN/m²</b>.</li><li><b>λ = 1,0.</b> Laje armada em cruz.</li><li><b>Charneiras a 45°.</b> Cada viga recebe um triângulo de área 3 × 1,5 / 2 = 2,25 m². q = 5,0 × 2,25 / 3 = <b>3,75 kN/m</b> em todas as vigas.</li></ol>"}, {"nivel": "obra", "titulo": "Laje de corredor de 3 × 7 m", "html": "<p>Mesma laje de 10 cm (p = 5,0 kN/m²), agora num corredor de 3 × 7 m.</p><ol class=\"passos\"><li><b>Relação dos lados.</b> λ = 7 / 3 = <b>2,33</b> &gt; 2 → laje armada em <b>uma direção</b>. A armadura principal vence os 3 m.</li><li><b>Vigas curtas (3 m).</b> Triângulos: q = <b>3,75 kN/m</b>.</li><li><b>Vigas longas (7 m).</b> Trapézios de área (7 + 4) / 2 × 1,5 = 8,25 m². q = 5,0 × 8,25 / 7 = <b>5,89 kN/m</b>.</li><li><b>Consequência.</b> As vigas longas recebem 57% mais carga por metro e têm vão maior. São elas que pedem mais altura.</li></ol><div class=\"dica\"><b>Na obra</b>Em laje armada numa direção, confira se a armadura principal foi colocada no sentido do menor vão. Invertida, a laje fissura e deforma.</div>"}],
obra:{"intro": "A laje é a peça que mais sofre com escoramento mal feito e desforma apressada. A maior parte das flechas e trincas em lajes nasce na obra, e não no projeto.", "erros": [["Escoramento sem contraventamento", "Escoras soltas ou apoiadas em solo mole cedem durante a concretagem."], ["Desforma antes do tempo", "Retirar as escoras cedo provoca flecha permanente e fissuras."], ["Armadura negativa pisoteada", "O aço de cima desce durante o lançamento e perde a função sobre as vigas."], ["Laje treliçada sem contraflecha", "Vãos maiores sem contraflecha ficam visivelmente \"barrigudos\"."]], "checklist": ["Escoras aprumadas, contraventadas e apoiadas em base firme (tábua ou calço)", "Contraflecha conferida em lajes treliçadas conforme o fabricante ou projeto", "Tubulações elétricas e hidráulicas passadas antes da concretagem, sem cortar nervuras", "Armadura negativa sobre caranguejos, com caminhos de tábua para circulação", "Espessura da capa conferida com gabarito durante o lançamento", "Cura por molhagem nos primeiros 7 dias", "Retirada das escoras só no prazo do projeto e sem retirar todas de uma vez"], "dica": "Deixe algumas escoras de reescoramento no meio dos vãos depois da desforma. Elas protegem a laje enquanto ela ainda recebe as cargas da obra."},
extras:[{nome:'Momentos e armadura',
html:()=>`<p class="nota">Laje maciça apoiada nos quatro lados. Em cruz, os momentos vêm da solução exata da teoria de placas (série de Navier, ν = 0,2). Com λ &gt; 2, a laje é calculada como uma faixa de 1 m.</p>`+simWrap(`<div class="row">${rng('lmA','Lado 1',2,8,0.05,4,'m')}${rng('lmB','Lado 2',2,8,0.05,5,'m')}</div>`+rng('lmH','Espessura h',7,20,0.5,10,'cm')+rng('lmG','Revestimento e contrapiso',0.5,3,0.1,1,'kN/m²')+rng('lmQ','Sobrecarga de uso',1,5,0.5,1.5,'kN/m²','NBR 6120: 1,5 em residências')+sel('lmF','Concreto',[[20,'C20'],[25,'C25',1],[30,'C30']])),
update(){const r=calc.lajeMomentos(V_('lmA'),V_('lmB'),V_('lmH'),V_('lmG'),V_('lmQ'),+$('lmF').value),h=V_('lmH');
  const tx=a=>a.inviavel?'aumente h':a.esc?`φ ${br(a.esc.f,a.esc.f%1?1:0)} c/ ${a.esc.s}`:'—';
  $('tiles').innerHTML=tiles([['λ = ly / lx',br(r.lam,2)+(r.uma?' (uma direção)':' (em cruz)')],['Mx / My',br(r.Mx,2)+' / '+(r.uma?'—':br(r.My,2))+' kN·m/m'],['Armadura no vão menor',tx(r.ax),1],[r.uma?'Distribuição':'Armadura no vão maior',tx(r.ay),1]])+`<span class="pill ${r.okF?'ok':'alerta'}">Flecha estimada ${br(r.wt,1)} mm ${r.okF?'≤':'>'} L/250 = ${br(r.lim,1)} mm</span>`;
  const sc=Math.min(300/r.ly,200/r.lx),W=r.ly*sc,H=r.lx*sc,ox=60,oy=40;
  let s=T_('PLANTA · ARMADURA POSITIVA (ESQUEMA)',ox,18)+`<rect x="${ox}" y="${oy}" width="${W}" height="${H}" style="fill:var(--grid);stroke:var(--ink);stroke-width:3"/>`;
  if(!r.ax.inviavel){const n=Math.min(16,Math.floor(100*r.ly/r.ax.esc.s));for(let i=1;i<n;i++){const x=ox+W*i/n;s+=Ln(x,oy+6,x,oy+H-6,'steel',1.2)}}
  if(r.ay&&r.ay.esc){const n=Math.min(12,Math.floor(100*r.lx/r.ay.esc.s));for(let i=1;i<n;i++){const y=oy+H*i/n;s+=Ln(ox+6,y,ox+W-6,y,'amber',1,'opacity=".8"')}}
  s+=T(ox+W/2,oy+H+18,'ly = '+br(r.ly,2)+' m','muted','text-anchor="middle" font-size="10"')+T(ox-8,oy+H/2,'lx = '+br(r.lx,2),'muted','text-anchor="end" font-size="10"');

  $('memorial').textContent=`lx = ${br(r.lx,2)} m · ly = ${br(r.ly,2)} m · λ = ${br(r.lam,3)} · h = ${h} cm
1) p = 25 × ${br(h/100,3)} + ${br(V_('lmG'),2)} + ${br(V_('lmQ'),2)} = ${br(r.p,2)} kN/m²
2) ${r.uma?`λ > 2: faixa de 1 m biapoiada → Mx = p·lx²/8 = ${br(r.Mx,3)} kN·m/m`:`Navier (4 bordas apoiadas, ν = 0,2): Mx = ${br(r.Mx/(r.p*r.lx*r.lx),4)} · p·lx² = ${br(r.Mx,3)} · My = ${br(r.My/(r.p*r.lx*r.lx),4)} · p·lx² = ${br(r.My,3)} kN·m/m`}
3) ${ar('Vão menor',r.ax,r.Mx)}
4) ${r.uma?`Distribuição: máx(20% de As ; 0,9 cm²/m ; 0,5 ρmín) = ${br(r.ay.Asf,2)} cm²/m → ${tx(r.ay)}`:ar('Vão maior (2ª camada)',r.ay,r.My)}
5) Flecha: Ecs = ${br(r.Ecs,0)} MPa · carga quase permanente g + 0,3q = ${br(r.ps,2)} kN/m² → imediata ${br(r.wi,2)} mm × 2,32 (fluência) = ${br(r.wt,2)} mm ${r.okF?'≤':'>'} ${br(r.lim,1)} mm
   Estimativa sem fissuração. Bordas engastadas e lajes contínuas pedem tabelas (Bares/Czerny) e armadura negativa.`;}}],
sim:{nome:'Cargas nas vigas',html:()=>simWrap(rng('lX','Lado menor lx',2,8,0.1,4,'m')+rng('lY','Lado maior ly',2,12,0.1,5,'m')+rng('lH','Espessura h',8,20,1,10,'cm')+rng('lR','Revestimento',0.5,2.5,0.1,1,'kN/m²','Contrapiso, piso, reboco do teto')+sel('lS','Uso (sobrecarga)',[[1.5,'Residencial: salas e quartos (1,5 kN/m²)',1],[2.5,'Escritórios (2,5 kN/m²)'],[3,'Corredores e escadas de uso comum (3,0 kN/m²)'],[1,'Cobertura só com manutenção (1,0 kN/m²)']],'Valores usuais. Confira a tabela da NBR 6120.')),

// MA-10 · Muros de Arrimo
Academia.modulo('ma',{
teoria:`<p>A terra atrás de um muro empurra o tempo todo. Esse empurrão se chama <b>empuxo</b>. O muro de gravidade resiste com o próprio peso: quanto mais pesado e largo na base, mais estável.</p>
<figure class="fig"><svg viewBox="0 0 640 206" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Muro de gravidade: o peso equilibra o empuxo triangular da terra"><path d="M200 30 L240 30 L280 190 L170 190Z" style="fill:var(--grid);stroke:var(--ink);stroke-width:2" /><path d="M240 30 L520 30 L520 190 L280 190Z" style="fill:var(--soil-fill);stroke:var(--none);stroke-width:0" /><line x1="240" y1="30" x2="520" y2="30" style="stroke:var(--soil);stroke-width:2" /><path d="M300 30 L300 190 L380 190Z" style="fill:var(--neg-fill);stroke:var(--neg);stroke-width:1.5" /><line x1="300" y1="137" x2="262" y2="137" style="stroke:var(--neg);stroke-width:2.2" /><path d="M268.4 134.3 L262 137 L268.4 139.7" style="fill:none;stroke:var(--neg);stroke-width:2.2" /><text x="390" y="180" style="fill:var(--neg)" font-size="10" font-weight="600">empuxo ativo: Ea = ½·Ka·γ·H²</text><text x="306" y="150" style="fill:var(--neg)" font-size="10">H/3</text><line x1="222" y1="90" x2="222" y2="150" style="stroke:var(--amber-ink);stroke-width:2.2" /><path d="M219.3 143.6 L222 150 L224.7 143.6" style="fill:none;stroke:var(--amber-ink);stroke-width:2.2" /><text x="160" y="120" style="fill:var(--amber-ink)" font-size="10" font-weight="600">peso W</text><line x1="140" y1="190" x2="320" y2="190" style="stroke:var(--ink);stroke-width:2" /><circle cx="255" cy="60" r="3" style="fill:var(--water);stroke:var(--water);stroke-width:1"/><circle cx="255" cy="100" r="3" style="fill:var(--water);stroke:var(--water);stroke-width:1"/><circle cx="255" cy="140" r="3" style="fill:var(--water);stroke:var(--water);stroke-width:1"/><text x="420" y="60" style="fill:var(--water)" font-size="10">dreno e barbacãs</text></svg><figcaption>Muro de gravidade: o peso equilibra o empuxo triangular da terra</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Empuxo ativo (Ea)</h4><p>A força da terra sobre o muro. Cresce com o quadrado da altura: um muro com o dobro da altura recebe quatro vezes mais empuxo.</p></div>
<div class="conceito"><h4>Ângulo de atrito (φ)</h4><p>Mede o quanto o solo se segura sozinho. Areias compactas têm φ alto; argilas moles, baixo.</p></div>
<div class="conceito"><h4>Tipos de muro</h4><p>Gravidade (concreto ciclópico, pedra, gabião), flexão (concreto armado em L) e solo grampeado.</p></div></div>
<h3>Fórmulas (Rankine, terrapleno horizontal)</h3>
<div class="formula">Ka = tg²(45° − φ/2)     Ea = ½ · Ka · γ · H²   aplicado a H/3 da base</div>
<h3>As três verificações</h3>
<div class="formula">Tombamento: FS = M resistente / M atuante ≥ 1,5 a 2,0</div>
<div class="formula">Deslizamento: FS = W · tg φ / Ea ≥ 1,5</div>
<div class="formula">Base: e = B/2 − (Mr − Mt)/W ≤ B/6   →  σmáx = (W/B)·(1 + 6e/B)</div>
<div class="dica"><b>O que mais derruba muro</b>Falta de drenagem. Água acumulada atrás do muro soma pressão hidrostática ao empuxo. Barbacãs, brita e manta geotêxtil são obrigatórios.</div>`,
exemplo:`<h3>Muro de concreto ciclópico com 3 m de altura</h3><p>Topo com 0,50 m, base com 1,80 m, face de trás vertical. Solo com γ = 18 kN/m³ e φ = 30°. Concreto ciclópico com 22 kN/m³. Cálculo por metro de muro.</p>
<ol class="passos"><li><b>Coeficiente.</b> Ka = tg²(45° − 15°) = tg²30° = <b>0,333</b>.</li>
<li><b>Empuxo.</b> Ea = 0,5 × 0,333 × 18 × 3² = <b>27,0 kN/m</b>, a 1,00 m da base.</li>
<li><b>Peso.</b> Triângulo: 1,30 × 3/2 × 22 = 42,9 kN. Retângulo: 0,50 × 3 × 22 = 33,0 kN. W = <b>75,9 kN/m</b>.</li>
<li><b>Tombamento.</b> Mr = 42,9 × 0,867 + 33,0 × 1,55 = 88,3 kN·m. Mt = 27 × 1,0 = 27,0. FS = <b>3,27</b> ✓</li>
<li><b>Deslizamento.</b> FS = 75,9 × tg30° / 27 = <b>1,62</b> ✓</li>
<li><b>Base.</b> e = 0,90 − (88,3 − 27,0)/75,9 = 0,09 m ≤ 0,30 ✓ → σmáx ≈ <b>55 kPa</b>.</li></ol>
<div class="dica"><b>Teste no simulador</b>Diminua a base para 1,20 m e veja qual verificação falha primeiro.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Muro de gravidade de 2 m em concreto ciclópico", "html": "<p>Altura de 2 m, topo de 0,40 m e base de 1,20 m. Solo com φ = 30° e γ = 18 kN/m³. Concreto ciclópico com 22 kN/m³.</p><ol class=\"passos\"><li><b>Empuxo.</b> Ka = 1/3. Ea = ½ × 1/3 × 18 × 2² = <b>12 kN/m</b>, a 0,67 m da base.</li><li><b>Peso do muro.</b> W = 22 × (0,40 + 1,20) / 2 × 2 = <b>35,2 kN/m</b>.</li><li><b>Tombamento.</b> FS = <b>3,37</b> ≥ 2,0 ✓</li><li><b>Deslizamento.</b> FS = <b>1,69</b> ≥ 1,5 ✓</li><li><b>Base.</b> e = 0,06 m ≤ B/6 = 0,20 ✓ · σmáx = <b>38,2 kPa</b>.</li></ol>"}, {"nivel": "obra", "titulo": "Gabião de 2,5 m para conter um aterro", "html": "<p>Muro de gabião com 2,5 m de altura, 1,0 m no topo e 2,0 m na base. Solo do aterro com φ = 32° e γ = 18 kN/m³.</p><ol class=\"passos\"><li><b>Empuxo.</b> Ka = 0,307. Ea = ½ × 0,307 × 17 × 2,5² = <b>17,3 kN/m</b>.</li><li><b>Peso do gabião.</b> Pedra com vazios: cerca de 17 kN/m³. W = <b>63,75 kN/m</b>.</li><li><b>Tombamento.</b> FS = <b>5,41</b> ✓</li><li><b>Deslizamento.</b> FS = <b>2,31</b> ✓</li><li><b>Vantagem na obra.</b> O gabião é permeável: drena sozinho e tolera pequenos recalques sem trincar.</li></ol><div class=\"dica\"><b>Geotêxtil</b>Atrás do gabião use manta geotêxtil. Sem ela, a terra do aterro entra nas pedras e entope a drenagem.</div>"}],
obra:{"intro": "Muro de arrimo cai quase sempre por água: dreno entupido, barbacã inexistente ou aterro encharcado. O projeto conta com o solo drenado.", "erros": [["Muro sem drenagem", "Sem barbacãs e dreno, a água acumula e o empuxo pode dobrar."], ["Reaterro com argila", "Aterrar atrás do muro com o solo argiloso da escavação, sem compactação nem material drenante."], ["Muro de bloco sem armadura", "Alvenaria de bloco empilhado como arrimo, sem projeto."], ["Sobrecarga não prevista", "Carro, casa ou piscina junto à crista do muro aumentam o empuxo."]], "checklist": ["Fundação do muro apoiada em solo firme, conferida na escavação", "Barbacãs com espaçamento do projeto (usual: a cada 1,5 m a 2 m)", "Dreno vertical de brita ou geocomposto atrás do muro, envolvido em geotêxtil", "Tubo dreno no pé do muro com saída livre", "Reaterro em camadas compactadas", "Canaleta na crista para desviar a água de chuva", "Nenhuma sobrecarga junto à crista além da prevista no projeto"], "dica": "Depois de uma chuva forte, olhe as barbacãs. Se não estiverem saindo água, o dreno pode estar entupido. Muro que \"sua\" pela face ou inclina para frente pede vistoria."},
sim:{html:()=>simWrap(rng('mH','Altura H',1,6,0.1,3,'m')+rng('mb','Largura do topo b',0.3,1.5,0.05,0.5,'m')+rng('mB','Largura da base B',0.5,4,0.05,1.8,'m')+rng('mF','Ângulo de atrito φ',20,40,1,30,'°')+rng('mG','Peso do solo γ',15,21,0.5,18,'kN/m³')+sel('mM','Material do muro',[[22,'Concreto ciclópico (22 kN/m³)',1],[24,'Concreto simples (24 kN/m³)'],[20,'Pedra argamassada (20 kN/m³)'],[17,'Gabião (17 kN/m³)']])),
update(){const H=V_('mH'),b=V_('mb'),r=calc.muro(H,b,V_('mB'),V_('mF'),V_('mG'),V_('mM')),B=r.B;
const pill=(c,t)=>`<span class="pill ${c?'ok':'alerta'}">${t}</span>`;
$('tiles').innerHTML=tiles([['Empuxo Ea',br(r.Ea)+' kN/m'],['Peso W',br(r.W)+' kN/m'],['FS tombamento',br(r.FSt),1],['FS deslizamento',br(r.FSd),1]])+`<div class="presets">${pill(r.FSt>=1.5,'Tombamento '+(r.FSt>=1.5?'OK':'falha'))}${pill(r.FSd>=1.5,'Deslizamento '+(r.FSd>=1.5?'OK':'falha'))}${pill(r.nucleo,r.nucleo?'Base comprimida':'Base com tração')}</div>`;
const sc=Math.min(260/H,220/B),gx=150,gy=40,Hs=H*sc,Bs=B*sc,bs=b*sc,base=gy+Hs;
let s=T(30,20,'CORTE · POR METRO DE MURO','muted','font-size="10" letter-spacing="1"');
const xBack=gx+Bs;s+=`<rect x="${xBack}" y="${gy}" width="${170}" height="${Hs}" style="fill:var(--soil-fill)"/>`;for(let k=0;k<6;k++)s+=Ln(xBack+20+k*26,gy+4,xBack+8+k*26,gy+16,'soil',1);
s+=`<polygon points="${gx},${base} ${xBack-bs},${gy} ${xBack},${gy} ${xBack},${base}" style="fill:var(--steel-soft);stroke:var(--ink);stroke-width:2"/>`;
s+=`<rect x="${gx-40}" y="${base}" width="${Bs+250}" height="14" style="fill:var(--soil-fill)"/>`;
const pk=Math.min(120,r.Ka*V_('mG')*H*8);s+=`<polygon points="${xBack},${gy} ${xBack},${base} ${xBack+pk},${base}" style="fill:var(--neg-fill);stroke:var(--neg)"/>`;
const ya=base-Hs/3;s+=Ln(xBack+pk+50,ya,xBack+6,ya,'neg',2.5)+`<path d="M${xBack+6} ${ya} l10 -6 v12z" style="fill:var(--neg)"/>`+T(xBack+pk+54,ya+4,'Ea = '+br(r.Ea,1),'neg','font-weight="600"');
const xc=gx+(r.W1*r.x1+r.W2*r.x2)/r.W*sc;s+=Ln(xc,gy+Hs*0.35,xc,gy+Hs*0.35+46,'ink',2.5)+`<path d="M${xc} ${gy+Hs*0.35+52} l-6 -10 h12z" style="fill:var(--ink)"/>`+T(xc+8,gy+Hs*0.35+20,'W = '+br(r.W,1),'ink','font-weight="600"');
const xR=gx+r.xr*sc;s+=`<circle cx="${xR}" cy="${base}" r="5" style="fill:var(--amber);stroke:var(--ink)"/>`+Ln(gx+Bs/3,base+20,gx+2*Bs/3,base+20,'pos',3)+T(gx+Bs/2,base+34,'terço central da base','pos','text-anchor="middle" font-size="10"');
s+=Ln(gx,base+44,xBack,base+44,'muted')+T(gx+Bs/2,base+58,'B = '+br(B)+' m','ink','text-anchor="middle"')+Ln(gx-24,gy,gx-24,base,'muted')+T(gx-30,gy+Hs/2,'H = '+br(H,1),'ink','text-anchor="end"');
$('draw').innerHTML=SVG(640,base+70,'Corte do muro de arrimo com empuxo e peso',s);
$('memorial').textContent=`1) Ka = tg²(45° − ${V_('mF')}°/2) = ${br(r.Ka,3)}
2) Ea = ½ × ${br(r.Ka,3)} × ${br(V_('mG'),1)} × ${br(H)}² = ${br(r.Ea)} kN/m  (a ${br(H/3)} m da base)
3) Peso: triângulo ${br(r.W1)} kN (braço ${br(r.x1,3)} m) + retângulo ${br(r.W2)} kN (braço ${br(r.x2,3)} m) = ${br(r.W)} kN/m
4) Tombamento: Mr = ${br(r.Mr)} kN·m · Mt = ${br(r.Mt)} kN·m → FS = ${br(r.FSt)} ${r.FSt>=1.5?'≥ 1,5 ✓':'< 1,5 ✗'}
5) Deslizamento: FS = ${br(r.W)} × tg${V_('mF')}° / ${br(r.Ea)} = ${br(r.FSd)} ${r.FSd>=1.5?'≥ 1,5 ✓':'< 1,5 ✗'}
6) Excentricidade: e = ${br(B/2)} − (${br(r.Mr)} − ${br(r.Mt)})/${br(r.W)} = ${br(r.e,3)} m ${r.nucleo?'≤':'>'} B/6 = ${br(B/6,3)} m
7) Tensões na base: σmáx = ${br(r.smax,1)} kPa · σmín = ${br(r.smin,1)} kPa${r.nucleo?'':'  (tração: aumente a base)'}
   Atrito na base adotado igual a tg φ (concreto moldado sobre o solo). Sem empuxo passivo e sem água.`;}}
});

// AP-11 · Águas Pluviais
Academia.modulo('ap',{
teoria:`<p>Toda a chuva que cai no telhado precisa sair por algum lugar. A calha recolhe a água e o condutor vertical leva até o chão. Se a calha for pequena, transborda e a água entra pela parede.</p>
<figure class="fig"><svg viewBox="0 0 640 222" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Telhado, calha e condutor: a área de contribuição considera a chuva inclinada"><path d="M60 150 L300 40 L540 150" style="fill:none;stroke:var(--ink);stroke-width:2.5" /><rect x="30" y="148" width="40" height="14" style="fill:var(--water-fill);stroke:var(--ink);stroke-width:1.5" /><line x1="50" y1="162" x2="50" y2="214" style="stroke:var(--steel);stroke-width:5" /><text x="80" y="180" style="fill:var(--muted)" font-size="10">calha</text><text x="60" y="214" style="fill:var(--muted)" font-size="10">condutor</text><line x1="150" y1="8" x2="135" y2="36" style="stroke:var(--water);stroke-width:1.3" /><path d="M135.6 29.0 L135 36 L140.4 31.6" style="fill:none;stroke:var(--water);stroke-width:1.3" /><line x1="210" y1="8" x2="195" y2="36" style="stroke:var(--water);stroke-width:1.3" /><path d="M195.6 29.0 L195 36 L200.4 31.6" style="fill:none;stroke:var(--water);stroke-width:1.3" /><line x1="270" y1="8" x2="255" y2="36" style="stroke:var(--water);stroke-width:1.3" /><path d="M255.6 29.0 L255 36 L260.4 31.6" style="fill:none;stroke:var(--water);stroke-width:1.3" /><line x1="330" y1="8" x2="315" y2="36" style="stroke:var(--water);stroke-width:1.3" /><path d="M315.6 29.0 L315 36 L320.4 31.6" style="fill:none;stroke:var(--water);stroke-width:1.3" /><line x1="390" y1="8" x2="375" y2="36" style="stroke:var(--water);stroke-width:1.3" /><path d="M375.6 29.0 L375 36 L380.4 31.6" style="fill:none;stroke:var(--water);stroke-width:1.3" /><line x1="450" y1="8" x2="435" y2="36" style="stroke:var(--water);stroke-width:1.3" /><path d="M435.6 29.0 L435 36 L440.4 31.6" style="fill:none;stroke:var(--water);stroke-width:1.3" /><text x="300" y="170" style="fill:var(--ink)" text-anchor="middle" font-weight="600">A = (a + h/2) × b</text><text x="300" y="188" style="fill:var(--ink)" text-anchor="middle">Q = I × A / 60  (L/min)</text><line x1="300" y1="40" x2="300" y2="150" style="stroke:var(--muted);stroke-width:1" stroke-dasharray="3 3"/><text x="306" y="100" style="fill:var(--muted)" >h</text><line x1="60" y1="150" x2="300" y2="150" style="stroke:var(--muted);stroke-width:1" stroke-dasharray="3 3"/><text x="180" y="146" style="fill:var(--muted)" >a</text></svg><figcaption>Telhado, calha e condutor: a área de contribuição considera a chuva inclinada</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Intensidade (I)</h4><p>Quantos milímetros de chuva caem por hora numa chuva forte. Depende da cidade e do período de retorno (5 anos para telhados).</p></div>
<div class="conceito"><h4>Área de contribuição</h4><p>A área do telhado que escoa para aquela calha. Em telhado inclinado, a altura da água também conta.</p></div>
<div class="conceito"><h4>Rugosidade (n)</h4><p>Coeficiente de Manning. PVC e metal: 0,011. Concreto alisado: 0,012. Alvenaria sem revestimento: 0,015.</p></div></div>
<h3>Fórmulas da NBR 10844</h3>
<div class="formula">Área de contribuição (telhado inclinado): A = (a + h/2) · b</div>
<div class="formula">Vazão de projeto: Q = I · A / 60     (Q em L/min, I em mm/h, A em m²)</div>
<div class="formula">Capacidade da calha (Manning): Q = 60.000 · (S/n) · Rh^(2/3) · i^(1/2)</div>
<div class="formula">Rh = S / P  (área molhada ÷ perímetro molhado)     declividade mínima da calha: 0,5%</div>
<div class="dica"><b>Condutor vertical</b>A norma exige diâmetro interno mínimo de 70 mm (na prática, tubo de 75 mm). O simulador usa uma regra prática de pré-dimensionamento; o dimensionamento final usa os ábacos da NBR 10844.</div>`,
exemplo:`<h3>Telhado de uma água com 10 m de comprimento</h3><p>Projeção horizontal de 5 m, altura de 1 m, chuva de 150 mm/h. Calha de PVC com 15 cm de largura e lâmina d'água de 5 cm, declividade 0,5%.</p>
<ol class="passos"><li><b>Área.</b> A = (5 + 1/2) × 10 = <b>55 m²</b>.</li>
<li><b>Vazão de projeto.</b> Q = 150 × 55 / 60 = <b>137,5 L/min</b>.</li>
<li><b>Geometria da calha.</b> S = 0,15 × 0,05 = 0,0075 m². P = 0,15 + 2 × 0,05 = 0,25 m. Rh = 0,030 m.</li>
<li><b>Capacidade.</b> Q = 60.000 × (0,0075/0,011) × 0,030<sup>2/3</sup> × 0,005<sup>1/2</sup> ≈ <b>279 L/min</b>.</li>
<li><b>Verificação.</b> 279 ≥ 137,5 ✓ A calha trabalha com cerca de metade da capacidade.</li></ol>
<div class="dica"><b>Confira no simulador</b>Os valores iniciais são os do exemplo.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Telhado de uma água com calha de 15 × 6", "html": "<p>Água de 4 m de projeção, 1,20 m de altura, 12 m de comprimento. Chuva de 150 mm/h. Calha retangular de PVC de 15 × 6 cm com declividade de 0,5%.</p><ol class=\"passos\"><li><b>Área de contribuição.</b> A = (4 + 1,2/2) × 12 = <b>55,2 m²</b>.</li><li><b>Vazão.</b> Q = 150 × 55,2 / 60 = <b>138 L/min</b>.</li><li><b>Capacidade da calha.</b> Por Manning, Qc ≈ <b>360 L/min</b> ✓</li><li><b>Condutor.</b> DN <b>100</b> atende com folga.</li></ol>"}, {"nivel": "obra", "titulo": "A calha que transborda", "html": "<p>Água de 6 m de projeção, 1,50 m de altura, 15 m de comprimento. Chuva de 180 mm/h. A calha existente é de 10 × 4 cm.</p><ol class=\"passos\"><li><b>Área.</b> A = (6 + 0,75) × 15 = <b>101,25 m²</b>.</li><li><b>Vazão.</b> Q = 180 × 101,25 / 60 = <b>303,75 L/min</b>.</li><li><b>Capacidade.</b> A calha de 10 × 4 leva cerca de <b>122 L/min</b>. ✗ Não atende: transborda em qualquer chuva forte.</li><li><b>Soluções.</b> Aumentar a calha, dividir o telhado em dois condutores (cada um com metade da área) ou aumentar a declividade. O condutor passa para <b>DN 125</b>, ou dois DN 100.</li></ol><div class=\"dica\"><b>Diagnóstico</b>Mancha de umidade no alto da parede, logo abaixo do beiral, costuma ser calha subdimensionada ou entupida, e não telha quebrada.</div>"}],
obra:{"intro": "Calha e condutor parecem detalhe, mas infiltração no forro e na parede é uma das reclamações mais comuns em casa nova. A execução vale tanto quanto o cálculo.", "erros": [["Calha sem caimento", "Calha instalada \"em nível\": a água empoça, acumula folhas e transborda."], ["Condutor ligado ao esgoto", "Água de chuva no esgoto sobrecarrega a rede e é proibido."], ["Rufo sem sobreposição", "Rufo curto ou sem vedação deixa a água correr por trás."], ["Sem grelha nem ralo hemisférico", "Folhas entram e entopem o condutor."]], "checklist": ["Calha com declividade mínima de 0,5% em direção aos bocais", "Bocais com ralo hemisférico ou grelha", "Condutores verticais com diâmetro do projeto e fixados a cada 2 m, no máximo", "Rufos e contrarrufos com sobreposição e vedação", "Água pluvial ligada à rede de drenagem, nunca ao esgoto", "Caixas de areia acessíveis no pé dos condutores", "Teste com mangueira antes da entrega"], "dica": "Antes de entregar a obra, faça o teste da mangueira: jogue água no telhado por 10 minutos e confira calhas, rufos e condutores. É mais fácil corrigir agora do que depois do forro pronto."},
extras:[{nome:'Microdrenagem (método racional)',
html:()=>`<p class="nota">Vazão de uma bacia pequena (até cerca de 2 km²) pelo método racional e diâmetro da galeria de concreto funcionando a seção plena, pela fórmula de Manning.</p>`+simWrap(sel('mdC2','Tipo de superfície (C)',[[0.9,'Telhados e asfalto (0,90)'],[0.7,'Área urbana densa (0,70)',1],[0.5,'Bairro residencial (0,50)'],[0.3,'Parques e lotes vazios (0,30)'],[0.2,'Gramados e matas (0,20)']])+rng('mdI','Intensidade da chuva i',50,250,5,120,'mm/h','Da curva IDF da cidade, com duração igual ao tempo de concentração')+rng('mdA','Área da bacia',0.1,50,0.1,2,'ha','1 ha = 10.000 m²')+rng('mdS','Declividade da galeria',0.2,5,0.1,1,'%')+sel('mdN','Material do tubo',[[0.013,'Concreto (n = 0,013)',1],[0.011,'PEAD corrugado (n = 0,011)']])),
update(){const Q=calc.racional(+$('mdC2').value,V_('mdI'),V_('mdA')),g=calc.galeria(Q,V_('mdS')/100,+$('mdN').value);
  $('tiles').innerHTML=tiles([['Vazão de projeto',br(Q*1000,0)+' L/s'],['Diâmetro teórico',br(g.D*1000,0)+' mm'],['Galeria adotada',g.DN?'DN '+br(g.DN*1000,0)+' mm':'acima de 2 m',1],['Velocidade a seção plena',g.DN?br(g.v,2)+' m/s':'—']])+(g.DN&&(g.v<0.6||g.v>5)?`<span class="pill alerta">Velocidade fora de 0,6 a 5 m/s: ajuste a declividade</span>`:g.DN?'<span class="pill ok">Velocidade dentro de 0,6 a 5 m/s</span>':'<span class="pill alerta">Vazão grande demais para galeria circular: use galeria celular</span>');
  let s=T_('SEÇÃO DA GALERIA',40,18);const R=g.DN?Math.min(90,40+40*g.DN):60,cx=150,cy=130,f=Math.min(1,Q/(g.Qp||Q));
  s+=`<circle cx="${cx}" cy="${cy}" r="${R+8}" style="fill:var(--grid);stroke:var(--ink);stroke-width:1.5"/><circle cx="${cx}" cy="${cy}" r="${R}" style="fill:var(--sheet);stroke:var(--ink)"/>`;
  const yw=cy+R-2*R*Math.min(0.94,0.15+0.79*f);s+=`<clipPath id="mdcl"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath><rect x="${cx-R}" y="${yw}" width="${2*R}" height="${cy+R-yw}" clip-path="url(#mdcl)" style="fill:var(--water-fill)"/>`+Ln(cx-R,yw,cx+R,yw,'water',1.5,'clip-path="url(#mdcl)"');
  s+=T(cx,cy+R+28,g.DN?'DN '+br(g.DN*1000,0)+' mm':'—','ink','text-anchor="middle" font-size="11" font-weight="600"');
  s+=usoBarras([['Vazão / capacidade a seção plena',g.Qp?Q/g.Qp:1.2,br(Q*1000,0)+' de '+br(g.Qp*1000,0)+' L/s']],320,60,280);
  $('draw').innerHTML=SVG(640,270,'Seção da galeria de águas pluviais',s);
  $('memorial').textContent=`1) Método racional: Q = C · i · A / 360 = ${br(+$('mdC2').value,2)} × ${br(V_('mdI'),0)} × ${br(V_('mdA'),2)} / 360 = ${br(Q,4)} m³/s (${br(Q*1000,1)} L/s)
2) Manning a seção plena: Q = 0,3117 · D^(8/3) · √S / n → D = (Q · n / (0,3117 √S))^(3/8) = ${br(g.D,3)} m
3) Diâmetro comercial: ${g.DN?'DN '+br(g.DN*1000,0)+' mm':'nenhum até 2 m'}${g.DN?` · capacidade ${br(g.Qp*1000,1)} L/s · v = ${br(g.v,2)} m/s`:''}
   Diâmetro mínimo usual de galeria: 400 mm. Na prática, o tempo de concentração define a duração da chuva na curva IDF.`;}}],
sim:{nome:'Calha e condutor',html:()=>simWrap(rng('pa','Projeção horizontal a',2,15,0.5,5,'m')+rng('ph','Altura do telhado h',0,4,0.1,1,'m')+rng('pb','Comprimento b',3,30,0.5,10,'m')+rng('pI','Intensidade de chuva I',100,250,5,150,'mm/h','Consulte a tabela da NBR 10844 para sua cidade')+rng('pw','Largura da calha',8,40,1,15,'cm')+rng('py','Lâmina d’água',3,20,0.5,5,'cm','Use no máximo metade da altura da calha')+rng('pi','Declividade da calha',0.5,2,0.1,0.5,'%')+sel('pn','Material da calha',[[0.011,'PVC, chapa metálica (n = 0,011)',1],[0.012,'Concreto alisado (n = 0,012)'],[0.013,'Concreto não alisado (n = 0,013)'],[0.015,'Alvenaria sem revestimento (n = 0,015)']])),
update(){const r=calc.pluvial(V_('pa'),V_('ph'),V_('pb'),V_('pI'),V_('pw'),V_('py'),V_('pi'),V_('pn')),uso=r.Q/r.Qc;
$('tiles').innerHTML=tiles([['Área',br(r.A)+' m²'],['Vazão de projeto',br(r.Q)+' L/min',1],['Capacidade da calha',br(r.Qc)+' L/min',1],['Condutor sugerido','Ø '+r.cond+' mm']])+(r.ok?`<span class="pill ok">Calha OK · ${br(uso*100,0)}% da capacidade</span>`:'<span class="pill alerta">Calha transborda · aumente largura, lâmina ou declividade</span>');
const a=V_('pa'),h=V_('ph');let s=T(30,20,'TELHADO EM CORTE','muted','font-size="10" letter-spacing="1"');
const tw=260,th=Math.max(10,110*h/Math.max(a,1)),tx=40,ty=170;s+=`<polygon points="${tx},${ty} ${tx+tw},${ty} ${tx},${ty-th}" style="fill:var(--line);stroke:var(--ink);stroke-width:1.5"/>`;
for(let k=0;k<5;k++)s+=Ln(tx+30+k*50,ty-th*(1-(30+k*50)/tw)-30,tx+22+k*50,ty-th*(1-(30+k*50)/tw)-14,'water',1.5);
s+=`<rect x="${tx+tw}" y="${ty-4}" width="22" height="18" style="fill:none;stroke:var(--ink);stroke-width:2"/>`+Ln(tx+tw+11,ty+14,tx+tw+11,250,'ink',6)+T(tx+tw+20,248,'Ø '+r.cond,'ink');
s+=T(tx+tw/2+30,ty+20,'a = '+br(a,1)+' m','muted','text-anchor="middle"')+T(tx,ty+20,'h = '+br(h,1)+' m','muted');
const cw=160,sc=cw/V_('pw'),ch=Math.max(V_('py')*2,V_('pw')*0.6)*sc,cx=400,cy=60,fill=Math.min(1.25,uso)*V_('py')*sc;
s+=T(cx,20,'SEÇÃO DA CALHA','muted','font-size="10" letter-spacing="1"');
s+=`<rect x="${cx}" y="${cy+ch-Math.min(fill,ch)}" width="${cw}" height="${Math.min(fill,ch)}" style="fill:var(--water-fill)"/>`;
s+=`<path d="M${cx} ${cy} V${cy+ch} H${cx+cw} V${cy}" style="fill:none;stroke:var(--ink);stroke-width:3"/>`+Ln(cx,cy+ch-V_('py')*sc,cx+cw,cy+ch-V_('py')*sc,'water',1.5,'stroke-dasharray="5 4"');
s+=T(cx+cw+6,cy+ch-V_('py')*sc+4,'lâmina máx.','water','font-size="10"')+T(cx+cw/2,cy+ch+18,br(V_('pw'),0)+' cm','muted','text-anchor="middle"')+T(cx+cw/2,cy+ch+34,'nível com a chuva de projeto: '+br(uso*100,0)+'%',r.ok?'pos':'neg','text-anchor="middle"');
$('draw').innerHTML=SVG(640,Math.max(270,cy+ch+50),'Telhado em corte e seção da calha',s);
$('memorial').textContent=`1) A = (a + h/2) · b = (${br(a)} + ${br(h)}/2) × ${br(V_('pb'))} = ${br(r.A)} m²
2) Q = I · A / 60 = ${br(V_('pI'),0)} × ${br(r.A)} / 60 = ${br(r.Q)} L/min
3) S = ${br(V_('pw')/100,3)} × ${br(V_('py')/100,3)} = ${br(r.S,5)} m²   P = ${br(r.P,3)} m   Rh = ${br(r.Rh,4)} m
4) Qcalha = 60.000 × (${br(r.S,5)}/${br(V_('pn'),3)}) × ${br(r.Rh,4)}^(2/3) × ${br(V_('pi')/100,3)}^(1/2) = ${br(r.Qc)} L/min
5) ${br(r.Qc)} ${r.ok?'≥':'<'} ${br(r.Q)} → ${r.ok?'calha atende':'calha NÃO atende'}
6) Condutor (regra prática 1 cm² por m² de telhado): Ø ≈ ${br(r.dPrat,0)} mm → adotar ${r.cond} mm (mínimo da norma: 70 mm)`;}}
});

// PL-12 · Planejamento de Obras
Academia.modulo('pl',{
teoria:`<p>Uma obra é uma sequência de atividades que dependem umas das outras: não dá para rebocar antes de levantar a parede. O planejamento descobre o prazo total e, principalmente, quais atividades seguram a obra inteira.</p>
<figure class="fig"><svg viewBox="0 0 640 206" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Rede de atividades e caminho crítico"><line x1="104" y1="94.0" x2="236" y2="56.0" style="stroke:var(--neg);stroke-width:2.2" /><path d="M230.6 60.4 L236 56.0 L229.1 55.2" style="fill:none;stroke:var(--neg);stroke-width:2.2" /><line x1="104" y1="106.0" x2="236" y2="144.0" style="stroke:var(--line);stroke-width:1.4" /><path d="M229.1 144.8 L236 144.0 L230.6 139.6" style="fill:none;stroke:var(--line);stroke-width:1.4" /><line x1="284" y1="56.0" x2="416" y2="94.0" style="stroke:var(--neg);stroke-width:2.2" /><path d="M409.1 94.8 L416 94.0 L410.6 89.6" style="fill:none;stroke:var(--neg);stroke-width:2.2" /><line x1="284" y1="144.0" x2="416" y2="106.0" style="stroke:var(--line);stroke-width:1.4" /><path d="M410.6 110.4 L416 106.0 L409.1 105.2" style="fill:none;stroke:var(--line);stroke-width:1.4" /><line x1="464" y1="100.0" x2="556" y2="100.0" style="stroke:var(--neg);stroke-width:2.2" /><path d="M549.6 102.7 L556 100.0 L549.6 97.3" style="fill:none;stroke:var(--neg);stroke-width:2.2" /><circle cx="80" cy="100" r="20" style="fill:var(--sheet);stroke:var(--neg);stroke-width:2"/><text x="80" y="104" style="fill:var(--ink)" text-anchor="middle" font-weight="600">A</text><circle cx="260" cy="50" r="20" style="fill:var(--sheet);stroke:var(--neg);stroke-width:2"/><text x="260" y="54" style="fill:var(--ink)" text-anchor="middle" font-weight="600">B</text><circle cx="260" cy="150" r="20" style="fill:var(--sheet);stroke:var(--ink);stroke-width:2"/><text x="260" y="154" style="fill:var(--ink)" text-anchor="middle" font-weight="600">C</text><circle cx="440" cy="100" r="20" style="fill:var(--sheet);stroke:var(--neg);stroke-width:2"/><text x="440" y="104" style="fill:var(--ink)" text-anchor="middle" font-weight="600">D</text><circle cx="580" cy="100" r="20" style="fill:var(--sheet);stroke:var(--neg);stroke-width:2"/><text x="580" y="104" style="fill:var(--ink)" text-anchor="middle" font-weight="600">Fim</text><text x="260" y="196" style="fill:var(--neg)" text-anchor="middle" font-size="10">caminho crítico (vermelho): a maior sequência define o prazo</text></svg><figcaption>Rede de atividades e caminho crítico</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Dependência</h4><p>A atividade só começa quando as anteriores terminam (relação término-início, a mais comum).</p></div>
<div class="conceito"><h4>Folga</h4><p>Quantos dias uma atividade pode atrasar sem atrasar a obra. Folga = início mais tarde − início mais cedo.</p></div>
<div class="conceito"><h4>Caminho crítico</h4><p>A sequência de atividades com folga zero. É ela que define o prazo. Atrasou ali, atrasou a obra.</p></div></div>
<h3>Como o cálculo funciona (CPM)</h3>
<div class="formula">Ida: início cedo = maior término cedo das antecessoras    término cedo = início + duração</div>
<div class="formula">Volta: término tarde = menor início tarde das sucessoras    início tarde = término − duração</div>
<div class="formula">PERT (duração incerta): te = (otimista + 4 × mais provável + pessimista) / 6</div>
<div class="dica"><b>Na obra</b>Equipe extra numa atividade com folga não adianta nada no prazo. Para acelerar a obra, reforce o caminho crítico.</div>`,
exemplo:`<h3>Casa térrea com 9 etapas</h3><p>As durações estão em dias úteis. A cobertura e as instalações começam juntas depois da alvenaria.</p>
<ol class="passos"><li><b>Ida.</b> A (0–5) → B (5–15) → C (15–35) → D (35–50). E (50–58) e F (50–62) em paralelo.</li>
<li><b>Revestimentos (G).</b> Dependem de E e F: começam no maior término, 62, e vão até 76.</li>
<li><b>Esquadrias (H).</b> Dependem só de E: 58–64.</li>
<li><b>Pintura (I).</b> Depende de G e H: começa em 76 e termina em <b>84 dias</b>.</li>
<li><b>Folgas.</b> E tem 4 dias de folga e H tem 12. As demais têm folga zero.</li>
<li><b>Caminho crítico.</b> <b>A → B → C → D → F → G → I</b>. As instalações (F) são críticas; a cobertura (E), não.</li></ol>
<div class="dica"><b>Teste no simulador</b>Aumente a cobertura (E) para 13 dias e veja o caminho crítico mudar.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Quatro atividades", "html": "<p>A (3 dias), B (5 dias, depois de A), C (2 dias, depois de A) e D (4 dias, depois de B e C).</p><ol class=\"passos\"><li><b>Ida.</b> A: 0–3. B: 3–8. C: 3–5. D começa quando B e C terminam: 8–12.</li><li><b>Prazo.</b> <b>12 dias</b>.</li><li><b>Caminho crítico.</b> A → B → D (3 + 5 + 4 = 12).</li><li><b>Folga de C.</b> C pode terminar até o dia 8 sem atrasar D: folga = 8 − 5 = <b>3 dias</b>.</li></ol>"}, {"nivel": "obra", "titulo": "Casa térrea em 9 etapas", "html": "<p>Sequência resumida: fundação (15 d) → alvenaria (25 d) → laje (10 d) → telhado (12 d). Em paralelo, depois da laje: instalações (15 d) e, depois das instalações, reboco (15 d). Esquadrias (5 d) dependem do reboco. Piso (12 d) depende do reboco e do telhado. Pintura (10 d) depende de esquadrias e piso.</p><ol class=\"passos\"><li><b>Ida.</b> Fundação 0–15, alvenaria 15–40, laje 40–50, telhado 50–62, instalações 50–65, reboco 65–80, esquadrias 80–85, piso 80–92, pintura 92–102.</li><li><b>Prazo.</b> <b>102 dias</b>.</li><li><b>Caminho crítico.</b> fundação → alvenaria → laje → instalações → reboco → piso → pintura.</li><li><b>Folgas.</b> Telhado: termina em 62, mas o piso só começa em 80 → folga de 18 dias. Esquadrias: folga de 7 dias.</li><li><b>Decisão.</b> Para ganhar prazo, reforce a equipe de instalações ou de reboco. Acelerar o telhado não adianta nada.</li></ol><div class=\"dica\"><b>Use a folga</b>Equipes de atividades com folga podem ser remanejadas para as críticas sem atrasar a obra.</div>"}],

const x0=170,x1=610,sx=d=>x0+(x1-x0)*d/(r.total||1),rh=26,y0=40;let s=T(30,20,'CRONOGRAMA (GANTT)','muted','font-size="10" letter-spacing="1"');

Academia.modulo('et',{
teoria:`<p>Quando o solo bom está fundo, a estaca leva a carga até lá. Ela resiste de dois jeitos: pela <b>ponta</b>, que se apoia na camada resistente, e pelo <b>atrito lateral</b>, o solo "abraçando" o fuste ao longo de todo o comprimento.</p>
<figure class="fig"><svg viewBox="0 0 640 236" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Estaca: a carga é resistida pelo atrito ao longo do fuste e pela ponta"><rect x="20" y="40" width="600" height="42" style="fill:var(--grid);stroke:none;stroke-width:0" opacity=".5"/><rect x="20" y="82" width="600" height="42" style="fill:var(--soil-fill);stroke:none;stroke-width:0" opacity=".5"/><rect x="20" y="124" width="600" height="42" style="fill:var(--grid);stroke:none;stroke-width:0" opacity=".5"/><rect x="20" y="166" width="600" height="42" style="fill:var(--soil-fill);stroke:none;stroke-width:0" opacity=".5"/><line x1="20" y1="40" x2="620" y2="40" style="stroke:var(--soil);stroke-width:2" /><rect x="200" y="20" width="120" height="24" style="fill:var(--grid);stroke:var(--ink);stroke-width:2" /><rect x="240" y="44" width="40" height="160" style="fill:var(--grid);stroke:var(--ink);stroke-width:2" /><line x1="232" y1="70" x2="232" y2="90" style="stroke:var(--steel);stroke-width:1.4" /><path d="M229.3 83.6 L232 90 L234.7 83.6" style="fill:none;stroke:var(--steel);stroke-width:1.4" /><line x1="288" y1="70" x2="288" y2="90" style="stroke:var(--steel);stroke-width:1.4" /><path d="M285.3 83.6 L288 90 L290.7 83.6" style="fill:none;stroke:var(--steel);stroke-width:1.4" /><line x1="232" y1="98" x2="232" y2="118" style="stroke:var(--steel);stroke-width:1.4" /><path d="M229.3 111.6 L232 118 L234.7 111.6" style="fill:none;stroke:var(--steel);stroke-width:1.4" /><line x1="288" y1="98" x2="288" y2="118" style="stroke:var(--steel);stroke-width:1.4" /><path d="M285.3 111.6 L288 118 L290.7 111.6" style="fill:none;stroke:var(--steel);stroke-width:1.4" /><line x1="232" y1="126" x2="232" y2="146" style="stroke:var(--steel);stroke-width:1.4" /><path d="M229.3 139.6 L232 146 L234.7 139.6" style="fill:none;stroke:var(--steel);stroke-width:1.4" /><line x1="288" y1="126" x2="288" y2="146" style="stroke:var(--steel);stroke-width:1.4" /><path d="M285.3 139.6 L288 146 L290.7 139.6" style="fill:none;stroke:var(--steel);stroke-width:1.4" /><line x1="232" y1="154" x2="232" y2="174" style="stroke:var(--steel);stroke-width:1.4" /><path d="M229.3 167.6 L232 174 L234.7 167.6" style="fill:none;stroke:var(--steel);stroke-width:1.4" /><line x1="288" y1="154" x2="288" y2="174" style="stroke:var(--steel);stroke-width:1.4" /><path d="M285.3 167.6 L288 174 L290.7 167.6" style="fill:none;stroke:var(--steel);stroke-width:1.4" /><line x1="232" y1="182" x2="232" y2="202" style="stroke:var(--steel);stroke-width:1.4" /><path d="M229.3 195.6 L232 202 L234.7 195.6" style="fill:none;stroke:var(--steel);stroke-width:1.4" /><line x1="288" y1="182" x2="288" y2="202" style="stroke:var(--steel);stroke-width:1.4" /><path d="M285.3 195.6 L288 202 L290.7 195.6" style="fill:none;stroke:var(--steel);stroke-width:1.4" /><line x1="244" y1="226" x2="244" y2="206" style="stroke:var(--amber-ink);stroke-width:1.4" /><path d="M246.7 212.4 L244 206 L241.3 212.4" style="fill:none;stroke:var(--amber-ink);stroke-width:1.4" /><line x1="254" y1="226" x2="254" y2="206" style="stroke:var(--amber-ink);stroke-width:1.4" /><path d="M256.7 212.4 L254 206 L251.3 212.4" style="fill:none;stroke:var(--amber-ink);stroke-width:1.4" /><line x1="264" y1="226" x2="264" y2="206" style="stroke:var(--amber-ink);stroke-width:1.4" /><path d="M266.7 212.4 L264 206 L261.3 212.4" style="fill:none;stroke:var(--amber-ink);stroke-width:1.4" /><line x1="274" y1="226" x2="274" y2="206" style="stroke:var(--amber-ink);stroke-width:1.4" /><path d="M276.7 212.4 L274 206 L271.3 212.4" style="fill:none;stroke:var(--amber-ink);stroke-width:1.4" /><text x="300" y="110" style="fill:var(--steel)" font-size="10" font-weight="600">atrito lateral Rl</text><text x="300" y="222" style="fill:var(--amber-ink)" font-size="10" font-weight="600">resistência de ponta Rp</text><text x="420" y="80" style="fill:var(--ink)" font-weight="600">Q = Rp + Rl</text><text x="420" y="98" style="fill:var(--muted)" font-size="10">Qadm = Q / 2 (fator global)</text></svg><figcaption>Estaca: a carga é resistida pelo atrito ao longo do fuste e pela ponta</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Resistência de ponta (Rp)</h4><p>Depende do solo na cota da ponta e da área da seção. Areias compactas dão muita ponta.</p></div>
<div class="conceito"><h4>Atrito lateral (Rl)</h4><p>Soma do atrito metro a metro. Depende do perímetro da estaca e da resistência de cada camada.</p></div>
<div class="conceito"><h4>Carga admissível</h4><p>A carga de ruptura dividida pelo fator de segurança. A NBR 6122 pede fator global 2 nos métodos semiempíricos.</p></div></div>
<h3>Aoki-Velloso (1975)</h3>
<div class="formula">Rp = K · Np / F1 · Ap        Rl = U · Σ (α · K · Nl / F2 · Δl)</div>
<p>K e α dependem do tipo de solo. F1 e F2 corrigem pelo tipo de estaca (escala e método executivo).</p>
<h3>Décourt-Quaresma (1978, revisado em 1996)</h3>
<div class="formula">Rp = α · C · Np · Ap        Rl = β · 10 · (Nl/3 + 1) · U · L</div>
<div class="formula">Np = média do N na ponta, logo acima e logo abaixo     Nl = média do N ao longo do fuste (3 ≤ N ≤ 50)</div>
<div class="formula">Carga admissível (Décourt): Rp/4 + Rl/1,3   e no máximo (Rp + Rl)/2</div>
<div class="dica"><b>Prática de projeto</b>Calcule por dois métodos e adote o menor valor. Confira também a carga estrutural da estaca, informada pelo fabricante, e faça prova de carga quando a norma exigir.</div>`,
exemplo:`<h3>Estaca pré-moldada Ø 30 cm com 10 m</h3><p>A sondagem mostra argila siltosa mole no topo, depois silte argiloso, silte arenoso e areia siltosa a partir de 10 m. Seção: Ap = 0,0707 m². Perímetro: U = 0,942 m.</p>
<ol class="passos"><li><b>Aoki-Velloso, ponta.</b> Areia siltosa (K = 0,80 MPa), N = 20 a 10 m: Rp = 800 × 20 / 1,75 × 0,0707 = <b>646 kN</b>.</li>
<li><b>Aoki-Velloso, atrito.</b> Somando os 10 metros de fuste camada por camada: Rl = <b>303 kN</b>. Carga admissível: (646 + 303) / 2 = <b>475 kN</b>.</li>
<li><b>Décourt-Quaresma, ponta.</b> Np = (17 + 20 + 24) / 3 = 20,3. C = 400 kPa (areia): Rp = 400 × 20,3 × 0,0707 = <b>575 kN</b>.</li>
<li><b>Décourt-Quaresma, atrito.</b> Nl = 7,6 (média de 1 a 8 m): Rl = 10 × (7,6/3 + 1) × 0,942 × 10 = <b>334 kN</b>. Carga admissível: 575/4 + 334/1,3 = <b>400 kN</b>.</li>
<li><b>Adotado.</b> O menor valor: <b>400 kN por estaca</b>. Um pilar de 1.000 kN precisa de 3 estacas.</li></ol>
<div class="dica"><b>Confira no simulador</b>O perfil e a estaca iniciais são os do exemplo.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Hélice contínua de Ø 40 com 11 m", "html": "<p>Perfil de sondagem padrão do simulador.</p><ol class=\"passos\"><li><b>Aoki-Velloso.</b> Ponta 1.206 kN + atrito lateral 474 kN = 1.680 kN de ruptura → Qadm = <b>840 kN</b>.</li><li><b>Décourt-Quaresma.</b> Np = 24,7 e Nl = 8,67 → ponta 372 kN + lateral 538 kN → Qadm = <b>455 kN</b>.</li><li><b>Adotado.</b> O menor: <b>455 kN</b>.</li><li><b>Leitura.</b> A diferença grande entre os métodos é normal. Adotar o menor é a postura prudente, e prova de carga pode confirmar valores maiores.</li></ol>"}, {"nivel": "obra", "titulo": "Estaca escavada de Ø 30 em casa", "html": "<p>Estaca escavada mecanicamente, Ø 30 cm, com 8 m de comprimento.</p><ol class=\"passos\"><li><b>Aoki-Velloso.</b> Ponta 181 kN + lateral 94 kN → Qadm = <b>137,8 kN</b>.</li><li><b>Décourt-Quaresma.</b> Qadm = <b>154 kN</b>.</li><li><b>Adotado.</b> <b>138 kN</b> por estaca.</li><li><b>No bloco.</b> Um pilar de 250 kN pede 2 estacas: 2 × 138 = 276 kN ✓</li></ol><div class=\"dica\"><b>Escavada com água</b>Estaca escavada sem fluido estabilizante só vale acima do lençol freático. Abaixo dele, o furo desmorona e a ponta fica com solo solto.</div>"}],
obra:{"intro": "Estaca não se vê depois de pronta. O controle na execução é o único jeito de saber se ela tem o comprimento, o diâmetro e o concreto do projeto.", "erros": [["Comprimento menor que o projeto", "Parar a perfuração antes da cota porque \"travou\" sem confirmar com o projetista."], ["Fundo do furo sujo", "Solo solto ou água no fundo: a estaca recalca porque a ponta não trabalha."], ["Concreto com slump errado", "Concreto seco em hélice contínua forma vazios. Muito fluido segrega."], ["Arrasamento mal feito", "Quebrar a cabeça da estaca com marreta pesada trinca o fuste."]], "checklist": ["Locação das estacas conferida com o projeto (tolerância usual de 10% do diâmetro)", "Boletim de cada estaca: diâmetro, profundidade, horário, volume de concreto e sobreconsumo", "Profundidade conferida com a sondagem e com o critério de parada do projeto", "Concreto com slump e consumo de cimento especificados para o tipo de estaca", "Armadura com espaçadores e comprimento correto", "Arrasamento na cota com equipamento adequado, sem danificar o fuste", "Prova de carga ou ensaio de integridade quando exigido"], "dica": "Compare o volume de concreto lançado com o volume teórico do furo. Consumo muito menor indica estrangulamento; muito maior, desmoronamento."},
sim:{perfil:[['Argila siltosa',3],['Argila siltosa',4],['Argila siltosa',5],['Silte argiloso',6],['Silte argiloso',8],['Silte argiloso',9],['Silte arenoso',12],['Silte arenoso',14],['Silte arenoso',17],['Areia siltosa',20],['Areia siltosa',24],['Areia siltosa',30]].map(([solo,N])=>({solo,N})),
html(){return simWrap(sel('etT','Tipo de estaca',Object.entries(TIPOS_ESTACA).map(([k,t])=>[k,t.nome,k==='premoldada']))+sel('etD','Diâmetro',[20,25,30,35,40,50,60].map(d=>[d,'Ø '+d+' cm',d===30]))+rng('etL','Comprimento L',2,12,1,10,'m')+rng('etP','Carga do pilar',100,4000,50,1000,'kN','Para calcular quantas estacas o bloco precisa'),
  '<h3>Sondagem SPT</h3><div class="tbl-wrap alto"><table class="ed"><thead><tr><th>Prof.</th><th>Solo</th><th>N</th><th></th></tr></thead><tbody id="etBody"></tbody></table></div><div class="presets"><button class="chip" id="etAdd">+ 1 metro</button></div>')},
init(){const self=this;this.base=this.base||JSON.parse(JSON.stringify(this.perfil));$('etAdd').onclick=()=>{const l=self.perfil[self.perfil.length-1];self.perfil.push({solo:l.solo,N:Math.min(50,l.N+3)});self.tabela();self.update()};this.tabela()},
tabela(){const self=this,ops=Object.keys(SOLOS);$('etL').max=this.perfil.length;if(+$('etL').value>this.perfil.length)$('etL').value=this.perfil.length;outs();
  $('etBody').innerHTML=this.perfil.map((c,i)=>`<tr><td class="num">${i+1} m</td><td><select id="etS${i}" data-i="${i}" aria-label="Solo a ${i+1} m">${ops.map(o=>`<option${o===c.solo?' selected':''}>${o}</option>`).join('')}</select></td><td><input type="number" min="0" max="80" step="1" id="etN${i}" data-i="${i}" value="${c.N}" aria-label="N a ${i+1} m"></td><td>${this.perfil.length>3&&i===this.perfil.length-1?'<button class="rm" id="etRm" aria-label="Remover último metro">✕</button>':''}</td></tr>`).join('');
  $('etBody').querySelectorAll('select').forEach(s=>s.onchange=()=>{self.perfil[+s.dataset.i].solo=s.value;self.update()});
  $('etBody').querySelectorAll('input').forEach(s=>s.oninput=()=>{const v=parseFloat(s.value);if(!isNaN(v)){self.perfil[+s.dataset.i].N=Math.max(0,v);self.update()}});
  const rm=$('etRm');if(rm)rm.onclick=()=>{self.perfil.pop();self.tabela();self.update()}},
update(){const tp=$('etT').value,D=V_('etD'),L=V_('etL'),P=V_('etP'),r=calc.estaca(this.perfil,tp,D,L);
  if(r.erro){$('tiles').innerHTML=`<span class="pill alerta">${r.erro}</span>`;$('draw').innerHTML='';$('memorial').textContent=r.erro;return}
  const n=Math.ceil(P/r.Qadm-1e-9);
  $('tiles').innerHTML=tiles([['Aoki-Velloso',br(r.QA,0)+' kN'],['Décourt-Quaresma',br(r.QD,0)+' kN'],['Carga admissível',br(r.Qadm,0)+' kN',1],['Estacas no bloco',n+' estaca'+(n>1?'s':'')]])+`<span class="pill ok">Ponta em ${esc(this.perfil[L-1].solo.toLowerCase())} · N = ${this.perfil[L-1].N}</span>`;
  const nm=this.perfil.length,top=34,sz=Math.min(30,420/nm),x0=70,w=230,cor={argila:'soil-fill',silte:'amber-fill',areia:'steel-soft'};
  let s=T_('SONDAGEM SPT',30,18)+T(x0+w/2,top-8,'solo','muted','text-anchor="middle" font-size="10"')+T(450,top-8,'N (golpes)','muted','text-anchor="middle" font-size="10"');
  this.perfil.forEach((c,i)=>{const y=top+i*sz,g=SOLOS[c.solo].g;s+=`<rect x="${x0}" y="${y}" width="${w}" height="${sz}" style="fill:var(--${cor[g]});stroke:var(--line)"/>`+T(x0-8,y+sz/2+4,(i+1)+' m','muted','text-anchor="end" font-size="10"');
    if(i===0||c.solo!==this.perfil[i-1].solo)s+=T(x0+6,y+13,c.solo,'ink','font-size="10"');
    const bw=Math.min(50,c.N)/50*140;s+=`<rect x="380" y="${y+3}" width="${bw}" height="${sz-6}" style="fill:var(--steel)"/>`+T(384+bw,y+sz/2+4,c.N,'ink','font-size="10"')});
  for(const v of [0,25,50])s+=Ln(380+v/50*140,top,380+v/50*140,top+nm*sz,'grid')+T(380+v/50*140,top+nm*sz+14,v,'muted','text-anchor="middle" font-size="9"');
  const pw=Math.max(8,D/60*34),px=x0+w-48-pw/2;s+=`<rect x="${px}" y="${top-14}" width="${pw}" height="${L*sz+14}" style="fill:var(--ink);opacity:.85"/>`;
  const mx=Math.max(...r.fusteA);r.fusteA.forEach((f,i)=>{const a=6+16*f/mx,y=top+i*sz+sz/2;s+=Ln(px-a,y,px-2,y,'pos',2)+Ln(px+pw+2,y,px+pw+a,y,'pos',2)});
  s+=`<path d="M${px-6} ${top+L*sz+2} h${pw+12} l-${(pw+12)/2} 12z" style="fill:var(--amber)"/>`+T(px+pw/2,top+L*sz+28,'ponta '+L+' m','amber-ink','font-weight="600" text-anchor="middle"');
  s+=T(30,top+nm*sz+38,`Atrito lateral (setas verdes) e ponta (seta amarela) · ${TIPOS_ESTACA[tp].nome} Ø ${D} cm`,'muted','font-size="10"');
  $('draw').innerHTML=SVG(560,top+nm*sz+56,'Perfil de sondagem com a estaca',s);
  const t=TIPOS_ESTACA[tp],sp=SOLOS[this.perfil[L-1].solo];
  $('memorial').textContent=`Estaca ${t.nome} Ø ${D} cm · L = ${L} m · Ap = ${br(r.Ap,4)} m² · U = ${br(r.U,3)} m
AOKI-VELLOSO (F1 = ${br(t.F1,2)} · F2 = ${br(t.F2,2)})
  Rp = K·Np/F1·Ap = ${br(sp.K*1000,0)} × ${Math.min(50,this.perfil[L-1].N)} / ${br(t.F1,2)} × ${br(r.Ap,4)} = ${br(r.RpA,1)} kN
  Rl = U·Σ(α·K·N/F2·1 m) = ${br(r.RlA,1)} kN
  Qadm = (${br(r.RpA,1)} + ${br(r.RlA,1)}) / 2 = ${br(r.QA,1)} kN
DÉCOURT-QUARESMA (α = ${br(t.alfa[sp.g],2)} na ponta)
  Np = ${br(r.Np,2)} · C = ${r.C} kPa → Rp = ${br(t.alfa[sp.g],2)} × ${r.C} × ${br(r.Np,2)} × ${br(r.Ap,4)} = ${br(r.RpD,1)} kN
  Nl = ${br(r.Nl,2)} → Rl = Σ β·10·(Nl/3 + 1)·U·1 m = ${br(r.RlD,1)} kN
  Qadm = mín(Rp/4 + Rl/1,3 ; (Rp + Rl)/2) = ${br(r.QD,1)} kN
ADOTADO: ${br(r.Qadm,1)} kN por estaca · pilar de ${P} kN → ${n} estaca(s)
  Confira a carga estrutural da estaca no catálogo do fabricante.`;}}
});

// PI-14 · Pilares
Academia.modulo('pi',{
teoria:`<p>O pilar leva a carga das vigas até a fundação. Parece que ele só é comprimido, mas qualquer pequena excentricidade faz o pilar flexionar. Se ele for esbelto, essa flexão cresce com a deformação: é o <b>efeito de segunda ordem</b>.</p>
<figure class="fig"><svg viewBox="0 0 640 226" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" role="img" aria-label="Pilar comprimido e o efeito de segunda ordem nos pilares esbeltos"><rect x="110" y="30" width="30" height="170" style="fill:var(--grid);stroke:var(--ink);stroke-width:2" /><line x1="125" y1="4" x2="125" y2="26" style="stroke:var(--amber-ink);stroke-width:2" /><path d="M122.3 19.6 L125 26 L127.7 19.6" style="fill:none;stroke:var(--amber-ink);stroke-width:2" /><text x="132" y="14" style="fill:var(--amber-ink)" font-weight="600">Nd</text><path d="M125 200 l-9 15 h18z" style="fill:none;stroke:var(--ink);stroke-width:1.5" /><line x1="115" y1="215" x2="111" y2="221" style="stroke:var(--ink);stroke-width:1" /><line x1="120" y1="215" x2="116" y2="221" style="stroke:var(--ink);stroke-width:1" /><line x1="125" y1="215" x2="121" y2="221" style="stroke:var(--ink);stroke-width:1" /><line x1="130" y1="215" x2="126" y2="221" style="stroke:var(--ink);stroke-width:1" /><line x1="135" y1="215" x2="131" y2="221" style="stroke:var(--ink);stroke-width:1" /><path d="M300 30 Q340 115 300 200" style="fill:none;stroke:var(--neg);stroke-width:2.5" /><line x1="300" y1="30" x2="300" y2="200" style="stroke:var(--line);stroke-width:1" stroke-dasharray="4 4"/><line x1="300" y1="4" x2="300" y2="26" style="stroke:var(--amber-ink);stroke-width:2" /><path d="M297.3 19.6 L300 26 L302.7 19.6" style="fill:none;stroke:var(--amber-ink);stroke-width:2" /><path d="M300 200 l-9 15 h18z" style="fill:none;stroke:var(--ink);stroke-width:1.5" /><line x1="290" y1="215" x2="286" y2="221" style="stroke:var(--ink);stroke-width:1" /><line x1="295" y1="215" x2="291" y2="221" style="stroke:var(--ink);stroke-width:1" /><line x1="300" y1="215" x2="296" y2="221" style="stroke:var(--ink);stroke-width:1" /><line x1="305" y1="215" x2="301" y2="221" style="stroke:var(--ink);stroke-width:1" /><line x1="310" y1="215" x2="306" y2="221" style="stroke:var(--ink);stroke-width:1" /><text x="346" y="118" style="fill:var(--neg)" font-size="10">e2: deslocamento de 2ª ordem</text><text x="420" y="60" style="fill:var(--ink)" font-weight="600">λ = 3,46 · le / h</text><text x="420" y="80" style="fill:var(--muted)" font-size="10">λ ≤ 35: sem 2ª ordem (aprox.)</text><text x="420" y="98" style="fill:var(--muted)" font-size="10">λ > 35: soma-se M2 = Nd · e2</text><line x1="84" y1="30" x2="84" y2="200" style="stroke:var(--muted);stroke-width:1" /><text x="78" y="120" style="fill:var(--muted)" text-anchor="end">le</text></svg><figcaption>Pilar comprimido e o efeito de segunda ordem nos pilares esbeltos</figcaption></figure>
<div class="cols"><div class="conceito"><h4>Esbeltez (λ)</h4><p>λ = 3,46 · le / h para seção retangular. Quanto mais alto e fino, maior o λ.</p></div>
<div class="conceito"><h4>Momento mínimo</h4><p>A norma sempre considera uma excentricidade mínima: M1d,mín = Nd · (0,015 + 0,03 · h), com h em metros.</p></div>
<div class="conceito"><h4>2ª ordem</h4><p>Para λ acima de λ1 (35 no pilar intermediário), soma-se o momento de 2ª ordem pelo pilar-padrão com curvatura aproximada.</p></div></div>
<h3>Roteiro de cálculo</h3>
<div class="formula">Nd = γn · 1,4 · Nk     γn = 1,95 − 0,05·b  para b &lt; 19 cm</div>
<div class="formula">ν = Nd / (Ac · fcd)     1/r = 0,005 / [h · (ν + 0,5)] ≤ 0,005 / h</div>
<div class="formula">M2d = Nd · le² / 10 · (1/r)     Md,tot = M1d,mín + M2d</div>
<div class="formula">As,mín = 0,15·Nd/fyd ≥ 0,4% Ac     As,máx = 4% Ac (8% na emenda)</div>
<div class="dica"><b>Detalhe que salva obra</b>Estribo segura as barras para elas não flambarem. Espaçamento máximo: o menor entre 20 cm, a menor dimensão do pilar e 12 vezes o diâmetro da barra (CA-50).</div><h3>Pré-dimensionamento pela área de influência</h3><div class="formula">Nk = área de influência × carga por m² × pavimentos     Ac ≈ 1,4 · α · Nk / σideal</div><p>α = 1,3 no pilar intermediário, 1,5 na extremidade e 1,8 no canto, para cobrir os momentos que ainda não foram calculados. Serve para lançar a estrutura; o dimensionamento final vem depois.</p>`,
exemplo:`<h3>Pilar 20 × 40 com Nk = 800 kN e le = 2,80 m</h3><p>Concreto C25, aço CA-50. Pilar intermediário, sem momentos de primeira ordem nas extremidades.</p>
<ol class="passos"><li><b>Esforço de cálculo.</b> b = 20 cm, então γn = 1: Nd = 1,4 × 800 = <b>1.120 kN</b>. ν = 1120 / (800 × 1,786) = 0,78.</li>
<li><b>Direção do lado de 20 cm.</b> λ = 3,46 × 280 / 20 = <b>48,4</b> &gt; 35: tem 2ª ordem. M1d,mín = 1120 × (1,5 + 0,03 × 20) = 2.352 kN·cm.</li>
<li><b>Curvatura.</b> 1/r = 0,005 / (20 × 1,28) = 1,95 × 10⁻⁴ cm⁻¹. M2d = 1120 × 280² / 10 × 1,95 × 10⁻⁴ = <b>1.710 kN·cm</b>.</li>
<li><b>Momento total.</b> Md = 2.352 + 1.710 = <b>4.062 kN·cm</b> (40,6 kN·m). Na outra direção, λ = 24,2 e vale só o momento mínimo.</li>
<li><b>Armadura.</b> Pelo diagrama parábola-retângulo, a seção precisa de As = <b>12,8 cm²</b> → <b>8 φ 16 mm</b> (16,1 cm², ρ = 2,0%). Estribos φ 5 a cada 19 cm.</li></ol>
<div class="dica"><b>Confira no simulador</b>Os valores iniciais são os do exemplo.</div>`,
exemplos:[{"nivel": "facil", "titulo": "Pilar de 20 × 20 de uma casa de dois pavimentos", "html": "<p>C25, Nk = 300 kN, comprimento de flambagem de 2,80 m nas duas direções.</p><ol class=\"passos\"><li><b>Esforço de cálculo.</b> Nd = 1,4 × 300 = <b>420 kN</b>. ν = 0,59.</li><li><b>Esbeltez.</b> λ = 3,46 × 280 / 20 = <b>48,4</b> nas duas direções. Passa de λ₁ = 35: precisa do efeito de 2ª ordem.</li><li><b>Momentos.</b> Mínimo de 1ª ordem 882 kN·cm + 2ª ordem 757 kN·cm = <b>Md = 1.639 kN·cm</b>.</li><li><b>Armadura.</b> As = 2,02 cm² (mínimo 1,60) → <b>4 φ 10 mm</b>, estribos φ 5 c/ 12 cm.</li></ol>"}, {"nivel": "obra", "titulo": "Pilar de garagem de 25 × 50 num prédio", "html": "<p>C30, Nk = 1.500 kN, le = 3,00 m. Pilar retangular alongado.</p><ol class=\"passos\"><li><b>Esforço.</b> Nd = <b>2.100 kN</b>, ν = 0,78.</li><li><b>Direção fraca (25 cm).</b> λx = <b>41,5</b> &gt; 35 → Md = 4.725 + 2.944 = <b>7.669 kN·cm</b>.</li><li><b>Direção forte (50 cm).</b> λy = 20,8, sem 2ª ordem: Md = 6.300 kN·cm.</li><li><b>Armadura.</b> Governa a direção fraca: As = <b>16,6 cm²</b> → <b>10 φ 16 mm</b> (20,1 cm²), estribos φ 5 c/ 19 cm.</li><li><b>Na obra.</b> Com 10 barras de 16 mm numa seção de 25 cm, a emenda por traspasse no mesmo ponto congestiona a forma. Confira a posição das emendas antes de concretar.</li></ol><div class=\"dica\"><b>Pilar de garagem</b>Pilares de garagem levam batida de carro. Proteja os cantos com cantoneira ou barreira, e nunca corte armadura para ganhar vaga.</div>"}],
obra:{"intro": "O pilar é a peça que menos aceita improviso: um pilar que falha leva junto tudo o que está em cima. Prumo, armadura e concretagem precisam ser conferidos em cada lance.", "erros": [["Pilar fora de prumo", "Forma mal aprumada cria excentricidade que o projeto não previu."], ["Concreto lançado de grande altura", "Concreto jogado de mais de 2 m segrega e forma bicheira no pé do pilar."], ["Estribos faltando ou abertos", "Estribos que não fecham ou faltam no nó viga-pilar deixam as barras flambarem."], ["Emendas todas na mesma altura", "Traspasse de todas as barras no mesmo ponto, sem seguir o projeto."]], "checklist": ["Locação e prumo da forma conferidos nas duas direções", "Bitola, quantidade e posição das barras longitudinais conforme o projeto", "Estribos no espaçamento correto, fechados e com ganchos a 135°", "Estribos também dentro do nó com as vigas", "Espaçadores garantindo o cobrimento de 3 cm (classe II)", "Janela de inspeção ou lançamento por tubo em pilares altos", "Vibração em camadas, com atenção ao pé do pilar"], "dica": "Antes de concretar, passe a mão no pé do pilar por dentro da forma: sujeira, pregos e serragem acumulados viram uma junta fraca justamente onde o esforço é maior."},
extras:[{nome:'Pré-dimensionamento',
html:()=>`<p class="nota">Estimativa da seção para o lançamento da estrutura, pela área de influência. O coeficiente α majora a carga para cobrir os momentos que o pilar vai receber. Depois, confira a seção no simulador de dimensionamento.</p>`+simWrap(rng('pdA','Área de influência por pavimento',2,60,0.5,16,'m²')+rng('pdN','Número de pavimentos acima',1,20,1,4,'')+rng('pdQ','Carga por m² de pavimento',6,15,0.5,10,'kN/m²','Já com peso próprio. Casas: 8 a 10 · prédios: 10 a 12')+sel('pdT','Posição do pilar',[['intermediario','Intermediário (α = 1,3)',1],['extremidade','Extremidade (α = 1,5)'],['canto','Canto (α = 1,8)']])+sel('pdF','Concreto',[[20,'C20'],[25,'C25',1],[30,'C30'],[35,'C35'],[40,'C40']])+sel('pdB','Menor dimensão desejada',[[14,'14 cm (com γn)'],[15,'15 cm (com γn)'],[19,'19 cm'],[20,'20 cm',1],[25,'25 cm'],[30,'30 cm']])),
update(){const tipo=$('pdT').value,r=calc.preDimPilar(V_('pdA'),V_('pdN'),V_('pdQ'),tipo,+$('pdF').value,+$('pdB').value);
  $('tiles').innerHTML=tiles([['Nk',br(r.Nk,0)+' kN'],['Nd com α',br(r.Nd,0)+' kN'],['Área necessária',br(r.Ac,0)+' cm²'],['Seção sugerida',r.b+' × '+r.h+' cm',1]])+(r.parede?'<span class="pill alerta">h &gt; 5b: vira pilar-parede. Aumente a menor dimensão.</span>':r.gn>1?`<span class="pill alerta">b &lt; 19 cm: cargas majoradas por γn = ${br(r.gn,2)}</span>`:'');
  const g=58,ox=50,oy=40;let s=T_('PLANTA · ÁREA DE INFLUÊNCIA',ox,18);
  const cel={intermediario:[1,1],extremidade:[1,0],canto:[0,0]}[tipo],cx=ox+cel[0]*2*g,cy=oy+cel[1]*2*g;

  $('draw').innerHTML=SVG(640,Math.max(oy+4*g+34,by+r.h*sx+40),'Área de influência e seção do pilar',s);
  $('memorial').textContent=`1) Nk = ${br(V_('pdA'),1)} m² × ${br(V_('pdQ'),1)} kN/m² × ${V_('pdN')} pavimentos = ${br(r.Nk,1)} kN
2) Nd = 1,4 × α × Nk = 1,4 × ${br(r.alfa,1)} × ${br(r.Nk,1)} = ${br(r.Nd,1)} kN${r.gn>1?` · γn = ${br(r.gn,2)} (b < 19 cm)`:''}
3) Tensão ideal com 1% de armadura: σ = 0,85 fcd + 0,01 × (420 − 0,85 fcd) = ${br(10*r.sig,2)} MPa
4) Ac = ${r.gn>1?'γn × ':''}Nd / σ = ${br(r.Ac,0)} cm² (mínimo da norma: 360 cm²)
5) Com b = ${r.b} cm → h = ${r.h} cm (múltiplo de 5) · Ac = ${br(r.Acf,0)} cm²
   Estimativa de lançamento: o dimensionamento final usa os esforços reais e a esbeltez (aba Dimensionamento).`;}}],

  const tx=Math.max(ox+W+70,250);s+=T(tx,40,'VERIFICAÇÃO POR DIREÇÃO','muted','font-size="10" letter-spacing="1"');

    s+=`<rect x="${tx}" y="${y+28}" width="260" height="12" style="fill:var(--grid)"/><rect x="${tx}" y="${y+28}" width="${260*pct}" height="12" style="fill:var(--${pct>0.999?'amber':'pos'})"/>`+T(tx,y+56,`Md = ${br(q.Md/100,1)} kN·m de ${br(q.MRd/100,1)} kN·m resistentes (${br(100*pct,0)}%)`,'ink','font-size="10"')});

${r.dx.map((q,i)=>`${i+2}) Direção ${q.nome}: λ = 3,46 × ${le}/${q.hd} = ${br(q.lam,1)}

   Md,tot = ${br(q.Md,0)} kN·cm ≤ MRd = ${br(q.MRd,0)} kN·cm ✓`).join('\n')}
4) As,mín = máx(0,15·Nd/fyd ; 0,4%·Ac) = ${br(r.Asmin)} cm² · As,máx = ${br(r.Asmax)} cm²
5) As necessária = ${br(r.As)} cm² (diagrama parábola-retângulo, armadura simétrica nas duas faces)
6) Adotado: ${r.bar.n} φ ${br(r.bar.f,1)} mm = ${br(r.bar.area)} cm² · estribos φ ${br(r.estribo.f,1)} c/${r.estribo.s} cm
   Pilar intermediário com momento mínimo (αb = 1, λ1 = 35). Pilares de canto e extremidade exigem os momentos de 1ª ordem.`;}}

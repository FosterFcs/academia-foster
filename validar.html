<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Validar certificado · Academia Foster</title>
<meta name="description" content="Confira se um certificado da Academia Foster de Engenharia é verdadeiro.">
<meta name="theme-color" content="#1b2a3a">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap">
<style>
@font-face{font-family:'Assinatura';src:url('fonts/assinatura.woff2') format('woff2');font-display:block}
:root{--ink:#1b2a3a;--muted:#5b6b7a;--line:#c9d2da;--paper:#f4f1ea;--sheet:#ffffff;--amber:#c8891b;--steel:#2b5d86;--ok:#1f7a4d;--neg:#b2452f;
  --f-head:'Barlow Condensed',system-ui,sans-serif;--f-body:'Source Sans 3',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;--f-serif:'Cormorant Garamond',Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6edf3;--muted:#9aabba;--line:#33475a;--paper:#0f1a24;--sheet:#16232f}}
:root[data-theme="dark"]{--ink:#e6edf3;--muted:#9aabba;--line:#33475a;--paper:#0f1a24;--sheet:#16232f}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.5}
.barra{max-width:1064px;margin:0 auto;padding:20px 16px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.barra a{color:var(--steel);font-weight:600;text-decoration:none}
.marca{font-family:var(--f-head);font-weight:700;font-size:1.35rem;letter-spacing:.02em}
.marca small{display:block;font-family:var(--f-mono);font-size:.68rem;font-weight:400;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
main{max-width:1064px;margin:0 auto;padding:8px 16px 40px}
form.busca{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
form.busca input{flex:1 1 220px;font:600 1rem var(--f-mono);padding:10px 12px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);text-transform:uppercase}
button,.btn{font:600 .95rem var(--f-body);padding:10px 16px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.btn.sec{background:transparent;color:var(--ink)}
.status{padding:12px 14px;border:1.5px solid var(--line);background:var(--sheet);margin:0 0 16px}
.status.ok{border-color:var(--ok);color:var(--ok)}.status.erro{border-color:var(--neg);color:var(--neg)}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
/* o certificado é sempre claro, como o papel impresso */
.folha-wrap{overflow-x:auto;padding-bottom:6px}
/* certificado: cores da Foster (preto, vermelho, grafite, cinza escuro e branco); sempre claro, como papel */
.folha{--c-preto:#111214;--c-graf:#2b2d30;--c-cinza:#4a4d52;--c-claro:#8a8e94;--c-verm:#c8102e;--c-papel:#ffffff;
  width:1000px;aspect-ratio:297/210;background:var(--c-papel);color:var(--c-preto);position:relative;display:grid;grid-template-columns:238px 1fr;
  border:1px solid #d9dadc;box-shadow:0 4px 22px rgba(0,0,0,.12);font-family:var(--f-body);overflow:hidden}
.f-lado{background:var(--c-graf);color:#fff;position:relative;padding:40px 26px 30px;display:flex;flex-direction:column;gap:14px;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px)}
.f-lado:after{content:"";position:absolute;top:0;right:0;width:7px;height:100%;background:var(--c-verm)}
.f-marca{font-family:var(--f-head);font-weight:700;font-size:2.05rem;line-height:.95;letter-spacing:.03em;text-transform:uppercase}
.f-marca span{color:var(--c-verm)}
.f-marca small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.62rem;letter-spacing:.16em;color:#c9cbcf;margin-top:8px;line-height:1.5}
.f-fio{width:42px;height:3px;background:var(--c-verm)}
.f-cod{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:#c9cbcf}
.f-cod b{display:block;color:#fff;font-size:1rem;letter-spacing:.06em;margin-top:4px}
.f-qr{margin-top:auto;font-family:var(--f-mono);font-size:.56rem;line-height:1.45;color:#c9cbcf}
.f-qr #qr{background:#fff;padding:8px;width:122px;height:122px;margin-bottom:8px}
.f-qr svg{width:106px;height:106px;display:block}
.f-slogan{font-family:var(--f-head);font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:#fff;border-top:1px solid rgba(255,255,255,.18);padding-top:12px}
.f-corpo{padding:44px 56px 26px 54px;display:flex;flex-direction:column;position:relative}
.f-corpo:before{content:"";position:absolute;right:28px;top:28px;width:70px;height:70px;border-top:3px solid var(--c-verm);border-right:3px solid var(--c-verm)}
.f-olho{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--c-verm);font-weight:600}
.f-tit{font-family:var(--f-head);font-weight:700;font-size:4.1rem;line-height:.9;letter-spacing:.02em;text-transform:uppercase;margin:6px 0 18px;color:var(--c-preto)}
.f-texto{font-size:1.02rem;line-height:1.6;color:var(--c-cinza);margin:0}
.f-nome{display:block;font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:2.45rem;line-height:1.1;color:var(--c-preto);margin:2px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--c-verm);width:fit-content;max-width:100%}
.f-texto b{color:var(--c-preto)}
.f-prog{margin:14px 0 0;padding:9px 14px;font-size:.74rem;line-height:1.5;color:var(--c-cinza);background:#f3f3f4;border-left:3px solid var(--c-graf)}
.f-prog b{color:var(--c-preto);text-transform:uppercase;letter-spacing:.08em;font-size:.66rem}
.f-ass{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start;padding-top:10px}
.f-ass div{text-align:center;font-size:.74rem;color:var(--c-cinza)}
.f-ass .assin{font-family:'Assinatura',cursive;font-weight:400;font-size:3.3rem;line-height:.7;color:#14213d;height:34px;transform:rotate(-4deg) translateY(4px);white-space:nowrap}
.f-ass .branco{height:34px}
.f-ass .linha{border-top:1.5px solid var(--c-preto);margin-top:4px;padding-top:6px;font-weight:700;font-size:.86rem;color:var(--c-preto)}
.f-ass span{display:block;line-height:1.45}
.f-rodape{margin-top:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-top:1px solid #e1e2e4;padding-top:10px}
.f-frase{font-family:var(--f-serif);font-style:italic;font-size:1rem;color:var(--c-graf);max-width:72%}
.f-frase:before{content:"“";color:var(--c-verm);font-size:1.6rem;line-height:0;vertical-align:-.35em;margin-right:2px}
.f-frase:after{content:"”";color:var(--c-verm);font-size:1.6rem;line-height:0;vertical-align:-.35em;margin-left:2px}
.f-data{font-size:.74rem;color:var(--c-cinza);text-align:right}
.f-legal{font-size:.58rem;color:var(--c-claro);margin-top:6px}
.dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0 0 16px}
.dados div{background:var(--sheet);border:1px solid var(--line);padding:10px 12px}
.dados span{display:block;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.nota{color:var(--muted);font-size:.9rem}
@media print{@page{size:A4 landscape;margin:0}body{background:#fff}.barra,form.busca,.acoes,.status,.dados,.nota{display:none!important}main{padding:0;max-width:none}html,body{margin:0;padding:0;height:210mm;overflow:hidden}.folha-wrap{overflow:visible;padding:0;margin:0}.folha{width:1000px;height:707px;aspect-ratio:auto;zoom:1.1225;border:0;box-shadow:none;margin:0;break-after:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<header class="barra"><div class="marca">Academia Foster de Engenharia<small>Validação de certificado</small></div><a href="./">Ir para a Academia</a></header>
<main>
<form class="busca" id="busca"><input id="codigo" placeholder="AF-XXXXXXXX" aria-label="Código do certificado" maxlength="11" autocomplete="off"><button type="submit">Validar</button></form>
<div id="saida"><p class="nota">Digite o código impresso no certificado (começa com AF-) ou leia o QR code.</p></div>
</main>
<script src="js/catalogo.js"></script>
<script>
const CFG={url:'https://fvsdlpnvqfvjdxmfgbjx.supabase.co',chave:'sb_publishable_VT3XEbInyTr2Eu-AuLnrqw_BOrA2jYy'};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const dataExtenso=iso=>{const d=new Date(iso);return `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`};
function script(src){return new Promise((ok,er)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=er;document.head.appendChild(s)})}
async function topicos(id){// títulos da teoria da disciplina, para o conteúdo programático
  const m=CATALOGO.find(x=>x.id===id);if(!m)return[];window.Academia={modulo(i,o){m._t=o}};window.SIG={};
  try{await script('js/modulos/'+id+'.js')}catch(e){return[]}
  const div=document.createElement('div');div.innerHTML=(m._t&&m._t.teoria)||'';return [...div.querySelectorAll('h3')].map(h=>h.textContent.trim()).filter(Boolean)}
async function validar(cod){
  cod=cod.trim().toUpperCase();$('codigo').value=cod;const out=$('saida');
  if(!/^AF-[A-Z0-9]{8}$/.test(cod)){out.innerHTML='<p class="status erro">Código em formato inválido. Ele tem o formato AF- seguido de 8 letras e números.</p>';return}
  out.innerHTML='<p class="nota">Consultando…</p>';let c;
  try{const r=await fetch(CFG.url+'/rest/v1/rpc/acad_validar',{method:'POST',headers:{apikey:CFG.chave,'Content-Type':'application/json'},body:JSON.stringify({p_codigo:cod})});if(!r.ok)throw new Error(r.status);const tx=await r.text();c=tx?JSON.parse(tx):null}
  catch(e){out.innerHTML='<p class="status erro">Não consegui consultar agora. Verifique a internet e tente de novo.</p>';return}
  if(!c){out.innerHTML=`<p class="status erro">Certificado <b>${esc(cod)}</b> não encontrado. Ele pode ter sido digitado errado ou ainda não ter sido emitido.</p>`;return}
  const m=CATALOGO.find(x=>x.id===c.modulo)||{cod:'',nome:c.modulo,titulo:''},tp=await topicos(c.modulo),url=location.origin+location.pathname+'?c='+cod;
  history.replaceState(null,'','?c='+cod);document.title='Certificado '+cod+' · Academia Foster';
  out.innerHTML=`<p class="status ok">✓ Certificado válido, emitido pela Academia Foster de Engenharia.</p>
  <div class="dados"><div><span>Aluno</span>${esc(c.nome)}</div><div><span>CPF</span>${esc(c.cpf)}</div><div><span>Curso</span>${esc(m.cod)} · ${esc(m.nome)}</div><div><span>Carga horária</span>${c.carga} horas</div><div><span>Nota na avaliação</span>${c.nota} de 10</div><div><span>Emissão</span>${new Date(c.emitido_em).toLocaleDateString('pt-BR')}</div></div>
  <div class="acoes"><button id="imprimir">Imprimir ou salvar em PDF</button><button class="btn sec" id="copiar">Copiar link</button><span class="nota" id="msg"></span></div>
  <div class="folha-wrap"><article class="folha" aria-label="Certificado">
    <aside class="f-lado"><div class="f-marca">Academia<br><span>Foster</span><small>de Engenharia</small></div><div class="f-fio"></div>
      <div class="f-cod">Código de validação<b>${esc(c.codigo)}</b></div>
      <div class="f-qr"><div id="qr"></div>Aponte a câmera ou acesse<br>fosterfcs.github.io<br>/academia-foster/validar.html</div>
      <div class="f-slogan">Engenharia civil descomplicada</div></aside>
    <section class="f-corpo">
      <div class="f-olho">Certificado de conclusão · Curso livre</div>
      <h1 class="f-tit">Certificado</h1>
      <p class="f-texto">Certificamos que<span class="f-nome">${esc(c.nome)}</span>CPF ${esc(c.cpf)}, concluiu o curso livre a distância <b>${esc(m.cod)} · ${esc(m.nome)}</b>, com carga horária de <b>${c.carga} horas</b>, e foi aprovado(a) na avaliação final com nota <b>${c.nota},0</b> de 10.</p>
      <p class="f-prog"><b>Conteúdo programático</b><br>${esc([m.titulo,...tp].filter(Boolean).join(' · '))} · exemplos resolvidos · simulador com memorial de cálculo · erros comuns e checklist de fiscalização · avaliação final com 10 questões.</p>
      <div class="f-ass">
        <div><div class="branco"></div><div class="linha">${esc(c.nome)}</div><span>Assinatura do aluno</span></div>
        <div><div class="assin">Wilson Foster</div><div class="linha">Wilson Foster</div><span>José Wilson Pereira · Engenheiro Civil</span><span>CREA-SP 5071894914 · Instrutor responsável</span></div>
      </div>
      <div class="f-rodape"><div class="f-frase">Aprender é a fundação de tudo o que você ainda vai construir.</div><div class="f-data">Emitido em ${dataExtenso(c.emitido_em)}.</div></div>
      <p class="f-legal">Curso livre de capacitação profissional, oferecido a distância. A aceitação como atividade complementar segue o regulamento de cada instituição de ensino.</p>
    </section>
  </article></div>`;
  $('imprimir').onclick=()=>print();
  $('copiar').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(url).then(()=>$('msg').textContent='Link copiado.',()=>$('msg').textContent=url)};
  try{await script('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js');const q=qrcode(0,'M');q.addData(url);q.make();$('qr').innerHTML=q.createSvgTag({cellSize:3,margin:0,scalable:true})}catch(e){}
}
$('busca').onsubmit=e=>{e.preventDefault();validar($('codigo').value)};
const ini=new URLSearchParams(location.search).get('c');if(ini)validar(ini);
</script>
</body>
</html>
